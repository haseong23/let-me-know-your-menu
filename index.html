   게임 오버레이(gameA11yOn)와 같은 문제를 푸는데 처방이 다르다 — 거기는 배경 노드에 aria-hidden 을
   씌우고, 여기는 aria-modal 에 맡긴다. 둘을 같은 처방으로 두면 안 된다: 게임 위에 시트가 열렸다
   닫히면 시트의 복원이 게임의 aria-hidden 까지 걷어내, 오버레이가 떠 있는데 배경이 다시 읽히게 된다.
   aria-modal 은 iOS VoiceOver·안드로이드 TalkBack 이 모두 존중하므로 이 앱의 대상 기기에서 충분하다. */
let sheetOpener=null;
function sheetFocusables(){
  return [...$sheet.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), summary, [tabindex="0"]')]
    .filter(x=>x.offsetParent!==null);
}
/* Tab 순환을 시트 안에 묶는다. 리스너를 시트가 아니라 document 에 거는 이유는 gameTrap 과 같다 —
   온도·메뉴를 고를 때마다 draw() 가 openSheet 을 다시 부르고, 그때 포커스가 있던 버튼이 innerHTML
   교체로 사라지면 포커스는 <body> 로 떨어진다. 시트에만 걸린 리스너는 body 에서 올라오는 Tab 을
   아예 못 보므로 그 순간 덫이 풀린다. 아래 !contains 갈래가 그 포커스를 시트로 회수한다. */
function sheetTrap(e){
  if(e.key!=="Tab" || !sheetOpen) return;
  if(confirmOpen) return;   // 확인창이 시트 위에 떠 있으면 그쪽 덫이 맡는다
  const f=sheetFocusables(); if(!f.length) return;
  const first=f[0], last=f[f.length-1], cur=document.activeElement;
  if(!$sheet.contains(cur)){ e.preventDefault(); (e.shiftKey?last:first).focus(); return; }   // 재렌더로 포커스를 잃은 경우 회수
  if(e.shiftKey && cur===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && cur===last){ e.preventDefault(); first.focus(); }
}
// 포커스를 연 자리로 돌려보낸다. 그 버튼이 render() 로 이미 사라졌으면 포커스가 <body> 에 남는데,
// 그러면 다음 Tab 이 문서 맨 처음부터 시작해 사용자가 자리를 잃는다 → 앱 컨테이너에 세운다 (gameA11yOff 와 같은 처방).
function restoreFocus(back){
  // 폴백은 '지금 떠 있는 것 중 가장 위'를 향한다. 확인창이 시트 위에서 닫히는 경로가 있어서,
  // 무조건 #app 으로 내려보내면 아직 열려 있는 모달 밖에 포커스를 세우게 된다.
  const home=()=>{
    const t=(sheetOpen && $scrim.classList.contains("show")) ? $sheet : $app;
    if(t){ t.setAttribute("tabindex","-1"); try{ t.focus(); }catch(e){} }
  };
  if(back && document.body.contains(back)){
    try{ back.focus(); }catch(e){}
    requestAnimationFrame(()=>{ if(document.activeElement===document.body) home(); });
  } else home();
}
function openSheet(h){
  // draw() 가 시트를 연 채로 다시 부른다(온도·메뉴 선택). 그때 포커스를 뺏으면 방금 누른 자리에서
  // 눈과 손이 튕겨 나가므로, '닫힘→열림' 전환일 때만 포커스와 덫을 손댄다.
  const wasOpen=sheetOpen;
  $sheet.innerHTML='<div class="grip"></div>'+h; $sheet.classList.toggle("has-foot", !!$sheet.querySelector(".sheet-foot")); $sheet.classList.toggle("split", !!$sheet.querySelector(".sheet-scroll")); $sheet.scrollTop=0; const sc=$sheet.querySelector(".sheet-scroll"); if(sc) sc.scrollTop=0; $scrim.classList.add("show"); sheetOpen=true; pushSub();
  // 시트마다 제목이 다르다 — 정적 aria-label 로는 어느 시트가 열렸는지 알 수 없다.
  const t=$sheet.querySelector("h3");
  if(t){ t.id="sheetTitle"; $sheet.setAttribute("aria-labelledby","sheetTitle"); $sheet.removeAttribute("aria-label"); }
  else { $sheet.removeAttribute("aria-labelledby"); $sheet.setAttribute("aria-label","상세"); }
  if(!wasOpen){
    const act=document.activeElement;
    sheetOpener=(act && act!==document.body) ? act : null;   // body 는 돌아갈 자리가 아니다 — 비워 두고 restoreFocus 의 폴백에 맡긴다
    document.addEventListener("keydown", sheetTrap);
    try{ $sheet.focus(); }catch(e){}   // 첫 컨트롤이 아니라 컨테이너 — 제목이 먼저 읽힌다
  }
}
function closeSheet(){   // history 항목은 다음 뒤로가기/열기가 소비·재사용
  const wasOpen=sheetOpen;
  $scrim.classList.remove("show"); sheetOpen=false;
  if(!wasOpen) return;   // 열린 적 없이 불린 경로에서 남의 포커스를 뺏지 않는다
  document.removeEventListener("keydown", sheetTrap);
  const back=sheetOpener; sheetOpener=null;
  restoreFocus(back);
}
$scrim.addEventListener("click",e=>{ if(e.target===$scrim) closeSheet(); });
// 칩 키보드 접근성: 포커스된 칩(tabindex=0)에서 Enter/Space → 클릭(키보드·스크린리더 사용자)
document.addEventListener("keydown",e=>{ const t=e.target; if((e.key==="Enter"||e.key===" "||e.key==="Spacebar")&&t&&t.getAttribute&&t.getAttribute("tabindex")==="0"&&(t.getAttribute("role")==="button"||(t.classList&&t.classList.contains("chip")))){ e.preventDefault(); t.click(); } });
/* Escape 로 닫기 (R20-4). 모바일에는 뒤로가기가 있어 이 앱이 여기까지 오지 않아도 됐지만,
   데스크톱 브라우저에서 열면 모달을 닫는 관습적인 키가 하나도 없었다.
   닫는 순서는 아래 popstate 와 똑같이 '위에 뜬 것부터'다 — 확인창(70) → 게임(55) → 시트(40).
   히스토리 처리도 각 화면의 닫기 버튼과 같은 함수에 맡겨 경로를 늘리지 않는다:
   finishConfirm 은 자기 항목을 ignorePop 으로 소비하고, closeSheet 은 항목을 다음 뒤로가기·열기가
   재사용하도록 남긴다(스크림을 눌러 닫을 때와 똑같다). */
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(confirmOpen){ e.preventDefault(); finishConfirm(false); return; }
  if(GS && GS.open){ e.preventDefault(); closeGame(); return; }
  if(sheetOpen){ e.preventDefault(); closeSheet(); return; }
});
window.addEventListener("popstate",()=>{
  if(ignorePop > 0){ ignorePop--; return; }   // 우리가 부른 history.back() 한 칸을 무시(확인창 버튼 닫기 등). 한 번에 한 칸씩만 소비한다.
  if(confirmOpen){ confirmOpen=false; $cscrim.classList.remove("show"); closeConfirmA11y(); const r=confirmResolve; confirmResolve=null; if(r) r(false); return; }  // 뒤로가기=확인창 취소(우선)
  // 게임은 subActive 를 건드리기 '전에' 처리한다. 오버레이는 자기 항목을 따로 갖고 있으므로
  // 여기서 빠진 칸은 게임의 것이다 — subActive=false 로 내리면 탭·시트의 항목이 없는 것처럼 되어
  // 다음 뒤로가기가 앱을 나간다. 확인창 처리보다는 뒤에 둬야 오버레이 위 확인창이 먼저 취소된다.
  if(GS && GS.open){ closeGame({fromPop:true}); return; }
  subActive=false;   // 쌓아둔 하위 항목이 (뒤로가기로) 빠졌다
  if(sheetOpen){ closeSheet(); return; }  // 시트 닫기 — 포커스 복원·덫 해제까지 closeSheet 한 곳이 맡는다
  if(openTab!=="order"){ openTab="order"; render(); return; }   // 카페 주문서 탭 → 합친 화면(기본 탭)
  if(curView==="pick" && ME){ render(); return; }         // 이름변경 → 주문
  if(curView==="adminmenu"){ renderAdminDash(); return; } // 메뉴관리 → 관리자
  if(curView==="admindash"){ renderAdminDash(); return; } // 대시보드 → 관리자
  // main/랜딩/초기 이름선택: 더 빠질 항목 없음 → 브라우저가 그대로 앱 밖으로
});

function render(){
  if(!ME || !memberById(ME)){ curView="pick"; renderPickMe(); $bottom.innerHTML=""; document.body.classList.add("no-bottom"); return; }
  projectServing(viewSeq!=null ? viewSeq : activeSeq);   // 현재 볼 섬김으로 투영(활성 or 보고있는 것)
  // 보는 섬김이 바뀌면 탭은 '내 주문'부터 — 남의 섬김을 주문서 탭으로 열고 시작하지 않는다
  if(SESSION.seq!==lastTabSeq){ lastTabSeq=SESSION.seq; openTab="order"; }
  curView="main"; renderHeader();
  if(!SESSION.seq) renderIdle();            // 열린 섬김 없음 = 오늘의 섬김 개요
  else if(SESSION.state==="open") renderOpen();
  else renderClosed();
  renderBottom();
}

let forceGrid=false;

  const showGrid = !myOrder || isSkip || forceGrid;
  /* '다른 분 주문' 블록은 없앴다 (R12-5, R12-6). 아래 로스터(dashPeopleHtml)의 ordered 그룹이
     같은 .person 마크업에 같은 세 필드를 이미 그리고 있어서, 두 화면을 합치면 주문한 사람이
     두 번 그려졌다. [나도] 버튼은 그 로스터 행으로 옮겨갔다. */
  /* '안 마실게요'는 메뉴와 나란한 갈림길이지 화면 아래 부속이 아니다.
     그리드 밑에 회색 ghost 버튼으로 붙여두니 아무도 못 봤다 — .label 로 구역을 떼서
     '메뉴 선택'과 같은 급의 섹션으로 올리고, 버튼도 흰 카드(누를 수 있는 것)로 바꾼다. */
  const skipHtml = isSkip ? "" : `
      <h3 class="label">음료를 안 드신다면</h3>
      <button class="btn btn-skip skip-btn">🙅 안 마실게요, 감사합니다</button>`;
  /* 지난번 주문 다시 담기.
     새 시각 언어를 만들지 않는다 — 아래 '다른 분들' 로스터의 [나도] 행과 같은 .person 마크업을
     그대로 쓴다. 하는 일이 똑같기 때문이다(남의 주문 그대로 vs 지난번 내 주문 그대로).
     보일 조건을 좁게 잡는다: 고르는 중이고 · 기억이 있고 · 그 메뉴가 지금 메뉴판에 아직 있을 때만.
     비활성 버튼이나 빈 상태를 두지 않으므로 평소에는 이 줄이 아예 없다.
     자리는 메뉴 그리드 '위'다 — 타일을 훑기 전에 보여야 훑는 일 자체를 없앨 수 있다. */
  const lastOrd = showGrid ? lastOrder() : null;
  const lastMenu = lastOrd ? anyMenuById(lastOrd.menuId) : null;
  /* 지금 담긴 주문과 똑같으면 감춘다. 주문하면 그 즉시 기억하므로, 담은 뒤 [🔄 다른 메뉴로]를
     누르면 '지난번엔 이렇게 드셨어요'가 방금 담은 바로 그것을 가리키게 된다 — 다른 걸 고르러
     들어온 사람에게 아무 쓸모가 없고, 바로 위 내 주문 카드와 같은 말을 두 번 하는 셈이다. */
  const sameAsNow = !!(lastOrd && myOrder && myOrder.type==="drink"
    && myOrder.menuId===lastOrd.menuId && (myOrder.temp||null)===(lastOrd.temp||null)
    && (myOrder.note||"")===(lastOrd.note||"")
    && (myOrder.extras||[]).slice().sort().join("|")===(lastOrd.extras||[]).slice().sort().join("|"));
  let againHtml = "";
  if(lastOrd && lastMenu && !sameAsNow){
    const bits = (lastOrd.extras||[]).slice();
    if(lastOrd.note) bits.push("📝 "+lastOrd.note);
    againHtml = `
      <h3 class="label">지난번엔 이렇게 드셨어요</h3>
      <div class="card" style="padding:6px 14px">
        <div class="person">
          <div class="avatar" style="background:var(--brand-soft);color:var(--brand)">↺</div>
          <div><div class="pname">${esc(lastMenu.emoji+" "+lastMenu.name)}${lastOrd.temp?" · "+esc(lastOrd.temp):""}</div>
            <div class="pmenu">${bits.length?esc(bits.join(" · ")):"옵션 없이"}</div></div>
          <button class="btn btn-sm btn-soft" id="againOrder">이걸로</button>
        </div>
      </div>`;
  }
  const gridHtml = showGrid ? `
      ${againHtml}
      <h3 class="label">${myOrder?'메뉴 다시 고르기':'메뉴 선택'}</h3>
      <div id="menuGrid">${gridTilesHtml()}</div>
      ${skipHtml}` : "";
  /* 주문을 이미 담은 뒤 화면에 남는 갈래는 둘뿐이다 — 고치기 / 안 마시기 (6a).
     예전엔 [🔄 다른 메뉴로]가 여기 하나 더 있었는데, 메뉴를 바꾸는 길이 두 곳(이 버튼과
     수정 시트 안의 [다른 메뉴로 바꾸기])이라 같은 일에 문이 둘이었다. 화면 쪽을 닫고
     수정 시트 한 곳으로 모은다 — 고치러 들어간 자리에서 바꾸는 것이 순서에 맞다. */
  const changeLink = (myOrder && myOrder.type==="drink" && !forceGrid)
    ? `<div style="margin:10px 0 0"><button class="btn btn-skip skip-btn">🙅 안 마실게요, 감사합니다</button></div>` : "";

  /* 탭 2개. '내 주문'과 '현황 n잔'을 합쳤다 (R12-1) — 내가 뭘 골랐는지 확인하고 다른 분이 다
     골랐는지 보려고 탭을 왕복하던 동선이 사라진다. 합친 탭은 키 order 를 그대로 쓰고 cafe 가
     유일한 비기본 탭으로 남으므로, '기본 탭을 떠날 때만 히스토리 1칸'이라는 불변식이 글자
     하나 안 바뀌고 성립한다 (R12-2).
     role="tab"/"tablist" 를 뗀 이유 (R12-20). (1) 지금 구조는 미완성 탭 패턴이다 — tablist 의
     aria-label, id/aria-controls, 패널의 role="tabpanel", roving tabindex, 좌우 방향키가 전부
     없다. (2) 남은 둘은 동급 형제 뷰가 아니다. 하나는 '지금 하는 일 전부'이고 다른 하나는
     '카페에 건넬 출력물'이다. 다섯 가지를 새로 들여 탭 패턴을 완성하는 것보다, 정확한 토글
     버튼 둘이 낫다.
     라벨 길이 제약: .tab 에는 white-space:nowrap 이 없고 330px 에서 글자가 12px 이라 길면 두
     줄로 접혀 min-height:44px 인 바가 두 배가 된다. 두 칸의 가용 폭이 ≈145px 이고 아래 두
     라벨은 패딩 포함 78·81px 이다. n잔 숫자는 dashStatsHtml() 의 주문 KPI 가 잇는다 (R12-18). */
  const tabs=`<div class="tabs" id="openTabs" role="group" aria-label="화면 선택">
    ${[["order","주문 · 현황"],["cafe","카페 주문서"]].map(([t,label])=>
      `<button class="tab ${openTab===t?'on':''}" data-t="${t}" aria-pressed="${openTab===t}">${label}</button>`).join("")}</div>`;

  /* 게임은 절대 저절로 뜨지 않는다 — 자진해서 섬기려던 분은 이 버튼을 그냥 안 누르면 된다.
     노출 조건은 '돌릴 수 있는가(gameEligible)' + '내가 결정권을 가진 자리인가'다.
     호스트가 남이면 그 사람의 결정을 가로챌 수 없으니 안 띄운다 (R16-1).
     주문 수 조건(Object.keys(ORDERS).length>0)은 지웠다 — 기본 참가가 '음료를 주문한 분'이라
     보통은 gameEligible() 이 더 강한 조건이다. 다만 [전원 참가]로 명단을 채운 뒤 주문이 모두
     취소되면 '참가자 2명 + 주문 0건'이 성립하므로, 그 방어는 실제로 쓰는 지점인
     commitGameWinner 로 옮겼다 (R16-5). 화면 조건으로 막으면 시트가 열려 있는 동안 주문이
     사라지는 경우를 놓친다. */
  /* 진입점을 전원에게 연다. 예전에는 '내가 호스트이거나 호스트가 없을 때'만 보였는데, 그러면
     게임 이야기를 들은 일반 참가자가 버튼을 찾다가 [제가 섬길게요]를 눌러 섬김을 열어버린다 —
     게임을 보려고 섬김을 여는 건 정확히 반대 방향이다.
     대신 결과를 서버에 쓸 수 있는 사람만 진짜다. 나머지는 연습(dry-run): 똑같이 돌려보고
     결과까지 보지만 [확정하기]가 없다. 그 판정은 gameCanCommit() 한 곳에서만 나온다. */
  const canGame = gameEligible();
  const amHostNow = SESSION.hostId===ME;
  const canCommit = gameCanCommit();
  /* 연습(dry-run) 진입점은 본문에서 뺐다 (검토 C-2).
     이 화면은 "내가 뭘 마실지 고르는 곳"인데, 아무것도 확정하지 않는 연습 버튼이 메뉴 그리드 바로
     아래·첫 화면 안에 본질과 같은 시각 무게(전폭 흰 카드)로 앉아 있었다. 실측으로 이 화면에서
     본질이 차지하는 세로가 26%였고 그중 8%가 이 버튼 구역이다.
     기능을 없애지는 않는다 — ⚙️ 설정에 두어 궁금한 사람이 찾아갈 수 있게 했다.
     남기는 것은 '결정이 필요한 자리'뿐이다: 호스트가 없어서 정해야 하거나(canCommit && !amHostNow),
     내가 호스트라 다시 정할 수 있는 경우(amHostNow). 남의 결정을 구경하는 자리에는 안 둔다. */
  const showGame = canGame && canCommit;
  const gameLabel = amHostNow ? "섬길 사람을 다시 정하려면" : "누가 섬길지 아직 안 정했다면";
  const gameBtnText = amHostNow ? "🎲 어떤 분이 섬겨주실지 게임으로 정하기"
                                : "🎲 게임으로 섬길 사람 정하기";
  // '안 마실게요'와 같은 처방 — .label 로 구역을 떼고 흰 카드 버튼으로.
  // 자리는 로스터 '위'다 (R12-11). 아래에 두면 버튼이 ~1,200px 지점으로 밀려, 예전에 탭 문제로
  // 나타났던 G9("기본 탭에 없어서 아무도 못 봤다")가 스크롤 깊이 문제로 되돌아온다.
  const gameHtml = showGame ? `
      <h3 class="label">${gameLabel}</h3>
      <button class="btn btn-choice" id="gamepick">${gameBtnText}</button>` : "";
  /* 버튼이 숨는 자리에 사유 한 줄. 호스트 없는 섬김에서만 남긴다 — 그 화면은 '누가 섬길까'가
     본론이라 게임을 기다리는 사람이 있고, 호스트가 나인 화면은 이미 결정이 끝난 자리다 (R16-2, R16-4).
     사유 문구는 gameShortReason() 의 why 를 그대로 쓴다(판정을 두 곳에 두지 않는다). how 는 안 쓴다 —
     그건 '참가자 바꾸기'로 보내는 시트 안의 안내인데, 여기선 그 시트로 갈 버튼 자체가 없다. */
  const gameWhyHtml = (!canGame && !SESSION.hostId)
    ? `<p class="muted center" style="margin-top:10px">🎲 ${esc(gameShortReason().why)} — 참가할 분이 2명 이상 모이면 게임으로 정할 수 있어요.</p>` : "";

  /* '현황' 구역을 사람에 따라 다르게 쌓는다.
     호스트 — KPI 3칸 + 펼친 로스터. "다 걷혔나"를 확인하는 것이 이 사람의 일이다.
     참가자 — 접힌 로스터 한 장뿐이다. KPI 는 접힌 요약이 이미 같은 말을 하고 있어 지웠고(R12-5의
       '한 화면에서 같은 숫자를 두 번 말하지 않는다'), 그러고 나니 구분선(👀 현황) 아래에 제목만
       두 겹으로 남아 접힌 카드 한 장에 머리가 셋 달린 꼴이 됐다. 그래서 참가자 화면에서는
       구분선을 빼고 `다른 분들` 한 층으로 간다 — 위의 `☕ 내 주문`과 짝을 이루는 두 층이 된다. */
  const iAmWatcher = SESSION.state==="open" && SESSION.hostId && SESSION.hostId!==ME;
  const statusHtml = iAmWatcher
    ? `<h2 class="sec-div">👀 다른 분들</h2>${dashPeopleHtml()}`
    : `<h2 class="sec-div">👀 ${SESSION.seq>1?SESSION.seq+"번째 섬김 · ":""}현황</h2>
      ${dashStatsHtml()}
      <h3 class="label">다른 분들 · [나도] 누르면 같은 걸로</h3>
      ${dashPeopleHtml()}`;
  if(openTab==="order"){
    /* 합친 화면의 순서 (R12-11, R12-6).
         배너 → 탭 → 내 주문(액션 카드) → 주문 바꾸기 → 메뉴 그리드 → 게임 → 현황 KPI → 다른 분들
       내 주문 블록을 로스터 행으로 접어 넣지(absorb) 않고 위에 그대로 둔(lift) 이유: 이건 상태
       행이 아니라 [수정]·[🔄 다른 메뉴로]·[🙅 안 마실게요] 세 동작을 진 액션 카드이고,
       67px 짜리 .person 행 하나에 320px 로 그 셋을 넣을 수 없다(16px 강조와 여러 줄 옵션·메모도
       함께 잃는다). 대신 아래 로스터가 나를 빼서 중복을 없앤다. */
    /* 안내 줄은 상태와 무관하게 '항상' 그린다 — 내용만 바뀐다. 예전엔 주문이 있으면 이 줄을
       통째로 빼서 카드가 한 줄만큼 줄었고, 그때마다 아래 탭이 위로 올라왔다. */
    // 한 줄(nowrap)이 유지되는 길이여야 한다 — 320px 에서 쓸 수 있는 폭이 268px 이라
    // 13px 한글 기준 대략 열여덟 글자가 상한이다. 넘으면 말줄임으로 잘린다.
    const heroSub = !myOrder ? "메뉴를 고르거나, 안 드시면 알려주세요"
                  : isSkip   ? "오늘은 쉬어가기로 하셨어요"
                             : "주문 완료 · 아래에서 바꿀 수 있어요";
    view().innerHTML=`
      <div class="card open-hero"><div class="emoji">${host?"🎉":"☕"}</div>
        <h2>${host?`<span class="host-name">${esc(host.name)}</span>${nimSfx(host.name)}이 섬깁니다!`:`아직 섬기실 분이 안 정해졌어요`}</h2>
        <p>${heroSub}</p></div>
      ${tabs}
      <h2 class="sec-div">☕ 내 주문</h2>
      ${myStatus}${changeLink}${gridHtml}${gameHtml}${gameWhyHtml}
      ${statusHtml}`;
  } else {
    view().innerHTML=`
      <!-- 합친 화면과 '똑같은' 머리말을 쓴다. 예전엔 여기만 muted 한 줄이라 카드 높이가 달랐고,
           탭을 오갈 때마다 탭 줄이 위아래로 움직였다(실사용 제보). 높이를 맞추는 게 아니라
           같은 컴포넌트를 쓰는 쪽을 골랐다 — 값을 맞춰 두면 한쪽만 고칠 때 다시 어긋난다. -->
      <div class="card open-hero"><div class="emoji">${host?"🎉":"☕"}</div>
        <h2>${host?`<span class="host-name">${esc(host.name)}</span>${nimSfx(host.name)}이 섬깁니다!`:`아직 섬기실 분이 안 정해졌어요`}</h2>
        <p>${SESSION.seq>1?SESSION.seq+"번째 섬김 · ":""}카페에 그대로 보여주세요</p></div>
      ${tabs}${dashCafeHtml()}`;
  }
  view().querySelectorAll("#openTabs .tab").forEach(el=> el.onclick=()=>setOpenTab(el.dataset.t));
  wireDashboard();
  // 누른 버튼을 그대로 넘긴다 — 오버레이가 닫힐 때 포커스를 여기로 되돌려야 한다(R13-3).
  // e.currentTarget 은 onclick 이 걸린 그 엘리먼트다. 합친 화면에서 #gamepick 은 정확히 하나다
  // (예전엔 '내 주문'과 '현황' 두 자리에 갈려 있었다 — R12-10).
  bind("gamepick",e=>{ gameEnsure(e.currentTarget); openGameSheet(); });
  if(openTab!=="order") return;   // 아래 배선은 합친 화면 전용(카페 주문서 탭에는 없다)

  const grid=document.getElementById("menuGrid");
  if(grid) grid.querySelectorAll(".menu-row2, .menu-more").forEach(t=>{ if(t.dataset.full) t.onclick=()=>openFullMenuSheet(myOrder&&myOrder.menuId, myOrder&&myOrder.note); else if(t.dataset.custom) t.onclick=()=>openCustomSheet(null, null, myOrder&&myOrder.note); else t.onclick=()=>openOrderSheet(t.dataset.id, myOrder&&myOrder.note?{note:myOrder.note}:null); });
  // 안 마실게요 버튼은 두 자리(그리드 아래 / 주문 후 버튼줄)에 나타난다 — 상호배타지만 클래스로 한 번에 배선
  /* 한 번 묻는다. 되돌릴 수 있는 선택이지만(아래 메뉴 그리드가 그대로 열려 있다) 이 버튼은
     메뉴 타일 바로 아래에 전폭으로 있어서 타일을 누르려다 스치는 자리다. 실수로 눌리면
     '주문함'에서 '안 마심'으로 상태가 통째로 바뀌고, 섬기는 분 화면의 잔 수까지 줄어든다. */
  view().querySelectorAll(".skip-btn").forEach(b=> b.onclick=async()=>{
    if(!(await askConfirm("오늘은 음료를 안 드시는 거죠?\n마음이 바뀌면 아래에서 메뉴를 고르면 돼요.",{ok:"네, 안 마실게요"}))) return;
    guardWrite(async()=>{ forceGrid=false; if(await safeWrite(Sync.setOrder(ME,{type:"skip"},SESSION.seq))){ track("order_skipped",{via:"idle"}); toast("오늘은 쉬어가기로 했어요 🙆"); render(); } }, b, "저장 중…");
  });
  const em=document.getElementById("editMine"); if(em) em.onclick=()=>openOrderSheet(myOrder.menuId,myOrder);
  view().querySelectorAll(".sameas").forEach(b=> b.onclick=()=>guardWrite(async()=>{ const src=ORDERS[b.dataset.id];
    const o={type:"drink",menuId:src.menuId,menuName:src.menuName||orderDisplay(src).name,temp:src.temp,extras:[...(src.extras||[])],note:""};
    forceGrid=false; if(await safeWrite(Sync.setOrder(ME,o,SESSION.seq))){ rememberOrder(o); bumpFreq(o.menuId); trackOrder(o,"copy_other"); toast(hon(memberById(b.dataset.id).name)+"과 같은 메뉴로 담았어요"); render(); } }, b, "담는 중…"));
  /* 지난번 주문 → 주문 시트를 채워서 연다. 바로 서버에 쓰지 않는 이유가 둘이다.
     ① 검증. 저장된 옵션이 지금도 유효한지는 시트의 draw() 가 판정한다(온도는 temps 로 조이고
        extras 는 availExtras 로 거른다). 여기서 바로 쓰면 그 판정을 한 벌 더 만들어야 하고,
        옵션 규칙이 바뀔 때 둘이 갈린다.
     ② 대부분의 '지난번 그대로'는 사실 '지난번에서 하나만 빼고'다 — 시트가 열려 있으면 그
        수정이 공짜다. 탭 한 번을 더 쓰는 대신 얻는 것이다. */
  const ag=document.getElementById("againOrder");
  if(ag) ag.onclick=()=>{ const p=lastOrder(); if(p) openOrderSheet(p.menuId, myOrder||null, p); };
}

// 서로 배반인 옵션: 한쪽을 켜면 다른 쪽은 자동 해제 (샷추가 ↔ 연하게)
const EXCLUSIVE_EXTRAS = { "샷추가":"연하게", "연하게":"샷추가", "얼음적게":"얼음많이", "얼음많이":"얼음적게", "우유적게":"우유많이", "우유많이":"우유적게", "물적게":"물많이", "물많이":"물적게" };

/* 커피샷/우유 음료 옵션 자동 부여 — 아메리카노/카페라떼를 기준으로 눈치껏.
   명시 optionGroups가 있으면 그걸 쓰고, 없으면 카테고리·이름으로 판별해 그룹을 구성한다.
   플래그로 개별 예외 지정 가능: shot:true/false, milk:true/false, decaf:false */
function menuHasShot(m){                                  // 에스프레소 샷 들어가는 음료
  if(m.shot===false) return false; if(m.shot===true) return true;
  if(m.cat==="coffee" || m.cat==="latte") return true;   // 아메리카노·에스프레소·라떼류(에스프레소 베이스)
  if(m.cat==="icedtea" && /샷/.test(m.name||"")) return true;  // 아샷추
  return false;
}
function menuHasMilk(m){                                  // 우유 들어가는 음료
  if(m.milk===false) return false; if(m.milk===true) return true;
  if(m.cat==="latte" || m.cat==="tealatte" || m.cat==="fruitlatte") return true;
  if(m.cat==="coldbrew" && /라떼|밀크/.test(m.name||"")) return true;  // 콜드브루 라떼/밀크
  return false;
}
function cafeAllowsDecaf(){ return (CAFES[activeCafeId()]||{}).decaf !== false; }   // 카페별 디카페인 제공 여부(길카페: 없음)
function menuTakesDecaf(m){ return cafeAllowsDecaf() && m.decaf!==false && (m.cat==="coffee" || m.cat==="latte"); }
function deriveOptionGroups(m){                           // 명시 그룹 없을 때 자동 구성(범위 밖이면 null)
  const hasShot=menuHasShot(m), hasMilk=menuHasMilk(m);
  if(!hasShot && !hasMilk) return null;
  const canIce=(m.temps||[]).includes("ICE");
  const g=[];
  if(hasMilk || canIce) g.push(OPT_SIZE);                // 컵 음료(우유/아이스 가능)만 사이즈
  if(hasShot) g.push(OPT_SHOT);
  if(hasMilk){ g.push(OPT_MILKTYPE); g.push(OPT_MILK); }
  if(canIce) g.push(OPT_ICE);
  return g.length ? g : null;
}
function menuFlatToggles(m){                              // 그룹에 안 담기는 토글(디카페인/덜달게) — 다중선택 유지
  const t=[];
  if(menuTakesDecaf(m)) t.push("디카페인");
  if((m.extras||[]).includes("덜달게")) t.push("덜달게");
  return t;
}
/* prefill 은 '값을 미리 채워라'이고 existing 은 '이미 주문이 있다'(→ 버튼이 [주문 수정]/[주문 취소])
   라는 뜻이다. 지난번 주문 다시 담기는 앞엣것만 필요하고 뒤엣것은 실제 상태를 따라야 해서 갈랐다.
   값 검증은 아래 draw() 가 이미 다 한다 — 온도는 지금 메뉴의 temps 로 조이고 extras 는
   availExtras 에 없는 걸 걸러낸다. 지난 주문을 여기로 흘려보내는 이유가 그것이다: 검증을
   두 벌 만들지 않는다. */
function openOrderSheet(menuId, existing, prefill){
  const src = prefill || existing;
  let temp = src&&src.temp ? src.temp : null;
  let extras = src&&src.extras ? [...src.extras] : [];
  let note = src&&src.note ? src.note : "";
  /* 옵션 접힘 상태. 이미 고른 옵션이 있으면 펼친 채로 연다 — 수정하러 들어온 사람에게
     자기가 고른 것이 안 보이면 '지워졌나' 로 읽힌다. draw() 는 온도 전환 등으로 여러 번 도는데
     그때마다 이 값을 다시 계산하면 열어 둔 서랍이 저절로 닫힌다. */
  let optOpen = !!(src && src.extras && src.extras.length);
  function draw(keepScroll){
    const m = anyMenuById(menuId) || { id:menuId, name:(existing&&existing.menuName)||"?", emoji:"🥤", temps:["ICE","HOT"], extras:[] };
    if(m.temps.length){ if(!temp || !m.temps.includes(temp)) temp = m.temps[0]; } else { temp = null; }
    // 구조화 옵션(단일선택 그룹): 명시 optionGroups 또는 커피샷/우유 자동 판별. 있으면 그룹+토글, 없으면 기존 flat extras.
    const allGroups = m.optionGroups || deriveOptionGroups(m) || [];
    const groups = allGroups.filter(g=> !g.tempOnly || g.tempOnly===temp);
    const hasGroups = groups.length>0;
    const flatToggles = hasGroups ? menuFlatToggles(m) : [];   // 디카페인/덜달게(다중선택)
    let availExtras, optionsHtml="";
    if(hasGroups){
      const groupOpts = groups.reduce((a,g)=>a.concat(g.opts.filter(o=>o!==g.def)),[]);  // 기본값은 저장 안 함
      availExtras = groupOpts.concat(flatToggles);
      extras = extras.filter(x=>availExtras.includes(x));
      optionsHtml = groups.map(g=>{
        const cur = g.opts.find(o=>extras.includes(o)) || g.def;   // 저장된 값 없으면 기본값 선택
        return `<div class="label" id="lbl-${esc(g.key)}">${esc(g.label)}</div><div class="chips optgroup" role="radiogroup" aria-labelledby="lbl-${esc(g.key)}" data-key="${esc(g.key)}">${g.opts.map(o=>`<div class="chip ${o===cur?'sel':''}" role="radio" tabindex="0" aria-checked="${o===cur}" data-opt="${esc(o)}">${esc(o)}</div>`).join("")}</div>`;
      }).join("");
      if(flatToggles.length) optionsHtml += `<div class="label">추가 옵션 (여러 개 가능)</div><div class="chips" id="extras">${flatToggles.map(x=>`<div class="chip ${extras.includes(x)?'sel':''}" role="button" tabindex="0" aria-pressed="${extras.includes(x)}" data-x="${esc(x)}">${esc(x)}</div>`).join("")}</div>`;
    } else {
      const caf = cafeAllowsDecaf() && m.decaf!==false && ["coffee","latte","coldbrew","handdrip"].includes(m.cat); // 커피 기반 = 디카페인 가능(카페가 제공 + decaf:false 제외)
      const isLatte = ["latte","tealatte","fruitlatte"].includes(m.cat) || /라떼|밀크/.test(m.name||""); // 라떼류 = 우유 조절
      const milkOpts = isLatte ? ["우유적게","우유많이"] : [];
      const iceOpts  = (temp==="ICE") ? ["얼음적게","얼음많이"] : [];   // 얼음은 ICE 주문일 때만
      availExtras = (caf?["디카페인"]:[]).concat(m.extras||[]).concat(milkOpts).concat(iceOpts);
      extras = extras.filter(x=>availExtras.includes(x));
      optionsHtml = availExtras.length?`<div class="label">옵션 (여러 개 가능)</div><div class="chips" id="extras">${availExtras.map(x=>`<div class="chip ${extras.includes(x)?'sel':''}" role="button" tabindex="0" aria-pressed="${extras.includes(x)}" data-x="${esc(x)}">${esc(x)}</div>`).join("")}</div>`:"";
    }
    const tempHtml = m.temps.length>1
      ? `<div class="seg-temp" id="temps">${m.temps.map(t=>`<button class="tbtn ${t==='ICE'?'ice':'hot'} ${t===temp?'on':''}" data-t="${t}">${t==='ICE'?'🧊 ICE':'🔥 HOT'}</button>`).join("")}</div>`
      : m.temps.length===1
      ? `<div class="seg-temp"><button class="tbtn ${m.temps[0]==='ICE'?'ice on':'hot on'}" disabled>${m.temps[0]==='ICE'?'🧊 ICE 전용':'🔥 HOT 전용'}</button></div>`
      : "";
    /* 옵션을 서랍에 넣는다 (검토 C-5). 아메리카노는 그룹 5개·칩 17개가 한 번에 펼쳐져서
       "이걸 다 골라야 하나"로 읽혔다 — 실제로는 기본값 그대로 두 번 탭이면 끝나는데도.
       온도는 서랍 밖에 둔다: 거의 항상 고르고, ICE/HOT 은 옵션이 아니라 주문의 일부다. */
    const optsHtml = optionsHtml ? `<details class="opt-fold"${optOpen?" open":""} id="optFold">
        <summary><span>옵션 고르기</span><span class="rf-more" id="optCount">${extras.length?esc(extras.length+"개 선택됨"):"기본 그대로"}</span></summary>
        <div class="opt-fold-body">${optionsHtml}</div></details>` : "";
    // 하단 고정 바에 보여줄 현재 선택 요약(온도·옵션) — 스크롤 없이 무엇을 골랐는지 확인
    const summaryText = ()=>{ const parts=[]; if(temp && m.temps.length>1) parts.push(temp==="ICE"?"🧊 ICE":"🔥 HOT"); availExtras.forEach(x=>{ if(extras.includes(x)) parts.push(x); }); return parts.length?parts.join(" · "):"기본 그대로"; };
    /* 옵션 칩은 일부러 리렌더하지 않고 .sel 만 제자리에서 바꾼다(모바일에서 화면이 위로 튀지 않게).
       그래서 서랍이 접혀 있을 때 보이는 요약도 여기서 함께 갱신해야 한다 — 안 그러면 접힌 서랍이
       '기본 그대로'라고 말하는데 안에는 옵션이 골라져 있는 상태가 된다. */
    const refreshSum = ()=>{ const s=document.getElementById("ordSum"); if(s) s.textContent=summaryText();
      const c=document.getElementById("optCount"); if(c) c.textContent = extras.length ? extras.length+"개 선택됨" : "기본 그대로"; };
    const prevScroll = keepScroll && sheetOpen ? $sheet.scrollTop : 0;   // 온도 전환 등 리렌더 시 스크롤 위치 유지
    openSheet(`
      <!-- 시트 머리는 둘 중 하나만 쓴다 — 제목과 .pickbar 를 같이 두면 같은 메뉴 이름이
           연달아 두 번 나온다(실사용 제보). 들어온 이유에 따라 남길 것이 다르다:
             수정 — 제목 한 줄("☕ 아메리카노 수정"). 무엇을 하러 왔는지가 이름보다 중요하다.
             새로 담기 — .pickbar. 방금 누른 타일이 그대로 올라온 확인이라 이모지·채움이 일을 한다.
           .pickbar 쪽 이름을 <h3> 로 쓰는 이유: openSheet 이 <h3> 를 찾아 aria-labelledby 를
           걸어 시트 이름을 만든다. 제목을 그냥 지우면 스크린리더에는 시트가 "상세"로만 읽힌다. -->
      ${existing
        ? `<h3>${esc(m.emoji)} ${esc(m.name)} 수정</h3>`
        : `<div class="pickbar"><span class="em">${esc(m.emoji)}</span><span class="tx"><span class="k">고른 메뉴</span><h3 class="n">${esc(m.name)}</h3></span></div>`}
      <!-- 안내 한 줄. 새로 담을 때는 남은 할 일을 말하고, 수정하러 들어왔을 때는
           "안 고쳐도 된다"를 말한다 — 이 시트에 들어온 이유가 서로 다르다. -->
      ${(optionsHtml||tempHtml)
        ? `<p class="sheet-hint">${existing?'담아 둔 주문이에요. 고치실 게 없으면 <b>[닫기]</b>를 누르시면 돼요.':(tempHtml?'이제 <b>온도</b>만 고르면 돼요.':'고르실 게 없으면 그대로 <b>[이걸로 주문]</b>을 누르시면 돼요.')}</p>`
        : ""}
      <div class="order-opts">
        ${tempHtml?`<div class="label">온도</div>${tempHtml}`:""}
        ${optsHtml}
        <div class="label" id="lbl-note">메모 (선택)</div><input autocomplete="off" type="text" id="note" maxlength="200" placeholder="예: 시럽 빼고" value="${esc(note)}" aria-labelledby="lbl-note" />
        <!-- 메뉴를 바꾸는 길은 본문 맨 아래다 (5a). 푸터는 이 시트를 끝내는 세 동작
             (닫기 · 주문 수정 · 주문 취소)만 쥔다 — 다른 화면으로 가는 문은 거기 섞지 않는다. -->
        ${existing?`<button class="sheet-relink" id="relinkMenu">다른 메뉴로 바꾸기</button>`:""}
      </div>
      <div class="sheet-foot">
        <div class="ord-sum" id="ordSum" aria-live="polite">${esc(summaryText())}</div>
        <!-- 좌우로 나란히 둔다. 세로로 쌓으면 버튼 하나 + 간격(≈57px)만큼 위 옵션 영역이 짧아지는데,
             이 시트는 옵션을 고르는 것이 본론이라 그 자리가 아깝다. 전체 메뉴판 시트가 같은 이유로
             이미 .row-2 를 쓴다.
             순서는 askConfirm 과 같게 부(좌)·주(우)다 — 이 앱에서 '진행'은 늘 오른쪽에 있다.
             라벨이 모두 네 글자 이하라 320px 반쪽 폭(≈130px)에서도 접히지 않는다. -->
        ${existing
          ? `<div class="row-2">
          <button class="btn btn-ghost" id="closeEdit">닫기</button>
          <button class="btn btn-brand" id="confirmOrder">주문 수정</button>
        </div>
        <!-- 파괴적 동작은 맨 아래 링크로 (5a). 예전엔 [주문 취소]가 [주문 수정] 과 같은 크기로
             나란히 서서, 고치러 들어온 사람이 반반 확률로 지우는 쪽을 만났다. -->
        <button class="sheet-relink danger" id="cancelOrder">주문 취소하기</button>`
          : `<button class="btn btn-brand" id="confirmOrder">이걸로 주문</button>
        <!-- 새로 담는 길에서는 여기가 되돌아가는 문이다. 라벨이 '가는 곳'을 말한다 —
             시트를 닫으면 메뉴 그리드로 돌아간다는 사실이 화면 어디에도 안 적혀 있었다. -->
        <button class="sheet-relink" id="relinkMenu">메뉴를 잘못 골랐어요 · 다시 고르기</button>`}
      </div>`);
    if(prevScroll) $sheet.scrollTop = prevScroll;   // openSheet가 0으로 리셋한 스크롤을 원복
    /* 시트 안에 메뉴 그리드가 없으므로 타일 배선도 없다. 대신 되돌아가는 길 하나 —
       시트를 닫고 화면의 그리드로 돌린다. 옛 방식(시트 안에서 menuId 를 갈아끼우고 draw())과
       달리 고르는 자리가 한 곳뿐이라, "여기서 고른 것"과 "저기서 고른 것"이 갈리지 않는다. */
    const rl=document.getElementById("relinkMenu"); if(rl) rl.onclick=()=>{ forceGrid=true; closeSheet(); render(); };
    const ce=document.getElementById("closeEdit"); if(ce) ce.onclick=closeSheet;   // 고칠 게 없으면 그냥 닫는다 (5a)
    const of_=document.getElementById("optFold"); if(of_) of_.addEventListener("toggle",()=>{ optOpen=of_.open; });
    const tp=document.getElementById("temps"); if(tp) tp.querySelectorAll(".tbtn").forEach(b=>{ if(!b.disabled) b.onclick=()=>{ temp=b.dataset.t; note=document.getElementById("note").value; draw(true); }; });
    // 단일선택 그룹: 같은 그룹의 다른 옵션은 해제, 기본값 선택 시 저장 안 함
    // 제자리에서 .sel만 갱신 — 전체 리렌더/스크롤 리셋 없이(카톡·모바일에서 위로 튐 방지)
    $sheet.querySelectorAll(".optgroup").forEach(gEl=>{ const g=groups.find(x=>x.key===gEl.dataset.key); if(!g) return;
      gEl.querySelectorAll(".chip").forEach(c=> c.onclick=()=>{ const opt=c.dataset.opt;
        extras = extras.filter(x=>!g.opts.includes(x));
        if(opt!==g.def) extras.push(opt);
        gEl.querySelectorAll(".chip").forEach(x=>{ const on=x===c; x.classList.toggle("sel", on); x.setAttribute("aria-checked", on); });
        refreshSum(); }); });
    const ex=document.getElementById("extras"); if(ex) ex.querySelectorAll(".chip").forEach(c=> c.onclick=()=>{ const v=c.dataset.x,i=extras.indexOf(v);
      if(i>=0){ extras.splice(i,1); c.classList.remove("sel"); c.setAttribute("aria-pressed","false"); }
      else { extras.push(v); c.classList.add("sel"); c.setAttribute("aria-pressed","true"); const opp=EXCLUSIVE_EXTRAS[v]; if(opp){ const j=extras.indexOf(opp); if(j>=0){ extras.splice(j,1);   // 배반 옵션 자동 해제
        ex.querySelectorAll(".chip").forEach(x=>{ if(x.dataset.x===opp){ x.classList.remove("sel"); x.setAttribute("aria-pressed","false"); } }); } } }
      refreshSum(); });
    const noteEl=document.getElementById("note"); if(noteEl) noteEl.onfocus=()=>{ setTimeout(()=>{ try{ noteEl.scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){} },250); };  // 키보드가 입력창 가리지 않게
    const cob=document.getElementById("confirmOrder");
    cob.onclick=()=>guardWrite(async()=>{ note=document.getElementById("note").value.trim(); forceGrid=false;
      if(hasGroups) extras.sort((a,b)=>availExtras.indexOf(a)-availExtras.indexOf(b));   // 표시 순서 안정화(사이즈→샷→물→얼음)
      const ord={type:"drink",menuId,menuName:m.name,temp,extras,note};
      if(await safeWrite(Sync.setOrder(ME,ord,SESSION.seq))){ rememberOrder(ord); bumpFreq(menuId); trackOrder(ord, existing?"edit":"sheet"); closeSheet(); toast(existing?"주문을 바꿨어요":"주문 담았어요 🙏"); render(); } }, cob, existing?"바꾸는 중…":"담는 중…");
    // 바로 위 [이걸로 주문]과 같은 가드에 넣는다 — 이 버튼만 밖에 있어서 빠른 더블탭이 삭제 요청을
    // 두 번 보냈다(두 번째는 이미 없는 주문을 지운다).
    const co=document.getElementById("cancelOrder"); if(co) co.onclick=()=>guardWrite(async()=>{ forceGrid=false; if(await safeWrite(Sync.removeOrder(ME,SESSION.seq))){ track("order_removed"); closeSheet(); toast("주문을 취소했어요"); render(); } }, co, "취소하는 중…");
  }
  draw();
}

// 편집거리(레벤슈타인) — 오타 허용 매칭용. 의존성 추가 없이 순수 JS로.
function editDistance(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i];
    for(let j=1;j<=n;j++) cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1+Math.min(prev[j-1],prev[j],cur[j-1]);
    prev=cur; }
  return prev[n]; }
// qn(입력)이 hay(후보명) 안 어딘가와 비슷한지 — hay가 더 길면 qn 길이만한 구간을 슬라이딩하며 최소 편집거리 계산
// (예: "붐다버그"가 "번더버그 만다린" 뒷부분과는 안 비슷해도 앞부분 "번더버그"와는 비슷함을 잡아냄)
function fuzzyDist(qn, hay){ if(qn.length>=hay.length) return editDistance(qn,hay);
  let best=Infinity;
  for(let i=0;i+qn.length<=hay.length;i++){ const d=editDistance(qn, hay.slice(i,i+qn.length)); if(d<best) best=d; if(!best) break; }
  return best; }
function typoThreshold(len){ return len<=3?1 : len<=5?2 : 3; }
function norm(s){ return (s||"").trim().toLowerCase().replace(/\s+/g,""); }
// 이름 매칭: 정확/부분 일치 우선, 짧은 오타는 편집거리로 허용 — 메뉴 검색·직접입력·대시보드 공용.
// 오타 허용은 3글자부터. 2글자에서 편집거리 1을 허용하면 절반이 틀려도 통과해
// "2셀"이 "청년2부1셀"에, "하영"이 "하성"에 걸린다(다른 대상이지 오타가 아니다).
function matchesName(mn,qn){ return mn===qn || mn.includes(qn) || qn.includes(mn) || (qn.length>=3 && fuzzyDist(qn,mn)<=typoThreshold(qn.length)); }
// 초성 검색: "ㅇㅁㄹ" → 아메리카노. 한글 유니코드 0xAC00 + (초성×588) 규칙.
const CHO=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function toCho(s){ return Array.from(String(s)).map(ch=>{ const c=ch.charCodeAt(0)-0xac00; return (c>=0&&c<=11171)?CHO[Math.floor(c/588)]:ch; }).join(""); }
function isChoQuery(s){ return !!s && Array.from(s).every(ch=>CHO.indexOf(ch)>=0); }
// 이름 매칭 정본 — 질의가 전부 자음이면 초성 모드, 아니면 오타 허용.
// 메뉴 검색과 대시보드의 셀·사람 검색이 이 한 함수를 공유한다.
function nameHit(name, ql){ if(!ql) return true; const n=norm(name);
  return isChoQuery(ql) ? toCho(n).indexOf(ql)>=0 : matchesName(n, ql); }
// 메뉴 대신 "주문완료/직접주문" 등을 적는 건 사실 오늘 생략 의사표시인 경우가 대부분 — 그쪽으로 자연스럽게 유도
const DECLINE_WORDS=["주문완료","직접주문","따로주문","개별주문","생략","패스","스킵","노쇼"];

function openCustomSheet(existing, prefillName, prefillNote){
  let temp="ICE";
  // 자동완성 후보 = 정식 메뉴 + 이 섬김에서 이미 다른 사람이 쓴 커스텀 메뉴(무분별한 중복 생성 방지)
  const pool=[...MENUS, ...customMenusFromOrders()];
  const noteVal = prefillNote!=null ? prefillNote : ((existing&&existing.note)||"");
  openSheet(`
    <h3>🥤 직접 입력</h3>
    <p class="muted" style="margin-top:0">목록에 없는 메뉴를 추가해요. 추가하면 다른 분에게도 보입니다.</p>
    <div class="label" id="lbl-cname">메뉴 이름</div>
    <input type="text" id="cname" maxlength="60" placeholder="예: 흑임자라떼" autocomplete="off" value="${esc(prefillName||"")}" aria-labelledby="lbl-cname" />
    <div id="cNotice"></div>
    <div id="cSuggest"></div>
    <div class="label">온도</div>
    <div class="seg-temp" id="ctemp">
      <button class="tbtn ice on" data-t="ICE">🧊 ICE</button>
      <button class="tbtn hot" data-t="HOT">🔥 HOT</button>
    </div>
    <div class="label" id="lbl-cnote">메모 (선택)</div><input autocomplete="off" type="text" id="cnote" maxlength="200" placeholder="예: 덜 달게" value="${esc(noteVal)}" aria-labelledby="lbl-cnote" />
    <div style="height:18px"></div>
    <!-- [닫기]를 옆으로 (14b) — 세로로 쌓으면 버튼 하나 + 간격만큼 시트가 길어진다.
         순서는 다른 시트와 같게 부(좌)·주(우). -->
    <div class="row-2">
      <button class="btn btn-ghost" id="cClose">닫기</button>
      <button class="btn btn-brand" id="cAdd">추가하고 주문</button>
    </div>`);
  document.getElementById("ctemp").querySelectorAll(".tbtn").forEach(b=> b.onclick=()=>{ temp=b.dataset.t;
    document.getElementById("ctemp").querySelectorAll(".tbtn").forEach(x=>x.classList.toggle("on", x.dataset.t===temp)); });

  const nameEl=document.getElementById("cname"), sugEl=document.getElementById("cSuggest"),
        noticeEl=document.getElementById("cNotice"), addBtn=document.getElementById("cAdd");
  let exactMatch=null, isDecline=false;
  // 기존 메뉴로 자연스럽게 전환 — 알림창 대신 이미 쓰던 시트 전환(openFullMenuSheet의 메뉴 클릭과 동일한 방식)
  function goToExisting(m){ openOrderSheet(m.id, existing); }
  function goToSkip(btn){ guardWrite(async()=>{ forceGrid=false;
    if(await safeWrite(Sync.setOrder(ME,{type:"skip"},SESSION.seq))){ track("order_skipped",{via:"sheet"}); closeSheet(); toast("오늘은 쉬어가기로 했어요 🙆"); render(); } }, btn, "저장 중…"); }
  /* '이미 있는 메뉴예요'는 주 버튼을 통째로 바꿔 커스텀으로 담을 길을 없애는 판정이라,
     검색보다 훨씬 좁아야 한다. 두 가지를 지킨다.
     ① 오타 허용은 3글자부터 — matchesName 이 이미 정한 규칙이고 근거도 그 주석에 있다.
        이 경로만 2글자에서 허용했더니 `우유→우도땅콩라떼`·`생수→홍삼생강차`처럼 절반이 틀려도
        통과했다 (QA F-2).
     ② 비교는 '이름 전체 대 이름 전체'다. fuzzyDist 는 긴 이름 안을 질의 길이만큼 슬라이딩하므로
        `밀크티`가 `콜드브루 밀크 블렌디드`의 한 조각과 닮았다는 이유로 걸린다 — 그건 부분 일치가
        옳은 검색의 규칙이지 '같은 메뉴인가'의 규칙이 아니다. 길이 차 1 이내로 묶어 두면
        오타(한 글자 틀림·빠짐)만 남고 '남의 이름 속 조각'은 빠진다.
     느슨한 후보는 아래 matches 가 제안 목록으로 계속 보여 준다 — 막는 게 아니라 옮기는 것이다.
     ③ 완전 일치를 먼저 훑고, 오타 후보 중에서는 가장 가까운 것을 고른다. pool.find 로 한 번에
        훑으면 '메뉴판에 먼저 적힌 것'이 이긴다 — `돌체라떼`를 쳤을 때 이름이 똑같은 메뉴를 두고
        앞줄의 `카페라떼`(거리 2)가 잡혔고, `바닐라라때`는 거리 1인 `바닐라라떼` 대신 거리 2인
        `바닐라빈라떼`가 잡혔다. 메뉴 배열 순서가 판정을 바꾸면 안 된다. */
  function bestExisting(qn){
    const exact = pool.find(m=>norm(m.name)===qn);
    if(exact || qn.length<3) return exact || null;
    let best=null, bd=Infinity;
    for(const m of pool){
      const mn=norm(m.name);
      if(Math.abs(mn.length-qn.length)>1) continue;   // 오타는 길이가 비슷하다. 남의 이름 속 조각은 여기서 빠진다
      const d=editDistance(qn,mn);
      if(d<=typoThreshold(qn.length) && d<bd){ bd=d; best=m; }
    }
    return best;
  }
  function refreshSuggestions(){
    const qn=norm(nameEl.value);
    isDecline = !!qn && DECLINE_WORDS.some(w=>qn.includes(w));
    exactMatch = (!isDecline && qn.length>=2) ? bestExisting(qn) : null;
    const matches = (!isDecline && qn && !exactMatch) ? pool.filter(m=>matchesName(norm(m.name),qn)).slice(0,4) : [];
    /* 제안 목록에 제목과 › 를 붙인다 (14b) — 목록만 있으면 '읽을 것'으로 보이고, 눌러서
       그 메뉴로 갈아탈 수 있다는 사실이 화면에 없다. */
    sugEl.innerHTML = matches.length ? `<div class="label" style="margin:10px 0 4px">혹시 이 메뉴인가요?</div>
      <div class="card" style="padding:2px 12px">${
      matches.map(m=>`<div class="person menu-row" data-id="${esc(m.id)}" style="cursor:pointer;padding:9px 2px" role="button" tabindex="0" aria-label="${esc(m.name)}로 전환">
        <div style="font-size:19px;width:24px;text-align:center">${esc(m.emoji||"🥤")}</div>
        <div class="pname" style="font-size:14px">${esc(m.name)}</div>
        <span class="cs-go">›</span></div>`).join("")}</div>` : "";
    /* 판정은 안내 박스가 말하고 버튼에는 동사만 남긴다 (14b).
       예전엔 버튼 하나가 판정과 동작을 같이 짊어져서 "✋ 이미 있는 메뉴예요 — 🍦 바닐라라떼로
       주문" 처럼 세 줄로 접혔다. 무엇이 일어나는지와 무엇을 누르는지는 다른 정보다. */
    if(isDecline){
      noticeEl.innerHTML = `<div class="banner-warn" style="margin:10px 0 0"><b>🙅 오늘은 안 드시는 건가요?</b><br>'안 마실게요'로 저장할게요.</div>`;
      addBtn.textContent = "안 마실게요";
      addBtn.classList.remove("btn-brand"); addBtn.classList.add("btn-soft");
    } else if(exactMatch){
      noticeEl.innerHTML = `<div class="banner-warn" style="margin:10px 0 0"><b>✋ 이미 메뉴판에 있어요</b><br>${esc((exactMatch.emoji||"🥤")+" "+exactMatch.name)} · ${esc(exactMatch.temps&&exactMatch.temps.length?exactMatch.temps.join("/"):"온도 없음")}</div>`;
      addBtn.textContent = "이걸로 주문";
      addBtn.classList.remove("btn-soft"); addBtn.classList.add("btn-brand");
    } else {
      noticeEl.innerHTML = "";
      addBtn.textContent = "추가하고 주문";
      addBtn.classList.remove("btn-soft"); addBtn.classList.add("btn-brand");
    }
  }
  nameEl.addEventListener("input", refreshSuggestions);
  if(prefillName) refreshSuggestions();   // 검색창에서 넘어온 값도 바로 자동완성/오타매칭 판정
  sugEl.addEventListener("click", e=>{ const r=e.target.closest(".menu-row"); if(!r) return; const m=pool.find(x=>x.id===r.dataset.id); if(m) goToExisting(m); });

  addBtn.onclick=async()=>{
    if(isDecline){ goToSkip(addBtn); return; }
    if(exactMatch){ goToExisting(exactMatch); return; }
    const name=document.getElementById("cname").value.trim(), note=document.getElementById("cnote").value.trim();
    if(!name){ toast("메뉴 이름을 입력해주세요"); return; }
    forceGrid=false;
    const cOrd={type:"drink",menuId:"c:"+name,menuName:name,temp,extras:[],note};
    if(!(await safeWrite(Sync.setOrder(ME,cOrd,SESSION.seq)))) return;
    trackOrder(cOrd,"custom");
    rememberOrder(cOrd);
    bumpFreq("c:"+name);
    // 직접입력 메뉴는 이 셀 주문(menu_name)으로만 저장 — 그날 이 셀 그리드에 표시(customMenusFromOrders).
    // (공유 카페로의 자동 승격은 익명 오염 방지를 위해 제거; 카페 공식 메뉴 추가는 관리자만)
    closeSheet(); toast("추가해서 담았어요 🙏"); render(); };
  document.getElementById("cClose").onclick=closeSheet;
  setTimeout(()=>{ const el=document.getElementById("cname"); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } },60);
}

function openFullMenuSheet(curId, carryNote){
  // 목록을 '한 번만' 그리고, 검색은 보이기/숨기기 토글만 → 덜컹임 없음
  /* 온도 배지는 모든 행에 붙는다 (13a). 둘 다 되면 색 없는 중립 칩, 한쪽만 되면 색이 붙어
     눈에 걸린다 — 색은 온도 버튼(.tbtn.ice.on·.tbtn.hot.on)과 같은 것을 쓴다.
     "HOT ONLY" 가 알려주는 것은 '이건 아이스가 안 된다'는 제약이라, 제약이 있을 때만 색이 켜진다. */
  const tempBadge = m => !m.temps.length ? `<span class="mt-b">·</span>`
    : m.temps.length>1 ? `<span class="mt-b">ICE · HOT</span>`
    : m.temps[0]==="HOT" ? `<span class="mt-b hot">HOT ONLY</span>`
                         : `<span class="mt-b ice">ICE ONLY</span>`;
  const listHtml = CATEGORIES.map(c=>{
    const items=MENUS.filter(m=>m.cat===c.id);
    if(!items.length) return "";
    return `<div class="mcat" data-cat="${esc(c.id)}"><div class="label" style="margin-top:14px">${c.label}</div><div class="card" style="padding:4px 14px">`+
      items.map(m=>`<div class="person menu-row${m.id===curId?' picksel':''}" data-id="${esc(m.id)}" data-name="${esc(norm(m.name))}" style="cursor:pointer" role="button" tabindex="0" aria-pressed="${m.id===curId}" aria-label="${esc(m.name)} 주문">
        <div class="mrow-em">${esc(m.emoji)}</div>
        <div class="mrow-nm">${esc(m.name)}</div>
        <span class="mrow-t">${m.id===curId?'<span class="mt-now">지금 이거</span>':tempBadge(m)}</span></div>`).join("")+`</div></div>`;
  }).join("");
  /* 종류 칩 줄 (13a). 32가지를 한 줄로 훑으려면 스크롤이 길어서, 먼저 종류로 좁힐 수 있게 한다.
     라벨은 줄임 없는 풀네임이다 — 칩 줄 자체가 가로 스크롤이라 길이를 아낄 이유가 없고,
     줄이면 "티 라떼"와 "티 (차)"처럼 앞이 같은 종류가 구분되지 않는다.
     기간 프리셋(.dash-filter)이 쓰는 가로 스크롤 규칙을 그대로 쓴다. */
  const catChips = `<div class="tabs dash-filter mcat-chips" id="mCats" role="group" aria-label="종류 고르기">`
    + `<button class="tab on" data-cat="">전체</button>`
    + CATEGORIES.filter(c=>MENUS.some(m=>m.cat===c.id))
        .map(c=>`<button class="tab" data-cat="${esc(c.id)}">${esc(c.label)}</button>`).join("")
    + `</div>`;
  openSheet(`
    <div style="flex:none;background:var(--bg);z-index:10;margin:0 -16px 0;padding:6px 16px 10px">
      <div class="row-between" style="margin-bottom:8px"><h3 style="margin:0">📋 전체 메뉴판</h3><button class="sheet-x btn-close" id="mCloseX" aria-label="닫기">✕</button></div>
      <input type="search" id="mq" placeholder="🔍 메뉴 검색 (예: 자몽, ㅇㅁㄹ)" aria-label="메뉴 검색 — 초성으로도 찾을 수 있어요" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" />
      ${catChips}
    </div>
    <div class="sheet-scroll">
      <div class="sheet-count" id="mCount"></div>
      <div id="mResults">${listHtml}<p class="muted center" id="mEmpty" style="margin-top:24px;display:none">검색 결과가 없어요</p></div>
      <div style="height:14px"></div>
    </div>
    <div class="sheet-foot">
      <!-- 좌우로 나란히 둔다. 세로로 쌓으면 버튼 하나 + 간격만큼(≈60px) 목록이 짧아지는데,
           이 시트는 목록을 훑는 것이 본론이라 그 60px 이 아깝다. 라벨을 줄인 건 그 대가다 —
           반쪽 폭이 320px 에서 ≈130px 이라 '목록에 없어요 — 직접 입력'은 두 줄로 접힌다. -->
      <div class="row-2">
        <button class="btn btn-soft" id="freeInput">✍️ 직접 입력</button>
        <button class="btn btn-ghost btn-close" id="mClose">닫기</button>
      </div>
    </div>`);
  const mq=document.getElementById("mq"), results=document.getElementById("mResults"), empty=document.getElementById("mEmpty");
  // 오타 허용 검색: 직접입력과 같은 matchesName 기준 — "아메리카노"를 "아메리카노"로 오타쳐도 목록에서 바로 찾힘
  const count=document.getElementById("mCount");
  // 초성 검색: "ㅇㅁㄹ" → 아메리카노
  let curCat="";   // "" = 전체. 종류 칩과 검색어는 AND 로 걸린다 (13a)
  function applyFilter(){
    const ql=norm(mq.value); let any=false, n=0;
    results.querySelectorAll(".mcat").forEach(cat=>{
      // 종류를 좁혀 둔 상태에서 검색하면, 안 보이는 종류의 결과를 못 찾고 "없어요"만 본다.
      // 그래서 검색어가 있으면 종류 필터를 접어 둔다 — 검색은 늘 전체에서 찾는다.
      const catOk = !curCat || ql || cat.dataset.cat===curCat;
      let catVisible=false;
      cat.querySelectorAll(".menu-row").forEach(r=>{ const hit=catOk && nameHit(r.dataset.name,ql); r.style.display=hit?"":"none"; if(hit){ catVisible=true; n++; } });
      cat.style.display=catVisible?"":"none"; if(catVisible) any=true;
    });
    empty.style.display=any?"none":"";
    // 검색 전에는 같은 자리에 초성 검색 힌트를 보여준다 — 줄을 새로 만들지 않아 세로 공간이 안 든다
    count.textContent = ql ? ("검색 결과 "+n+"개") : "💡 초성으로도 찾아요 — ㅇㅁㄹ → 아메리카노";
  }
  mq.addEventListener("input", applyFilter);
  const cats=document.getElementById("mCats");
  if(cats) cats.querySelectorAll(".tab").forEach(t=> t.onclick=()=>{
    curCat=t.dataset.cat; mq.value="";                        // 종류를 고르면 검색어는 비운다(둘이 서로를 가린다)
    cats.querySelectorAll(".tab").forEach(x=>{ const on=x===t; x.classList.toggle("on",on); x.setAttribute("aria-pressed",on); });
    applyFilter();
    const sc=$sheet.querySelector(".sheet-scroll"); if(sc) sc.scrollTop=0;   // 좁힌 결과는 맨 위부터 본다
  });
  applyFilter();   // 시트를 열자마자 초성 힌트가 보이도록 한 번 실행(빈 질의라 목록은 그대로)
  // 검색 키를 누르면 키보드를 내려 목록 전체를 보여준다(보낼 폼이 없으므로 제출은 무의미)
  mq.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); mq.blur(); } });
  // 클릭은 이벤트 위임 (재바인딩 없음) — 메모는 넘겨받은 그대로 새 메뉴에 이어감
  results.addEventListener("click", e=>{ const r=e.target.closest(".menu-row"); if(r) openOrderSheet(r.dataset.id, carryNote?{note:carryNote}:null); });
  document.getElementById("freeInput").onclick=()=>openCustomSheet(null, mq.value, carryNote);
  document.getElementById("mClose").onclick=closeSheet;
  document.getElementById("mCloseX").onclick=closeSheet;
  // 자동 포커스 안 함 — 키보드가 올라와 목록을 가리지 않도록(스크롤로 훑어보기 우선)
}

/* ---------- 대시보드 ----------
   조각(stats·사람별·주문서)을 따로 두어 열린 섬김에서는 상위 탭이 직접 꺼내 쓰고,
   마감 화면에서는 예전처럼 한 덩어리(dashboardHtml)로 쓴다. */
let dashTab="people";
function dashSplit(){ return {
  ordered: MEMBERS.filter(m=>ORDERS[m.id]&&ORDERS[m.id].type==="drink"),
  skipped: MEMBERS.filter(m=>ORDERS[m.id]&&ORDERS[m.id].type==="skip"),
  pending: MEMBERS.filter(m=>!ORDERS[m.id]) }; }
/* KPI 세 칸 아래 한 줄로 분모와 잔 수를 보탠다 (15b). 세 숫자만 있으면 "3·1·2 가 전부인가"를
   사용자가 더해 봐야 하고, 카페에 말할 잔 수는 어디에도 없다. */
function dashStatsHtml(){ const {ordered,skipped,pending}=dashSplit();
  const answered=ordered.length+skipped.length;
  return `<div class="stats">
    <div class="stat"><div class="num" style="color:var(--green)">${ordered.length}</div><div class="lbl">주문</div></div>
    <div class="stat"><div class="num" style="color:var(--sub)">${skipped.length}</div><div class="lbl">안마심</div></div>
    <div class="stat"><div class="num" style="color:var(--accent-ink)">${pending.length}</div><div class="lbl">미응답</div></div></div>
    <div class="stat-sum">구성원 ${MEMBERS.length}명 중 <b>${answered}명 응답</b> · 지금까지 <b>${countDrinks()}잔</b></div>`; }
/* 열린 화면과 닫힌 화면이 같은 함수를 쓴다. 시그니처를 바꾸지 않고 두 화면을 가르는 조건은
   SESSION.state==="open" 하나다 (R12-12) — #nudge 가 이미 쓰던 조건이라 새 개념이 늘지 않고,
   닫힌 화면(renderClosed → dashboardHtml)은 코드 경로가 예전 그대로다.
   열린 화면에서만 달라지는 두 가지:
     ① 로스터에서 나를 뺀다 — 내 주문은 화면 위 액션 카드에 이미 있다 (R12-6).
        그래서 카드 제목이 '다른 분들'이다. KPI 는 전원 기준이라 목록이 n−1 행인데,
        그 비대칭은 제목으로 말한다(KPI 를 나 제외로 바꾸면 countDrinks() 와 닫힌 화면 집계가
        어긋난다 — 의도적으로 받아들인 비대칭이다).
     ② ordered 행의 '주문' 알약을 [나도] 로 바꾼다 (R12-9). 나란히 두지 않는 이유 둘 —
        같은 행에 음료 이름이 이미 있어 '주문' 알약은 정보를 더하지 않고, 320px 에서
        아바타 34 + 간격 16 + 알약 ~50 + 버튼 ~56 을 빼면 이름·메뉴에 ~150px 밖에 안 남는다.
        정보를 가진 '안마심'·'미응답' 알약은 그대로 둔다. */
function dashPeopleHtml(){ const {ordered,skipped,pending}=dashSplit();
  const openNow = SESSION.state==="open";
  const mine = m => openNow && m.id===ME;
  const row=(m,kind)=>{ const o=ORDERS[m.id]; let menu="",pill="";
    /* 주문 행만 두 줄로 푼다 (15b). 메뉴·온도는 이름 아래 굵게, 옵션·메모는 그 아랫줄에
       잘리지 않고 전부. 예전엔 넷을 한 줄에 이어 붙여 말줄임으로 잘렸는데, 그 잘린 부분이
       바로 '얼음적게'·'시럽 빼주세요' 같은 실제로 전달해야 할 내용이었다.
       나머지 행(안마심·미응답)은 한 줄 그대로라 목록 전체가 길어지지는 않는다. */
    if(kind==="ordered"){ const d=orderDisplay(o);
      const bits=[]; if(o.extras&&o.extras.length) bits.push(esc(o.extras.join(", ")));
      if(o.note) bits.push("📝 "+esc(o.note));
      menu=`<div class="pmenu ord-1">${esc(d.emoji+" "+d.name)}${o.temp?(' · '+o.temp):''}</div>`
         + (bits.length?`<div class="pmenu ord-2">${bits.join(" · ")}</div>`:"");
      pill = openNow ? `<button class="btn btn-sm btn-soft sameas" data-id="${esc(m.id)}">나도</button>`
                     : `<span class="pill ordered">주문</span>`; }
    else if(kind==="skip"){ menu=`<div class="pmenu">오늘은 안 마심</div>`; pill=`<span class="pill skip">안마심</span>`; }
    else { menu=`<div class="pmenu">아직 응답 없음</div>`; pill=`<span class="pill pending">미응답</span>`; }
    return `<div class="person${kind==='ordered'?' p-2line':''}"><div class="avatar" style="${kind==='pending'||kind==='skip'?'background:var(--sub)':''}">${esc(initials(m.name))}</div>
      <div><div class="pname">${esc(m.name)}</div>${menu}</div>${pill}</div>`; };
  const rows=`${ordered.filter(m=>!mine(m)).map(m=>row(m,"ordered")).join("")}${skipped.filter(m=>!mine(m)).map(m=>row(m,"skip")).join("")}${pending.filter(m=>!mine(m)).map(m=>row(m,"pending")).join("")}`;
  let body = rows
    ? `<div class="card" style="padding:6px 18px">${rows}</div>`
    : `<div class="card center muted">${openNow?"아직 다른 분이 없어요":"구성원이 없어요"}</div>`;   // 혼자인 셀 — 빈 카드만 남지 않게
  /* 열린 화면에서 내가 호스트가 아니면 이 목록을 접는다 (검토 C-2).
     "다 걷혔나"를 확인하는 건 섬기는 분의 일이고, 참가자에게는 구경거리다. 실측으로 이 블록이
     화면 세로의 35%(470px)를 먹고 있었다 — 내 할 일이 끝난 뒤에도 화면이 계속 이어지니
     '아직 뭔가 더 해야 하나'를 묻게 된다.
     <details> 를 쓰는 이유: 접힘 상태가 DOM 에 남아 폴링 재렌더에도 브라우저가 복원해 주고,
     키보드·스크린리더 동작이 공짜다. 마감 화면(openNow=false)은 손대지 않는다 — 그 화면은
     받아온 음료를 나눠 주는 자리라 전원이 펼쳐져 있어야 한다. */
  const fold = openNow && SESSION.hostId && SESSION.hostId!==ME && rows;
  if(fold){
    const n = ordered.filter(m=>!mine(m)).length, s = skipped.filter(m=>!mine(m)).length, p = pending.filter(m=>!mine(m)).length;
    const sum = [n?`${n}명 주문`:"", s?`${s}명 안 마심`:"", p?`${p}명 대기`:""].filter(Boolean).join(" · ");
    body = `<details class="roster-fold"><summary><span>${esc(sum)}</span><span class="rf-more">자세히</span></summary>${body}</details>`;
  }
  /* 재촉은 섬기는 분의 일이다 — 게임 진입점과 같은 규칙을 쓴다(내가 호스트이거나, 아직 호스트가
     없어 누구나 나설 수 있는 판일 때만). 남이 사는 판에서 참가자에게 전폭 버튼으로 남아 있으면
     '내가 뭔가 더 해야 하나'를 묻게 된다. */
  if(pending.length && SESSION.state==="open" && (!SESSION.hostId || SESSION.hostId===ME))
    body+=`<button class="btn btn-soft" id="nudge">📢 미응답 ${pending.length}명 안내 문구 복사</button>`;
  return body; }
/* 섬기실 분이 안 정해진 채로 주문서만 나가면, 실제로 다녀오신 분이 기록에 안 남는다 —
   대시보드의 섬김 랭킹에서 통째로 빠진다. 그런데 화면 어디에도 그 사실을 말하는 곳이 없었다.
   막지는 않는다: 먼저 다녀오고 나중에 정하는 순서가 실제로 있다. 알려만 준다. */
function dashCafeHtml(){
  const noHost = SESSION.state==="open" && !SESSION.hostId;
  return `<div class="card">${noHost?`<div class="banner-warn" style="margin:0 0 12px">⚠️ 아직 <b>섬기실 분</b>이 안 정해졌어요 — 다녀오신 뒤에도 <b>[주문 마감]</b>에서 정할 수 있어요.</div>`:""}
      <div class="muted" style="margin-bottom:10px">카페에 그대로 보여주거나 복사하세요 (이름 없이 수량만)</div>
      <div class="order-box" id="orderBox">${esc(cafeText())}</div><div style="height:12px"></div>
      <button class="btn btn-brand" id="copyCafe">📋 주문서 복사</button></div>`; }
/* ---------- 마감 후: 나눠 주기 (16b) ----------
   마감 뒤 화면이 하는 일은 '현황 보기'가 아니라 '받을 사람에게 나눠 주기'다. 그래서 목록이
   받을 사람만 남고, 각 행이 체크되는 원을 갖고, 탭 이름도 그 일을 말한다.
   안 마심·미응답은 아래 한 줄로 접는다 — 마감 뒤엔 할 일이 아니다.

   체크 상태는 이 기기에만 둔다(localStorage). 서버를 안 건드리는 선에서 유지하는 값이고,
   키는 셀 + 날짜 + 섬김 회차다 — 하루에 두 번 섬겨도 회차가 갈리므로 1번째 체크가 2번째로
   새지 않고, 날짜가 바뀌면 어제 키는 다시 읽히지 않는다(용량이 무한정 늘지는 않게 아래에서 정리). */
function deliverKey(){ return "coffee_deliver_v1|" + (CELL?CELL.id:"none") + "|" + todayKey() + "|" + (SESSION.seq||0); }
function deliverGet(){
  try{ const r=localStorage.getItem(deliverKey()); return r ? new Set(JSON.parse(r)) : new Set(); }
  catch(e){ return new Set(); }
}
function deliverSet(set){
  try{
    localStorage.setItem(deliverKey(), JSON.stringify([...set]));
    // 지난 날짜 키는 그때그때 하나씩 걷는다 — 쌓아 두면 이 앱이 안 쓰는 값으로 저장소를 채운다
    const today=todayKey();
    for(let i=localStorage.length-1;i>=0;i--){ const k=localStorage.key(i);
      if(k && k.startsWith("coffee_deliver_v1|") && k.split("|")[2] !== today) localStorage.removeItem(k); }
  }catch(e){}
}
function dashDeliverHtml(){
  const {ordered,skipped,pending}=dashSplit();
  const done=deliverGet();
  const n=ordered.filter(m=>done.has(m.id)).length;
  if(!ordered.length) return `<div class="card center muted">받을 분이 없어요</div>`;
  const rows=ordered.map(m=>{ const o=ORDERS[m.id], d=orderDisplay(o);
    const bits=[]; if(o.extras&&o.extras.length) bits.push(esc(o.extras.join(", ")));
    if(o.note) bits.push("📝 "+esc(o.note));
    const on=done.has(m.id);
    return `<button class="dlv-row${on?" on":""}" data-id="${esc(m.id)}" aria-pressed="${on}">
      <span class="dlv-ck">${on?"✓":""}</span>
      <span class="dlv-tx"><b>${esc(m.name)}</b>
        <span class="dlv-1">${esc(d.emoji+" "+d.name)}${o.temp?(" · "+o.temp):""}</span>
        ${bits.length?`<span class="dlv-2">${bits.join(" · ")}</span>`:""}</span></button>`; }).join("");
  const restN=skipped.length+pending.length;
  const rest=restN ? `<details class="roster-fold" style="margin-top:10px"><summary>
      <span>안 마신 분 ${skipped.length}명 · 안 고른 분 ${pending.length}명</span><span class="rf-more">보기</span></summary>
      <div class="card" style="padding:6px 18px">${
        skipped.map(m=>`<div class="person"><div class="avatar" style="background:var(--sub)">${esc(initials(m.name))}</div><div><div class="pname">${esc(m.name)}</div><div class="pmenu">오늘은 안 마심</div></div></div>`).join("")
      + pending.map(m=>`<div class="person"><div class="avatar" style="background:var(--sub)">${esc(initials(m.name))}</div><div><div class="pname">${esc(m.name)}</div><div class="pmenu">아직 응답 없음</div></div></div>`).join("")}</div></details>` : "";
  return `<div class="dlv-head"><b>${n} / ${ordered.length} 전달</b><span class="muted">눌러서 체크하세요</span></div>
    <div class="card dlv-card">${rows}</div>${rest}`;
}
function dashboardHtml(){   // 마감 화면 전용 — 안쪽 탭 그대로
  const stats=dashStatsHtml();
  const tabs=`<div class="tabs" id="dashTabs">
    <div class="tab ${dashTab==='people'?'on':''}" data-t="people">나눠 주기</div>
    <div class="tab ${dashTab==='cafe'?'on':''}" data-t="cafe">카페 주문서</div></div>`;
  const body = dashTab==="people" ? dashDeliverHtml() : dashCafeHtml();
  return stats+tabs+body;
}
function wireDashboard(){
  const t=document.getElementById("dashTabs"); if(t) t.querySelectorAll(".tab").forEach(el=> el.onclick=()=>{ dashTab=el.dataset.t; rerenderDash(); });
  const cp=document.getElementById("copyCafe"); if(cp) cp.onclick=()=>copyText(cafeText(),"주문서를 복사했어요", cp);
  /* 체크는 그 행만 제자리에서 고친다 — 목록을 다시 그리면 스크롤이 맨 위로 튀어서
     여러 명을 연달아 체크할 수 없다(참가자 시트가 같은 이유로 같은 처방을 쓴다). */
  document.querySelectorAll(".dlv-row").forEach(r=> r.onclick=()=>{
    const set=deliverGet(), id=r.dataset.id;
    if(set.has(id)) set.delete(id); else set.add(id);
    deliverSet(set);
    const on=set.has(id);
    r.classList.toggle("on",on); r.setAttribute("aria-pressed",on);
    r.querySelector(".dlv-ck").textContent = on?"✓":"";
    const head=document.querySelector(".dlv-head b");
    if(head){ const {ordered}=dashSplit(); head.textContent=`${ordered.filter(m=>set.has(m.id)).length} / ${ordered.length} 전달`; }
  });
  const nd=document.getElementById("nudge"); if(nd) nd.onclick=()=>{ const names=MEMBERS.filter(m=>!ORDERS[m.id]).map(m=>m.name).join(", ");
    const h=memberById(SESSION.hostId); const hostClause=h?`${hon(h.name)}이 `:"";   // host가 구성원에서 빠져도 안전
    /* 링크를 같이 붙인다 — "링크에서 골라주세요"라고 적어 놓고 링크를 안 주면 받는 사람이
       대화방을 거슬러 올라가 찾아야 한다. 안내를 붙여넣는 곳이 대개 단톡방이라 그 한 줄이 곧
       진입점이다. CELL 이 없는 경로(직접 링크 없이 들어온 경우)는 줄을 아예 빼서 빈 URL 을
       남기지 않는다. */
    const link=CELL?`\n${location.origin}${location.pathname}?cell=${CELL.id}`:"";
    copyText(`☕ 아직 메뉴 안 고르신 분: ${names}\n${hostClause}오늘 음료로 섬기십니다. 링크에서 골라주세요!${link}`,"안내 문구 복사됨", nd); };
}
function rerenderDash(){ if(SESSION.state==="closed") renderClosed(); else render(); }
function countDrinks(){ return MEMBERS.filter(m=>ORDERS[m.id]&&ORDERS[m.id].type==="drink").length; }
function cafeText(){
  const map={};
  MEMBERS.forEach(m=>{ const o=ORDERS[m.id]; if(!o||o.type!=="drink") return; const nm=orderDisplay(o).name;
    const note=(o.note||"").trim();   // 메모(예: 우유많이)도 주문서에 포함 — 메모 다르면 별도 줄로 집계
    const k=nm+(o.temp?` (${o.temp})`:"")+(o.extras&&o.extras.length?` [${o.extras.join("/")}]`:"")+(note?` · 📝${note}`:""); map[k]=(map[k]||0)+1; });
  const lines=Object.keys(map).sort((a,b)=>a.localeCompare(b,"ko")).map(k=>`${k}  x${map[k]}`); const total=countDrinks();
  if(!total) return "아직 주문이 없습니다.";
  return lines.join("\n")+`\n────────────\n합계  ${total}잔`;
}
// renderHostView() 는 지웠다 (R12-16). '현황'이 별도 페이지에서 탭으로 내려온 뒤 남겨둔
// 호환용 껍데기였는데, 그 탭마저 '주문 · 현황'으로 합쳐지면서 가리킬 대상이 없어졌고
// 파일 전체에 호출부도 없었다.

/* ---------- 하단 액션바 ---------- */
function renderBottom(){
  const s=SESSION; const amHost=s.hostId===ME; let html="";
  if(!s.seq){                                   // 열린 섬김 없음(개요) → 새 섬김 시작
    /* 갈림길을 두 개로 연다 (검토 C-1).
       예전에는 이 화면에서 누를 수 있는 것이 [오늘 섬기기 시작] 하나뿐이라, "뭐 마실래?"에
       답하러 온 사람에게 앱이 먼저 묻는 것이 "누가 섬길래?"였다. 이제 주문부터 할 수 있다.
       무게를 뒤집어 놨다 — 대부분의 사람이 할 일(주문)이 진한 버튼이고, 섬기겠다는 선언은
       그 옆의 흰 버튼이다. 확인창은 섬기겠다는 쪽에만 붙는다(되돌리기 어려운 쪽).
       서버에 open_serving 이 없으면(마이그레이션 전) 예전처럼 한 갈래만 그린다. */
    html = orderFirstRPC
      ? `<div class="row-2"><button class="btn btn-soft" id="startserv">☕ 제가 섬길게요</button>
         <button class="btn btn-brand" id="orderonly">📝 메뉴 고르기</button></div>`
      : `<button class="btn btn-brand" id="startserv">☕ 오늘은 제가 섬길게요</button>`;
  } else if(s.state==="open"){
    // 현황은 탭으로 올라갔으므로 하단바에서 뺀다 — 화면마다 버튼이 바뀌지 않아 예측 가능해진다.
    if(!s.hostId){
      /* 호스트 없는 열린 판. 예전에는 여기에 출구가 없었다 — 마감 버튼이 amHost 분기에만 있어서,
         아무도 안 나서면 그 판을 닫을 수 없고 `sessions_one_open` 때문에 그날 다음 판도 못 열었다.
         주문 먼저 받기가 생기면서 이 상태가 기본 진입 경로가 됐으므로 출구를 낸다.
         게임 진입점은 여기서 뺐다 — 본문 #gamepick 이 같은 조건(canCommit)으로 이미 첫 화면에
         있어 하단바의 것은 같은 자리를 두 번 차지할 뿐이다.
         두 칸 구성(부 · 주)은 호스트 화면과 같아서 하단바가 상황에 따라 흔들리지 않는다 (N2). */
      const hasOrders = Object.keys(ORDERS).length > 0;
      html = (hasOrders ? `<button class="btn btn-soft" id="closeNoHost">✅ 주문 마감</button>`
                        : `<button class="btn btn-ghost btn-close" id="dropEmpty">이 섬김 접기</button>`)
           + `<button class="btn btn-brand" id="takeover">🙋 제가 섬길게요</button>`;
    } else if(amHost){
      // btn-sm 을 뺀다 — 한 줄에 선 짝인데 한쪽만 44px, 다른 쪽이 51px 이었다 (21b)
      html=`<button class="btn btn-danger" id="unclaim">섬김 취소</button><button class="btn btn-brand" id="close">주문 마감하기</button>`;
    }                                           // 호스트가 아니면 하단 액션 없음 — 할 일은 화면 안(메뉴 고르기)에 있다
  } else {                                       // closed(섬김 보기 중)
    /* 되돌리는 동작(섬김 취소·마감 취소)은 늘 왼쪽·붉은 테두리다 — 한 자리에서 모양이 바뀌는
       컨트롤이라 규칙이 일정해야 손이 자리를 기억한다 (21b).
       참가자 시점의 '주문 마감됨'은 버튼이 아니라 상태다. 눌리지 않는 버튼이 절반을 차지하면
       '왜 안 눌리지'가 되므로 회색 점 + 글자로 바꿔 애초에 누를 것으로 안 보이게 한다. */
    html = (amHost ? `<button class="btn btn-danger" id="reopen">마감 취소</button>`
                   : `<span class="bar-state"><i></i>주문 마감됨</span>`)
         + `<button class="btn btn-soft" id="toOverview">오늘의 섬김</button>`;
  }
  $bottom.innerHTML = html ? `<div class="bottombar"><div class="inner">${html}</div></div>` : "";
  document.body.classList.toggle("no-bottom", !html);   // 하단바가 없으면 본문 아래 여백도 걷는다
  /* 되돌리기 어려운 자리에는 확인이 있어야 한다. 이 버튼은 "오늘 음료는 내가 섬긴다"는 약속이고,
     섬김이 시작되기 전 화면에서는 이것이 **유일하게 크고 진한 버튼**이라 '다음'으로 읽힌다.
     되돌리려면 [섬김 취소]라는 다른 말을 찾아야 한다.
     반대로 [안 마실게요]는 되돌리기 쉬운데 확인창이 있었다 — 위험도 순서가 뒤집혀 있었다. */
  bind("startserv",async()=>{
    if(!(await askConfirm("오늘 음료로 섬기시는 거죠?\n주문이 모이면 카페에 낼 주문서를 만들어 드려요.",{ok:"네, 제가 섬길게요"}))) return;
    if(CAFE_LIST.length<=1) doStartServing((CELL&&CELL.homeCafeId)||CAFE_LIST[0].id); else openClaimCafeSheet();
  });
  bind("orderonly",()=>doOpenWithoutHost((CELL&&CELL.homeCafeId)||CAFE_LIST[0].id));
  bind("takeover",()=>doClaim(SESSION.cafeId||(CELL&&CELL.homeCafeId)||CAFE_LIST[0].id));
  bind("closeNoHost",()=>openWhoBoughtSheet(SESSION.seq));
  bind("dropEmpty",async()=>{ const seq=SESSION.seq;
    if(await askConfirm("주문이 하나도 없어요.\n이 섬김을 접을까요?",{ok:"네, 접을게요"})){
      if(await safeWrite(Sync.unclaim(seq))){ viewSeq=null; toast("섬김을 접었어요"); render(); } }});
  bind("unclaim",async()=>{ const seq=SESSION.seq; if(await askConfirm("오늘은 안 섬기시는 걸로 할까요?\n주문이 있으면 섬김은 그대로 남고, 다른 분이 이어받으면 메뉴도 그대로 돌아옵니다.\n아직 주문이 하나도 없으면 이 섬김은 사라져요.",{ok:"네, 안 섬길게요",danger:true})){ if(await safeWrite(Sync.unclaim(seq))){ viewSeq=null; render(); } }});
  bind("close",async()=>{ const seq=SESSION.seq; if(await askConfirm("주문을 마감할까요?\n마감 후에도 '마감 취소'로 다시 열 수 있어요.",{ok:"마감하기"})){ if(await safeWrite(Sync.close(seq))){ track("serving_closed", trackServingStats()); viewSeq=seq; render(); } }});
  bind("reopen",async()=>{ const seq=SESSION.seq; if(await safeWrite(Sync.reopen(seq),"다시 열 수 없어요 — 다른 섬김이 진행 중입니다")){ viewSeq=null; render(); } });
  bind("toOverview",()=>{ viewSeq=null; render(); });
}
function bind(id,fn){ const el=document.getElementById(id); if(el) el.onclick=fn; }

/* ---------- 클레임 시 카페 선택 ---------- */
async function doStartServing(cafeId){   // 새 섬김 시작(순차: 열린 섬김 있으면 거부)
  await guardWrite(async()=>{
    toast("시작하는 중…");
    try{ const seq=await Sync.startServing(ME, cafeId);
      if(seq){ viewSeq=null; track("serving_started",{ seq, cafe_id: cafeId||null }); toast(hon(meName())+"이 "+seq+"번째 섬김을 시작했어요 🙏"); }
      else toast("이미 진행 중인 섬김이 있어요");
      render();
    }catch(e){ console.error(e); toast("시작 실패 — 다시 시도해주세요"); render(); }
  });
}
/* 주문만 먼저 받는다 — 섬기실 분은 나중에 (검토 C-1-③).
   호스트 없는 열린 섬김을 만들 뿐이라 새 상태를 들이지 않는다. 그 상태는 이미
   unclaim_serving 이 만들고 claim_host 가 이어받는, 앱이 오래 다뤄 온 상태다.
   여기서 track 하지 않는 이유: 아직 아무 결정도 안 났고, 이어서 들어올 order_submitted 가
   실제 사건이다. 서버에 함수가 없으면(마이그레이션 전) 진입점 자체가 안 그려지므로
   여기까지 오지 않지만, 폴링 사이에 상태가 바뀌는 경우를 위해 null 도 받아 둔다. */
async function doOpenWithoutHost(cafeId){
  await guardWrite(async()=>{
    toast("여는 중…");
    try{ const seq = await Sync.openNoHost(cafeId);
      if(seq){ viewSeq=null; toast("메뉴부터 골라주세요 — 섬기실 분은 나중에 정하면 돼요 ☕"); }
      else toast("지금은 열 수 없어요 — 잠시 후 다시 시도해주세요");
      render();
    }catch(e){ console.error(e); toast("열기 실패 — 다시 시도해주세요"); render(); }
  });
}
/* 마감 = 섬기신 분 확정 + 닫기 (호스트 없는 섬김 전용).
   누락을 '알려서' 막는 게 아니라 '구조로' 막는 지점이다. 주문서만 뽑아 다녀오고 아무도 안 나서면
   기록에 host_id 가 null 로 남아 대시보드 섬김 랭킹에서 통째로 빠지는데, 마감이 유일한 종료
   지점이므로 여기서 한 번만 물으면 그 경로가 사라진다.
   claim → close 순서인 이유: 닫힌 섬김은 claim_host 가 안 잡는다(열린 것만 본다). 그리고 claim 이
   실패하면 아직 열린 상태라 되돌릴 것이 없다 — 닫아 놓고 호스트를 못 채우는 경우를 만들지 않는다. */
function openWhoBoughtSheet(seq){
  const drank = MEMBERS.filter(m=>ORDERS[m.id] && ORDERS[m.id].type==="drink");
  const rest  = MEMBERS.filter(m=>!drank.some(x=>x.id===m.id));
  const row = m => { const o=ORDERS[m.id];
    const sub = o && o.type==="drink" ? esc(orderDisplay(o).emoji+" "+orderDisplay(o).name)
              : o && o.type==="skip"  ? "안 마심" : "주문 안 함";
    return `<div class="person who-pick" data-id="${esc(m.id)}" role="button" tabindex="0" aria-label="${esc(m.name)}님이 섬기셨어요">
      <div class="avatar">${esc(initials(m.name))}</div>
      <div style="min-width:0"><div class="pname">${esc(m.name)}</div><div class="pmenu">${sub}</div></div></div>`; };
  openSheet(`
    <h3>☕ 누가 섬기셨어요?</h3>
    <p class="sheet-hint">고르면 그분으로 기록하고 주문을 마감해요. 마감 뒤에도 <b>[마감 취소]</b>로 되돌릴 수 있어요.</p>
    <div class="card" style="padding:6px 14px">${drank.map(row).join("")}${rest.map(row).join("")}</div>
    <div style="height:10px"></div>
    <button class="btn btn-ghost btn-close" id="whoCancel">아직 못 정했어요</button>`);
  document.getElementById("whoCancel").onclick=closeSheet;
  $sheet.querySelectorAll(".who-pick").forEach(el=> el.onclick=()=>guardWrite(async()=>{
    const id=el.dataset.id, m=memberById(id); if(!m) return;
    const cafeId=SESSION.cafeId||activeCafeId();
    toast("기록하는 중…");
    try{
      const ok=await Sync.claim(id, cafeId);
      if(!ok){ toast("앗, 그 사이 다른 분이 먼저 이어받으셨어요"); closeSheet(); render(); return; }
      if(!(await safeWrite(Sync.close(seq)))) { render(); return; }
      track("serving_closed", Object.assign(trackServingStats(), { via:"who_bought" }));
      closeSheet(); viewSeq=seq; toast(hon(m.name)+"이 섬기신 걸로 기록했어요 🙏"); render();
    }catch(e){ console.error(e); toast("기록 실패 — 다시 시도해주세요"); render(); }
  }, el, "기록 중…"));
}
async function doClaim(cafeId){   // 호스트 없는 열린 섬김 이어받기(인계)
  await guardWrite(async()=>{
    toast("저장 중…");
    try{ const ok=await Sync.claim(ME, cafeId); viewSeq=null; toast(ok ? (hon(meName())+"이 이어서 섬겨요 🙏") : "앗, 방금 다른 분이 먼저 이어받으셨어요!"); render(); }
    catch(e){ console.error(e); toast("저장 실패 — 다시 시도해주세요"); render(); }
  });
}
function openClaimCafeSheet(){

  function draw(){

      <h3>🙋 오늘은 제가 섬기겠습니다</h3>
      <p class="muted" style="margin-top:0">어느 카페인가요? <b>고른 카페의 메뉴</b>로 주문을 받아요.</p>
      <div class="chips" id="cafechips">${CAFE_LIST.map(c=>`<div class="chip ${c.id===cafeId?'sel':''}" data-c="${c.id}">${c.emoji} ${esc(c.name)}</div>`).join("")}</div>
      <p class="muted" style="margin-top:8px">${CAFES[cafeId]&&CAFES[cafeId].freeform?'프리셋 메뉴 없이 각자 \'직접 입력\'으로 받아요 (외부 카페용).':'정해진 메뉴판에서 고르고, 없으면 직접 입력도 가능해요.'}</p>
      <div style="height:14px"></div>
      <button class="btn btn-brand" id="goClaim">🎉 '${esc((CAFES[cafeId]||{}).name||"")}'(으)로 섬김 시작하기</button>

    document.getElementById("goClaim").onclick=()=>{ closeSheet(); doStartServing(cafeId); };
