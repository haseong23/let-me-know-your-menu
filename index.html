/* ===================== 랜덤 게임 — 섬길 사람 정하기 =====================
   1) 절대 자동으로 뜨지 않는다. 자진해서 섬기려던 분의 마음을 게임이 가로채면 안 되므로,
      [🎲 게임으로 정하기]를 직접 눌렀을 때만 시작한다. 호스트가 있는 섬김은 '그 호스트만' 열 수 있다.
   2) 결과에 구속력이 없다. [확정]을 누르기 전에는 서버에 아무것도 쓰지 않고, [한 판 더]가 늘 있다.
   3) 주문이 모인 뒤에 돌린다 — 안 마시는 분이 자동으로 빠져 후보가 정확해진다. 호스트가 있는 섬김을
      unclaim→claim 으로 갈아끼울 때 섬김이 사라지지 않게 하는 방어는 commitGameWinner 앞에 있다
      (주문이 0건이면 unclaim 이 섬김째 지운다).
   4) 흔들기·기울이기(DeviceMotion)는 쓰지 않는다 — 카톡 인앱 브라우저에서 권한 프롬프트가 안 뜨는 사례가 많다. */
/* 아래 마커 사이는 tests/game-logic.test.mjs 가 그대로 떼어내 샌드박스에서 평가한다.
   리포지토리에 빌드 단계도 테스트 러너도 없어서, 파일을 쪼개는 대신 이 구간만 분리해 검증한다.
   그러니 DOM 이나 전역 상태(MEMBERS·ORDERS·GS·SESSION·SERVINGS)를 읽는 코드는 블록 밖에 둔다.
   시작 마커는 추출기가 첫 줄을 버리는 방식이라 반드시 한 줄로 유지한다. */
/* @test-export:start */
/* 가중 추첨의 '가중치가 다를 때'를 검증하는 상수. 앱은 2a 이후 가중치를 전부 1 로만 주므로
   이 값이 화면에 영향을 주지는 않는다 — pickWeighted 가 불균등 입력에서도 비율대로 수렴하는지
   확인하는 테스트의 입력값으로 남아 있다. */
const GS_SOFT_W = 1/3;
const GAME_LABEL_MAX = 10;          // 이보다 많으면 이름이 겹치므로 번호 + 범례로 바꾼다
const GAME_MAX = { ladder:16, wheel:24, finger:Infinity, race:24 };   // 화면에 들어가는 인원 한계
const GAME_COLORS = ["#7a4a12","#1f6b3a","#2a5f8f","#97371c","#5b4080","#14615c","#8f2f2c","#35435c","#6b5220","#4a6b1f"];

function gameFits(kind, n){ return n <= GAME_MAX[kind]; }

// 10명 이하는 지금 보이는 색 그대로 두고, 넘을 때만 골든앵글로 생성해 인접 인덱스끼리
// 색상차를 최대로 벌린다 — 돌림판에서 이웃 조각이 같은 색이 되는 걸 막는 게 목적이다.
// l 34% 는 기존 팔레트와 같은 명도대라서 흰 구분선·#e7ddcf 배경 위에서 그대로 식별된다.
// n 을 안 넘기면 예전처럼 팔레트를 순환한다 — 손가락 룰렛은 참가자 수와 무관한 손가락 순번으로
// 부르기 때문에 이 경로가 필요하다. 사다리·돌림판은 반드시 n 을 넘긴다.
function gcolor(i, n){
  if(n === undefined || n <= GAME_COLORS.length) return GAME_COLORS[i % GAME_COLORS.length];
  return "hsl(" + ((i*137.508) % 360).toFixed(1) + " 52% 34%)";
}

// 난수를 인자로 받는다 — 그래야 확률이 의도한 비율로 수렴하는지 결정론적으로 검증할 수 있다
function pickWeighted(players, w, rnd){
  const total = w.reduce((a,b)=>a+b, 0);
  let r = (rnd||Math.random)() * total;
  for(let i=0;i<players.length;i++){ r -= w[i]; if(r < 0) return players[i]; }
  return players[players.length-1];        // 부동소수 잔차 방어 — undefined 를 돌려주면 안 된다
}

// 명단 판단의 순수 버전. '안 마심'만 되돌릴 수 없는 제외이고, 그 위에 사용자의 명시적 선택이 얹힌다 —
// 주문이 실시간으로 바뀌어도 사용자가 직접 켜고 끈 것이 살아남아야 한다.
function rosterFrom(members, orders, on, off){
  return members.filter(m=>{
    const o = orders[m.id];
    if(o && o.type==="skip") return false;
    if(off.has(m.id)) return false;
    if(on.has(m.id))  return true;
    return !!(o && o.type==="drink");      // 기본 참가 = 음료를 주문한 사람
  });
}

// 추첨 대상 = 명단에 정책을 얹은 것. skip 만 명단을 줄이고 soft·even 은 가중치로만 다룬다
function playersFrom(roster, policy, lastHostId){
  if(policy==="skip" && lastHostId) return roster.filter(m=>m.id!==lastHostId);
  return roster;
}

/* 돌림판의 회전량과 라벨 각도 (R6).
   판을 A, 라벨 글리프의 역회전을 L 이라 하면 멈춘 순간 두 식이 동시에 성립해야 한다.
     ① 이름이 똑바로:  A(end) + L(end) ≡ 0 (mod 360)
     ② 승자가 핀 아래:  mid + A(end) ≡ 0 (mod 360)
   두 식에서 L(end) ≡ mid 다. 그런데 정지 상태에서 관찰자가 못 보는 값은 A(end) 하나뿐이고
   (조각 배치는 눈앞에 그대로 있다), L 이 상수면 L(0)=L(end)≡mid 가 그 값을 그대로 알려준다.
   그게 예전 버그였다 — 눈썰미가 아니라 산수로 당첨자를 알 수 있었다. 조각 배치를 통째로
   돌리는 상수를 더해도 그건 시작 상태에서 보이므로 소용이 없다. 즉 L 은 시간에 따라 변해야
   하고, 이 함수는 그 시작값과 끝값을 준다.
   labelStart 가 0(상수)인 것이 이 설계의 전부다. wi 와도 jitter 와도 무관하므로 정지 상태에서
   샐 것이 없다. 난수를 인자로 받는 이유도 그 성질을 결정론적으로 검증하기 위해서다. */
/* 조각 각도가 곧 확률이다.
   예전에는 조각을 똑같이 n 등분해 놓고, 당첨자를 가중 추첨으로 먼저 뽑은 다음 그 조각이 핀
   아래로 오도록 각도를 맞췄다. 결과는 정확했지만 화면이 거짓말을 했다 — 조각이 다 같은
   크기인데 '이분은 확률이 3분의 1'이라고 글로만 적혀 있으니, 보는 사람은 숫자를 믿는 수밖에
   없었다. 돌림판을 쓰는 이유가 '확률이 눈에 보이는 것'인데 그게 없어진 셈이다.

   이제 조각 각도를 가중치에 비례해 나눈다. 그러면 추첨은 따로 할 것이 없다 — 핀이 멈출
   각도를 0~360 에서 고르게 뽑고, 그 각도가 어느 조각에 떨어졌는지 보면 그게 당첨자다.
   P(i) = 조각 각도 / 360 = w_i / Σw 라 옛 가중 추첨과 확률이 정확히 같고, 이제는 그 확률이
   화면에 그려져 있다. 확률 조정을 따로 하지 않는 것이 요점이다. */
function wheelSlices(weights){
  const w = (weights||[]).map(x => (typeof x === "number" && x > 0) ? x : 0);
  let sum = w.reduce((a,b)=>a+b, 0);
  if(!(sum > 0)) return w.map((_,i,arr)=>({ start:i*360/arr.length, end:(i+1)*360/arr.length, deg:360/arr.length }));
  const out=[]; let at=0;
  for(let i=0;i<w.length;i++){ const deg = 360*w[i]/sum; out.push({ start:at, end:at+deg, deg }); at += deg; }
  /* 마지막 끝을 360 에 못 박는다. 부동소수 오차로 359.9999 가 되면 그 틈에 핀이 떨어졌을 때
     아무 조각에도 안 걸린다 — 확률 1/10^13 짜리 버그는 재현이 안 되므로 미리 막는다. */
  out[out.length-1].end = 360;
  return out;
}

/* ══ 돌림판 물리 ══
   각도를 먼저 뽑아 거기로 감으면, 결과는 균등해도 '뽑고 나서 맞춘다'는 구조가 그대로 남는다.
   그래서 진짜로 돌린다. 판은 [그만 돌리기]를 누를 때까지 등속으로 계속 돌고, 누른 순간부터
   마찰과 테두리 압정이 판을 세운다 — 멈춘 자리에 있는 조각이 당첨이다.
   초기 속도는 5~14 바퀴/초다. 눈으로 따라갈 수 없어야 '이쯤에서 멈추겠다'는 감이 안 생긴다.

   무작위가 둘이라는 점이 중요하다. 누른 순간의 각도(사람의 손)와 감속하며 더 도는 양(아래
   시뮬레이션)이 각각 균등하고, 둘을 더한 것이 최종 각도다. 그래서 설령 누구도 못 하겠지만
   누르는 순간을 완벽히 맞춘다 해도 결과를 못 고른다 — 감속량을 모르기 때문이다.
   반대로 감속량만으로 정하면 '누르기 전에 이미 답이 있는' 옛 구조로 돌아간다. 둘 다 필요하다.
   멈춘 자리에 있는 조각이 당첨이다. 아무도 결과를 먼저 알지 못하고, 알 수 있는 코드도 없다.

   압정은 저항만 준다. '가장 가까운 압정 사이로 딸깍 물리는' 디텐트를 넣으면 안 된다 —
   멈출 수 있는 자리가 압정 수만큼으로 줄어들고, 그러면 좁은 조각(확률을 낮춘 분) 안에
   그 자리가 0 개일 수도 1 개일 수도 있어 확률이 각도 비율에서 크게 어긋난다.
   압정은 지날 때마다 속도를 조금씩 깎기만 하고, 판은 압정 사이 아무 데서나 멈춘다.

   초기 속도 범위가 넓어야 한다. 총 회전량이 ω²/2α 라 속도 범위가 좁으면 총 회전량도 좁게
   모이고, 360 으로 접었을 때 특정 구간이 잘 나오는 편향이 생긴다. 아래 값이면 총 회전량이
   5.4~23.4 바퀴에 걸쳐 흩어져서, 접은 분포가 균등에서 0.16%p 안으로 들어온다(4만 판 계측). */
const WHEEL_PEGS = 36;              // 테두리 압정 개수. 10 도마다 하나
const WHEEL_W0 = [1800, 5000];      // 초기 각속도 deg/s (5~14 바퀴/초). 눈으로 못 따라간다
const WHEEL_FRIC = 700;             // 기본 마찰 deg/s²
/* 압정 손실을 작게 잡는 것이 중요하다. 이 값이 크면 감쇠가 지수라 총 회전량이 초기 속도의
   '로그'로만 늘어난다 — 0.006 으로 뒀더니 회전량이 3.3~6.5 바퀴에 몰려서 360 으로 접은
   분포가 균등에서 0.94%p 나 벗어났다(어느 조각은 33%, 어느 조각은 28%). 마찰이 지배하면
   회전량이 ω²/2α 라 제곱으로 벌어져 5.4~23.4 바퀴에 흩어지고, 편차가 0.16%p 로 내려온다.
   압정은 딸깍이는 저항과 소리를 위해 있는 것이지 판을 세우는 주역이 아니다. */
const WHEEL_PEG_LOSS = 0.0008;      // 압정 하나를 지날 때 잃는 속도 비율
const WHEEL_STOP = 10;              // 이보다 느려지면 멈춘 것으로 본다 deg/s
const WHEEL_DT = 1/60;              // 기록 간격 — 화면과 같은 60fps
const WHEEL_MAXF = 900;             // 15초 상한

/* 물리를 미리 다 돌려 각도를 기록하고, 화면은 그 배열을 읽기만 한다 — 구슬 레이스와 같은
   구조다. 이렇게 해야 [그만 돌리기]로 건너뛰어도 결과가 안 바뀌고, 느린 기기에서 프레임을
   흘려도 멈추는 자리가 같다. */
function wheelSimulate(rnd){
  const r = rnd || Math.random;
  const pegA = 360/WHEEL_PEGS;
  const w0 = WHEEL_W0[0] + r()*(WHEEL_W0[1]-WHEEL_W0[0]);
  let w = w0;
  let th = 0, f = 0;
  const angles = new Float32Array(WHEEL_MAXF);
  const ticks  = new Uint8Array(WHEEL_MAXF);      // 그 프레임에 압정을 몇 개 지났나
  while(f < WHEEL_MAXF){
    w -= WHEEL_FRIC*WHEEL_DT;
    if(w <= WHEEL_STOP){ angles[f]=th; ticks[f]=0; f++; break; }
    const from = th, to = th + w*WHEEL_DT;
    const k0 = Math.floor(from/pegA), k1 = Math.floor(to/pegA);
    let hits = 0;
    for(let k=k0+1; k<=k1; k++){ w *= (1-WHEEL_PEG_LOSS); hits++; }
    th = to;
    angles[f] = th; ticks[f] = hits > 255 ? 255 : hits;
    f++;
  }
  // 핀은 12시에 고정이고 판이 th 만큼 돌았으므로, 핀 아래에 온 판의 각도는 -th 다.
  const hit = ((-th % 360) + 360) % 360;
  return { angles: angles.subarray(0, f), ticks: ticks.subarray(0, f), frames: f, turn: th, hit, w0 };
}

/* 멈춘 각도가 어느 조각인지. 조각을 못 찾는 경우는 없어야 하지만, 못 찾으면 마지막 조각으로
   본다 — 아무도 안 걸리는 판을 만드는 것보다 낫다. */
function wheelWinner(slices, hit){
  for(let i=0;i<slices.length;i++) if(hit >= slices[i].start && hit < slices[i].end) return i;
  return slices.length - 1;
}


// 사다리 치수. 인원 상한(16)이 실제 한계와 맞는지 이 값으로 역검증한다.
// LEV(층 수)도 치수의 일부라 여기서 함께 돌려준다 — playLadder 와 테스트가 같은 공식을 두 번
// 적으면 한쪽만 고쳐도 아무도 못 알아챈다.
function ladderGeometry(n){
  const W=340, PAD=24, GAP=(W-2*PAD)/(n-1);
  return { GAP, BOX_W: Math.min(30, GAP*0.82), NCH: n<=7?4 : n<=9?3 : 2, NFS: n<=7?11 : n<=9?10 : 8.5,
           LEV: Math.min(14, Math.max(6, n*2)) };
}

/* 가로줄을 놓는다. 규칙 둘이 있다.
     ① 인접 금지 — 같은 높이에서 이웃끼리 겹치면 경로가 갈라지지 않는다.
     ② 세로줄마다 가로선이 최소 하나는 닿는다 — 하나도 안 닿는 줄에 선 사람은 처음부터 끝까지
        직진이라 게임을 구경만 한다(실사용 제보).

   ②를 확률로 굴린 뒤 걸러내지 않고 먼저 깔아 두는 것이 요점이다. 걸러내는 방식은 n=2·LEV=6 에서
   실패율이 2.8% 라 예순 번쯤 다시 뽑으면 사실상 통과하지만, 그건 "거의 항상"이지 "반드시"가
   아니다. 순서도 요점이다 — 확률로 먼저 채우면 인접 금지에 막혀 ①이 놓을 자리가 사라진다.

   난수를 인자로 받는 이유는 두 규칙이 실제로 지켜지는지 결정론적으로 검증하기 위해서다. */
function ladderRungs(n, LEV, rnd){
  const R = rnd || Math.random;
  const rows = Array.from({length:LEV}, ()=>[]);
  const has = (row,g)=> row.indexOf(g) >= 0;
  const canPut = (row,g)=> g>=0 && g<n-1 && !has(row,g) && !has(row,g-1) && !has(row,g+1);
  const touched = (c)=> rows.some(row=> has(row,c) || has(row,c-1));
  for(let c=0;c<n;c++){
    if(touched(c)) continue;
    // 세로줄 c 에 닿는 가로선은 왼쪽 간격(c-1) 아니면 오른쪽 간격(c) 이다. 양 끝 줄은 한쪽뿐.
    const gaps = c===0 ? [0] : c===n-1 ? [c-1] : [c-1, c];
    const cand = [];
    for(let l=0;l<LEV;l++) for(let k=0;k<gaps.length;k++) if(canPut(rows[l], gaps[k])) cand.push([l, gaps[k]]);
    // 이론상만 있는 경우다(그 줄의 양쪽 간격이 전 층에서 비었는데 그 '이웃' 간격이 전 층을 채운 상태).
    // 여기서 조용히 포기하지 않고 호출부가 다시 뽑게 한다 — 보장이 무너지는 유일한 통로를 막는다.
    if(!cand.length) return null;
    const pick = cand[Math.floor(R()*cand.length)];
    rows[pick[0]].push(pick[1]);
  }
  for(let l=0;l<LEV;l++) for(let g=0;g<n-1;g++) if(canPut(rows[l],g) && R()<0.45) rows[l].push(g);
  for(let l=0;l<LEV;l++) rows[l].sort((a,b)=>a-b);   // trace 는 순서를 안 보지만 읽기 위해 정렬한다
  return rows;
}

/* ─────────── 🏁 구슬 레이스 (물리) ───────────
   라이브러리는 여전히 0개다. 원-캡슐 거리 하나로 모든 충돌을 처리한다 —
   폴리라인은 캡슐 사슬, 상자는 두꺼운 캡슐, 원은 길이 0 인 캡슐이다.

   세계 규모가 이 게임의 성격을 정한다. 코스 폭 26 에 구슬 반지름 0.25 라 한 줄에 52 개가
   들어가고, 그래서 '작은 구슬이 많이 흐르는' 그림이 나온다. 예전에는 폭 200 에 반지름 9 여서
   한 줄에 11 개뿐이었고, 구슬이 커서 서로 밀기만 하고 흐르지 않았다.

   물리는 한 번 미리 다 돌려 좌표를 Float32Array 에 녹화하고, 화면은 그 배열을 읽기만 한다.
   슬로모션이 결과를 못 바꾸는 이유가 이것이다 — 시간축만 늦추면 되고 물리를 안 건드린다.

   맵을 지을 때 지킨 것 셋. 셋 다 어겨 봤고 그때마다 판이 안 끝났다.
     ① 가두는 선은 코스 테두리가 아니라 '그 y 의 벽 안쪽'이다(bnd).
     ② 장애물은 자기 자리를 벽에 맞춘다 — 고정 좌표로 깔면 좁아지는 곳에서 낀다.
     ③ 기울기 하한 |Δx|/Δy ≤ 1.4. 벽에도 걸린다. 완만한 면은 선반이 되어 구슬을 얹는다.
        축이 멀고 팔이 긴 큰 날도 같은 이유로 '움직이는 선반'이 된다. */

/* ══════════════════════════════════════════════════════════════════════════
   구슬 레이스 — 레퍼런스 방식 재구현

   본뜬 것 세 가지:
     ① 엔티티 체계 — 몸체 타입(static / kinematic) × 형태(polyline / box / rpeg)
        × 물리 속성(restitution · angularVelocity · life). 회전 장애물, 반발 1.5 범퍼,
        life 가 있는 파괴형(버블), 고정 사선 막대가 전부 이 조합으로 나온다.
     ② 맵 구성 — 바깥 벽이 폴리라인이라 방이 좁아졌다 넓어지고, 그 방 안에 원·상자를 깐다.
        세계 좌표도 그쪽 규모를 따른다(코스 폭 26, 길이 120, 구슬 반지름 0.25).
        우리 앱의 레이스는 폭 200 에 반지름 9 라 코스 하나에 구슬 11개 폭이었는데,
        이쪽은 52개 폭이라 '작은 구슬이 많이 흐르는' 그림이 나온다.
     ③ 카메라 — 추적 대상 선정(순위가 확정된 만큼 다음 다툼으로) · goalDist<5 에서 줌 시작 ·
        zoom = max(1, (1-goalDist/5)*4) · 매 프레임 차이의 1/10 만 이동 · 접전 슬로모션.

   맵 데이터는 우리가 직접 지었다. 좌표를 옮겨 오지 않고 구성 방식만 따랐다.
   물리 풀이는 원-캡슐 거리 하나로 통일한다 — 폴리라인은 캡슐 사슬, 상자는 두꺼운 캡슐,
   원은 길이 0 인 캡슐이다. 형태가 셋이어도 충돌 코드는 하나다.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 세계 상수 ── 레퍼런스 규모(미터급 Box2D 좌표)를 그대로 쓴다. */
const RACE_W = 26;              // 코스 폭
const RACE_R = 0.25;            // 구슬 반지름
const RACE_G = 10;              // 중력
const RACE_DT = 1/240, RACE_SUB = 4; // 물리 스텝 · 프레임당 서브스텝(→ 60fps 기록)
const RACE_VMAX = 40;           // 속도 상한. RACE_VMAX*RACE_DT = 0.167 < RACE_R 이라 한 스텝에 캡슐을 건너뛸 수 없다
const RACE_E_WALL = 0.25;       // 벽 기본 반발
const RACE_E_BALL = 0.20;       // 구슬끼리
const RACE_MAXF = 5400;         // 90초. 이 안에 아무도 못 들어오면 그 시드는 버린다
const RACE_CELL = 6;            // y 격자 셀 높이

/* ── 엔티티 ──
   rcap  : 캡슐(폴리라인 한 마디 · 상자 · 원 전부 이것)
   spin : 0 이 아니면 kinematic(각속도 rad/s). 축은 (cx,cy)
   e    : 반발계수. 1 을 넘으면 에너지를 얻는다(레퍼런스의 범퍼 핀이 1.5 다)
   life : 있으면 파괴형. 구슬이 닿는 순간 사라진다 */
function rcap(x1,y1,x2,y2,rad,e){
  return { x1,y1,x2,y2,rad, e:e||0, spin:0, cx:0, cy:0, hl:0, ph:0, life:0, dead:null,
           y0:Math.min(y1,y2)-rad, y1b:Math.max(y1,y2)+rad };
}
const rpeg = (x,y,rad,e) => rcap(x,y,x,y,rad,e);
function rbar(cx,cy,hl,rad,spin,ph,e){          // kinematic box
  const b = { x1:cx-hl,y1:cy,x2:cx+hl,y2:cy, rad, e:e||0, spin, cx,cy,hl,ph, life:0, dead:null };
  b.y0 = cy-hl-rad; b.y1b = cy+hl+rad; return b;
}
function rbubble(x,y,rad){ const b=rpeg(x,y,rad,0.3); b.life=1; return b; }
// 고정 사선 막대 — 각도만 주고 각속도는 0. 레퍼런스의 static box 와 같은 자리다.
function rslab(cx,cy,hl,ang,rad,e){
  const c=Math.cos(ang), s=Math.sin(ang);
  return rcap(cx-hl*c, cy-hl*s, cx+hl*c, cy+hl*s, rad, e);
}
// 폴리라인 → 캡슐 사슬. 마디 끝이 반원이라 꺾이는 자리에 각진 틈이 안 남는다.
function rpoly(E, pts, rad){
  for(let i=1;i<pts.length;i++)
    E.push(rcap(pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1], rad));
}

/* ── 시드 난수 ── 한 판을 시드 하나로 완전히 재현한다. */
function raceRnd(seed){
  let a = seed>>>0;
  return function(){ a=(a+0x6d2b79f5)>>>0; let t=a;
    t=Math.imul(t^(t>>>15), t|1); t^=t+Math.imul(t^(t>>>7), t|61);
    return ((t^(t>>>14))>>>0)/4294967296; };
}

/* ══ 스테이지 ══
   바깥 벽 두 줄이 방을 만들고, 방마다 성격이 다른 장애물이 들어간다.
   레퍼런스의 스테이지가 하는 일이 정확히 이것이다 — 벽이 흐름을 몰고, 안의 물체가 흩는다.
   구역을 y 로 적어 두면 어디를 고칠지 한눈에 보인다. */
function raceMapBuild(rnd){
  const E = [];
  const WT = 0.5;                                      /* 벽 두께 절반. 구슬 반지름(0.25)의 두 배다.
        얇게 뒀더니 축이 코스 밖에 있는 큰 날과 반발 1.5 범퍼가 구슬을 벽 너머로 밀어냈다. */

  /* ① 바깥 벽. 위쪽은 코스 밖까지 길게 뽑아 출발 순간 구슬이 위로 새지 못하게 막는다.
        좌우가 같은 y 에서 함께 좁아졌다 넓어지며 방을 만든다. */
  /* 장애물 구간 사이마다 '문'을 둔다(y 46~49, y 62~65). 문이 없을 때는 구슬이 바람개비·범퍼
     사이를 무작위로 휘저으며 아주 천천히만 빠져나갔다 — 성공한 판도 중앙 16초에 꼬리가 75초까지
     늘어졌고, 상한에 걸린 판이 3할이었다. 문을 지난 구슬은 위로 되돌아갈 수 없으므로 휘젓기가
     한 방에 갇히고, 방마다 끝이 난다. 폭 3(지름의 여섯 배)이면 막히지 않으면서 줄은 세운다. */
  /* 기울기 하한이 벽에도 걸린다 — |Δx|/Δy ≤ 1.4(수평에서 35° 이상). 문을 처음 넣을 때
     8 칸을 3 줄 만에 좁혀 2.67 이 나왔고, 그 완만한 면이 그대로 선반이 됐다. 장애물을 전부
     치우고 벽만 남겨도 실패 판 열한 개가 똑같이 그 자리에 멈춰 있었다 — 범인은 벽이었다.
     이제 문 하나를 좁히는 데 6 칸을 쓴다. */
  const LW = [[3,-30],[3,10],[7,17],[7,25],[3,32],[3,42],[11,48],[11,50],[4,55],[4,61],
              [11,67],[11,69],[4,74],[3,79],[3,88],[6,92],[6,97],[11,103],[11,119]];
  const RW = [[23,-30],[23,10],[19,17],[19,25],[23,32],[23,42],[15,48],[15,50],[22,55],[22,61],
              [15,67],[15,69],[22,74],[23,79],[23,88],[20,92],[20,97],[15,103],[15,119]];
  rpoly(E, LW, WT); rpoly(E, RW, WT);

  /* 벽 안쪽 경계를 y 로 조회한다. 두 군데서 쓴다 — 구슬을 가두는 클램프와, 장애물이 자기
     자리를 벽에 맞추는 것. 장애물을 고정 좌표로 깔았더니 벽이 좁아지는 y 에서 벽과 못 사이가
     지름보다 좁아져 사방에 낀다(계측: 60판 중 23판이 그렇게 멈췄다). */
  const lerpAt = (arr, y) => {
    if(y <= arr[0][1]) return arr[0][0];
    for(let i=1;i<arr.length;i++){
      const a=arr[i-1], b=arr[i];
      if(y <= b[1]) return a[0] + (b[0]-a[0])*(y-a[1])/(b[1]-a[1] || 1);
    }
    return arr[arr.length-1][0];
  };
  const bnd = y => [lerpAt(LW,y)+WT, lerpAt(RW,y)-WT];

  /* ② y 11~24 · 못밭(static rpeg). 가장 싼 장치이자 이 장르의 기본기다.
        가로 간격 3.4 는 구슬 지름(0.5)의 여섯 배가 넘어 낄 자리가 없다. */
  for(let j=0;j<5;j++){
    const y = 11.5 + j*2.6, off = (j%2)?1.7:0, r=0.34;
    const [xl,xr] = bnd(y), m = r + 2*RACE_R + 0.35;         // 벽과 못 사이에 지름 넘는 틈을 남긴다
    for(let x=xl+m+off; x<=xr-m; x+=3.4) E.push(rpeg(x, y, r));
  }

  /* ③ y 26~31 · 고정 사선 막대(static box, 각속도 0). 흐름을 한쪽으로 몰아 준다.
        레퍼런스에도 같은 자리에 같은 물건이 있다. */
  /* 기울기 하한이 있다. 완만한 면은 '선반'이 되어 구슬이 얹힌 채 안 내려온다 —
     0.30 rad(17°)로 뒀다가 그렇게 됐다. 0.7 rad = 40° 면 무엇도 얹히지 않는다. */
  [[27.4, 0.72, -1], [30.2, -0.70, 1]].forEach(([y, ang, side])=>{
    const [xl,xr]=bnd(y), w=xr-xl;
    const hl=Math.min(4.6, w*0.34);                     // 길이를 방 폭에 맞춘다
    const cx=(xl+xr)/2 + side*(w*0.5 - hl*Math.cos(ang) - 2*RACE_R - 0.5);
    E.push(rslab(cx, y, hl, ang, 0.22));
  });

  /* ④ y 34~45 · 바람개비 밭(kinematic box). 나란히 놓고 서로 반대로 돌린다 —
        레퍼런스가 ±3.5 로 쓰는 그 구성이다. 이웃이 반대로 돌아야 구슬이 한쪽으로만
        쏠리지 않고, 어느 날에 맞느냐로 결과가 갈린다. */
  /* 세로 간격은 날이 그리는 원의 지름(2*(1.9+0.16))보다 넉넉히 커야 한다. 3.6 으로 뒀더니
     위아래 원이 겹쳐, 반대로 도는 두 날 사이에 구슬이 물린 채 안 빠졌다. */
  for(let j=0;j<2;j++){
    const y = 35.5 + j*5.0;
    const [xl,xr]=bnd(y), c=(j%2===0)?3:2, hl=1.9;
    const span=(xr-xl) - 2*(hl + 2*RACE_R + 0.4);
    for(let k=0;k<c;k++){
      const x = xl + hl + 2*RACE_R + 0.4 + (c===1 ? span/2 : span*k/(c-1));
      E.push(rbar(x, y, hl, 0.16, ((k+j)%2?1:-1)*2.4, rnd()*6.283));
    }
  }

  /* ⑤ y 49~61 · 범퍼 핀(static rpeg, restitution 1.5).
        1 을 넘는 반발은 충돌마다 에너지를 '만든다'. 레퍼런스의 1.5 를 그대로 썼더니 주머니에
        갇힌 구슬이 튈수록 빨라져 영영 안 나왔다 — 1.22 면 순위는 흔들리되 빠져나온다. 그래서 여기 들어온 구슬은 튕겨 올라가고
        순위가 크게 흔들린다. 속도 상한(RACE_VMAX)이 있어 발산하지는 않는다 — 상한이 없으면
        몇 번 튕기다 화면 밖으로 날아간다. */
  [[0.12,56.8],[0.5,56.8],[0.88,56.8],[0.28,59.8],[0.72,59.8]].forEach(([t,y])=>{
    const [xl,xr]=bnd(y), r=0.75, m=r+2*RACE_R+0.4;
    E.push(rpeg(xl+m + (xr-xl-2*m)*t, y, r, 1.1));
  });

  /* ⑥ y 65~76 · 버블(rpeg + life). 닿으면 사라진다.
        간격을 지름보다 좁게(0.35) 깔아 그냥은 못 지나가게 한다 — 반드시 하나는 터뜨려야 하고,
        터진 자리가 그대로 길이 되어 뒤 구슬이 더 빨리 온다. 이 코스에서 판 중에 지형이 변하는
        유일한 자리다. 막힐 걱정은 없다: 닿기만 하면 사라지므로 눌릴수록 빨리 열린다. */
  for(let j=0;j<2;j++){
    const y = 77 + j*4, off = (j%2)?0.68:0, r=0.5;
    const [xl,xr]=bnd(y), m=r+0.1;                      // 버블은 닿으면 사라지니 벽에 붙여도 안 낀다
    for(let x=xl+m+off; x<=xr-m; x+=1.35) E.push(rbubble(x, y, r));
  }

  /* ⑧ y 88~100 · 못밭 + 사선 한 장. 결승 앞 마지막 흩기. */
  for(let j=0;j<3;j++){
    const y = 90.5 + j*2.8, off = (j%2)?1.5:0, r=0.3;
    const [xl,xr]=bnd(y), m=r+2*RACE_R+0.35;
    for(let x=xl+m+off; x<=xr-m; x+=3.0) E.push(rpeg(x, y, r));
  }
  { const [xl,xr]=bnd(99), w=xr-xl, hl=Math.min(3.4, w*0.3);
    E.push(rslab((xl+xr)/2, 99, hl, rnd()<0.5?0.68:-0.68, 0.2)); }

  /* ⑨ y 103~119 · 결승 통로. 폭 3(구슬 지름의 여섯 배)이라 둘셋이 나란히 서고, 길이는 16 이다.
        좁고 길수록 마지막 몇 초가 '줄을 선 채 앞을 못 지나가는' 그림이 된다.
        그 위를 큰 회전 날 하나가 쓸어 마지막 순위를 흔든다 — 판의 마지막 장면이 여기다.
        축을 코스 바깥에 두면 통로를 지나는 구간이 완만한 호가 되어 '천천히 쓸고 지나가는'
        그림이 된다. 다만 팔이 통로를 가로질러 다 덮으면 안 된다 — 축 14, 팔 44 로 뒀더니
        팔이 거의 수평인 채 오래 머무는 '움직이는 선반'이 되어 구슬을 태우고 안 놔줬다.
        축 5 이면 반대쪽이 늘 열려 있어 태울 수 없다. */
  {
    /* 팔 길이는 통로 폭에서 역산한다 — 훑는 원이 통로의 90% 를 덮게 한다. 고정 길이로 두면
       통로 치수를 고칠 때마다 덮는 비율이 조용히 달라진다. 100% 로 덮으면 반대쪽이 닫혀
       '움직이는 선반'이 되므로 나머지 10% 는 반드시 남긴다. */
    /* 날의 높이가 113 인 것은 회전 방향과 한 몸이다. 위로 쓸어 올리는 날을 통로 한가운데(110)에
       두면 들어 올린 구슬이 통로를 다시 다 내려와야 해서 최대 소요가 24 → 54 초로 뛴다.
       결승선(117) 가까이 내리면 들어 올려도 되돌릴 거리가 짧다. 카메라가 조여드는 지점(zoomY)
       과 같은 높이라, 가장 크게 보일 때 날이 훑는 그림이 나오는 것은 덤이다. */
    const RACE_VANE_COVER = 0.90, ay = 113;
    const [gxl, gxr] = bnd(ay), gw = gxr - gxl;
    /* 축은 왼쪽 바깥에 고정한다. 좌우를 판마다 뒤집으면 마지막 장면의 그림이 판마다 달라져
       '어느 쪽에서 쓸어 오는지'를 매번 다시 읽어야 한다 — 여기는 판의 결말이라 같은 그림이 낫다.
       구슬이 어느 레인에서 출발했는지와 무관한 값이므로 이걸 고정해도 누출은 생기지 않는다. */
    const ax = -5;
    const hl = (gxl + gw*RACE_VANE_COVER) - ax;
    /* 회전 속도는 1.2 다. 1.6 으로 두면 통로 안에서 최대 소요가 34 → 66 초로 뛴다 —
       날이 도는 주기와 구슬이 통로를 지나는 시간이 맞물려, 열린 틈이 올 때마다 번번이
       놓치는 판이 생긴다. 0.8 은 한 번 닫히면 너무 오래 닫혀 있다(최대 40초). */
    /* 회전 부호는 축을 왼쪽으로 옮긴 것과 한 몸이다. 축이 왼쪽에 있으면 팔이 통로를 지날 때
       오른쪽을 향하고, 그때 -1.2 는 팔 끝이 위로 올라가는 방향이다 — 통로를 쓸어 올린다.
       올려 보내는 날은 내려 보내는 날보다 다루기가 까다롭다. 자리를 잘못 잡으면 들어 올린
       구슬이 통로를 다시 다 내려와야 해서 꼬리가 길어진다 — 그래서 위 ay 를 결승 가까이 뒀다. */
    E.push(rbar(ax, ay, hl, 0.22, -1.2, rnd()*6.283));
  }

  const goalY = 117, zoomY = 113;
  const total = 120;

  // y 격자 — 구슬 하나가 훑을 물체를 셀 단위로 줄인다.
  const cells = Math.ceil(total/RACE_CELL)+8;
  const grid = []; for(let i=0;i<cells;i++) grid.push([]);
  E.forEach((b,i)=>{
    const a = Math.max(0, Math.floor((b.y0+30)/RACE_CELL)), z = Math.min(cells-1, Math.floor((b.y1b+30)/RACE_CELL));
    for(let c=a;c<=z;c++) grid[c].push(i);
  });
  // bodies·finishY 는 앱 렌더러와 테스트가 부르는 이름이다(같은 것을 가리킨다)
  return { E, bodies:E, grid, cells, goalY, finishY:goalY, zoomY, total, bnd };
}

/* ══ 시뮬레이션 ══
   모두가 결승선을 넘을 때까지 돌리고, 프레임마다 좌표를 녹화한다.
   1등만 뽑는 게임이라도 끝까지 돌리는 이유는 카메라 때문이다 — 레퍼런스처럼 '순위가 확정된
   만큼 다음 다툼으로' 옮겨 가려면 그 뒤 장면이 있어야 한다. */
function raceSimulate(st, n, rnd){
  const px=new Float64Array(n), py=new Float64Array(n), vx=new Float64Array(n), vy=new Float64Array(n);
  const done=new Int32Array(n).fill(-1);          // 결승선을 넘은 프레임
  /* 출발 정렬 — 격자로 세우되 자리는 시드로 섞는다(자리가 유리하면 번호가 곧 답이 된다).
     한 줄 여섯·간격 3.0 은 이름표가 읽히는 최소 폭이다. 예전 여덟·2.2 는 간격이 ≈24 논리 px 이라
     세 글자 이름(≈30px)이 이웃을 물었다. 여섯이면 한 줄 폭이 5×3.0=15 라 출발선의 벽 사이
     (x 3.5~22.5)에 여유 있게 들어가고, 줄이 하나 늘어도 위쪽 벽은 y=-30 까지 뻗어 있어 남는다.
     자리 유불리는 섞기가 지우므로 이 값은 공정성이 아니라 가독성의 문제다 — 그래도 쏠림이
     생기지 않는지는 tests/race.test.mjs 의 '1등이 특정 번호로 쏠리지 않는다' 가 판정한다. */
  const per = 6, SPX = 3.0, slot=[];
  for(let i=0;i<n;i++) slot.push(i);
  for(let i=n-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=slot[i]; slot[i]=slot[j]; slot[j]=t; }
  for(let i=0;i<n;i++){
    const s=slot[i], row=Math.floor(s/per), col=s%per, cnt=Math.min(per, n-row*per);
    px[i] = RACE_W/2 + (col-(cnt-1)/2)*SPX + (rnd()-0.5)*0.06;
    py[i] = 1 - row*1.6;
    vx[i] = (rnd()-0.5)*0.5; vy[i]=0;
  }
  const path = new Float32Array(RACE_MAXF*n*2);
  const idx = new Int32Array(n); for(let i=0;i<n;i++) idx[i]=i;
  const E=st.E, grid=st.grid, cells=st.cells;
  let frames=0, order=[], winner=-1, tail=-1;

  /* 1등이 들어와도 화면은 멈추지 않는다 — 꼴등이 궁금한 사람이 있다.
     멈추는 조건은 둘 중 먼저 오는 것이다: 모든 구슬이 들어왔거나, 1등 이후 30초가 지났거나.
     '전원 완주'만으로는 안 된다. 어딘가에 얹혀 끝내 안 내려오는 구슬이 판의 2~8% 에서 나오고,
     그것만 기다리면 그 판은 상한(90초)까지 돌아간다 — 랩 첫 판에서 60판 중 37판이 그렇게 됐다.
     그래서 상한을 함께 둔다. 30초면 대부분의 판이 전원 완주로 먼저 끝난다. */
  const TAIL = 1800;
  let landed = 0;
  for(let f=0; f<RACE_MAXF; f++){
    if(tail>=0 && (landed>=n || f-tail>=TAIL)) break;
    for(let s=0;s<RACE_SUB;s++){
      const tt=(f*RACE_SUB+s)*RACE_DT;
      for(let i=0;i<n;i++){
        if(done[i]>=0) continue;
        /* 아주 약한 감쇠. 초당 5% 만 깎으므로 자유낙하에는 영향이 없고, 벽·장애물 사이에서
           오래 튀는 구슬의 에너지만 서서히 빼앗는다. */
        vy[i]+=RACE_G*RACE_DT; vx[i]*=0.99995; vy[i]*=0.99995;
        const q=vx[i]*vx[i]+vy[i]*vy[i];
        if(q>RACE_VMAX*RACE_VMAX){ const k=RACE_VMAX/Math.sqrt(q); vx[i]*=k; vy[i]*=k; }
        px[i]+=vx[i]*RACE_DT; py[i]+=vy[i]*RACE_DT;
      }
      for(let i=0;i<n;i++){                        // 지형·장애물
        if(done[i]>=0) continue;
        const c=Math.floor((py[i]+30)/RACE_CELL);
        if(c<0||c>=cells) continue;
        const list=grid[c];
        for(let k=0;k<list.length;k++){
          const b=E[list[k]];
          if(b.dead!=null) continue;               // 이미 터진 버블
          if(rhit(b, i, tt, px, py, vx, vy) && b.life) b.dead=f;
        }
      }
      // 구슬끼리 — y 로 정렬해 창 밖은 볼 것 없이 끊는다.
      for(let a=1;a<n;a++){ const v=idx[a]; let b=a-1; while(b>=0&&py[idx[b]]>py[v]){ idx[b+1]=idx[b]; b--; } idx[b+1]=v; }
      const D=2*RACE_R;
      for(let a=0;a<n;a++){
        const i=idx[a]; if(done[i]>=0) continue;
        for(let b2=a+1;b2<n;b2++){
          const j=idx[b2]; if(done[j]>=0) continue;
          if(py[j]-py[i]>D) break;
          let nx=px[j]-px[i], ny=py[j]-py[i];
          const d2=nx*nx+ny*ny;
          if(d2>=D*D||d2===0) continue;
          const d=Math.sqrt(d2); nx/=d; ny/=d;
          const push=(D-d)*0.5;
          px[i]-=nx*push; py[i]-=ny*push; px[j]+=nx*push; py[j]+=ny*push;
          const rvn=(vx[j]-vx[i])*nx+(vy[j]-vy[i])*ny;
          if(rvn<0){ const jm=-(1+RACE_E_BALL)*rvn*0.5;
            vx[i]-=nx*jm; vy[i]-=ny*jm; vx[j]+=nx*jm; vy[j]+=ny*jm; }
        }
      }
      for(let i=0;i<n;i++){                        // 좌우 최후 안전망(벽이 먼저 막는다)
        /* 가두는 선은 코스 테두리(0~RACE_W)가 아니라 '그 y 의 벽 안쪽'이다. 테두리에 걸어 뒀더니
           벽 밖으로 밀려난 구슬이 x=0.25 에 붙들린 채, 밖에서 위를 향한 벽 사면에 얹혀
           영원히 안 내려왔다 — 멈춘 구슬의 좌표가 전부 벽 바깥이었다. */
        const [bl,br] = st.bnd(py[i]);
        if(px[i]<bl+RACE_R){ px[i]=bl+RACE_R; if(vx[i]<0) vx[i]=-vx[i]*RACE_E_WALL; }
        else if(px[i]>br-RACE_R){ px[i]=br-RACE_R; if(vx[i]>0) vx[i]=-vx[i]*RACE_E_WALL; }
      }
    }
    const base=f*n*2;
    for(let i=0;i<n;i++){ path[base+i*2]=px[i]; path[base+i*2+1]=py[i]; }
    frames=f+1;
    for(let i=0;i<n;i++){
      if(done[i]<0 && py[i]>=st.goalY){ done[i]=f; order.push(i); landed++; if(winner<0){ winner=i; tail=f; } }
    }
  }
  /* winAt — 승자가 결승선을 지난 프레임. 판이 얼마나 걸렸는지는 frames 가 아니라 이것으로
     재야 한다. frames 에는 1등 이후의 꼬리가 붙어 있어서, 꼬리를 늘리면 '판이 길어졌다'고
     잘못 읽힌다(시드 채택 창과 테스트가 둘 다 그렇게 속는다). */
  return { ok:winner>=0, winner, order, done, frames, winAt: winner>=0 ? done[winner] : frames,
           path:path.subarray(0, frames*n*2), n };
}

/* 구슬 i 와 캡슐 하나. 닿았으면 true — 버블을 터뜨릴지 판정하는 데 쓴다. */
function rhit(b, i, tt, px, py, vx, vy){
  let x1=b.x1,y1=b.y1,x2=b.x2,y2=b.y2, sxv=0, syv=0;
  if(b.spin){
    const a=b.ph+b.spin*tt, ca=Math.cos(a), sa=Math.sin(a);
    x1=b.cx-b.hl*ca; y1=b.cy-b.hl*sa; x2=b.cx+b.hl*ca; y2=b.cy+b.hl*sa;
  }
  const dx=x2-x1, dy=y2-y1, L2=dx*dx+dy*dy;
  let t = L2>0 ? ((px[i]-x1)*dx+(py[i]-y1)*dy)/L2 : 0;
  t = t<0?0 : t>1?1 : t;
  const qx=x1+t*dx, qy=y1+t*dy;
  let nx=px[i]-qx, ny=py[i]-qy;
  const rr=RACE_R+b.rad, d2=nx*nx+ny*ny;
  if(d2>=rr*rr) return false;
  let d=Math.sqrt(d2);
  if(d<1e-9){ nx=0; ny=-1; d=1e-9; } else { nx/=d; ny/=d; }
  px[i]+=nx*(rr-d); py[i]+=ny*(rr-d);
  if(b.spin){ sxv=-b.spin*(qy-b.cy); syv=b.spin*(qx-b.cx); }   // 접촉점의 표면 속도
  const rvx=vx[i]-sxv, rvy=vy[i]-syv;
  const vn=rvx*nx+rvy*ny;
  if(vn>=0) return true;                                       // 겹쳤지만 멀어지는 중 — 접촉은 접촉
  const e=b.e||RACE_E_WALL;
  vx[i]=rvx-(1+e)*vn*nx+sxv;
  vy[i]=rvy-(1+e)*vn*ny+syv;
  return true;
}

/* ══ 카메라 ══ 레퍼런스의 알고리즘을 그대로 옮긴다.
     · 추적 대상 — 순위가 확정된 만큼 '다음에 순위를 가릴 구슬'로 옮겨 간다.
       초반엔 1등 다툼, 후반엔 남은 순위 다툼을 따라간다.
     · 줌 조건 — 추적 대상과 zoomY 사이 거리가 RACE_ZOOM_TRIG 미만일 때만 시작한다.
     · 줌 배율 — max(1, (1 - goalDist/RACE_ZOOM_TRIG) * RACE_ZOOM_MAX).
     · 보간 — 목표를 바로 쓰지 않고 매 프레임 차이의 1/10 만 좁힌다. 오차가 아주 작으면 스냅.
     · 슬로모션 — 결승 직전이고 바로 앞뒤에 경쟁자가 붙어 있을 때만 시간을 늦춘다. */
const RACE_GOAL_H = 2.2;          // 결승 괘선 두 줄 사이 간격(글자가 들어갈 만큼)
const RACE_ZOOM_TRIG = 5, RACE_ZOOM_MAX = 4, RACE_LERP = 1/10, RACE_SNAP = 1/30;
/* 결승 밖에서 선두~꼴찌를 다 담으려고 여는 줌의 바닥. 0.5 면 화면에 세로 71 세계단위가 들어와
   24명 기준 99% 의 프레임을 덮는다(폭 분포: 중앙 24 · 90% 57 · 99% 70 · 최대 80).
   더 내리면 남은 1% 를 위해 늘 구슬을 더 작게 보게 된다 — 구슬 지름이 5.5px × 줌이라
   0.5 에서 2.8px 다. 여기가 '다 담긴다'와 '뭐가 담겼는지 보인다'가 갈리는 자리다. */
const RACE_ZOOM_MIN = 0.5;
/* 위아래 화면 여백 px. 맨 아래 구슬의 이름표(구슬 밑 10px 글자)가 잘리지 않을 만큼. */
const RACE_FIT_PAD = 18;
/* 지금 폭에 딱 맞추지 않고 12% 를 미리 더 열어 둔다. 이게 이 기능의 핵심 값이다 —
   딱 맞추면 카메라가 늘 한 발 늦어 '벌어지는 중'인 프레임에서 누군가 밖에 있다.
   실측(12시드): 전원 보이는 프레임이 8명 59.9 → 80.8% · 24명 41.2 → 63.7% 로 올랐고,
   지연 때문에 놓치는 프레임은 22~25% → 1~3% 로 떨어졌다. 여는 속도를 아무리 올려도
   (즉시 열어도) 여유 없이는 57~40% 에서 더 안 올라간다 — 속도가 아니라 여유의 문제다. */
const RACE_FIT_MARGIN = 1.12;
/* 열 때(줌아웃)만 쓰는 빠른 추종 계수. 뒤처진 구슬은 빨리 담고, 다시 다가갈 때는 RACE_LERP 로
   천천히 — 양쪽 다 빠르면 선두가 튈 때마다 화면이 같이 들썩인다. */
const RACE_OPEN = 1/3;
const RACE_SLOW_MIN = 0.2, RACE_SLOW_NEAR = 1.6;

/* 순위 — 이미 들어온 구슬이 항상 앞이고, 그들끼리는 들어온 순서다.
   y 로만 매기면 안 된다. 결승선을 지난 구슬은 그 자리에 얼어붙는데(done 이후 적분을 멈춘다)
   아직 달리는 구슬은 선 너머까지 계속 떨어진다 — 그래서 나중에 지나간 쪽이 화면과 HUD 에서
   1등 자리를 빼앗는다. 계측으로는 90판 중 64판이 그랬다. 발표되는 승자(sim.winner)는 늘
   맞았으므로, 보이는 것과 발표가 어긋나는 형태로만 드러났다. */
function raceOrder(rank, done, ypos, f){
  return rank.sort((a,b)=>{
    const fa = done[a]>=0 && done[a]<=f, fb = done[b]>=0 && done[b]<=f;
    if(fa && fb) return done[a]-done[b];
    if(fa) return -1;
    if(fb) return 1;
    return ypos[b]-ypos[a];
  });
}

// rate 를 주면 그 속도로 따라간다(줌을 열 때만 쓴다). 안 주면 예전 그대로 RACE_LERP.
function raceLerp(cur, tgt, rate){ return Math.abs(tgt-cur) < RACE_SNAP ? tgt : cur + (tgt-cur)*(rate || RACE_LERP); }

const pickOne = arr => arr[Math.floor(Math.random()*arr.length)];

// 자르는 목적 자체가 무너진다 — 돌림판 10명은 4글자 11px(≈44px)가 이미 조각 폭(≈39px)에 겨우
// 들어가 있어 여기에 …를 더하면 이웃 라벨과 겹친다. 전체 이름은 사다리 <title> 과 결과 발표에
// 그대로 남고, 11명부터는 라벨이 번호로 바뀌어 애초에 자를 일이 없다 (R10-2).

/* 번호–색–이름 범례. 사다리와 돌림판이 같은 함수를 쓴다 (R9-5, R10-2).
   11명을 넘으면 라벨에 번호만 들어가므로 이 표가 없으면 누가 어느 선·어느 조각인지 알 수 없다.
   하나로 세 가지가 풀린다 — 이름이 겹치지 않고(라벨이 번호 두 자리), 색이 비슷해 보여도 번호로
   갈리고, 잘려서 못 읽던 이름을 여기서 온전히 읽는다.
   n <= GAME_LABEL_MAX 면 빈 문자열을 돌려준다 — 호출부에 같은 조건을 두 번 쓰지 않기 위해서다.
   색은 그림이 쓴 gcolor(i, n) 을 그대로 부른다. 여기서 따로 계산하면 언젠가 그림과 어긋난다.
   n 은 인자로 받는다(players.length 를 쓰지 않는다) — 그리는 시점의 인원과 같은 값이어야 하고,
   호출부가 이미 그 값을 쥐고 있다.
   (구슬 레이스가 인원과 무관하게 범례를 켜던 always 인자는 없앴다 — 그 게임은 구슬에 이름을
    직접 달고 순위 목록이 색·이름을 다 갖고 있어서, 번호를 이름으로 옮겨 적을 표가 사라졌다.) */
function gameLegendHtml(players, n){

}

// 게임 상태는 '보고 있는 섬김' 하나에 매인다. 섬김이 바뀌면 통째로 버린다.
// 열림 여부·제외 명단·게임 종류·타이머·정리 함수가 각자 전역으로 흩어져 있었다. 하나로 모아야
// 명단 연동과 확률 정책을 얹을 자리가 생긴다. 게임을 한 번도 열지 않았으면 null 이다.
let GS = null;
// {
//   seq:        number|null   이 상태가 속한 섬김
//   on:         Set<memberId> 사용자가 명시적으로 '참가'로 켠 사람
//   off:        Set<memberId> 사용자가 명시적으로 '제외'로 끈 사람

//   sig:        string|null   게임 시작 시점의 참가자 서명(도중 변경 감지용)
//   open:       boolean       오버레이가 떠 있는지
//   pushed:     boolean       오버레이가 히스토리 1칸을 쥐고 있는지

// 명단은 게임을 열기 전에도(렌더 중 canGame 계산) 물어볼 수 있어야 한다.
// GS 가 없는 상태는 '아무도 켜거나 끄지 않았고 정책도 기본값'인 상태와 같다 — 그렇게 읽고 던지지 않는다.
const GS_NONE = new Set();
function gsOn(){  return GS ? GS.on  : GS_NONE; }
function gsOff(){ return GS ? GS.off : GS_NONE; }
function gameEnsure(opener){
  const seq = SESSION.seq ?? null;   // 호스트 없는 섬김에서 하단바로 들어오면 null — 그대로 키로 쓴다
  if(!GS || GS.seq !== seq){         // 보고 있는 섬김이 바뀌면 명단을 그 섬김의 기본값으로 되돌린다

           open:false, pushed:false, opener:null, timers:[], teardown:null };

}

// 기본 참가 = 음료를 주문한 분 (R2-1). 무응답은 기본 제외지만 토글로 넣을 수 있다.
function gameDefaultOn(m){ const o=ORDERS[m.id]; return !!(o && o.type==="drink"); }
// '오늘은 안 마실게요'는 되돌릴 수 없는 제외다 — 토글로도 넣지 못한다 (R2-5).

// 켜고 끈 것이 살아남아야 하기 때문이다(R3-5). 판단 규칙은 위 마커 블록의 순수 함수에만 두고
// 아래 둘은 전역을 읽어 넘겨주는 껍데기로만 남긴다 — 규칙이 두 곳에 생기면 화면에 보이는 인원과
// 실제 추첨 대상이 어긋난다.
// '오늘 섬긴 분 전원 자동 제외'는 없어졌다 — 직전 한 명은 확률 정책으로 다룬다.
function gameRoster(){ return rosterFrom(MEMBERS, ORDERS, gsOn(), gsOff()); }
// 참가자 수 표기와 게임 가능 판정의 단일 출처 (R3-6, R6-6). 정책이 명단을 줄이는 경우까지 여기서 반영된다.
/* 추첨 대상 = 로스터 그대로다 (2a). 예전엔 정책([제외])이 여기서 한 명을 더 덜어냈는데,
   확률 조정을 걷어내면서 덜어낼 이유가 없어졌다 — 넣고 빼는 것은 참가자 시트의 스위치뿐이다. */
function gamePlayers(){ return gameRoster(); }
// 렌더 도중 canGame 이 부르므로 GS 없이도 답이 나와야 한다 — 위 널 안전 리더들이 그 경로를 받친다.
// 기본값 규칙과 같은 출처를 쓰므로, 음료 주문자가 2명 미만이면 진입점이 뜨지 않는다 (R2-8).
function gameEligible(){ return gamePlayers().length >= 2; }
/* 결과를 서버에 쓸 수 있는가. 진입점 노출(전원)과 확정 권한(호스트 또는 호스트 없음)을 가르는
   단 하나의 판정이다. 화면과 실행 지점이 같은 함수를 봐야 '보이는데 안 되는' 어긋남이 없다.
   호스트가 남이면 그 사람의 결정을 가로챌 수 없다 — 대신 연습으로는 돌려볼 수 있다. */
function gameCanCommit(){ return SESSION.hostId===ME || !SESSION.hostId; }
/* 게임이 도는 동안 추첨 대상이 바뀌었는지 알아보는 서명 (R17-1).
   id 만 모아 정렬한다 — MEMBERS 는 이름순이라 누가 개명하면 배열 순서가 바뀌는데, 그건 명단이
   바뀐 게 아니다. 정렬하면 순서가 id 에만 매이므로 개명은 서명을 흔들지 않고, 사람이 들어오거나
   빠진 경우만 잡힌다. 값 비교라 감시자·구독이 필요 없고, 필요한 두 지점(결과 표시·확정)에서
   그때그때 늦게 비교한다. */
function gameRosterSig(){ return gamePlayers().map(m=>m.id).sort().join(","); }
// 수동 [오늘 섬긴 분 빼기] 전용으로 남는다 — 더 이상 진입 시 자동 적용하지 않는다
function gameServedIds(){ return new Set(SERVINGS.map(s=>s.hostId).filter(Boolean)); }

// 토글은 두 Set 을 함께 갱신한다. 한쪽만 만지면 '켰다 껐다' 한 사람이 기본값으로 돌아가버린다 (R3-5).
// 아래 세 함수는 사용자가 시트에서 조작할 때만 불리므로 GS 는 이미 있다.
function gameToggle(id, on){
  if(on){ GS.on.add(id);  GS.off.delete(id); }
  else  { GS.off.add(id); GS.on.delete(id);  }
}
// 전원 참가 (R2-10): 안 마시는 분을 뺀 전원을 '명시적 참가'로 — 나중에 주문이 들어와도 흔들리지 않는다
function gameAllOn(){ GS.off.clear(); GS.on = new Set(MEMBERS.filter(m=>!gameIsSkip(m)).map(m=>m.id)); }
// 전부 해제 — 손으로 몇 명만 고르고 싶을 때의 출발점이다. 참가자가 0명이 되지만 그 상태로
// 게임을 시작할 수는 없고(startGame 이 2명 미만을 막는다), 시트 푸터가 '참가 0명'을 바로 말한다.
function gameAllOff(){ GS.on.clear(); GS.off = new Set(MEMBERS.map(m=>m.id)); }
// 오늘 섬긴 분 빼기 (R2-9): 그분들만 끄고 나머지 명단은 그대로 둔다
function gameDropServed(){ gameServedIds().forEach(id=>gameToggle(id,false)); }

/* ---------- 확률 정책 (R6) ----------
   가중치 계산은 전역(GS)을 읽으므로 마커 블록 밖에 둔다. 검증 대상인 추첨 자체는 위 pickWeighted 가 맡고
   여기서는 '누구에게 얼마를 줄지'만 정한다 — 순수한 부분과 상태를 읽는 부분의 경계가 그 선이다.
   soft 만 가중치를 쓴다. skip 은 gamePlayers() 가 이미 명단에서 빼므로 남은 사람은 전원 1 이 되고,
   even 은 애초에 전원 1 이다. 그래서 정책별 분기가 여기 한 줄로 끝난다.
   직전 섬긴 분이 없거나(null) 아직 조회가 안 끝났으면(undefined) 조건이 falsy 라서 전원 1 이다 —
   undefined 가 실수로 어떤 구성원의 id 와 같아질 일은 없으므로 별도 방어가 필요하지 않다 (R6-12).
/* 모두 같은 확률로 뽑는다 (2a). pickWeighted 를 그대로 쓰되 가중치를 전부 1 로 준다 —
   균등 추첨은 가중 추첨의 한 경우고, 검증된 함수를 두고 새 추첨기를 또 만들 이유가 없다. */
function gamePickWinner(players){ return pickWeighted(players, players.map(()=>1)); }

function gtimer(fn,ms){ const t=setTimeout(fn,ms); if(GS) GS.timers.push(t); return t; }
function clearGameTimers(){ if(!GS) return; GS.timers.forEach(clearTimeout); GS.timers=[]; }

/* ---------- 모달 접근성 (R13) ----------
   #gameOv 는 role="dialog" aria-modal="true" 를 갖고 있지만, 그것만으로는 포커스가 배경에 남고
   스크린리더가 뒤쪽 화면을 계속 읽는다. 아래 세 함수가 '진짜 모달'의 나머지 절반이다.
   gameA11yPrev 가 null 이 아니면 '켜져 있음'을 뜻한다 — openGameOv 는 한 판마다 다시 불리므로
   켜기는 여러 번 들어오고, 닫기는 popstate·✕·그만두기·확정 네 경로에서 들어온다. */
let gameA11yPrev = null;

function gameA11yOn(){
  const el=$gv();
  // 진입점(gamepick/gamepickBar)이 opener 를 넘겨주지만, 그 경로를 안 거치고 열리는 일이 생기면
  // 지금 포커스를 돌아갈 자리로 삼는다 — 닫을 때 갈 곳이 없는 상태를 만들지 않는다.
  const act=document.activeElement;
  if(GS && !GS.opener && act && act!==document.body) GS.opener=act;   // body 는 돌아갈 자리가 아니다 — 그냥 비워 두고 아래 폴백에 맡긴다
  // 복원 상태는 처음 켤 때 한 번만 잡는다. '한 판 더'로 두 번 잡으면 이미 aria-hidden 이 걸린
  // 상태를 원래 모습으로 기억해, 닫아도 배경이 계속 숨겨진 채로 남는다.
  if(!gameA11yPrev){
    gameA11yPrev=[$app,$bottom];
    // #gameOv 는 이 둘의 형제라 자기 자신은 숨겨지지 않는다 — 배경만 스크린리더에서 사라진다 (R13-1~3)
    gameA11yPrev.forEach(n=>{ if(n) n.setAttribute("aria-hidden","true"); });
    // 오버레이가 아니라 document 에 건다. 결과가 나오면 setGameFoot 이 푸터를 다시 그리는데,
    // 그때 포커스가 있던 [그만두기]가 사라지면 포커스는 <body> 로 떨어진다. 오버레이에만 걸린
    // 리스너는 body 에서 올라오는 Tab 을 아예 못 보므로 그 순간 덫이 풀려버린다.
    document.addEventListener("keydown", gameTrap);
  }
  // 열릴 때마다 ✕ 는 새로 그려진 엘리먼트다. 이전 포커스는 DOM 에서 사라졌으니 다시 잡아준다 (R13-1)
  const first=el && el.querySelector("#gvX");
  if(first) first.focus();
}
function gameA11yOff(){
  if(!gameA11yPrev) return;   // 한 번도 안 열었거나 이미 되돌렸다 — 두 번 불려도 아무 일도 하지 않는다
  document.removeEventListener("keydown", gameTrap);
  gameA11yPrev.forEach(n=>{ if(n) n.removeAttribute("aria-hidden"); });
  gameA11yPrev=null;
  // 여는 버튼으로 돌아간다 (R13-3). 그 버튼이 render() 로 이미 사라졌으면 포커스가 <body> 에 남는데,
  // 그러면 다음 Tab 이 문서 맨 처음부터 시작해 사용자가 자리를 잃는다 → 앱 컨테이너에 세운다.
  const back=GS && GS.opener;
  const home=()=>{ if($app){ $app.setAttribute("tabindex","-1"); try{ $app.focus(); }catch(e){} } };  // -1 = 프로그램으로만 잡힘, Tab 순서엔 안 들어간다
  if(back && document.body.contains(back)){
    try{ back.focus(); }catch(e){}
    // 확정 경로는 closeGame() 바로 뒤에 render() 로 #app 을 다시 그린다 — 방금 잡은 버튼이 그때
    // 사라져 포커스가 <body> 로 떨어진다. 한 프레임 뒤에 확인해서 떨어졌으면 컨테이너로 올린다.
    requestAnimationFrame(()=>{ if(document.activeElement===document.body) home(); });
  } else home();
  if(GS) GS.opener=null;
}
// Tab 순환을 오버레이 안에 묶는다 (R13-2).
// .game-ov 자체가 position:fixed 라 그 자손의 offsetParent 는 오버레이(또는 .game-body)다 —
// null 이 되는 건 오버레이가 닫혀 display:none 일 때뿐이라, 이 필터가 '보이는 것만' 검사로 정확히 맞는다.
function gameTrap(e){
  if(e.key!=="Tab") return;
  // 확인창은 오버레이보다 위(z-index 70 > 55)에 뜬다. 그때도 이 덫이 Tab 을 오버레이 안으로
  // 되돌리면 확인창의 [취소]·[확인]에 영영 닿지 못한다 — 위에 뜬 쪽에 양보한다 (R20-2).
  if(confirmOpen) return;
  const el=$gv();
  if(!el || !el.classList.contains("show")) return;
  const f=[...el.querySelectorAll('button:not([disabled]), [tabindex="0"]')].filter(x=>x.offsetParent!==null);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1], cur=document.activeElement;
  if(!el.contains(cur)){ e.preventDefault(); (e.shiftKey?last:first).focus(); return; }   // 푸터 재렌더로 포커스를 잃은 경우 회수
  if(e.shiftKey && cur===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && cur===last){ e.preventDefault(); first.focus(); }
}

function openGameOv(title, bodyHtml){
  const el=$gv();
  el.innerHTML=`<div class="game-head"><div class="game-title">${title}</div>
      <button class="sheet-x" id="gvX" aria-label="닫기">✕</button></div>
    <div class="game-body" id="gvBody">${bodyHtml}</div>
    <div class="game-foot" id="gvFoot"></div>`;
  el.classList.add("show");
  // 오버레이는 자기 히스토리 항목을 직접 소유한다. pushSub() 을 쓰지 않는 이유:
  // pushSub 은 subActive 가 이미 true 면 no-op 이라, 현황 탭·게임 시트·오버레이가 한 칸을 공유했다.
  // 그래서 뒤로가기 한 번에 게임이 닫히면서 탭의 항목까지 함께 사라져 다음 뒤로가기가 앱을 나갔다.
  // subActive 와 무관하게 1칸을 push 하면 탭·시트의 뒤로가기 한 칸이 그대로 살아 있다.
  if(!GS.open){
    GS.open=true; GS.pushed=true;
    try{ history.pushState({sub:1, game:1},""); }catch(e){ GS.pushed=false; }   // push 실패면 소비할 항목도 없다
  }
  document.getElementById("gvX").onclick=()=>closeGame();   // 이벤트 객체가 opts 로 들어오지 않게 감싼다
  gameA11yOn();   // ✕ 를 배선한 뒤·show 를 켠 뒤라야 포커스가 걸린다(display:none 엔 포커스가 안 간다)
  holdGameHeight(document.getElementById("gvSay"),"sayH");   // 첫 안내 줄부터 바닥을 잡는다 — 아래 주석
}
/* 게임 화면에서 세로로 오르내리는 자리는 둘뿐이다 — 안내 한 줄(#gvSay)과 버튼 푸터(#gvFoot).
   단계가 바뀔 때마다 줄 수가 달라지는데(한 줄 안내 ↔ 두 줄 안내, 버튼 한 줄 ↔ 두 줄),
   그 사이에 놓인 판·사다리는 .game-body 의 auto 마진으로 세로 가운데에 떠 있어서
   위아래 어느 쪽이 줄면 그만큼 끌려간다 — 돌아가는 판이 덜컹인다.
   특히 돌림판은 [▶ 돌리기!] → 갈래 묻기 → 도는 중 → 멈추는 중으로 네 번 바뀌어서 제일 심했다.
   그래서 두 자리 모두 '한 게임 안에서는 줄지 않는다'로 바꾼다: 지금까지 본 가장 큰 높이를
   바닥(min-height)으로 깔아 둔다. 커질 때 한 번은 움직이지만 그건 방금 누른 단계의 화면 변화고,
   판이 도는 동안에는 아무것도 움직이지 않는다.
   가장 큰 높이를 미리 깔아 두지 않는 이유 — 첫 화면부터 결과 화면만큼(버튼 두 줄) 비워 두면
   짧은 폰에서 판이 그만큼 작아진다. 움직임을 없애자고 판을 줄이는 건 바꾼 보람이 없다.
   px 을 적어 두지 않고 실제로 재는 이유 — 버튼·글자 높이가 화면 폭(.btn 미디어쿼리)과
   사용자 글자 크기 설정(rem)에 따라 달라진다. 적어 두면 어느 한쪽에서 어긋난다.
   기준값은 GS 에 둔다. 게임 한 판과 생애가 같고, [한 판 더]로 다시 시작하면 startGame 이 비운다. */
function holdGameHeight(el, key){
  if(!el || !GS) return;
  const h=el.offsetHeight;
  if(h>(GS[key]||0)) GS[key]=h;
  el.style.minHeight=GS[key]+"px";
}
function setGameFoot(html){
  const f=document.getElementById("gvFoot"); if(!f) return;
  f.innerHTML=html; holdGameHeight(f,"footH");
}
// 안내 한 줄도 같은 규칙. 호출부가 <b> 를 쓰므로 innerHTML 로 받는다.
function setGameSay(html){
  const s=document.getElementById("gvSay"); if(!s) return;
  s.innerHTML=html; holdGameHeight(s,"sayH");
}
// opts.fromPop — 뒤로가기(popstate)로 들어온 호출. 그 경우 항목은 브라우저가 이미 소비했으므로
// 다시 back() 을 부르면 한 칸을 더 먹어 탭·시트의 뒤로가기가 사라진다.
function closeGame(opts){
  const fromPop = !!(opts && opts.fromPop);
  /* 결과가 나오기 전에 닫혔다면 중도 이탈이다 — 판이 길거나 지루하면 여기 숫자가 오른다.
     '게임을 몇 판 돌렸나'만 세면 이게 안 보이고, 시작 수만 늘어 성공처럼 읽힌다. */
  if(GS && GS.open && trackGameAt && !trackGameDone){
    track("game_abandoned", { kind: GS.kind || null, at_ms: Date.now()-trackGameAt, via: fromPop?"back":"button" });
    trackGameAt = 0;
  }
  clearGameTimers();
  if(GS && GS.teardown){ try{ GS.teardown(); }catch(e){} GS.teardown=null; }
  const el=$gv(); el.classList.remove("show"); el.innerHTML="";
  if(GS){
    GS.open=false;
    gameA11yOff();   // 배경 aria-hidden 해제 + 포커스 복귀. 네 경로(popstate·✕·그만두기·확정) 모두 여기를 지난다.
    // 버튼·✕·확정으로 닫을 때만 우리가 쥔 항목을 되돌린다. 증감은 짝을 맞춘다.
    if(!fromPop && GS.pushed){ ignorePop++; try{ history.back(); }catch(e){ ignorePop--; } }
    GS.pushed=false;
  }
}
// 탭·시트가 쌓아둔 하위 항목 1칸을 정리한다. 확정 후 '내 주문' 탭으로 직접 넘어갈 때만 쓴다(12.2).
function clearSubEntry(){
  if(subActive){ subActive=false; ignorePop++; try{ history.back(); }catch(e){ ignorePop--; } }
}

/* ---------- 게임 고르기 시트 ----------
   두 함수로 나눈다. openGameSheet 은 '진입'이라 비동기 조회를 걸고, drawGameSheet 은 '그리기'라
   동기로 끝난다. 나눠야 하는 이유는 둘이다 — 조회를 기다리지 않고 즉시 그려야 하고(R5-10),
   참가자 고르기에서 돌아올 때는 조회를 다시 걸지 않고 그리기만 다시 불러야 한다(R11-7).
   시트는 블록 단위로 쪼개 그린다. 정책 칩이 참가자 수를 바꾸므로 시트 전체를 다시 그리지 않고
   블록만 갈아끼워야 스크롤이 유지된다(R7-6) — 그래서 각 블록에 감싸는 div 와 HTML 생성 함수가 있다. */
/* 게임 계측 — 판이 시작한 시각을 들고 있다가 끝날 때 길이를 잰다. 얼마나 걸리는지를 모르면
   '20초짜리'라는 목표가 지켜지는지 실사용에서 확인할 방법이 없다(헤드리스 계측은 재생 속도와
   슬로모션을 반영하지 않는다). */
let trackGameAt = 0, trackGameDone = false;
function openGameSheet(){
  track("game_sheet_opened", { roster: (GS && GS.on) ? GS.on.size : null });
  if(!GS) gameEnsure();          // 진입점을 거치지 않고 열리는 경로가 생겨도 상태 없이 돌지 않게
  drawGameSheet();
  // 조회는 시트 렌더를 기다리게 하지 않는다 (R5-10). 위에서 이미 그렸고, 결과가 오면 그 블록만 갈아끼운다.
  // 조회를 여기(진입)에만 두는 이유: 이 가드는 GS.lastHostId 로 '조회했는지'만 보므로,
}

// 참가자 카드 (블록 2). 인원은 gamePlayers() 하나에서만 나온다 — 참가자 고르기 시트의 '현재 N명'과
// 같은 값이어야 한다 (R3-6).
// 기준 안내 한 줄이 필요한 이유: 무응답인 분이 왜 안 보이는지 여기서 말하지 않으면
// [참가자 바꾸기]를 열어봐야 알 수 있다 (R2-6).
/* 참가자 카드. 이름만 늘어놓고 바꾸는 길 하나를 카드 안에 둔다 (2a).
   예전엔 여기에 사람별 당첨 확률 %가 붙어 있었다. 확률을 조정할 수 있으니 보여 준 것인데,
   조정을 걷어낸 지금은 "모두 같다"를 굳이 숫자로 말할 이유가 없다 — 읽을 것만 늘어난다.
   [바꾸기]도 오른쪽 작은 버튼에서 카드 안 구분선 아래 전체폭으로 내렸다. 참가자를 고치는 것은
   이 카드에 대한 동작이지 제목 옆에 붙는 곁가지가 아니고, 44px 폭 버튼보다 찾기 쉽다. */
function gamePlayerCardHtml(){
  const players=gamePlayers();
  return `<div class="card gp-card">
      <b style="font-size:var(--fs-base)">참가자 ${players.length}명</b>
      <div class="gpr">${players.map(m=>`<span class="gpr-it"><b>${esc(m.name)}</b></span>`).join("")}</div>
      <div class="muted" style="margin-top:8px;font-size:var(--fs-sm)">메뉴를 고른 분이 기본으로 들어가 있어요</div>
      <button class="gp-swap" id="gRoster">참가자 바꾸기</button>
    </div>`;
}

// 2명 미만인 이유는 갈린다 — 주문이 아직 안 모였거나, 사용자가 명단에서 뺐거나, 정책이 한 분을
// 뺐거나. "2명 이상이어야 돌릴 수 있어요" 한 문장만 보여주면 어느 손잡이를 당겨야 하는지 알 수 없다.
// 그래서 사유와 다음 동작을 함께 적는다 (R2-7).
function gameShortReason(){
  const ordered = MEMBERS.filter(gameDefaultOn).length;   // 기본 참가 후보 = 메뉴를 고른 분
  // 정책이 명단을 줄이던 갈래는 없앴다 (2a) — 이제 명단을 줄이는 것은 사용자의 스위치뿐이다.
  // ① 다 켜도 두 분이 안 되는 경우. 토글로는 안 풀리니 주문을 기다리는 쪽을 먼저 말한다.
  if(ordered < 2) return { why: ordered ? "지금까지 메뉴를 고른 분이 한 분뿐이에요" : "아직 주문이 모이지 않았어요",
                           how:"조금 기다리거나, 아직 안 고른 분을 직접 넣어도 돼요" };
  // ② 주문은 모였는데 사용자가 껐다. 다시 켜면 바로 풀린다.
  return { why:"명단에서 빠진 분이 있어요", how:"빠진 분을 다시 켜면 바로 돌릴 수 있어요" };
}

/* 인원 상한 초과 처리 (R10-4). 상한값은 GAME_MAX 한 곳에서만 나온다 — 마크업에 숫자를 박으면
   상한을 고쳐도 화면이 옛 숫자를 말한다. 사유에 상한과 '지금 몇 명인지'를 함께 적는 이유:
   숫자 하나만 보여주면 몇 명을 빼야 풀리는지 사용자가 셈을 해야 한다.
   사유는 새 노드가 아니라 원래 있던 <small> 자리에 들어간다 — 줄을 하나 더 붙이면 세 버튼의
   높이가 들쭉날쭉해지고, 막힌 버튼이 오히려 더 커 보인다. */
function gamePickOff(kind, n){ return gameFits(kind, n) ? "" : " disabled"; }
function gamePickSub(kind, n, sub){
  return gameFits(kind, n) ? sub : GAME_MAX[kind]+"명까지 — 지금 "+n+"명이라 화면에 안 들어가요";
}

// 게임 고르기 블록 (블록 4). 참가자가 2명 미만이면 게임 대신 사유 배너 + [바꾸기]를 보여준다 (R2-7).
// 상한 판정은 이 배너 분기 '뒤'에만 있다 — 2명 미만이면 어떤 상한도 넘을 수 없으므로 볼 필요가 없다.
// 손가락 룰렛은 GAME_MAX 가 Infinity 라 어떤 인원에서도 살아남는다. 그래서 네 개가 동시에
// 막히는 상태는 만들어지지 않는다 — 사용자가 고를 게 하나도 없는 화면을 보지 않는다.
// 순서는 '짧은 것 → 긴 것'이 아니라 기존 세 개를 그대로 두고 구슬 레이스를 맨 끝에 붙인다 (R19-1).
// 20초짜리를 위로 올리면 이미 익숙한 배치가 흐트러지고, 제일 오래 걸리는 게임이 첫 선택지가 된다.
function gamePickBlockHtml(){
  const n=gamePlayers().length;
  if(n<2){
    const r=gameShortReason();
    return `<div class="banner-warn"><b>${r.why}</b><br>${r.how}</div>
      <button class="btn btn-soft" id="gRosterB">참가자 바꾸기</button>`;
  }
  /* 네 게임이 한 목록이다 (2a). 예전엔 [🎯 확률 조정 가능] / [🎲 완전 랜덤] 두 무리로 갈라
     놓았는데, 그건 위 카드가 사람별 확률 %를 보여주던 시절 "그 숫자가 이 둘엔 안 걸린다"를
     말하려고 그은 선이었다. 확률 이야기를 아예 안 하므로 가를 것이 없어졌다 —
     선과 그 아래 해명 한 줄이 함께 사라지고, 사용자가 읽을 것은 게임 이름 넷뿐이다. */
  return `<h3 class="label">어떤 방식으로 정할까요</h3>
      <button class="game-pick" data-g="ladder"${gamePickOff("ladder",n)}><span class="gp-em">🪜</span><span><b>사다리타기</b><small>${gamePickSub("ladder",n,"한 폰을 다 같이 보며 · 제일 두근거려요")}</small></span></button>
      <button class="game-pick" data-g="wheel"${gamePickOff("wheel",n)}><span class="gp-em">🎡</span><span><b>돌림판</b><small>${gamePickSub("wheel",n,"직접 멈춰서 정해요")}</small></span></button>
      <button class="game-pick" data-g="finger"${gamePickOff("finger",n)}><span class="gp-em">☝️</span><span><b>손가락 룰렛</b><small>${gamePickSub("finger",n,"폰 하나에 다 같이 손가락을 올려요")}</small></span></button>
      <button class="game-pick" data-g="race"${gamePickOff("race",n)}><span class="gp-em">🏁</span><span><b>구슬 레이스</b><small>${gamePickSub("race",n,"시스템도 모르는 100% 랜덤이에요")}</small></span></button>`;
}

// 블록을 다시 그린 뒤에도 그대로 부를 수 있게 배선을 한 곳에 모은다 — 부분 갱신이
// 리스너를 잃지 않게 하는 유일한 방법이 '다시 배선하는 지점을 하나로 두는 것'이다.
// 블록 안의 노드만 다루므로 시트 밖으로 새지 않는다.
function bindGameSheet(){
  bind("gRoster",  openRosterSheet);
  bind("gRosterB", openRosterSheet);   // 사유 배너의 CTA — 같은 곳으로 보낸다 (R2-7)
  // 상한을 넘어 disabled 인 버튼도 그냥 함께 배선한다 — <button disabled> 는 브라우저가 click 을
  // 아예 발생시키지 않으므로 이 핸들러가 돌 길이 없고, 탭 순서에서도 빠진다(gameTrap 의
  // 'button:not([disabled])' 도 같은 이유로 건너뛴다). 배선 쪽에 조건을 또 두면 상한 규칙이 두 곳에 생긴다.
  $sheet.querySelectorAll(".game-pick").forEach(b=> b.onclick=()=>{ const k=b.dataset.g; closeSheet(); startGame(k); });
}

// 참가자 수를 쓰는 두 블록은 항상 함께 그린다 — 따로 그리면 '참가자 2명'인데 아래엔 사유 배너가
// 떠 있는 중간 상태가 한 프레임 보인다. innerHTML 을 갈므로 그 안의 [바꾸기]·게임 버튼이 새 노드가
// 되어 리스너를 잃는다 → 마지막에 반드시 다시 배선한다. $sheet 자체는 건드리지 않으니 스크롤은 그대로다.
function syncGameCountBlocks(){
  const pl=document.getElementById("gPlayerBlock"), pk=document.getElementById("gPickBlock");
  if(!pl || !pk) return;               // 게임 고르기 시트가 아니면 아무것도 하지 않는다
  pl.innerHTML=gamePlayerCardHtml();
  pk.innerHTML=gamePickBlockHtml();
  bindGameSheet();
}


// 그리기만 한다. 비동기 조회는 openGameSheet 이 맡으므로 여기서는 아무것도 기다리지 않는다.
// 여러 번 불려도 안전하다 — openSheet 의 pushSub() 은 subActive 가 이미 true 면 no-op 이라
// 히스토리 항목이 늘지 않는다 (R11-7).
function drawGameSheet(){
  openSheet(`
    <h3>🎲 섬길 사람 정하기</h3>
    <p class="muted" style="margin-top:0">결과는 <b>[확정하기]</b>를 누르기 전까진 아무것도 바꾸지 않아요. 마음에 안 들면 한 판 더 돌리면 됩니다.</p>
    <div id="gPlayerBlock">${gamePlayerCardHtml()}</div>
    <div id="gPickBlock">${gamePickBlockHtml()}</div>
    <div style="height:8px"></div><button class="btn btn-ghost btn-close" id="gClose">닫기</button>`);
  bind("gClose", closeSheet);
  bindGameSheet();
}

/* ---------- 참가자 바꾸기 ---------- */
/* ---------- 참가 토글 스위치 ---------- */
// 이름 노드에 붙일 id 규약. 스위치가 aria-labelledby 로 같은 행의 이름을 가리켜야
// "김요셉, 스위치, 켜짐"으로 읽힌다 (R1-5). 행 마크업도 반드시 이 함수로 id 를 만든다.
// 구성원 id 는 보통 genMemberId() 가 만든 "m_" + [0-9a-z]{10} 이지만, 옛 데이터에서는
// memObjs() 가 이름 문자열을 그대로 id 로 쓴다({id:m, name:m}) — 공백이 섞이면 HTML id 로
// 쓸 수 없다. 그래서 [A-Za-z0-9-] 밖의 글자는 "_코드36_"으로 감싼다. 구분자로 감싸므로
// 서로 다른 id 가 같은 라벨 id 로 뭉개지지 않는다(이름이 다른 사람의 스위치가 되는 사고 방지).
function gswLabelId(id){
  return "gswl-" + String(id).replace(/[^A-Za-z0-9-]/g, c => "_" + c.codePointAt(0).toString(36) + "_");
}
// 스위치 한 개의 HTML 을 만드는 순수 문자열 생성기. 상태는 aria-checked 로만 싣고
// 색·손잡이 위치는 CSS 가 파생시킨다. <button> 이라 Space/Enter 와 포커스가 공짜로 들어온다 (R1-6).
// type="button" 은 지금 감싸는 form 이 없어도 붙여 둔다 — 나중에 form 안으로 들어가도 제출로 새지 않는다.
function gswHtml(id, on, labelId){
  return `<button type="button" class="gsw" role="switch" aria-checked="${on?"true":"false"}"`
       + ` aria-labelledby="${esc(labelId || gswLabelId(id))}" data-id="${esc(id)}">`
       + `<span class="gsw-track"></span><span class="gsw-knob"></span></button>`;
}

/* ---------- 참가자 고르기 시트 (R7) ----------
   토글마다 openSheet() 을 다시 부르던 draw() 구조를 버린다. openSheet 은 $sheet.innerHTML 을
   갈아치우고 scrollTop=0 을 실행하므로, 명단 아래쪽 사람을 연달아 조정할 수 없었다 —
   매번 맨 위로 튀고 방금 누른 버튼도 사라졌다. 구성원이 많으면 시트 자체를 쓸 수 없다.
   그래서 렌더는 최초 1회로 고정하고, 조작 결과는 '그 행 + 상단 카운트'만 제자리에서 고친다. */

// 한 번의 갱신에 필요한 값을 그 순간 gameRoster() 에서 다시 읽어 묶는다.
// 화면이 자기 상태를 들고 있으면 보이는 인원과 실제 추첨 대상이 어긋나므로(design 13) 오래 들고 있지 않는다 —
// 여러 행을 함께 고칠 때 행마다 명단을 다시 계산하지 않기 위한 한 번짜리 묶음이다.
function rosterNow(){
  return { on:new Set(gameRoster().map(m=>m.id)), served:gameServedIds() };
}

// 행 부제의 우선순위를 여기 한 곳에서 정한다. 한 사람이 여러 조건에 동시에 걸리므로(주문도 했고
// 오늘 섬겼고 직전 호스트이기도 하다) 순서를 못 박아야 화면이 흔들리지 않는다. 위에서부터:
//   1. 안 마심        — 되돌릴 수 없는 제외라 나머지가 무의미하다 (R2-5)
//   2. 아직 주문 전   — 왜 기본 제외인지와 무엇을 하면 되는지를 말하는 유일한 문구다 (R2-4)
//   3. 오늘 이미 섬기셨어요
//   4. 주문 완료
// 켜져 있을 때는 CTA('넣으려면 켜주세요')를 떼어낸다 — 이미 켜 둔 사람에게 켜라고 말하면 안 된다.
// '직전에 섬기신 분' 갈래는 없앴다 (2a) — 그 사람을 가리키던 정책 카드가 사라져서, 행에만
// 남겨두면 어디에도 쓰이지 않는 꼬리표가 된다.
function rosterSubText(m, on, snap){
  if(gameIsSkip(m))     return "오늘은 안 마셔요 — 후보에서 빠짐";
  if(!gameDefaultOn(m)) return on ? "아직 주문 전" : "아직 주문 전 — 넣으려면 켜주세요";
  if(snap.served.has(m.id)) return "오늘 이미 섬기셨어요";
  return "주문 완료";
}

// 행 마크업. 아바타 배경을 --sub 로 바꾸던 처방은 없앴다 — 상태는 스위치가 말하고,
// 제외된 행은 .gs-off 로 이름·부제만 흐려진다 (R1-9는 CSS 쪽 주석 참고).
function rosterRowHtml(m, snap){
  const skip=gameIsSkip(m), on=snap.on.has(m.id), lid=gswLabelId(m.id);
  return `<div class="person${on?"":" gs-off"}" data-id="${esc(m.id)}">
    <div class="avatar">${esc(initials(m.name))}</div>
    <div><div class="pname" id="${esc(lid)}">${esc(m.name)}</div>
      <div class="pmenu">${esc(rosterSubText(m,on,snap))}</div></div>
    ${skip?`<span class="pill skip">안마심</span>`:gswHtml(m.id,on,lid)}</div>`;
}

// 행 하나를 '제자리에서' 고친다. innerHTML 을 다시 넣지 않고 속성·클래스·텍스트만 건드리는 것이
// 핵심이다 — 노드가 살아 있으니 방금 누른 스위치의 포커스가 애초에 날아갈 일이 없다 (R7-2).
function patchRosterRow(row, snap){
  const m=memberById(row.dataset.id);
  if(!m) return;                                    // 갱신 중 명단에서 사라진 행은 건드리지 않는다
  const on=snap.on.has(m.id);
  row.classList.toggle("gs-off", !on);
  const sw=row.querySelector(".gsw");
  if(sw) sw.setAttribute("aria-checked", on?"true":"false");   // 색·손잡이 위치는 CSS 가 여기서 파생시킨다
  const sub=row.querySelector(".pmenu"), t=rosterSubText(m,on,snap);
  if(sub && sub.textContent!==t) sub.textContent=t;
}

function rosterRows(){ const l=document.getElementById("gRosterList"); return l ? l.querySelectorAll(".person") : []; }

// data-id 를 CSS 선택자에 끼워 찾지 않는다 — 옛 데이터의 구성원 id 는 이름 문자열이라 따옴표·공백이
// 섞일 수 있다. 구성원은 최대 60명이라 훑는 비용이 무의미하다.
function syncRosterRow(id){
  const snap=rosterNow(); id=String(id);
  rosterRows().forEach(row=>{ if(row.dataset.id===id) patchRosterRow(row, snap); });
}
// 게임 고르기 시트와 같은 값이어야 한다 — 그래서 gamePlayers() 하나만 본다 (R3-6).
function syncRosterCount(){
  const n=gamePlayers().length;
  const el=document.getElementById("gRosterCount");
  if(el) el.textContent=n;
  // 빠진 인원도 함께 말한다 — '참가 3명'만 보면 나머지가 몇인지 세어봐야 한다.
  const off=document.getElementById("gRosterOff");
  if(off) off.textContent=(MEMBERS.length-n)+"명 빠짐";
}
// 컨테이너를 다시 만들지 않으므로 scrollTop 이 유지되고, 위임 리스너도 그대로 살아 있다 (R7-4).
function syncRosterAll(){
  const snap=rosterNow();
  rosterRows().forEach(row=>patchRosterRow(row, snap));
  syncRosterCount();
}

// [완료] 는 '되돌아가기'다 — 히스토리 항목이 늘어나면 뒤로가기가 한 번 헛돈다 (R11-7).
// openSheet 안의 pushSub() 은 subActive 가 이미 true 면 no-op 이라 실제로 늘지는 않지만,
// 그 no-op 에 기대는 계약은 조용히 깨진다. 늘어났으면 개발 중에 드러나게 확인만 남긴다.
// openGameSheet 이 아니라 drawGameSheet 을 부른다. 진입은 이미 한 번 있었고 직전 섬긴 분 조회도
// 그때 걸렸으므로, 여기서 다시 진입하면 응답이 오기 전이었을 때 같은 RPC 가 두 번 나간다.
// (fetchLastHost 의 캐시는 응답이 도착한 뒤에야 채워진다 — 진행 중인 조회를 합쳐주지 않는다.)
// 조회가 이 시트가 닫혀 있는 동안 끝났더라도, 아래 그리기가 GS.lastHostId 를 읽어 정책 카드까지 함께 그린다.
function backToGameSheet(){
  const had=subActive;
  drawGameSheet();
  if(!had && subActive) console.warn("참가자 고르기 [완료]가 히스토리 항목을 늘렸다 (R11-7)");
}

/* 참가자 고르기 시트.
   구조를 split 시트(머리 고정 · 목록만 스크롤 · 푸터 고정)로 바꿨다. 예전에는 시트 전체가
   한 덩어리로 스크롤돼서 두 가지가 동시에 나빴다 — ① 24명이면 [완료]가 화면 밖으로 밀려
   목록을 끝까지 내려야 눌 수 있었고 ② 참가 인원수가 맨 위 문장 안에 있어서, 아래쪽 사람을
   토글하는 순간 그 숫자가 화면에 없었다. 토글의 결과를 못 보면서 토글하는 셈이었다.
   이제 숫자와 [완료]가 같은 푸터에 고정으로 붙어 있어 늘 함께 보인다.
   일괄 버튼은 셋으로 늘렸다 — 되돌아갈 자리(기본값)가 없으면 한 번 헝클어뜨린 명단을
   손으로 다시 맞춰야 한다. */
function openRosterSheet(){
  if(!GS) gameEnsure();
  const snap=rosterNow();
  openSheet(`
    <h3>참가자 고르기</h3>
    <!-- 기본이 무엇인지를 제목 바로 아래에서 말한다 (18b). 이 줄이 없으면 무응답인 분이 왜
         꺼져 있는지 알 수 없어, 사용자가 스위치를 하나씩 눌러 보며 규칙을 추측하게 된다. -->
    <p class="sheet-hint">메뉴를 고른 분이 기본으로 들어가 있어요. 스위치로 넣고 뺄 수 있어요.</p>
    <!-- 일괄 버튼 셋 (18b). 채우는 둘은 나란히 같은 모양, 되돌리기는 테두리만으로 낮춘다 —
         셋이 같은 무게면 어느 것이 '원래대로'인지 모양으로 구분되지 않는다.
         [직전 섬긴 분 제외]는 삭제했다: 그 사람을 알아내던 조회가 2a 와 함께 사라졌다. -->
    <div class="rst-pre">
      <button class="btn btn-sm btn-soft rst-fill" id="gAll">전원 참가</button>
      <button class="btn btn-sm btn-soft rst-fill" id="gNone">전부 해제</button>
      <button class="btn btn-sm btn-ghost" id="gDefault">↺ 기본</button></div>
    <div class="sheet-scroll">
      <div class="card" id="gRosterList" style="padding:6px 14px;margin-bottom:4px">${MEMBERS.map(m=>rosterRowHtml(m,snap)).join("")}</div>
    </div>
    <div class="sheet-foot">
      <div class="row-between rst-sum">
        <span>참가 <b id="gRosterCount">${gamePlayers().length}</b>명</span>
        <span class="muted" id="gRosterOff">${MEMBERS.length-gamePlayers().length}명 빠짐</span></div>
      <button class="btn btn-brand" id="gDone">완료</button>
    </div>`);
  // 리스너는 목록 컨테이너에 하나만 건다. 행을 제자리에서 고치니 재배선할 일이 없고,
  // 컨테이너가 살아 있는 동안(=시트가 열려 있는 동안) 위임이 유지된다.
  // 스위치가 없는 '안 마심' 행은 .gsw 가 없어 여기 걸리지 않고, 설령 강제로 켜도
  // rosterFrom 이 안 마시는 분을 먼저 잘라내므로 명단에 들어가지 못한다 (R2-5).
  const list=document.getElementById("gRosterList");
  list.addEventListener("click", e=>{
    const sw=e.target.closest(".gsw");
    if(!sw || !list.contains(sw)) return;
    gameToggle(sw.dataset.id, sw.getAttribute("aria-checked")!=="true");   // 상태의 출처는 화면이 아니라 GS 지만, 뒤집을 기준은 방금 보고 누른 값이다
    syncRosterRow(sw.dataset.id);   // 그 행만
    syncRosterCount();              // 상단 카운트만 — 컨테이너를 다시 만들지 않으니 scrollTop 이 그대로다 (R7-1, R7-3)
    sw.focus();                     // iOS 사파리는 버튼을 눌러도 포커스를 주지 않는다 — 여기서 못 박는다 (R7-2)
  });
  /* 일괄 버튼 셋 (18b). 둘은 '이렇게 채워라'(전원 참가·전부 해제)이고, [↺ 기본]은
     켠 것과 끈 것을 모두 지워 기본 규칙(메뉴 고른 분)만 남기는 되돌리기다.
     되돌리기를 테두리만(btn-ghost)으로 낮춰 채우는 둘과 무게를 가른다. */
  bind("gAll",     ()=>{ gameAllOn();      syncRosterAll(); });   // R2-10
  bind("gDefault", ()=>{ GS.on.clear(); GS.off.clear(); syncRosterAll(); });
  bind("gNone",    ()=>{ gameAllOff();     syncRosterAll(); });
  bind("gDone",    backToGameSheet);
}

/* ---------- 실행 ---------- */
function startGame(kind){
  if(!GS) gameEnsure();
  const players=gamePlayers();   // 시트에 보인 인원과 같은 출처 — 정책 적용 후 1명이 되는 경우도 여기서 막힌다
  if(players.length<2){
    // 사유를 갈라 말한다 (R6-14). [제외] 때문에 줄어든 경우에 "2명 이상이어야 해요"만 띄우면
    // 명단에는 두 명이 보이는데 왜 안 되는지 알 수 없고, 어느 손잡이를 당길지도 모른다.
    const dropped = gameRoster().length >= 2;
    toast(dropped ? "[제외] 때문에 참가자가 "+players.length+"명이에요 — 정책을 바꾸거나 참가자를 늘려주세요"
                  : "참가자가 2명 이상이어야 해요");
    return;
  }
  // 상한은 시트에서 이미 막았지만 [한 판 더]는 시트를 지나지 않고 startGame(GS.kind) 을 직접 부른다.
  // 게임 도중 누가 주문을 넣어 명단이 16명을 넘으면, 시트에서는 비활성인 사다리가 여기로 다시
  // 들어와 라벨이 겹친 화면을 그린다. 그래서 판정을 실행 지점에도 둔다. 문구는 시트의 사유와 같다 (R10-4).
  // GAME_MAX[kind] 가 없는(=모르는) kind 는 판정하지 않는다 — Infinity·16·24 는 모두 truthy 다.
  if(GAME_MAX[kind] && !gameFits(kind, players.length)){
    toast(GAME_MAX[kind]+"명까지 — 지금 "+players.length+"명이라 화면에 안 들어가요");
    return;
  }
  GS.kind=kind;   // [한 판 더]가 같은 게임을 다시 돌릴 수 있게 기억해 둔다 (R6-8)
  // 안내 줄·푸터의 높이 바닥은 한 판마다 새로 잡는다 — 안 비우면 사다리(버튼 한 줄)가
  // 앞서 돌린 구슬 레이스의 결과 푸터(두 줄)만큼 빈 자리를 안고 시작한다. holdGameHeight 주석 참조.
  GS.sayH=0; GS.footH=0;
  trackGameAt = Date.now(); trackGameDone = false;
  track("game_started", { kind, players: gamePlayers().length, policy: (GS && GS.policy) || null,
                          soft_w: (GS && GS.softW != null) ? GS.softW : null, dry_run: !gameCanCommit() });
  // 서명도 여기서 남긴다 — 위 두 가드를 통과한 뒤라야 한다. 가드에 걸려 돌아가는 경우까지 덮어쓰면
  // 화면에 남아 있는 지난 결과의 기준이 '시작하지도 않은 판'의 명단으로 갈려 경고가 사라진다.
  // [한 판 더]도 이 지점을 다시 지나므로 서명이 새로 잡히고, 그러면 경고가 저절로 걷힌다 (R17-1).
  GS.sig=gameRosterSig();
  // 결과를 먼저 뽑고 그림이 그 결과를 향하게 한다 — 애니메이션이 결과를 만들면 확률이 고르지 않다.
  // 그래서 확률 정책이 여기 한 지점에만 얹힌다 (R6-9).
  if(kind==="ladder") playLadder(players, gamePickWinner(players));
  // 돌림판만 당첨자를 미리 뽑지 않는다 — 조각 각도가 이미 확률이라 판이 멈춘 자리가 곧 추첨이다.
  else if(kind==="wheel") playWheel(players, players.map(()=>1));   // 조각은 모두 같은 각도 (2a)
  // 구슬 레이스도 같은 지점에서 당첨자를 먼저 뽑는다 — 확률 정책이 그대로 반영된다 (R19-4).
  // 명단도 여기서 읽은 players 를 그대로 넘긴다. [한 판 더]가 이 지점을 다시 지나므로 그때의
  // gamePlayers() 로 새로 뽑히고, playRace 는 명단을 어디에도 캐시하지 않는다 (R19-15).
  // 구슬 레이스만 예외다 — 승자를 미리 뽑지 않는다. 물리가 정하고 이름은 그 뒤에 붙으며,
  // 구슬이 서로 구별되지 않으므로 결과는 균등하다. [확률⬇️]를 걸 자리가 없고(손가락 룰렛과
  // 같은 이유) [제외]는 gamePlayers() 가 이미 반영했다.
  else if(kind==="race") startRace(players);
  // 손가락 룰렛은 예외다 (R6-10). 당첨되는 건 화면에 올라온 물리적 손가락이고 그게 누구인지는
  // 사후에 사람이 지목한다 — 미리 뽑아 강제하면 사람의 지목을 몰래 덮어쓰게 되므로 뽑지 않는다.
  // 명단도 넘기지 않는다. 이름 칩은 지목하는 그 순간의 gamePlayers() 를 읽어야 하므로(R3-7)
  // 시작 시점의 배열을 들고 있으면 오히려 낡은 값을 쓸 위험만 생긴다.
  else playFinger();
}

/* 그림판의 aria-label 을 '진행 중'에서 결과로 바꾼다 (R13-6, R19-16).
   사다리와 돌림판 두 곳이 같은 문제를 갖고 있어 각자 고치면 처방이 갈라진다. 세 게임이 반드시
   지나가는 showGameResult 한 지점에 얹는 이유는 여기가 (a) 게임마다 한 번씩 불리고 (b) 이미
   당첨자를 쥐고 있어서다. 문구만 GS.kind 로 갈린다.
   선택자에 canvas 를 함께 넣는다 — 구슬 레이스의 그림판은 <canvas role="img"> 라서 svg 만 찾으면
   조용히 지나가고 라벨이 '진행 중'으로 남는다. '무엇으로 그렸는지'가 아니라 'role=img 인 그림판'이
   이 함수가 찾는 대상이므로, 종류별 분기를 늘리는 대신 선택자를 그 뜻에 맞게 넓힌다.
   손가락 룰렛은 그림판이 없으므로 querySelector 가 null 을 돌려주고 조용히 지나간다 — 손가락은
   화면에 '진행 중' 라벨을 걸지 않으니 되돌릴 것도 없다.
   [한 판 더]는 openGameOv 가 마크업을 다시 그리므로 라벨이 '진행 중'으로 저절로 되돌아온다. */
function gameStageDone(w){
  const ov=$gv(); if(!ov) return;
  const stage=ov.querySelector('svg[role="img"], canvas[role="img"]');   // 오버레이 안의 그림판. 게임마다 하나뿐이다
  if(!stage) return;
  const kind=GS && GS.kind;
  const head= kind==="ladder" ? "사다리타기 결과: "
            : kind==="wheel"  ? "돌림판 결과: "
            : kind==="race"   ? "구슬 레이스 결과: " : "게임 결과: ";
  stage.setAttribute("aria-label", head + hon(w.name));
}

function showGameResult(w){
  gvibe([28,60,28]);
  trackGameDone = true;
  track("game_finished", { kind: (GS && GS.kind) || null, players: gamePlayers().length,
                           duration_ms: trackGameAt ? Date.now()-trackGameAt : null,
                           winner_is_me: !!(w && w.id === ME) });
  gameStageDone(w);   // 진행 중 라벨을 결과로 갱신 (R13-6)
  // role="status"(= aria-live polite + atomic)는 이 안에 꽂는 마크업이 아니라 빈 #gvWin 컨테이너에 미리 걸려 있다.
  // 라이브 리전은 '이미 DOM 에 등록된 영역이 바뀔 때' 읽힌다 — 내용과 함께 새로 삽입되면 안 읽히는 리더가 있다 (R13-4).
  const box=document.getElementById("gvWin");
  /* 게임이 도는 사이 명단이 바뀌었는지는 여기서 처음 본다 (R17-1, R17-2). 감시자를 걸지 않는 이유는
     이 값이 쓰이는 순간이 둘뿐이라서다 — 결과가 걸릴 때와 확정할 때. 그 사이에 알아도 할 일이 없다.
     결과를 몰래 다시 뽑거나 오버레이를 닫지는 않는다. 사용자가 방금 본 그림과 이름은 그대로 두고
     '이 결과를 그대로 쓸지'만 사용자가 고르게 한다.
     gone(당첨자가 지금 추첨 대상이 아님)이 더 강한 조건이다 — 명단에서 빠진 분을 호스트로 앉히는
     것이 실제 사고이고, changed 는 남이 주문을 넣은 정도의 변화도 함께 잡는다. */
  const changed = !!(GS && GS.sig!==null && GS.sig!==gameRosterSig());
  const gone = !gamePlayers().some(m=>m.id===w.id);
  const warn = gone    ? "당첨되신 분이 방금 명단에서 빠졌어요 — 한 판 더 돌려주세요"
             : changed ? "게임 도중 참가자가 바뀌었어요 — 한 판 더 돌리시겠어요?" : "";
  // 배너를 #gvWin 안, 결과 블록 '위'에 넣는다. 따로 만든 div 를 바깥에 끼우면 새로 삽입된 영역이라
  // 라이브 리전으로 안 읽히는 리더가 있고, 리전을 하나 더 두면 결과와 경고가 두 번에 나눠 읽힌다.
  // 여기 넣으면 role="status"(atomic) 가 '경고 + 당첨자'를 한 번에 읽는다 — #gvWin 의 속성은 그대로다.
  if(box) box.innerHTML=`${warn?`<div class="game-warn">${esc(warn)}</div>`:""}<div class="game-win"><div class="we">☕</div>
    <div class="wn">${esc(hon(w.name))}</div>
    <div class="ws">오늘 음료로 섬겨주실 분${w.id===ME?" — 바로 나!":""}</div></div>`;
  setGameSay("결과가 나왔어요");
  const same = SESSION.hostId===w.id;
  // 라벨에서 이름을 뺀다 (R18-3, R18-4). 당첨자 이름은 바로 위 .game-win .wn 에 25px 로 크게 나와
  // 있으니 버튼에서 되풀이할 이유가 없고, 이름을 빼면 길이에 따른 넘침과 이름 뒤 조사 문제가
  // 함께 사라진다 — 조사를 다른 자리로 옮기는 게 아니라 없애는 쪽이다.
  const okLabel = same ? "확인" : "✅ 이분으로 확정하기";
  /* 명단에서 빠진 분을 호스트로 앉히는 길을 아예 없앤다 (R17-2). 비활성 버튼으로 남기지 않는 이유는
     푸터가 이미 [한 판 더]로 다음 행동을 주고 있어서다 — 못 누르는 버튼을 하나 더 보여줄 이유가 없다.
     same(당첨자가 이미 호스트)인 경우는 막지 않는다. 그 버튼은 [확인]이라 서버에 쓰는 것이 없고
     '그대로 섬깁니다'도 여전히 사실이다 — 막으면 현상 유지를 받아들일 길만 사라진다. */
  const blocked = gone && !same;
  /* 연습(dry-run)이면 확정 버튼 자체를 안 만든다. 비활성 버튼으로 두지 않는 이유는 위 blocked 와
     같다 — 못 누르는 버튼은 '내가 뭘 잘못했나'를 묻게 만든다. 대신 왜 없는지를 한 줄로 적는다.
     결과·이름·[한 판 더]는 그대로다: 연습이라고 게임을 반쪽으로 만들지는 않는다. */
  const dry = !gameCanCommit();
  const dryNote = dry ? `<div class="game-hint" style="margin-bottom:6px">연습으로 돌려본 판이에요 — 확정은 섬기기로 하신 분이 합니다</div>` : "";
  setGameFoot(`${dryNote}${(blocked||dry)?"":`<button class="btn btn-brand" id="gvOk">${okLabel}</button>`}
    <div class="row-2"><button class="btn btn-soft" id="gvAgain">🎲 한 판 더</button>
      <button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button></div>`);
  bind("gvOk", async()=>{
    // 호스트가 이미 당첨자면 서버에 쓸 것이 없다 — 잠글 이유도 없으므로 두 갈래를 구분해 둔다.
    // 위에서 잡아둔 same 이 아니라 눌린 시점의 SESSION 을 다시 읽는다 (R17-3). 결과 화면이 떠 있는
    // 동안 폴링이 호스트를 갈아끼울 수 있고, 낡은 same 으로 갈리면 남이 이어받은 섬김을 두고
    // '그대로 섬깁니다'라고 말하거나(true→false), 이미 호스트인 분을 다시 인계한다(false→true).
    if(SESSION.hostId===w.id){ closeGame(); toast(hon(w.name)+"이 그대로 섬깁니다 🙏"); return; }
    // guardWrite 는 busyWrite 가 이미 true 면 fn 을 아예 부르지 않는다. 그 상태에서 잠그면
    // 되돌릴 계기가 없는 disabled 로 남을 수 있으니, 잠그기 전에 확인해서 그때는 손대지 않는다.
    if(busyWrite) return;
    const b=document.getElementById("gvOk");
    // await 앞에서 동기로 잠근다 — 재진입 차단은 guardWrite 가 하고 여기서는 시각 상태만 얹는다(R18-1).
    if(b){ b.disabled=true; b.textContent="확정하는 중…"; }
    try{ await commitGameWinner(w); }
    finally{
      // 성공 경로에서는 closeGame() 이 오버레이를 비웠으므로 이 버튼은 이미 DOM 에 없다.
      // 되돌리기가 의미 있는 건 오버레이가 남아 있는 실패 경로뿐이라 contains 로 확인한다.
      if(b && document.body.contains(b)){ b.disabled=false; b.textContent=okLabel; }
    }
  });
  bind("gvAgain",()=>{ track("game_replayed",{ kind: GS && GS.kind }); clearGameTimers(); if(GS && GS.teardown){ try{ GS.teardown(); }catch(e){} GS.teardown=null; } startGame(GS && GS.kind); });
  bind("gvCancel",()=>closeGame());   // closeGame(opts) — 이벤트 객체를 opts 로 흘려보내지 않는다
  // 인원이 많거나 화면이 짧으면 발표가 접힌 아래에 생긴다 — 끝까지 내려서 보여준다.
  // 버튼이 다 들어간 뒤라야 푸터 높이가 확정되므로 반드시 setGameFoot 다음, 레이아웃 한 프레임 뒤에 잰다.
  // (확정이 막힌 경우엔 두 개다 — 높이가 달라지므로 여기서 재는 순서가 더 중요해진다.)
  requestAnimationFrame(()=>{ const bd=document.getElementById("gvBody"); if(!bd || bd.scrollHeight<=bd.clientHeight) return;
    try{ bd.scrollTo({top:bd.scrollHeight, behavior:lessMotion()?"auto":"smooth"}); }catch(e){ bd.scrollTop=bd.scrollHeight; } });
}

/* 확정 = 여기서 처음으로 서버에 쓴다. 호스트가 이미 있으면 비운 뒤(unclaim) 당첨자가 이어받는다(claim).
   unclaim 은 주문이 0건이면 섬김 자체를 지우고, 그러면 claim 이 새 seq 로 섬김을 다시 만든다 —
   'N번째 섬김'이 사라지고 번호가 튀는 사고다. 이 방어는 예전엔 진입점 조건
   (Object.keys(ORDERS).length>0)에 있었는데, 그 자리로는 두 경우를 못 막는다:
     ① 시트가 열려 있는 동안 마지막 주문이 취소되는 경우 — 화면 조건은 이미 통과했다.
     ② [전원 참가](gameAllOn)로 GS.on 을 채우면 rosterFrom 이 주문과 무관하게 참가로 세므로
        '참가자 2명 + 주문 0건'이 성립하는 경우.
   그래서 쓰기 바로 앞으로 옮겼다. 인계가 필요 없는 경우(prevHost 없음)엔 unclaim 을 부르지
   않으므로 조건도 걸지 않는다 — 호스트 없는 빈 섬김을 게임으로 가져가는 건 안전하다 (R16-5). */
async function commitGameWinner(w){
  track("host_committed", { kind: (GS && GS.kind) || null, winner_is_me: !!(w && w.id === ME) });
  await guardWrite(async()=>{
    /* SESSION 을 함수 진입 시점이 아니라 쓰기 직전에 읽는다 (R17-3). 게임은 몇십 초를 도는 동안
       폴링이 SESSION 을 계속 갈아끼우므로, 미리 잡아둔 prevHost 로 판단하면 두 가지가 어긋난다 —
       그사이 남이 이어받았는데도 '호스트 없음'으로 보고 unclaim 을 건너뛰거나, 반대로 이미 비워진
       섬김을 또 비운다. 0건 가드도 같은 값을 봐야 하므로 한 번 읽어 둘이 함께 쓴다.
       읽는 자리를 guardWrite 안으로 옮긴 것도 같은 이유다 — 지금은 이 앞에 await 가 없어 값이
       같지만, 나중에 확인창 같은 await 가 앞에 끼면 밖에서 읽은 값이 곧 낡은 값이 된다. */
    const seq=SESSION.seq, prevHost=SESSION.hostId, cafeId=SESSION.cafeId||activeCafeId();
    /* 권한을 쓰기 직전에 한 번 더 본다. 화면은 연습이면 [확정하기]를 아예 안 만들지만, 결과가
       떠 있는 동안 폴링이 호스트를 갈아끼울 수 있다 — 눌렀을 땐 내 권한이었는데 쓰기 직전엔
       남의 섬김인 경우가 그것이다. 그때 그대로 쓰면 남의 결정을 가로챈다. */
    if(prevHost && prevHost!==ME){
      toast("그 사이 다른 분이 섬기기로 하셨어요 — 이 결과는 확정할 수 없어요");
      return;
    }
    if(prevHost && !Object.keys(ORDERS).length){
      toast("아직 주문이 없어서 지금 넘기면 이 섬김이 사라져요 — 주문이 모인 뒤에 확정해주세요");
      return;   // 오버레이는 그대로 둔다 — [한 판 더]나 닫기를 사용자가 고르게 한다
    }
    toast("확정하는 중…");
    try{
      if(prevHost) await Sync.unclaim(seq);
      const ok=await Sync.claim(w.id, cafeId);
      /* claim 은 'host_id is null' 일 때만 성공하므로 false = 그 찰나에 남이 먼저 이어받았다는 뜻이다.
         이 경우엔 오버레이를 닫지 않는다 (R17-4). 닫으면 우리가 시도한 결과가 화면에서 사라지고
         [한 판 더]도 함께 없어져, 다시 돌리려면 시트를 처음부터 다시 열어야 한다 — 복구 가능해야
         한다는 요구와 반대다. 성공 경로만 닫고, 실패 경로는 결과 화면을 남긴 채 사유를 알린다.
         render() 는 실패 경로에서도 부른다 — 아래 화면이 새 호스트를 반영해야 하고, 오버레이는
         #app 밖에 있어 재렌더에 닫히지 않는다 (R17-5). */
      if(!ok){
        toast("앗, 방금 다른 분이 먼저 이어받으셨어요 — [한 판 더]로 다시 돌려보세요");
        render();
        return;
      }
      closeGame(); viewSeq=null;   // 게임이 쥔 히스토리 항목을 여기서 소비한다
      toast(w.id===ME ? "🎲 제가 섬기게 됐어요 — 메뉴는 지금도 바꿀 수 있어요"
                      : "🎲 "+hon(w.name)+"이 오늘의 섬김을 맡았어요");
      // 게임을 연 자리에 그대로 둔다(R12-4). 단 당첨자 본인은 메뉴를 다시 고를 수 있어야 하므로
      // 합친 화면(기본 탭 order)으로 보낸다 — 사는 줄 모르고 고른 메뉴를 바꿀 기회를 주는 게
      // 이 흐름의 예의다.
      // setOpenTab 을 쓰지 않는 이유가 둘이다: openTab 이 이미 "order"(합친 화면에서 게임을 열었을 때)면
      // 즉시 return 해서 forceGrid 가 화면에 반영되지 않고, 다른 탭이면 history.back() 이라는 부수효과가
      // 방금 closeGame() 이 맞춰둔 히스토리 장부와 부딪힌다. 그래서 직접 대입한다.
      if(w.id===ME){          // 여기까지 왔으면 성공 경로다 — 실패는 위에서 이미 return 했다
        clearSubEntry();      // 내 주문 탭으로 넘어가므로 탭·시트가 쥔 1칸도 함께 정리한다 (7.3)
        forceGrid=true;
        openTab="order";
      }
      render();   // 분기 '뒤'에 딱 한 번. 먼저 부르면 forceGrid 가 반영될 기회가 없다 (R12-1)
    }catch(e){ console.error(e); closeGame(); toast("확정 실패 — 네트워크 확인 후 다시 시도해주세요"); render(); }
  });
}

/* ---------- 🪜 사다리타기 ---------- */
function playLadder(roster, winner){
  const n=roster.length, W=340, PAD=24, LABEL_Y=15, Y0=28, RUN=300;
  const LEV=ladderGeometry(n).LEV, STEP=RUN/LEV, Y1=Y0+RUN, BOX_Y=Y1+9, BOX_H=26, H=BOX_Y+BOX_H+6;
  const colX=i=> PAD + i*(W-2*PAD)/(n-1);
  // 세로줄 간격보다 이름이 넓으면 위쪽 이름이 서로 겹쳐 못 읽는다 → 인원에 맞춰 글자수·크기를 줄인다.
  // 짧게 잘려도 전체 이름은 결과 발표와 <title> 에 그대로 나온다.
  /* 미측정 (R13-5): 이 값들은 SVG 사용자 단위다. viewBox 340 을 .game-stage(max-width
     min(400px,50vh))에 맞추므로 320px 화면에서 배율이 0.84 이고, n=10 의 NFS 8.5u 는
     CSS 7.1px 로 렌더된다(375px 화면에서 8.3px). 번호로 바뀌는 시점이 n>10 이라 n=10 이
     최악이면서 두 글자 한글을 그 크기로 그린다.
     크기를 올리면 GAP·BOX_W 와 겹치므로 단독으로 못 바꾼다 — 실기기에서 판독 여부를 잰 뒤,
     안 읽히면 크기가 아니라 GAME_LABEL_MAX 를 9 로 내려 번호+범례 경로로 보내는 게 맞다. */
  const GAP=(W-2*PAD)/(n-1), NCH= n<=7?4 : n<=9?3 : 2, NFS= n<=7?11 : n<=9?10 : 8.5;
  const BOX_W=Math.min(30, GAP*0.82);
  // 11명부터는 라벨을 번호로 바꾼다. 이름 축소는 2글자·8.5px 에서 멈추므로 그 아래로는 겹칠 뿐이고,
  // 2글자로 자른 이름은 어차피 못 읽는다. 번호는 아래 범례가 이름과 이어준다 (R10-1, R10-2).
  // 숫자는 한글보다 좁아서 두 자리가 10px 로도 ≈11px — 세로줄 간격이 가장 좁은 16명(19.5px)에도
  // 들어간다. NFS(8.5px)까지 줄일 이유가 없으므로 읽기 쉬운 쪽을 고른다.
  const NUMS = n > GAME_LABEL_MAX, LFS = NUMS ? 10 : NFS;
  // 도착 상자 안 기호 크기. 상자 폭에 비례로 묶어야 16명(BOX_W≈15.96)에서 ☕ 가 상자를 넘지
  // 않는다 (R4-7, R10-3). ☕ 는 이모지라 마침표보다 넓고 폰트에 따라 1em 을 살짝 넘기도 하는데,
  // 0.62em 이면 넘쳐도 상자 폭의 ~75% 라서 테두리 안에 남는다. 14px 상한은 2~12명에서 지금과
  // 같은 크기를 유지하기 위한 것이다.
  const BFS = Math.min(14, BOX_W*0.62);
  // 기호를 상자 정중앙에 놓는 베이스라인. 글자 크기가 인원에 따라 변하므로 상수 18 을 쓰면
  // 작은 상자에서 글자가 아래로 처진다. 중심(BOX_Y+BOX_H/2)에서 대문자 높이 절반(≈0.36em)만큼
  // 내린다 — BFS=14 에서 BOX_Y+18.0 으로 기존 값과 같다.
  const BTY = BOX_Y + BOX_H/2 + BFS*0.36;
  const rowY=l=> Y0 + (l+0.5)*STEP;
  // 가로줄 놓기(인접 금지 · 모든 세로줄에 최소 하나)는 ladderRungs 가 한다.
  // 여기서 더 보는 것은 하나뿐이다 — 아무도 자리를 안 바꾸는(제자리) 사다리는 그림이 밋밋해서
  // 다시 만든다. "가로줄 총수 ≥ n" 은 뺐다. 커버리지 보장이 그보다 강한 조건이라 겹친다.
  const trace=(rungs,start)=>{ let col=start; const pts=[[colX(col),Y0-6]];
    for(let l=0;l<LEV;l++){ const row=rungs[l];
      const to = row.indexOf(col)>=0 ? col+1 : (row.indexOf(col-1)>=0 ? col-1 : null);
      if(to!==null){ pts.push([colX(col),rowY(l)]); pts.push([colX(to),rowY(l)]); col=to; } }
    pts.push([colX(col),BOX_Y-2]); return {pts,end:col}; };
  let rungs=null, paths=[];
  for(let t=0;t<60;t++){
    const r=ladderRungs(n, LEV, Math.random);
    if(!r) continue;
    rungs=r;
    paths=roster.map((m,i)=>trace(rungs,i));
    if(paths.some((p,i)=>p.end!==i)) break;
  }
  // ladderRungs 가 예순 번 내리 포기할 자리는 사실상 없지만(커버리지 단계에서 놓을 자리가 없어지는
  // 조합이 성립하지 않는다), 없다고 단정하면 아래 전부가 null 을 읽는다. 밋밋한 사다리가 낫다.
  if(!rungs){ rungs=Array.from({length:LEV},()=>[]); paths=roster.map((m,i)=>trace(rungs,i)); }
  const wi=roster.indexOf(winner), goal=paths[wi].end;   // ☕ 는 당첨자가 도착하는 칸에 놓는다
  // 같은 가로줄을 두 사람이 지날 때 색이 덮이지 않도록 사람마다 아주 조금 어긋나게 그린다
  const dOf=(pts,i)=>{ const off=(i-(n-1)/2)*0.8;
    return pts.map((p,k)=>(k?"L":"M")+p[0].toFixed(1)+" "+(p[1]+off).toFixed(1)).join(" "); };
  // 색은 gcolor(i, n) 으로 뽑는다. n 을 안 넘기면 11명째부터 0번과 색이 겹쳐 두 사람의
  // 경로선을 구분할 수 없다 (R9-1·R9-3). n 은 이 판을 그릴 때 쓴 roster.length 그대로 —
  // 그리는 중에 명단이 바뀌어도 라벨 색과 경로 색이 어긋나지 않는다.
  // 도착 상자(.lbox)는 첫 프레임부터 확정된 모습으로 그린다 — goal 칸은 강조 배경·굵은 테두리에
  // ☕, 나머지는 중립 배경에 · 만 둔다. ? 로 시작해 뒤늦게 하나씩 여는 연출을 없앴다
  // (R4-1·R4-2·R4-5·R4-8). 왼쪽부터 열리던 예전 연출은 소거법으로 답이 새기도 했다.
  // 긴장은 선이 2.4초 동안 위에서 아래로 내려오는 데서 나온다.

  openGameOv("🪜 사다리타기", `
    <div class="game-say" id="gvSay" aria-live="polite">준비됐어요 — 내 이름을 찾아두세요</div>
    <div class="game-stage"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="사다리타기 진행 중">
      ${roster.map((m,i)=>`<text x="${colX(i)}" y="${LABEL_Y}" text-anchor="middle" font-size="${LFS}" font-weight="800" fill="${gcolor(i, n)}"><title>${esc(m.name)}</title>${NUMS ? (i+1) : esc(shortName(m.name,NCH))}</text>`).join("")}
      ${roster.map((m,i)=>`<line x1="${colX(i)}" y1="${Y0}" x2="${colX(i)}" y2="${Y1}" stroke="#e7ddcf" stroke-width="3" stroke-linecap="round"/>`).join("")}
      ${rungs.map((row,l)=>row.map(i=>`<line x1="${colX(i)}" y1="${rowY(l)}" x2="${colX(i+1)}" y2="${rowY(l)}" stroke="#e7ddcf" stroke-width="3" stroke-linecap="round"/>`).join("")).join("")}
      ${roster.map((m,i)=>`<path class="lpath" d="${dOf(paths[i].pts,i)}" fill="none" stroke="${gcolor(i, n)}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`).join("")}
      ${roster.map((m,i)=>{ const hit = i===goal;
        return `<g class="lbox" data-c="${i}"><rect x="${(colX(i)-BOX_W/2).toFixed(1)}" y="${BOX_Y}" width="${BOX_W.toFixed(1)}" height="${BOX_H}" rx="9" fill="${hit?"#fbe9e3":"#f6f1ea"}" stroke="${hit?"#c2552f":"#e7ddcf"}" stroke-width="${hit?2:1.5}"/>
        <text x="${colX(i)}" y="${BTY.toFixed(1)}" text-anchor="middle" font-size="${BFS.toFixed(1)}" font-weight="800" fill="${hit?"#a8401f":"#b6a99a"}">${hit?"☕":"·"}</text></g>`; }).join("")}
    </svg></div>
    ${gameLegendHtml(roster, n)}
    <div id="gvWin" role="status"></div>`);
  /* 푸터가 두 단계다 — 구슬 레이스의 출발 게이트와 같은 이유다. 열자마자 선이 내려가면 세로줄
     위의 자기 이름을 찾기도 전에 여섯 줄이 동시에 움직여, 누구를 보고 있었는지 놓친다.
     멈춰 있는 동안 내 이름을 찾아 두면 그 뒤로는 한 줄만 눈으로 따라가면 된다. */
  setGameFoot(`<div class="row-2"><button class="btn btn-brand" id="gvGo">▶ 시작!</button>
    <button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button></div>`);
  bind("gvCancel",()=>closeGame());   // closeGame(opts) — 이벤트 객체를 opts 로 흘려보내지 않는다

  // 4800ms — 예전 2400 의 절반 속도다. 2.4초는 선 여섯 줄이 동시에 내려오는 걸 눈으로 좇기엔
  // 빨라서 "누가 어디로 갔는지"가 안 보였다. 돌림판(4.4초)과도 대역이 맞는다.
  const DUR = lessMotion() ? 10 : 4800;
  // 선이 위에서 아래로 그려지는 애니메이션. 두 가지를 지켜야 실제로 움직인다:
  //   ① 길이에 단위를 붙인다 — CSS 의 stroke-dashoffset 은 <length> 라 단위 없는 숫자는 0 으로 떨어진다.
  //   ② 시작값을 브라우저가 한 번 반영한 뒤에 끝값을 준다 — 안 그러면 두 값이 같은 스타일 재계산에
  //      묶여 보간할 구간이 없고 그냥 완성된 채로 나타난다(rAF 한 번으로는 부족하다).
  const els=[...$gv().querySelectorAll(".lpath")];
  /* 사람마다 배속을 0.9~1.3 배로 흩는다. 다 같은 속도로 내려오면 여섯 줄이 한 덩어리로 움직여
     누구를 보고 있었는지 놓친다 — 조금만 어긋나도 눈이 한 줄을 따라갈 수 있다.
     결과에는 영향이 없다: 당첨자는 사다리 구조가 정한 goal 이고, 배속은 그와 무관한 난수다.
     길이(=시간)는 배속의 역수라 0.77~1.11 배가 되므로, 발표는 '가장 느린 선'을 기준으로 한다. */
  const spd = els.map(()=> 0.9 + Math.random()*0.4);
  const durs = spd.map(s=> DUR/s);
  const LAST = Math.max(...durs);
  const lens = els.map(p=> p.getTotalLength());
  els.forEach((p,i)=>{
    p.style.transition="none";
    p.style.strokeDasharray=lens[i]+"px"; p.style.strokeDashoffset=lens[i]+"px"; });
  /* 최전선 표식 — 선 끝에 그 사람의 동그라미가 따라 내려간다 (사용자 요청).
     반지름은 세로줄 간격에 묶는다. 16명(GAP 19.5)에서 고정 반지름을 쓰면 이웃 표식이 서로를
     덮어 누가 누군지 못 읽는다. 이름은 표식이 충분히 클 때만 넣는다 — 작은 원에 글자를 밀어
     넣으면 원도 글자도 안 읽힌다. 그때는 색 동그라미만으로 '어디까지 왔는지'를 말한다. */
  const MR = Math.min(12, GAP*0.45), MFS = MR*0.9;
  const mkLabel = MR >= 9;
  const marks = els.map((p,i)=>{
    const g=document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","lmk");
    g.innerHTML = `<circle r="${MR.toFixed(1)}" fill="${gcolor(i, n)}" stroke="#fff" stroke-width="2"/>`
      + (mkLabel ? `<text text-anchor="middle" y="${(MFS*0.35).toFixed(1)}" font-size="${MFS.toFixed(1)}" font-weight="800" fill="#fff">${NUMS ? (i+1) : esc(shortName(roster[i].name,2))}</text>` : "");
    p.parentNode.appendChild(g);   // 경로보다 뒤에 넣어야 선 위에 얹힌다
    return g;
  });
  const place=(g,pt)=> g.setAttribute("transform","translate("+pt.x.toFixed(1)+" "+pt.y.toFixed(1)+")");
  els.forEach((p,i)=> place(marks[i], p.getPointAtLength(0)));

  /* [▶ 시작!] 을 누른 뒤에 굴린다. 여기서 리플로우를 한 번 내는 것이 여전히 요점이다 —
     시작값과 끝값이 같은 스타일 재계산에 묶이면 보간할 구간이 없어 선이 완성된 채로 나타난다. */
  let started=false;
  const startRun=()=>{
    if(started) return;
    started=true;
    setGameSay("한 폰을 다 같이 보세요 — 내려갑니다…");
    setGameFoot(`<button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button>`);
    bind("gvCancel",()=>closeGame());
    void $gv().offsetHeight;   // 시작값 커밋(리플로우 1회)
    els.forEach((p,i)=>{ p.style.transition="stroke-dashoffset "+durs[i].toFixed(0)+"ms cubic-bezier(.45,.05,.25,1)";
                         p.style.strokeDashoffset="0px"; });
    mraf=requestAnimationFrame(follow);
    // 선이 다 내려오면 곧바로 발표한다. 상자는 이미 다 보이므로 열어 보일 것이 없다 (R4-5).
    // 120ms 는 마지막 선의 끝점이 상자에 닿은 걸 눈이 확인할 여유다.
    gtimer(()=>showGameResult(winner), LAST+120);
  };
  /* 표식은 애니메이션의 '현재 값'을 읽어서 따라간다 — 같은 이징을 두 군데 적어 두면 언젠가
     어긋나므로, 진짜 값 하나(strokeDashoffset)를 출처로 삼는다. lessMotion 이면 전역 규칙이
     전환을 꺼서 첫 프레임에 이미 0 이라 표식도 곧장 끝점에 선다. */
  let mraf=0;
  const follow=()=>{
    mraf=0;
    if(!els[0] || !els[0].isConnected) return;
    let moving=false;
    els.forEach((p,i)=>{
      const off=parseFloat(getComputedStyle(p).strokeDashoffset)||0;
      const at=Math.max(0, Math.min(lens[i], lens[i]-off));
      place(marks[i], p.getPointAtLength(at));
      if(off > 0.5) moving=true;
    });
    if(moving) mraf=requestAnimationFrame(follow);
  };
  /* 끊는 장치를 따로 두지 않는다. 루프가 스스로 멈추는 조건이 둘이라 새는 경로가 없다 —
     ① 선이 다 내려오면(off<=0.5) 더 예약하지 않는다 ② [한 판 더]나 다른 게임이 오버레이
     마크업을 갈아치우면 isConnected 가 false 가 된다. GS.teardown 을 가로채는 방식은
     손가락 룰렛이 이미 쓰고 있어서, 여기서 또 감싸면 두 게임이 서로의 정리를 덮어쓴다. */
  // 배선은 follow 를 선언한 뒤에 건다 — startRun 이 그것을 부르므로 순서를 눈에 보이게 둔다.
  bind("gvGo", startRun);
}

/* ---------- 🎡 돌림판 ---------- */
function playWheel(roster, weights){
  const n=roster.length, R=100;
  const slices=wheelSlices(weights && weights.length===n ? weights : roster.map(()=>1));
  /* 판을 실제로 돌린다. 초기 각속도만 무작위고, 마찰과 압정이 세운다 — 멈춘 자리가 곧 결과다.
     물리를 먼저 끝까지 돌려 각도를 기록해 두고 화면은 그것을 재생한다(구슬 레이스와 같은 구조).
     이렇게 해야 [그만 돌리기]로 건너뛰거나 느린 기기에서 프레임을 흘려도 멈추는 자리가 같다. */
  const sim=wheelSimulate(Math.random);

  // 조각 색은 gcolor(i, n). n 을 안 넘기면 11명째에 0번과 같은 색이 되고, 그 둘은 바로
  // 옆 조각이라 흰 구분선만 남아 경계가 사실상 사라진다 (R9-1·R9-2).
  const sectors=roster.map((m,i)=>{
    const sl=slices[i];
    const s=(sl.start-90)*Math.PI/180, e=(sl.end-90)*Math.PI/180, big=sl.deg>180?1:0;
    return `<path d="M0 0 L ${(R*Math.cos(s)).toFixed(2)} ${(R*Math.sin(s)).toFixed(2)} A ${R} ${R} 0 ${big} 1 ${(R*Math.cos(e)).toFixed(2)} ${(R*Math.sin(e)).toFixed(2)} Z" fill="${gcolor(i, n)}" stroke="#fff" stroke-width="1.2"/>`;
  }).join("");
  // 이름은 판과 같이 돌면 멈췄을 때 거꾸로 선다. 판이 도는 만큼 글자를 제자리에서 되돌려 놔
  // 멈춘 순간 항상 똑바로 읽히게 한다(폰에서는 가로로 놓인 2~4글자가 제일 잘 읽힌다).
  // 되돌림은 마크업에 박지 않고 paint() 가 매 프레임 넣는다 — 상수로 박아 두면 출발 화면의
  // 기울기가 곧 당첨 조각의 각도가 되어 산수로 답이 샌다 (R6). 여기서는 rotate(0), 즉
  // transform 을 아예 안 건 상태로 그린다.
  // ⚠️ .wlab 에 CSS transform 규칙을 두면 이 되돌림이 통째로 죽는다(CSS 가 presentation
  //    attribute 를 이긴다). 근거는 스타일시트의 '돌림판' 주석에 있다 — QA F-1.
  // 11명부터는 조각 라벨도 번호만 넣는다 — 조각 각도가 15°(24명)까지 좁아지면 2글자 이름조차
  // 이웃 조각으로 넘어간다. 역회전은 번호에도 그대로 걸어야 멈춘 순간 똑바로 선다 (R14-4, R6-4).
  // 글자 크기는 기존 식(n>8?11:13)을 건드리지 않는다. 번호 경로는 항상 n>10 이라 그 식이 이미
  // 11px 을 주고, 두 자리 숫자가 ≈12px 이라 24명의 라벨 간격(반지름 62 · 15° ≈ 16px)에 들어간다.
  // 더 줄일 이유가 없으니 줄이지 않는다.
  const NUMS = n > GAME_LABEL_MAX;
  /* 좁은 조각의 이름은 바깥으로 밀어낸다. 호의 길이가 r·θ 라 반지름을 키우면 같은 각도에서도
     글자가 들어갈 자리가 넓어진다 — 확률을 낮춘 분의 조각이 제일 좁으니 이 손질이 필요하다. */
  const labels=roster.map((m,i)=>{ const sl=slices[i];
    const t=((sl.start+sl.end)/2-90)*Math.PI/180, lr=R*(sl.deg<14 ? 0.80 : 0.62);
    const x=lr*Math.cos(t), y=lr*Math.sin(t);
    // font-size 는 SVG 사용자 단위다 — viewBox 216 을 .wheel-wrap(max-width min(320px,50vh))에
    // 맞추므로 배율이 1.31~1.48 이고 화면에서는 CSS 14.5~19.3px 로 렌더된다. 이 파일에서 가장
    // 큰 본문급 글자이며, 값 자체는 위 폭 예산에 묶여 있어 바꾸지 않는다 (R13-23).
    // transform 을 아예 안 건다 = rotate(0) = 똑바로. 역회전은 매 프레임 판의 각도에서 계산해
    // 넣으므로 정지 화면에는 어떤 각도도 박혀 있지 않다 — 시작 화면이 답을 말하지 않는다 (R6).
    return `<text class="wlab" x="${x.toFixed(2)}" y="${(y+4).toFixed(2)}" data-cx="${x.toFixed(2)}" data-cy="${y.toFixed(2)}" text-anchor="middle" font-size="${n>8?11:13}" font-weight="800" fill="#fff">${NUMS ? (i+1) : esc(shortName(m.name,4))}</text>`;
  }).join("");
  /* 테두리 압정. 각도는 조각과 무관하게 균등하다 — 조각 경계에 맞추면 압정이 조각을 세는
     눈금처럼 보여, 좁은 조각이 '압정 하나짜리'로 읽힌다. 확률은 각도지 압정 개수가 아니다. */
  const pegs=Array.from({length:WHEEL_PEGS},(_,k)=>{
    const t=(k*360/WHEEL_PEGS-90)*Math.PI/180, pr=R*0.955;
    return `<circle cx="${(pr*Math.cos(t)).toFixed(2)}" cy="${(pr*Math.sin(t)).toFixed(2)}" r="2.6" fill="#fffdf9" stroke="#6f6253" stroke-width="1"/>`;
  }).join("");
  openGameOv("🎡 돌림판", `
    <div class="game-say" id="gvSay" aria-live="polite">준비됐어요 — 내 이름을 찾아두세요</div>
    <div class="wheel-wrap"><div class="wheel-pin" id="wPin">🔻</div>
      <div id="wRot" style="transform:rotate(0deg)"><svg viewBox="-108 -108 216 216" role="img" aria-label="돌림판 회전 중">
        ${sectors}${labels}${pegs}<circle cx="0" cy="0" r="13" fill="#fff" stroke="#e7ddcf" stroke-width="2"/></svg></div></div>
    ${gameLegendHtml(roster, n)}
    <div id="gvWin" role="status"></div>`);
  /* 푸터가 두 단계다 — 사다리·구슬 레이스와 같은 출발 게이트다 (QA X-1).
     열자마자 돌면 자기 조각을 찾기도 전에 판이 흐려져, 멈춘 뒤 발표 텍스트를 읽기 전까지
     아무것도 따라갈 수 없다. 조각이 24명에서 15°까지 좁아지는 이 게임이 셋 중 그 이유가 가장
     강한데 혼자 게이트가 없었다. 멈춰 있는 동안 이름을 찾아 두면 그 뒤로는 그 조각만 좇으면 된다.
     [⏹ 그만 돌리기] — 기다리기 싫을 때 회전을 끊는다. 이름을 '여기서 멈추기'로 하지 않은 이유가
     있다. 누른 순간의 각도는 출발점일 뿐이고, 거기서 감속하며 더 도는 양(5~23 바퀴)이 얹혀야
     최종 각도가 나온다. 그 양은 판이 시작할 때 이미 뽑혀 있지만 아무 데도 안 보이므로,
     누르는 순간을 완벽히 맞춰도 결과를 고를 수 없다 — 반응 속도 시합이 되지 않는 이유다. */
  const runFoot = ()=>{
    setGameFoot(`<div class="row-2"><button class="btn btn-soft" id="gvStop">⏹ 그만 돌리기</button>
      <button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button></div>`);
    bind("gvStop", stopSpin);
    bind("gvCancel",()=>closeGame());
  };
  /* 자동 갈래의 푸터. [그만 돌리기]를 자리만 남기고 비활성으로 두지 않는다 — 누를 수 없는 버튼이
     같은 자리에 서 있으면 "왜 안 눌리지"가 되고, 자동은 애초에 손댈 것이 없는 갈래다.
     대신 [그만두기]만 남긴다. row-2 안에 혼자 두면 반쪽 폭이 되므로 밖으로 뺀다. */
  const autoFoot = ()=>{
    setGameFoot(`<button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button>`);
    bind("gvCancel",()=>closeGame());
  };
  /* 출발 게이트가 두 단계다. [▶ 돌리기!] 는 이제 "돈다"가 아니라 "어떻게 세울래"를 묻는다 —
     같은 판인데 사람마다 원하는 게 갈렸다: 여럿이 둘러보는 자리에서는 손으로 끊는 맛이 있고,
     혼자 빨리 정할 때는 그 버튼이 일거리다. 물리는 한 벌이라 어느 갈래든 결과의 성질은 같다.
     기본(진한 버튼)은 자동이다 — 아무 생각 없이 진행하려는 사람이 다수고, 자동 쪽이 더 적은
     손으로 끝난다. 수동을 고르면 예전 그대로 [⏹ 그만 돌리기] 가 나온다. */
  const askFoot = ()=>{
    /* 안내를 여기 한 줄로 적는다. 이 게임의 핵심 약속은 "누구도 결과를 고를 수 없다"인데,
       갈래를 묻는 순간이 그 약속이 흔들려 보이는 유일한 자리다 — 손으로 끊는 쪽을 고르면
       타이밍으로 조작할 수 있다고 읽히기 때문이다. 버튼 라벨에는 못 적으니 이 줄에 적는다. */
    setGameSay("어떻게 세울까요? — 어느 쪽이든 결과는 못 고릅니다");
    setGameFoot(`<div class="row-2"><button class="btn btn-soft" id="gvManual">✋ 내가 멈추기</button>
      <button class="btn btn-brand" id="gvAuto">🤖 알아서 멈추기</button></div>
      <div style="height:8px"></div><button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button>`);
    bind("gvManual", ()=>startSpin("manual"));
    bind("gvAuto",   ()=>startSpin("auto"));
    bind("gvCancel", ()=>closeGame());
  };
  setGameFoot(`<div class="row-2"><button class="btn btn-brand" id="gvGo">▶ 돌리기!</button>
    <button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button></div>`);
  bind("gvCancel",()=>closeGame());   // closeGame(opts) — 이벤트 객체를 opts 로 흘려보내지 않는다

  const rot=document.getElementById("wRot"), pin=document.getElementById("wPin");
  const labs=[...(rot?rot.querySelectorAll(".wlab"):[])];
  /* 두 구간이다. 누르기 전에는 등속으로 계속 돈다 — 그동안은 결과가 존재하지 않는다.
     [그만 돌리기]를 누른 순간의 각도에 감속 기록을 이어 붙이면 그게 최종 각도다.
     감속 구간을 CSS 트랜지션이 아니라 기록 재생으로 두는 이유는, 트랜지션이 '목표 각도'를
     먼저 알아야 하는 물건이라서다 — 매 프레임 각도가 물리에서 나오는 지금은 넘길 목표가 없다.
     이름은 판과 같이 돌면 거꾸로 선다. 되돌림을 매 프레임 계산하므로 정지 화면에는 어떤
     각도도 박혀 있지 않다 (R6). */
  const pegA = 360/WHEEL_PEGS;
  let spinning = true, base = 0, wf = 0, done = false, t0 = 0;
  let winner = null;

  function paint(deg, tick){
    rot.style.transform = "rotate(" + deg.toFixed(2) + "deg)";
    labs.forEach(el=> el.setAttribute("transform", "rotate(" + (-deg).toFixed(2) + " " + el.dataset.cx + " " + el.dataset.cy + ")"));
    /* 압정 딸깍임 — 압정 사이 어디쯤인지로 핀을 기울인다. 빠를 때는 떨고 느려지면 잦아들어
       저항이 눈에 보인다. CSS 가 translateX(-50%) 로 가운데를 잡고 있으니 덮어쓰지 않는다. */
    if(pin){
      const frac = ((deg/pegA) % 1 + 1) % 1;
      const amp = Math.min(1, tick/2);
      pin.style.transform = "translateX(-50%) rotate(" + (Math.sin(frac*6.283)*14*amp).toFixed(1) + "deg)";
    }
  }
  function settle(){
    const deg = base + sim.angles[sim.frames-1];
    paint(deg, 0);
    if(pin) pin.style.transform = "translateX(-50%) rotate(0deg)";
    // 핀은 12시 고정이고 판이 deg 만큼 돌았으므로, 핀 아래에 온 판의 각도는 -deg 다.
    winner = roster[wheelWinner(slices, ((-deg % 360) + 360) % 360)];
    setGameSay("멈췄어요!");
    gtimer(()=>showGameResult(winner), 300);
  }
  function step(now){
    if(done) return;
    if(!rot.isConnected){ done = true; return; }   // 오버레이가 닫힌 뒤 예약된 프레임 방어
    if(spinning){
      if(!t0) t0 = now;
      base = sim.w0 * (now - t0) / 1000;           // 등속 — 결과는 아직 없다
      paint(base, 2);
    } else {
      paint(base + sim.angles[wf], sim.ticks[wf]);
      if(++wf >= sim.frames){ done = true; settle(); return; }
    }
    if(GS) GS.raf = requestAnimationFrame(step);
