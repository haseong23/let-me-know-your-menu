<style>
  :root {
    --bg: #f6f1ea; --card: #ffffff; --ink: #2b2118; --sub: #6f6253; --line: #e7ddcf;
    --brand: #6f4e37; --brand-soft: #efe6da; --accent: #c98a3a; --green: #3f9d6b;
    --red: #c2552f; --gray: #b6a99a; --radius: 16px; --shadow: 0 6px 20px rgba(80,55,30,.08);
    /* --accent(#c98a3a)는 흰 배경 대비 2.92:1 이라 글자에 못 쓴다. 칠(배지·점)에만 쓰고 글자는 --accent-ink.
       --gray(2.05:1)도 글자 금지 — 보조문구는 --sub(5.27:1). */
    --accent-ink: #96631f;
    /* 차트 마크 전용. --brand 는 채도 0.057 이라 데이터 막대로 쓰면 회색으로 읽힌다(UI 색으로는 문제없음).
       #94520c 는 채도 0.104 로 floor 통과 + 흰 배경 대비 3:1 이상. */
    --data-1: #94520c;
  }
  /* 움직임 최소화 설정을 켠 사용자에게는 전환을 끈다 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased;
    word-break: keep-all; overflow-wrap: break-word;   /* 한글은 어절 단위로 줄바꿈(모바일 가독성) · 긴 URL 등은 안전하게 끊김 */
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding: 0 16px 120px; }
  body.no-bottom #app { padding-bottom: calc(28px + env(safe-area-inset-bottom)); }   /* 하단바 없는 화면의 빈 여백 제거 */
  header { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 14px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .h-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .room-name { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .date { font-size: 12px; color: var(--sub); margin-top: 1px; display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; }
  .dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
  .dot.on { background: var(--green); } .dot.off { background: var(--accent); }
  .me-chip { font-size: 13px; font-weight: 600; color: var(--brand); background: var(--brand-soft); border: 1px solid var(--line); padding: 7px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .me-chip small { color: var(--sub); font-weight: 500; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .muted { color: var(--sub); font-size: 13px; } .center { text-align: center; }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; transition: transform .05s ease, filter .15s; }
  .btn:active { transform: scale(.985); }
  .btn-brand { background: var(--brand); color: #fff; } .btn-soft { background: var(--brand-soft); color: var(--brand); border: 1px solid var(--line); }
  .btn-ghost { background: transparent; color: var(--sub); border: 1px solid var(--line); } .btn-danger { background: #fff; color: var(--red); border: 1px solid #f0d4c8; }
  /* '고를 수 있는 것' 전용 — 이 앱에서 누를 수 있는 건 전부 흰 카드다(메뉴 타일·사람 행).
     btn-ghost(투명 배경 + --sub 회색)로 두면 배경에 묻혀 '닫기' 같은 부속으로 읽힌다. */
  .btn-choice { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); box-shadow: 0 1px 3px rgba(80,55,30,.05); }
  .btn-sm { width: auto; padding: 9px 14px; font-size: 14px; border-radius: 10px; min-height: 44px; }
  .banner { text-align: center; padding: 26px 18px; } .banner .emoji { font-size: 44px; }
  .banner h2 { margin: 10px 0 4px; font-size: 21px; letter-spacing: -.4px; } .banner p { margin: 0; color: var(--sub); font-size: 14px; }
  .host-name { color: var(--brand); font-weight: 800; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .menu-tile { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 8px; text-align: center; font-weight: 700; font-size: 14px; position: relative; transition: .12s; }
  .menu-tile.sel { border-color: var(--brand); background: var(--brand-soft); }
  .menu-tile .em { display:block; font-size: 22px; margin-bottom: 4px; }
  .menu-tile .cnt { display:block; font-size: 11px; color: var(--accent-ink); margin-top: 3px; font-weight: 700; }
  .menu-tile .ck { position: absolute; top: 6px; right: 9px; color: var(--brand); font-weight: 900; opacity: 0; } .menu-tile.sel .ck { opacity: 1; }
  .menu-tile.add { border-style: dashed; color: var(--brand); background: #fbf8f3; }
  .seg-temp { display:flex; gap:8px; }
  .tbtn { flex:1; padding:14px; border-radius:12px; font-weight:800; font-size:15px; border:2px solid var(--line); background:#fff; color:var(--sub); }
  .tbtn.ice.on { background:#e8f1fb; border-color:#3b82c4; color:#2b6aa3; }
  .tbtn.hot.on { background:#fbe9e3; border-color:#c2552f; color:#a8401f; }
  .tbtn[disabled] { opacity:.95; }
  .seg { display:flex; gap:8px; }
  .sameas { flex:none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  /* 온도·옵션 칩은 주문 핵심 경로 — 탭 영역 44px 확보 */
  .chip { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #faf6f0; border: 1.5px solid var(--line); color: var(--ink); cursor: pointer; transition: transform .06s, background .12s, border-color .12s; }
  .chip:active { transform: scale(.94); }
  .chip.sel { background: var(--brand); color: #fff; border-color: var(--brand); }
  .label { font-size: 13px; font-weight: 700; color: var(--sub); margin: 16px 0 6px; }
  /* font-size 16px 미만이면 iOS가 포커스 시 자동 확대한다 — 줄이지 말 것 */
  input[type=text], input[type=search], textarea { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 16px; font-family: inherit; background: #fff; color: var(--ink); -webkit-appearance: none; appearance: none; }
  input, textarea, select { max-width: 100%; min-width: 0; }
  /* 테두리 색만 바꾸면 1.5px 변화라 포커스 표시가 약하다. box-shadow 링은 레이아웃을 밀지 않는다.
     키보드 사용자에게는 :focus-visible 로 더 진한 외곽선을 추가로 준다. */
  input:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(111,78,55,.22); }
  input:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .person { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
  .person:last-child { border-bottom: none; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff; background: var(--brand); }
  .person .pname { font-weight: 700; font-size: 15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .person .pmenu { font-size: 13px; color: var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .person > div { min-width: 0; }
  .logrow { padding: 9px 2px; border-bottom: 1px solid var(--line); }
  .logrow:last-child { border-bottom: none; }
  .logmeta { font-size: 12px; color: var(--sub); margin-bottom: 5px; }
  .logchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .logchip { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--ink); }
  .logchip.add { background: #e6f4ea; color: #1e7a37; }
  .logchip.rem { background: #fdeaea; color: #b3261e; }
  .logchip.ren { background: #eaeef6; color: #33415c; }
  .pill { margin-left: auto; flex: none; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.ordered { background: #e7f4ec; color: #1e7a37; } .pill.skip { background: #f1eee9; color: var(--sub); } .pill.pending { background: #fbecdf; color: #8a5a1f; }
  .person.picksel { background: var(--brand-soft); border-radius: 12px; box-shadow: inset 0 0 0 2px var(--brand); }
  .stats { display: flex; gap: 8px; margin-bottom: 6px; }
  .stat { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 8px; text-align: center; }
  .stat .num { font-size: 24px; font-weight: 900; letter-spacing: -1px; } .stat .lbl { font-size: 12px; color: var(--sub); margin-top: 2px; } .stat.total .num { color: var(--brand); }
  .tabs { display: flex; gap: 6px; background: var(--brand-soft); padding: 5px; border-radius: 12px; margin-bottom: 14px; }
  /* div·button 둘 다로 쓰인다 — button 의 UA 기본 배경을 지우고 탭 영역 44px 을 보장한다 */
  .tab { flex: 1; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; text-align: center; padding: 9px; border-radius: 9px; font-size: 14px; font-weight: 700; color: var(--sub); background: none; } .tab.on { background: #fff; color: var(--brand); box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .order-box { background: #2b2118; color: #f6f1ea; border-radius: 14px; padding: 16px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: keep-all; }
  .bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: linear-gradient(to top, var(--bg) 70%, rgba(246,241,234,0)); padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); }
  .bottombar .inner { max-width: 480px; margin: 0 auto; display: flex; gap: 10px; } .bottombar .inner > * { flex: 1; min-width: 0; }
  /* scrim 은 항상 화면 전체를 덮고, 키보드가 가린 높이(--kb)만큼 패딩으로 시트를 밀어올린다.
     바닥을 계산으로 만들지 않으므로 측정이 어긋나도 딤 안 된 틈이 드러나지 않는다(최악이어도 시트가 조금 짧아질 뿐). */
  .scrim { position: fixed; inset: 0; box-sizing: border-box; padding-bottom: var(--kb, 0px); background: rgba(40,28,16,.45); z-index: 40; display: none; align-items: flex-end; } .scrim.show { display: flex; }
  .sheet { background: var(--bg); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 22px 22px 0 0; padding: 0 16px calc(20px + env(safe-area-inset-bottom)); max-height: min(88vh, var(--vvh, 88vh)); overflow-y: auto; }
  /* 검색이 있는 시트: 시트 자체는 스크롤 안 하고 목록만 스크롤 → 타이핑 중에도 검색창·결과·하단바가 항상 보임 */
  .sheet.split { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }
  .sheet.split .sheet-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .sheet-count { font-size: 12.5px; font-weight: 700; color: var(--sub); padding: 2px 2px 0; }
  .sheet .grip { width: 44px; height: 5px; background: var(--line); border-radius: 99px; margin: 8px auto 14px; } .sheet h3 { margin: 4px 0 4px; font-size: 19px; }
  /* 하단 고정 액션 바 — 긴 옵션 목록에서도 스크롤 없이 주문/취소 가능. 푸터가 있는 시트는 하단 패딩 0으로 밀착 */
  .sheet.has-foot { padding-bottom: 0; }
  .sheet-foot { position: sticky; bottom: 0; z-index: 3; background: var(--bg); margin: 16px -16px 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); box-shadow: 0 -10px 22px -12px rgba(40,28,16,.22); }
  .ord-sum { font-size: 13px; font-weight: 700; color: var(--brand); text-align: center; margin: 0 0 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 메뉴 바꾸기 — 기본 접힘. 시트 열리면 온도·옵션이 바로 보이도록(카톡 등 짧은 화면 대응) */
  .menu-switch { margin: 8px 0 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .menu-switch > summary { list-style: none; cursor: pointer; padding: 11px 14px; font-size: 14px; font-weight: 700; color: var(--sub); display: flex; align-items: center; justify-content: space-between; }
  .menu-switch > summary::-webkit-details-marker { display: none; }
  .menu-switch > summary::after { content: "▾"; color: var(--sub); font-size: 12px; transition: transform .15s; }
  .menu-switch[open] > summary::after { transform: rotate(180deg); }
  .menu-switch > .grid { padding: 2px 12px 12px; }
  /* 주문 옵션 영역만 간격 촘촘화(온도~메모) — 옵션 그룹이 많은 메뉴도 스크롤 덜 하고 한눈에 */
  .order-opts .label { margin: 10px 0 5px; }
  .order-opts .chips { gap: 6px; margin-top: 5px; }
  .order-opts .chip { padding: 7px 12px; }
  /* 열린 섬김 없음(idle) 화면 — 헤더/하단바 사이 여백에 붕 떠 보이지 않도록 세로 중앙 정렬 */
  .idle-wrap { min-height: calc(100vh - 260px); display: flex; flex-direction: column; justify-content: center; }
  /* 닫기·취소 버튼 — 붉은 계열로 통일해 직관적으로(파괴적 액션인 danger 버튼은 이미 붉음) */
  .btn-close { color: var(--red); border-color: #f0d4c8; }
  /* 44px 탭 영역을 확보하되 음수 마진으로 시각적 위치는 그대로 둔다(hit slop) */
  .sheet-x { background: none; border: none; font-size: 19px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 0; margin: -6px -10px -6px 0; flex: none; }
  .chip:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .cscrim { position: fixed; inset: 0; background: rgba(40,28,16,.5); z-index: 70; display: none; align-items: center; justify-content: center; padding: 26px; } .cscrim.show { display: flex; }
  .cdialog { background: var(--card); width: 100%; max-width: 320px; border-radius: 18px; padding: 22px 20px 16px; box-shadow: 0 20px 50px rgba(40,28,16,.3); }
  .cdialog .cmsg { font-size: 15px; line-height: 1.65; color: var(--ink); white-space: pre-line; margin-bottom: 18px; }
  .cdialog .crow { display: flex; gap: 8px; } .cdialog .crow .btn { flex: 1; margin: 0; }
  /* 설정·뒤로가기·로그아웃 진입점. 글자는 13px 그대로 두고 탭 영역만 44px 로 넓힌다(음수 마진으로 줄높이 유지) */
  .nav-link { font-size: 13px; color: var(--sub); text-decoration: underline; cursor: pointer; background: none; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 6px; margin: -11px -6px; }
  .toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); background: #2b2118; color: #fff; padding: 11px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; line-height: 1.45; z-index: 60; opacity: 0; transition: opacity .2s, bottom .2s; pointer-events: none; max-width: min(88%, 340px); text-align:center; } .toast.show { opacity: 1; bottom: 110px; }
  .row-between { display:flex; align-items:center; justify-content: space-between; gap: 10px; min-width:0; }

/* ===================== 현재 셀/카페 전역값 (부팅 시 채움) ===================== */
let CELL=null, ROOM="default", ROOM_NAME="", MEMBERS=[], MENUS=[], CATEGORIES=[];
let CAFEMENU_CACHE={}; // cafeId -> DB 추가 메뉴(공식) 배열
function activeCafeId(){ return (SESSION&&SESSION.cafeId) || (CELL&&CELL.homeCafeId) || "gil"; }
function activeCafe(){ return CAFES[activeCafeId()] || CAFES.gil; }
function applyCellGlobals(){ ROOM=CELL.roomId; ROOM_NAME=CELL.name;
  CELL.members = memObjs(CELL.members);   // 문자열 레거시 → {id,name} 정규화(이후 저장도 객체로 일관)
  MEMBERS = CELL.members.map(m=>({id:m.id,name:m.name})).sort((a,b)=>a.name.localeCompare(b.name,"ko")); }
const CAT_ORDER=["coffee","coldbrew","latte","tealatte","tea","icedtea","ade","fruitlatte","blended","handdrip","dessert","extra"];
const CAT_LABEL={coffee:"커피 · 에스프레소",coldbrew:"콜드브루",latte:"라떼",tealatte:"티 라떼",tea:"티 (차)",icedtea:"아이스티",ade:"에이드",fruitlatte:"과일 라떼",blended:"블렌디드 (스무디 · 쉐이크)",handdrip:"핸드드립",dessert:"아이스크림 · 요거트",extra:"기타"};
// 메뉴 출처: DB(cafe_menus)에 시드돼 있으면 그걸 source of truth로, 없으면 코드 폴백
function applyCafeGlobals(){ const c=activeCafe();
  const dbm=(CAFEMENU_CACHE[c.id]||[]);
  if(dbm.length){
    MENUS = dbm.slice().sort((a,b)=> (a.sort-b.sort) || a.name.localeCompare(b.name,"ko"));
    const ci=x=>{ const i=CAT_ORDER.indexOf(x); return i<0?99:i; };
    const cats=[...new Set(MENUS.map(m=>m.cat||"extra"))].sort((a,b)=>ci(a)-ci(b));
    CATEGORIES = cats.map(id=>({id,label:CAT_LABEL[id]||id}));
  } else { MENUS=c.menus; CATEGORIES=c.categories; }
}
// 카페 메뉴 로드 — DB(cafe_menus) 전체. 테이블 없거나 로컬이면 빈 배열(→코드 폴백)
async function loadCafeMenus(cafeId){
  if(!SHARED) return [];
  if(CAFEMENU_CACHE[cafeId]) return CAFEMENU_CACHE[cafeId];
  try{ const {data,error}=await Sync.client.from("cafe_menus").select("*").eq("cafe_id",cafeId).limit(500); if(error) throw error;
    // 상세 옵션(optionGroups)·디카페인 여부는 코드가 소유 — DB 메뉴에 menu_id로 접목(스키마 변경 없이 상세 옵션 유지)
    const codeCafe=CAFES[cafeId], codeById={}; (codeCafe&&codeCafe.menus||[]).forEach(m=>{ codeById[m.id]=m; });
    CAFEMENU_CACHE[cafeId]=(data||[]).map(r=>{ const cm=codeById[r.menu_id]||{};
      return {id:r.menu_id,name:r.name,emoji:r.emoji||"🥤",cat:r.cat||"extra",temps:Array.isArray(r.temps)?r.temps:["ICE","HOT"],extras:Array.isArray(r.extras)?r.extras:[],popular:!!r.popular,sort:r.sort||0,
        optionGroups:cm.optionGroups, decaf:cm.decaf}; });
    return CAFEMENU_CACHE[cafeId];
  }catch(e){ CAFEMENU_CACHE[cafeId]=[]; return []; }
}
// 주문 이력 집계 (셀 단위): #1 개인화 정렬용 H_byMemberId, #2 구성원 선호 메뉴용 H_topName
let HIST_ROOM="", H_byMemberId={}, H_topName={};
async function loadHist(){
  if(!SHARED){ H_byMemberId={}; H_topName={}; HIST_ROOM=ROOM; return; }
  if(HIST_ROOM===ROOM) return;
  try{
    // 오늘(KST) 주문은 제외 — 마감 후 익일이 되면 그날 주문이 +1로 반영됨(찍기만 해선 안 오름)
    // room_id를 아는 사람만 읽는 RPC. 실패 시 직접 SELECT로 우회하지 않는다.
    const { data, error } = await Sync.client.rpc("get_room_history",{p_room:ROOM,p_today:todayKey()});
    if(error) throw error;
    const byId={}, byName={};
    (data||[]).forEach(r=>{ const mid=r.member_id; if(!mid) return;
      if(r.menu_id){ byId[mid]=byId[mid]||{}; byId[mid][r.menu_id]=(byId[mid][r.menu_id]||0)+1; }
      const nm=r.menu_name||r.menu_id; if(nm){ byName[mid]=byName[mid]||{}; byName[mid][nm]=(byName[mid][nm]||0)+1; }
    });
    H_byMemberId=byId; H_topName={};
    // 최애 top-2: 빈도 desc 정렬(Array.sort는 stable이라 동률은 기존과 동일하게 먼저 나온 메뉴가 앞섬)
    Object.keys(byName).forEach(mid=>{ const o=byName[mid];
      const ranked=Object.keys(o).map(k=>({name:k,count:o[k]})).sort((a,b)=>b.count-a.count);
      H_topName[mid]={first:ranked[0]||null, second:ranked[1]||null}; });
    HIST_ROOM=ROOM;
  }catch(e){ console.warn("hist fail",e); }
}
// #1: 내가 자주 주문한 메뉴 먼저(빈도 desc) → popular → 상위 10. 이력 없으면 popular 폴백
function popularMenus(){
  const freq=(ME && H_byMemberId[ME]) || {};
  return MENUS.map(m=>({m, f:freq[m.id]||0, p:m.popular?1:0}))
    .filter(x=> x.f>0 || x.p)
    .sort((a,b)=> b.f-a.f || b.p-a.p).slice(0,10).map(x=>x.m);
}
// 빠른 선택 그리드 = 사람마다 개인 빈도순 3개 + 전체 메뉴판(총 4칸). 나머지는 전체 메뉴판에서.
function gridTilesHtml(selId){
  const sel = selId && anyMenuById(selId);
  let items = popularMenus();
  if(sel) items = [sel, ...items.filter(m=>m.id!==sel.id)];   // 현재 선택을 맨 앞에(중복 제거)
  items = items.slice(0,3);                                    // 사람마다 3개
  const addTile = activeCafe().freeform
    ? `<div class="menu-tile add" data-custom="1" role="button" tabindex="0"><span class="em">📝</span>직접 입력</div>`
    : `<div class="menu-tile add" data-full="1" role="button" tabindex="0"><span class="em">📋</span>전체 메뉴판</div>`;
  return items.map(m=>tileHtml(m,selId)).join("") + addTile;
}
function memberById(id){ return MEMBERS.find(m=>m.id===id); }
// 멤버는 {id(숨은 고유값), name(표시·수정 가능)} 객체. 레거시(문자열)도 안전 처리(문자열→id=name).
function memObjs(arr){ return (arr||[]).map(m => (m && typeof m==="object") ? {id:m.id, name:m.name} : {id:m, name:m}); }
// 동시편집 충돌 감지용: 배열 순서와 무관하게 {id,이름} 집합만 비교(정렬/입력순 차이로 인한 오탐 방지)
function memSig(arr){ return JSON.stringify(memObjs(arr).map(m=>({id:m.id, name:(m.name||"").trim()})).sort((a,b)=> a.id<b.id?-1:a.id>b.id?1:0)); }

}

function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// 다중 섬김(하루 N번, 순차): SERVINGS=오늘의 섬김 배열, activeSeq=열린 섬김, viewSeq=보고 있는 섬김(null=활성/개요)
let SERVINGS = [];      // [{seq,state,hostId,cafeId,closeAt, orders:{memberId:{...}}}]
let activeSeq = null;

const emptySession = ()=>({ state:"idle", hostId:null, closeAt:null, cafeId:null, seq:null });

function ordersObj(arr){ const o={}; (arr||[]).forEach(r=>{ o[r.member_id]={type:r.type,menuId:r.menu_id,menuName:r.menu_name||"",temp:r.temp,extras:r.extras||[],note:r.note||""}; }); return o; }
function servingsFromDB(arr){ return (arr||[]).map(s=>({seq:s.seq, state:s.state, hostId:s.host_id, cafeId:s.cafe_id||null, closeAt:s.close_at, orders:ordersObj(s.orders)})); }
function projectServing(seq){
  const s = SERVINGS.find(x=>x.seq===seq);
  if(s){ SESSION={state:s.state, hostId:s.hostId, closeAt:s.closeAt, cafeId:s.cafeId, seq:s.seq}; ORDERS=s.orders||{}; }
  else { SESSION=emptySession(); ORDERS={}; }
  applyCafeGlobals();
}
// 섬김 배열을 반영하고 SESSION/ORDERS를 활성(또는 보고 있는) 섬김으로 투영
function setServings(list){
  SERVINGS = list || [];
  const open = SERVINGS.find(x=>x.state==="open");
  activeSeq = open ? open.seq : null;
  if(viewSeq!=null && !SERVINGS.some(x=>x.seq===viewSeq)) viewSeq=null;  // 사라진 섬김 보기 정리
  projectServing(viewSeq!=null ? viewSeq : activeSeq);
}

/* ---- 단독(로컬) 모드 ---- */
const LocalSync = () => {
  const key = ()=> `coffee_local_${ROOM}_${todayKey()}`;
  function read(){ try{ const r=localStorage.getItem(key()); if(r){ const d=JSON.parse(r); if(Array.isArray(d.servings)) return d; } }catch(e){} return {servings:[]}; }
  function write(d){ localStorage.setItem(key(), JSON.stringify(d)); apply(d); }
  function apply(d){ setServings((d.servings||[]).map(s=>({seq:s.seq,state:s.state,hostId:s.hostId,cafeId:s.cafeId||null,closeAt:s.closeAt,orders:s.orders||{}}))); }
  const nextSeq = d => d.servings.reduce((m,s)=>Math.max(m,s.seq),0)+1;
  return {
    shared:false,
    async init(cb){ onChange=cb;
      window.addEventListener("storage", e=>{ if(e.key===key()){ apply(read()); onChange(); }}); },
    async reload(){ apply(read()); },
    async resubscribe(){ apply(read()); },
    pause(){},
    async startServing(me,cafeId){ const d=read(); if(d.servings.some(s=>s.state==="open")){ apply(d); return 0; } const ns=nextSeq(d); d.servings.push({seq:ns,state:"open",hostId:me,cafeId:cafeId||null,closeAt:null,orders:{}}); write(d); return ns; },
    async claim(me,cafeId){ const d=read(); const o=d.servings.find(s=>s.state==="open"); if(o){ if(o.hostId){ apply(d); return false; } o.hostId=me; if(!o.cafeId) o.cafeId=cafeId||null; write(d); return true; } const ns=nextSeq(d); d.servings.push({seq:ns,state:"open",hostId:me,cafeId:cafeId||null,closeAt:null,orders:{}}); write(d); return true; },
    async unclaim(seq){ const d=read(); const s=d.servings.find(x=>x.seq===seq); if(!s){ apply(d); return; } if(!s.orders||!Object.keys(s.orders).length){ d.servings=d.servings.filter(x=>x.seq!==seq); } else { s.hostId=null; } write(d); }, // 빈 섬김 삭제/주문 있으면 인계
    async close(seq){ const d=read(); const s=d.servings.find(x=>x.seq===seq); if(s){ s.state="closed"; s.closeAt=Date.now(); } write(d); },
    async reopen(seq){ const d=read(); if(d.servings.some(s=>s.state==="open"&&s.seq!==seq)){ apply(d); throw new Error("다른 섬김이 열려 있어요"); } const s=d.servings.find(x=>x.seq===seq); if(s){ s.state="open"; s.closeAt=null; } write(d); },
    async setOrder(me,o,seq){ const d=read(); const s=d.servings.find(x=>x.seq===seq)||d.servings.find(x=>x.state==="open"); if(!s){ apply(d); return; } s.orders=s.orders||{}; s.orders[me]=o; write(d); },
    async removeOrder(me,seq){ const d=read(); const s=d.servings.find(x=>x.seq===seq)||d.servings.find(x=>x.state==="open"); if(s&&s.orders){ delete s.orders[me]; } write(d); },
  };
};

/* ---- Supabase(공유) 모드 ---- */
const SupabaseSync = () => {
  const client = window.supabase.createClient(sbUrl, sbKey);
  const date = ()=> todayKey();
  function nowIso(){ return new Date().toISOString(); }
  // 엄격 모드: anon 직접 SELECT 차단 → 폴링으로 갱신(실시간 미사용)
  let pollTimer=null;
  function startPolling(){ stopPolling(); pollTimer=setInterval(async()=>{ if(document.hidden) return; try{ await reload(); onChange(); }catch(e){} }, 10000); }
  function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
  async function reload(){
    // 하루 전체 섬김을 1회 조회(열거 불가 RPC). get_day 없으면 옛 get_room_day로 폴백(단일 섬김).
    const { data, error } = await client.rpc("get_day",{p_room:ROOM,p_date:date()});
    if(error){
      if(error.code==="PGRST202"){
        const r = await client.rpc("get_room_day",{p_room:ROOM,p_date:date()}); if(r.error) throw r.error;
        const s=r.data&&r.data.session;
        setServings(s ? [{seq:s.seq||1, state:s.state, hostId:s.host_id, cafeId:s.cafe_id||null, closeAt:s.close_at, orders:ordersObj(r.data.orders)}] : []);
        lastSyncAt=Date.now(); return;
      }
      throw error;
    }
    setServings(servingsFromDB(data&&data.servings));
    lastSyncAt=Date.now();
  }
  return {
    shared:true, client,
    async init(cb){ onChange=cb; },           // 첫 reload/폴링은 enterCell에서
    reload,
    async resubscribe(){ await reload(); startPolling(); },
    pause(){ stopPolling(); },
    async startServing(me,cafeId){   // 새 섬김 시작 → 새 seq 반환(0=이미 열린 섬김 있음)
      const { data, error } = await client.rpc("start_serving",{p_room:ROOM,p_date:date(),p_me:me,p_cafe:cafeId||null});
      if(error) throw error; await reload(); return data|0;
    },
    async claim(me,cafeId){          // 열린(호스트 없는) 섬김 인계
      const { data, error } = await client.rpc("claim_host",{p_room:ROOM,p_date:date(),p_me:me,p_cafe:cafeId||null});
      if(error) throw error; await reload(); return !!data;
    },
    async unclaim(seq){ const {error}=await client.rpc("unclaim_serving",{p_room:ROOM,p_date:date(),p_seq:seq}); if(error) throw error; await reload(); },
    async close(seq){ const {error}=await client.rpc("set_serving_state",{p_room:ROOM,p_date:date(),p_seq:seq,p_state:"closed"}); if(error) throw error; await reload(); },
    async reopen(seq){ const {error}=await client.rpc("set_serving_state",{p_room:ROOM,p_date:date(),p_seq:seq,p_state:"open"}); if(error) throw error; await reload(); },
    async setOrder(me,o,seq){
      const {error}=await client.rpc("set_order",{p_room:ROOM,p_date:date(),p_member_id:me,p_type:o.type,p_menu_id:o.menuId||null,p_menu_name:o.menuName||null,p_temp:o.temp||null,p_extras:o.extras||[],p_note:o.note||"",p_seq:seq}); if(error) throw error;
      await reload();
    },
    async removeOrder(me,seq){ const {error}=await client.rpc("remove_order",{p_room:ROOM,p_date:date(),p_member_id:me,p_seq:seq}); if(error) throw error; await reload(); },
  };
};

// 커스텀 확인창 — 기본 confirm() 대체. 뒤로가기 모델과 통합(뒤로가기=취소). 시트 위에도 안전(상위 레이어).
let confirmOpen=false, ignorePop=false, confirmResolve=null;
function askConfirm(message, opts){ opts=opts||{};
  return new Promise(resolve=>{
    confirmResolve=resolve;
    $cscrim.innerHTML=`<div class="cdialog" role="alertdialog" aria-modal="true" aria-label="확인">
      <div class="cmsg">${esc(message)}</div>
      <div class="crow">
        <button class="btn btn-soft btn-close" id="cCancel">${esc(opts.cancel||"취소")}</button>
        <button class="btn ${opts.danger?'btn-danger':'btn-brand'}" id="cOk">${esc(opts.ok||"확인")}</button>
      </div></div>`;
    $cscrim.classList.add("show"); confirmOpen=true;
    try{ history.pushState({c:1},""); }catch(e){}
    document.getElementById("cOk").onclick=()=>finishConfirm(true);
    document.getElementById("cCancel").onclick=()=>finishConfirm(false);
  });
}
function finishConfirm(result){ // 버튼으로 닫기: 히스토리 항목 소비(ignorePop)
  if(!confirmOpen) return; confirmOpen=false; $cscrim.classList.remove("show");
  const r=confirmResolve; confirmResolve=null;
  ignorePop=true; try{ history.back(); }catch(e){ ignorePop=false; }
  if(r) r(result);
}
$cscrim.addEventListener("click",e=>{ if(e.target===$cscrim) finishConfirm(false); });

// 모바일 키보드가 가린 높이를 --kb 로, 실제 보이는 높이를 --vvh 로 노출한다.
// --kb = innerHeight - (보이는 높이 + 위로 밀린 양). 두 경우 모두 자동으로 맞는다:
//   Android(키보드가 레이아웃 뷰포트까지 줄임) → innerHeight 도 같이 줄어 --kb=0, inset:0 이 이미 정답
//   iOS(레이아웃 뷰포트는 그대로)              → --kb 가 곧 키보드 높이, 그만큼 시트를 밀어올림
(function syncViewport(){
  const vv=window.visualViewport; if(!vv) return;
  // ?vvdebug — 실기기에서 추측 말고 숫자를 보고 판단하려고 붙인 계측 표시줄
  const dbg = /[?&]vvdebug/.test(location.search) ? document.createElement("div") : null;
  let probe=null;
  if(dbg){ dbg.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:99;background:#2b2118;color:#fff;font:11px/1.5 ui-monospace,monospace;padding:4px 8px;text-align:center;pointer-events:none";
    probe=document.createElement("div"); probe.style.cssText="position:fixed;bottom:0;width:0;visibility:hidden;pointer-events:none;height:env(safe-area-inset-bottom,0px)"; }
  const apply=()=>{ const r=document.documentElement.style;
    const kb=Math.max(0, Math.round(window.innerHeight-(vv.height+vv.offsetTop)));
    r.setProperty("--vvh", Math.round(vv.height)+"px");
    r.setProperty("--kb", kb+"px");
    if(dbg){ if(!dbg.parentNode && document.body){ document.body.appendChild(probe); document.body.appendChild(dbg); }
      dbg.textContent=`inner ${window.innerHeight} · vv ${Math.round(vv.height)} · top ${Math.round(vv.offsetTop)} · kb ${kb} · sab ${probe?probe.offsetHeight:0} · ${APP_VERSION}`; } };
  // 삼성·구글 키보드는 자동완성/추천 줄이 뒤늦게 붙어 키보드가 더 높아진다. 한 번만 재면
  // 그 증가분이 시트와 키보드 사이 틈으로 남으므로, 이벤트 후 잠깐 동안 다시 잰다.
  const settle=()=>{ apply(); [60,160,320,600].forEach(ms=>setTimeout(apply,ms)); };
  vv.addEventListener("resize", settle); vv.addEventListener("scroll", apply);
  document.addEventListener("focusin", settle); document.addEventListener("focusout", settle);
  window.addEventListener("orientationchange", ()=>setTimeout(settle,250));
  settle();
})();

function closeSheet(){ $scrim.classList.remove("show"); sheetOpen=false; }  // history 항목은 다음 뒤로가기/열기가 소비·재사용
$scrim.addEventListener("click",e=>{ if(e.target===$scrim) closeSheet(); });
// 칩 키보드 접근성: 포커스된 칩(tabindex=0)에서 Enter/Space → 클릭(키보드·스크린리더 사용자)
document.addEventListener("keydown",e=>{ const t=e.target; if((e.key==="Enter"||e.key===" "||e.key==="Spacebar")&&t&&t.getAttribute&&t.getAttribute("tabindex")==="0"&&(t.getAttribute("role")==="button"||(t.classList&&t.classList.contains("chip")))){ e.preventDefault(); t.click(); } });
window.addEventListener("popstate",()=>{
  if(ignorePop){ ignorePop=false; return; }   // 버튼으로 확인창 닫을 때의 history.back() 무시
  if(confirmOpen){ confirmOpen=false; $cscrim.classList.remove("show"); const r=confirmResolve; confirmResolve=null; if(r) r(false); return; }  // 뒤로가기=확인창 취소(우선)
  subActive=false;   // 쌓아둔 하위 항목이 (뒤로가기로) 빠졌다
  if(gameOpen){ closeGame(); return; }        // 게임 오버레이가 시트보다 위 — 뒤로가기 한 번이면 게임만 닫힌다
  if(sheetOpen){ $scrim.classList.remove("show"); sheetOpen=false; return; }  // 시트 닫기
  if(openTab!=="order"){ openTab="order"; render(); return; }   // 현황·주문서 탭 → 내 주문 탭
  if(curView==="pick" && ME){ render(); return; }         // 이름변경 → 주문
  if(curView==="adminmenu"){ renderAdminDash(); return; } // 메뉴관리 → 관리자
  if(curView==="admindash"){ renderAdminDash(); return; } // 대시보드 → 관리자
  // main/랜딩/초기 이름선택: 더 빠질 항목 없음 → 브라우저가 그대로 앱 밖으로
});

/* ===================== 렌더 ===================== */
function render(){
  if(!ME || !memberById(ME)){ curView="pick"; renderPickMe(); $bottom.innerHTML=""; document.body.classList.add("no-bottom"); return; }
  projectServing(viewSeq!=null ? viewSeq : activeSeq);   // 현재 볼 섬김으로 투영(활성 or 보고있는 것)
  // 보는 섬김이 바뀌면 탭은 '내 주문'부터 — 남의 섬김을 주문서 탭으로 열고 시작하지 않는다
  if(SESSION.seq!==lastTabSeq){ lastTabSeq=SESSION.seq; openTab="order"; }
  curView="main"; renderHeader();
  if(!SESSION.seq) renderIdle();            // 열린 섬김 없음 = 오늘의 섬김 개요
  else if(SESSION.state==="open") renderOpen();
  else renderClosed();
  renderBottom();
}
function view(){ return document.getElementById("view"); }

  $app.innerHTML = `
    <header><div class="h-row">
      <div style="min-width:0;overflow:hidden"><h1 class="room-name">☕ ${esc(ROOM_NAME)}${CELL&&CELL.id==="demo"?'<span class="demo-badge">데모·공용</span>':''}${SESSION.seq?`<span class="demo-badge" style="background:var(--brand);color:#fff">${SESSION.seq}번째 섬김</span>`:''}</h1>
        <div class="date">${prettyDate()} · ${connHtml}</div></div>
      <div class="header-actions">
        <div class="me-chip" id="meChip" role="button" tabindex="0" aria-label="내 이름 변경">${esc(meName())} <small>· 변경</small></div>

function renderPickMe(){
  if(ME && curView!=="pick") pushSub();   // '이름 변경'으로 들어올 때만(초기 선택은 root)
  curView="pick";
  $bottom.innerHTML=""; document.body.classList.add("no-bottom"); // 이전 화면의 하단바 제거 (확인 바와 중복 방지)
  const list = MEMBERS.map(m=>{
    const o=ORDERS[m.id]; let badge="";
    if(o&&o.type==="drink") badge='<span class="pill ordered">주문함</span>';
    else if(o&&o.type==="skip") badge='<span class="pill skip">안마심</span>';
    if(m.id===pickSel) badge='<span class="pill" style="background:var(--brand);color:#fff">✓ 선택됨</span>';
    else if(m.id===ME && !badge) badge='<span class="pill ordered">나</span>';
    const th=H_topName[m.id];
    const favParts=[]; if(th&&th.first) favParts.push(`①${esc(th.first.name)}`); if(th&&th.second) favParts.push(`②${esc(th.second.name)}`);
    const fav=favParts.join(" · ");
    return `<div class="person${m.id===pickSel?' picksel':''}" data-id="${esc(m.id)}" style="cursor:pointer" role="button" tabindex="0" aria-pressed="${m.id===pickSel}" aria-label="${esc(m.name)}">
      <div class="avatar">${esc(initials(m.name))}</div>
      <div style="min-width:0"><div class="pname">${esc(m.name)}</div>${fav?`<div class="pmenu">${fav}</div>`:''}</div>${badge}</div>`;
  }).join("");
  const sel = pickSel && memberById(pickSel);
  const selOrder = sel && ORDERS[pickSel];
  $app.innerHTML = `
    <header><div class="room-name" style="padding-top:6px">☕ ${esc(ROOM_NAME)}</div>
    <div class="date">먼저 <b>본인</b>을 선택해 주세요 (ㄱㄴㄷ순)</div></header>
    <div class="card" style="padding:8px 18px">${list}</div>
    <div class="label" id="lbl-addMeName">내 이름이 목록에 없나요?</div>
    <div class="inline-form"><input autocomplete="off" type="text" id="addMeName" maxlength="40" placeholder="이름 입력" aria-labelledby="lbl-addMeName"/><button class="btn btn-soft btn-sm" id="addMeBtn" style="flex:none">추가하고 시작</button></div>`;
  $app.querySelectorAll(".person").forEach(el=> el.onclick=()=>{ pickSel=el.dataset.id; renderPickMe(); });
  document.getElementById("addMeBtn").onclick=async()=>{
    const nm=document.getElementById("addMeName").value.trim().slice(0,40); if(!nm){ toast("이름을 입력해주세요"); return; }
    const exist=MEMBERS.find(m=>m.name===nm);
    if(exist){ pickSel=exist.id; renderPickMe(); toast("이미 있는 이름이라 선택했어요"); return; }
    const nid=genMemberId();
    const arr=[...MEMBERS.map(m=>({id:m.id,name:m.name})), {id:nid,name:nm}];
    if(await saveMembers(arr)){ setMe(nid); toast(hon(nm)+", 반가워요 🙏"); render(); }
  };
  if(sel){
    const bar=document.createElement("div"); bar.className="bottombar";
    bar.innerHTML=`<div class="inner" style="flex-direction:column;gap:8px">
      ${selOrder?`<div class="banner-warn" style="margin:0;text-align:center">⚠️ '${esc(sel.name)}'${nimSfx(sel.name)}은 이미 ${selOrder.type==="skip"?"'안 마심'":"주문"}이 있어요. 본인이 맞는지 꼭 확인!</div>`:''}
      <button class="btn btn-brand" id="confirmMe">🙋 '${esc(hon(sel.name))}'으로 시작하기</button></div>`;

function renderIdle(){
  const past = SERVINGS.slice().sort((a,b)=>a.seq-b.seq);
  let list="";
  if(past.length){
    list=`<div class="label">오늘의 섬김 (${past.length}회)</div><div class="card" style="padding:6px 14px">`+
      past.map(s=>{ const h=memberById(s.hostId); const n=servingDrinks(s);
        const badge = s.state==="open" ? `<span class="pill ordered">진행 중</span>` : `<span class="pill skip">마감</span>`;
        return `<div class="person"><div class="avatar" style="background:var(--brand-soft);color:var(--brand)">${s.seq}</div>
          <div style="min-width:0"><div class="pname">${s.seq}번째 섬김 ${badge}</div>
          <div class="pmenu">${h?esc(hon(h.name))+" · ":""}총 ${n}잔</div></div>
          <button class="btn btn-sm btn-soft viewserv" data-seq="${s.seq}">보기</button></div>`;
      }).join("")+`</div>`;
  }
  view().innerHTML=`
    <div class="idle-wrap">
      <div class="card banner"><div class="emoji">🫧</div>
        <h2>${past.length?"지금은 열린 섬김이 없어요":"오늘은 아직<br>섬기기로 하신 분이 없어요"}</h2>
        <p>오늘 음료로 섬겨주실 분은<br>아래 <b>[오늘 섬기기 시작]</b>을 눌러주세요</p></div>
      ${list}
      <p class="muted center" style="margin-top:10px"><b>${esc(meName())}</b>${nimSfx(meName())}이 시작하면 이번 섬김의 주문이 열립니다.<br>
        섬길 사람은 <b>주문을 받은 뒤</b> 🎲 게임으로 정할 수도 있어요.</p>
    </div>`;
  view().querySelectorAll(".viewserv").forEach(b=> b.onclick=()=>{ viewSeq=+b.dataset.seq; render(); });
}

let pickSel=null; // 본인선택 화면에서 임시로 고른 이름 (확인 전)
function renderOpen(){
  const host=memberById(SESSION.hostId), myOrder=ORDERS[ME];
  let myStatus="";
  if(myOrder && myOrder.type==="skip"){

  const showGrid = !myOrder || isSkip || forceGrid;
  // 다른 분 주문 ("나도" 버튼)

      <div class="card" style="padding:6px 14px">${others.map(m=>{ const o=ORDERS[m.id], d=orderDisplay(o);

    const o={type:"drink",menuId:src.menuId,menuName:src.menuName||orderDisplay(src).name,temp:src.temp,extras:[...(src.extras||[])],note:""};
    forceGrid=false; if(await safeWrite(Sync.setOrder(ME,o,SESSION.seq))){ bumpFreq(o.menuId); toast(hon(memberById(b.dataset.id).name)+"과 같은 메뉴로 담았어요"); render(); } }));
}

// 서로 배반인 옵션: 한쪽을 켜면 다른 쪽은 자동 해제 (샷추가 ↔ 연하게)
const EXCLUSIVE_EXTRAS = { "샷추가":"연하게", "연하게":"샷추가", "얼음적게":"얼음많이", "얼음많이":"얼음적게", "우유적게":"우유많이", "우유많이":"우유적게", "물적게":"물많이", "물많이":"물적게" };

/* 커피샷/우유 음료 옵션 자동 부여 — 아메리카노/카페라떼를 기준으로 눈치껏.
   명시 optionGroups가 있으면 그걸 쓰고, 없으면 카테고리·이름으로 판별해 그룹을 구성한다.
   플래그로 개별 예외 지정 가능: shot:true/false, milk:true/false, decaf:false */
function menuHasShot(m){                                  // 에스프레소 샷 들어가는 음료
  if(m.shot===false) return false; if(m.shot===true) return true;
  if(m.cat==="coffee" || m.cat==="latte") return true;   // 아메리카노·에스프레소·라떼류(에스프레소 베이스)
  if(m.cat==="icedtea" && /샷/.test(m.name||"")) return true;  // 아샷추
  return false;
}
function menuHasMilk(m){                                  // 우유 들어가는 음료
  if(m.milk===false) return false; if(m.milk===true) return true;
  if(m.cat==="latte" || m.cat==="tealatte" || m.cat==="fruitlatte") return true;
  if(m.cat==="coldbrew" && /라떼|밀크/.test(m.name||"")) return true;  // 콜드브루 라떼/밀크
  return false;
}
function cafeAllowsDecaf(){ return (CAFES[activeCafeId()]||{}).decaf !== false; }   // 카페별 디카페인 제공 여부(길카페: 없음)
function menuTakesDecaf(m){ return cafeAllowsDecaf() && m.decaf!==false && (m.cat==="coffee" || m.cat==="latte"); }
function deriveOptionGroups(m){                           // 명시 그룹 없을 때 자동 구성(범위 밖이면 null)
  const hasShot=menuHasShot(m), hasMilk=menuHasMilk(m);
  if(!hasShot && !hasMilk) return null;
  const canIce=(m.temps||[]).includes("ICE");
  const g=[];
  if(hasMilk || canIce) g.push(OPT_SIZE);                // 컵 음료(우유/아이스 가능)만 사이즈
  if(hasShot) g.push(OPT_SHOT);
  if(hasMilk){ g.push(OPT_MILKTYPE); g.push(OPT_MILK); }
  if(canIce) g.push(OPT_ICE);
  return g.length ? g : null;
}
function menuFlatToggles(m){                              // 그룹에 안 담기는 토글(디카페인/덜달게) — 다중선택 유지
  const t=[];
  if(menuTakesDecaf(m)) t.push("디카페인");
  if((m.extras||[]).includes("덜달게")) t.push("덜달게");
  return t;
}
function openOrderSheet(menuId, existing){
  let temp = existing&&existing.temp ? existing.temp : null;
  let extras = existing&&existing.extras ? [...existing.extras] : [];
  let note = existing&&existing.note ? existing.note : "";
  function draw(keepScroll){
    const m = anyMenuById(menuId) || { id:menuId, name:(existing&&existing.menuName)||"?", emoji:"🥤", temps:["ICE","HOT"], extras:[] };
    if(m.temps.length){ if(!temp || !m.temps.includes(temp)) temp = m.temps[0]; } else { temp = null; }
    // 구조화 옵션(단일선택 그룹): 명시 optionGroups 또는 커피샷/우유 자동 판별. 있으면 그룹+토글, 없으면 기존 flat extras.
    const allGroups = m.optionGroups || deriveOptionGroups(m) || [];
    const groups = allGroups.filter(g=> !g.tempOnly || g.tempOnly===temp);
    const hasGroups = groups.length>0;
    const flatToggles = hasGroups ? menuFlatToggles(m) : [];   // 디카페인/덜달게(다중선택)
    let availExtras, optionsHtml="";
    if(hasGroups){
      const groupOpts = groups.reduce((a,g)=>a.concat(g.opts.filter(o=>o!==g.def)),[]);  // 기본값은 저장 안 함
      availExtras = groupOpts.concat(flatToggles);
      extras = extras.filter(x=>availExtras.includes(x));
      optionsHtml = groups.map(g=>{
        const cur = g.opts.find(o=>extras.includes(o)) || g.def;   // 저장된 값 없으면 기본값 선택
        return `<div class="label" id="lbl-${esc(g.key)}">${esc(g.label)}</div><div class="chips optgroup" role="radiogroup" aria-labelledby="lbl-${esc(g.key)}" data-key="${esc(g.key)}">${g.opts.map(o=>`<div class="chip ${o===cur?'sel':''}" role="radio" tabindex="0" aria-checked="${o===cur}" data-opt="${esc(o)}">${esc(o)}</div>`).join("")}</div>`;
      }).join("");
      if(flatToggles.length) optionsHtml += `<div class="label">추가 옵션 (여러 개 가능)</div><div class="chips" id="extras">${flatToggles.map(x=>`<div class="chip ${extras.includes(x)?'sel':''}" role="button" tabindex="0" aria-pressed="${extras.includes(x)}" data-x="${esc(x)}">${esc(x)}</div>`).join("")}</div>`;
    } else {
      const caf = cafeAllowsDecaf() && m.decaf!==false && ["coffee","latte","coldbrew","handdrip"].includes(m.cat); // 커피 기반 = 디카페인 가능(카페가 제공 + decaf:false 제외)
      const isLatte = ["latte","tealatte","fruitlatte"].includes(m.cat) || /라떼|밀크/.test(m.name||""); // 라떼류 = 우유 조절
      const milkOpts = isLatte ? ["우유적게","우유많이"] : [];
      const iceOpts  = (temp==="ICE") ? ["얼음적게","얼음많이"] : [];   // 얼음은 ICE 주문일 때만
      availExtras = (caf?["디카페인"]:[]).concat(m.extras||[]).concat(milkOpts).concat(iceOpts);
      extras = extras.filter(x=>availExtras.includes(x));
      optionsHtml = availExtras.length?`<div class="label">옵션 (여러 개 가능)</div><div class="chips" id="extras">${availExtras.map(x=>`<div class="chip ${extras.includes(x)?'sel':''}" role="button" tabindex="0" aria-pressed="${extras.includes(x)}" data-x="${esc(x)}">${esc(x)}</div>`).join("")}</div>`:"";
    }
    const tempHtml = m.temps.length>1
      ? `<div class="seg-temp" id="temps">${m.temps.map(t=>`<button class="tbtn ${t==='ICE'?'ice':'hot'} ${t===temp?'on':''}" data-t="${t}">${t==='ICE'?'🧊 ICE':'🔥 HOT'}</button>`).join("")}</div>`
      : m.temps.length===1
      ? `<div class="seg-temp"><button class="tbtn ${m.temps[0]==='ICE'?'ice on':'hot on'}" disabled>${m.temps[0]==='ICE'?'🧊 ICE 전용':'🔥 HOT 전용'}</button></div>`
      : "";
    // 하단 고정 바에 보여줄 현재 선택 요약(온도·옵션) — 스크롤 없이 무엇을 골랐는지 확인
    const summaryText = ()=>{ const parts=[]; if(temp && m.temps.length>1) parts.push(temp==="ICE"?"🧊 ICE":"🔥 HOT"); availExtras.forEach(x=>{ if(extras.includes(x)) parts.push(x); }); return parts.length?parts.join(" · "):"기본 그대로"; };
    const refreshSum = ()=>{ const s=document.getElementById("ordSum"); if(s) s.textContent=summaryText(); };
    const prevScroll = keepScroll && sheetOpen ? $sheet.scrollTop : 0;   // 온도 전환 등 리렌더 시 스크롤 위치 유지
    openSheet(`
      <h3>${esc(m.emoji)} ${esc(m.name)}</h3>
      <details class="menu-switch"><summary>🔄 다른 메뉴로 바꾸기</summary><div class="grid">${gridTilesHtml(menuId)}</div></details>
      <div class="order-opts">
        ${tempHtml?`<div class="label">온도</div>${tempHtml}`:""}
        ${optionsHtml}
        <div class="label" id="lbl-note">메모 (선택)</div><input autocomplete="off" type="text" id="note" maxlength="200" placeholder="예: 시럽 빼고" value="${esc(note)}" aria-labelledby="lbl-note" />
      </div>
      <div class="sheet-foot">
        <div class="ord-sum" id="ordSum" aria-live="polite">${esc(summaryText())}</div>
        <button class="btn btn-brand" id="confirmOrder">${existing?'주문 수정':'이걸로 주문'}</button>
        <div style="height:8px"></div>
        ${existing?'<button class="btn btn-danger" id="cancelOrder">주문 취소</button>':'<button class="btn btn-ghost btn-close" id="closeSheet">닫기</button>'}
      </div>`);
    if(prevScroll) $sheet.scrollTop = prevScroll;   // openSheet가 0으로 리셋한 스크롤을 원복
    $sheet.querySelectorAll(".menu-tile").forEach(t=>{ if(t.dataset.full){ t.onclick=()=>{ const n=document.getElementById("note").value; openFullMenuSheet(menuId, n); }; } else if(t.dataset.custom){ t.onclick=()=>{ const n=document.getElementById("note").value; openCustomSheet(existing, null, n); }; } else { t.onclick=()=>{ note=document.getElementById("note").value; menuId=t.dataset.id; temp=null; extras=[]; draw(); }; }});
    const tp=document.getElementById("temps"); if(tp) tp.querySelectorAll(".tbtn").forEach(b=>{ if(!b.disabled) b.onclick=()=>{ temp=b.dataset.t; note=document.getElementById("note").value; draw(true); }; });
    // 단일선택 그룹: 같은 그룹의 다른 옵션은 해제, 기본값 선택 시 저장 안 함
    // 제자리에서 .sel만 갱신 — 전체 리렌더/스크롤 리셋 없이(카톡·모바일에서 위로 튐 방지)
    $sheet.querySelectorAll(".optgroup").forEach(gEl=>{ const g=groups.find(x=>x.key===gEl.dataset.key); if(!g) return;
      gEl.querySelectorAll(".chip").forEach(c=> c.onclick=()=>{ const opt=c.dataset.opt;
        extras = extras.filter(x=>!g.opts.includes(x));
        if(opt!==g.def) extras.push(opt);
        gEl.querySelectorAll(".chip").forEach(x=>{ const on=x===c; x.classList.toggle("sel", on); x.setAttribute("aria-checked", on); });
        refreshSum(); }); });
    const ex=document.getElementById("extras"); if(ex) ex.querySelectorAll(".chip").forEach(c=> c.onclick=()=>{ const v=c.dataset.x,i=extras.indexOf(v);
      if(i>=0){ extras.splice(i,1); c.classList.remove("sel"); c.setAttribute("aria-pressed","false"); }
      else { extras.push(v); c.classList.add("sel"); c.setAttribute("aria-pressed","true"); const opp=EXCLUSIVE_EXTRAS[v]; if(opp){ const j=extras.indexOf(opp); if(j>=0){ extras.splice(j,1);   // 배반 옵션 자동 해제
        ex.querySelectorAll(".chip").forEach(x=>{ if(x.dataset.x===opp){ x.classList.remove("sel"); x.setAttribute("aria-pressed","false"); } }); } } }
      refreshSum(); });
    const noteEl=document.getElementById("note"); if(noteEl) noteEl.onfocus=()=>{ setTimeout(()=>{ try{ noteEl.scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){} },250); };  // 키보드가 입력창 가리지 않게
    document.getElementById("confirmOrder").onclick=()=>guardWrite(async()=>{ note=document.getElementById("note").value.trim(); forceGrid=false;
      if(hasGroups) extras.sort((a,b)=>availExtras.indexOf(a)-availExtras.indexOf(b));   // 표시 순서 안정화(사이즈→샷→물→얼음)
      if(await safeWrite(Sync.setOrder(ME,{type:"drink",menuId,menuName:m.name,temp,extras,note},SESSION.seq))){ bumpFreq(menuId); closeSheet(); toast(existing?"주문을 바꿨어요":"주문 담았어요 🙏"); render(); } });
    const cs=document.getElementById("closeSheet"); if(cs) cs.onclick=closeSheet;
    const co=document.getElementById("cancelOrder"); if(co) co.onclick=async()=>{ forceGrid=false; if(await safeWrite(Sync.removeOrder(ME,SESSION.seq))){ closeSheet(); toast("주문을 취소했어요"); render(); } };
  }
  draw();
}

// 편집거리(레벤슈타인) — 오타 허용 매칭용. 의존성 추가 없이 순수 JS로.
function editDistance(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i];
    for(let j=1;j<=n;j++) cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1+Math.min(prev[j-1],prev[j],cur[j-1]);
    prev=cur; }
  return prev[n]; }
// qn(입력)이 hay(후보명) 안 어딘가와 비슷한지 — hay가 더 길면 qn 길이만한 구간을 슬라이딩하며 최소 편집거리 계산
// (예: "붐다버그"가 "번더버그 만다린" 뒷부분과는 안 비슷해도 앞부분 "번더버그"와는 비슷함을 잡아냄)
function fuzzyDist(qn, hay){ if(qn.length>=hay.length) return editDistance(qn,hay);
  let best=Infinity;
  for(let i=0;i+qn.length<=hay.length;i++){ const d=editDistance(qn, hay.slice(i,i+qn.length)); if(d<best) best=d; if(!best) break; }
  return best; }
function typoThreshold(len){ return len<=3?1 : len<=5?2 : 3; }
function norm(s){ return (s||"").trim().toLowerCase().replace(/\s+/g,""); }
// 이름 매칭: 정확/부분 일치 우선, 짧은 오타는 편집거리로 허용 — 메뉴 검색·직접입력·대시보드 공용.
// 오타 허용은 3글자부터. 2글자에서 편집거리 1을 허용하면 절반이 틀려도 통과해
// "2셀"이 "청년2부1셀"에, "하영"이 "하성"에 걸린다(다른 대상이지 오타가 아니다).
function matchesName(mn,qn){ return mn===qn || mn.includes(qn) || qn.includes(mn) || (qn.length>=3 && fuzzyDist(qn,mn)<=typoThreshold(qn.length)); }
// 초성 검색: "ㅇㅁㄹ" → 아메리카노. 한글 유니코드 0xAC00 + (초성×588) 규칙.
const CHO=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function toCho(s){ return Array.from(String(s)).map(ch=>{ const c=ch.charCodeAt(0)-0xac00; return (c>=0&&c<=11171)?CHO[Math.floor(c/588)]:ch; }).join(""); }
function isChoQuery(s){ return !!s && Array.from(s).every(ch=>CHO.indexOf(ch)>=0); }
// 이름 매칭 정본 — 질의가 전부 자음이면 초성 모드, 아니면 오타 허용.
// 메뉴 검색과 대시보드의 셀·사람 검색이 이 한 함수를 공유한다.
function nameHit(name, ql){ if(!ql) return true; const n=norm(name);
  return isChoQuery(ql) ? toCho(n).indexOf(ql)>=0 : matchesName(n, ql); }
// 메뉴 대신 "주문완료/직접주문" 등을 적는 건 사실 오늘 생략 의사표시인 경우가 대부분 — 그쪽으로 자연스럽게 유도
const DECLINE_WORDS=["주문완료","직접주문","따로주문","개별주문","생략","패스","스킵","노쇼"];

function openCustomSheet(existing, prefillName, prefillNote){
  let temp="ICE";
  // 자동완성 후보 = 정식 메뉴 + 이 섬김에서 이미 다른 사람이 쓴 커스텀 메뉴(무분별한 중복 생성 방지)
  const pool=[...MENUS, ...customMenusFromOrders()];
  const noteVal = prefillNote!=null ? prefillNote : ((existing&&existing.note)||"");
  openSheet(`
    <h3>🥤 직접 입력</h3>
    <p class="muted" style="margin-top:0">목록에 없는 메뉴를 추가해요. 추가하면 다른 분에게도 보입니다.</p>
    <div class="label" id="lbl-cname">메뉴 이름</div>
    <input type="text" id="cname" maxlength="60" placeholder="예: 흑임자라떼" autocomplete="off" value="${esc(prefillName||"")}" aria-labelledby="lbl-cname" />
    <div id="cSuggest"></div>
    <div class="label">온도</div>
    <div class="seg-temp" id="ctemp">
      <button class="tbtn ice on" data-t="ICE">🧊 ICE</button>
      <button class="tbtn hot" data-t="HOT">🔥 HOT</button>
    </div>
    <div class="label" id="lbl-cnote">메모 (선택)</div><input autocomplete="off" type="text" id="cnote" maxlength="200" placeholder="예: 덜 달게" value="${esc(noteVal)}" aria-labelledby="lbl-cnote" />
    <div style="height:18px"></div>
    <button class="btn btn-brand" id="cAdd">추가하고 주문</button>
    <div style="height:8px"></div><button class="btn btn-ghost btn-close" id="cClose">닫기</button>`);
  document.getElementById("ctemp").querySelectorAll(".tbtn").forEach(b=> b.onclick=()=>{ temp=b.dataset.t;
    document.getElementById("ctemp").querySelectorAll(".tbtn").forEach(x=>x.classList.toggle("on", x.dataset.t===temp)); });

  const nameEl=document.getElementById("cname"), sugEl=document.getElementById("cSuggest"), addBtn=document.getElementById("cAdd");
  let exactMatch=null, isDecline=false;
  // 기존 메뉴로 자연스럽게 전환 — 알림창 대신 이미 쓰던 시트 전환(openFullMenuSheet의 메뉴 클릭과 동일한 방식)
  function goToExisting(m){ openOrderSheet(m.id, existing); }
  function goToSkip(){ guardWrite(async()=>{ forceGrid=false;
    if(await safeWrite(Sync.setOrder(ME,{type:"skip"},SESSION.seq))){ closeSheet(); toast("오늘은 쉬어가기로 했어요 🙆"); render(); } }); }
  function refreshSuggestions(){
    const qn=norm(nameEl.value);
    isDecline = !!qn && DECLINE_WORDS.some(w=>qn.includes(w));
    exactMatch = (!isDecline && qn.length>=2) ? pool.find(m=>{ const mn=norm(m.name); return mn===qn || fuzzyDist(qn,mn)<=typoThreshold(qn.length); }) : null;
    const matches = (!isDecline && qn && !exactMatch) ? pool.filter(m=>matchesName(norm(m.name),qn)).slice(0,4) : [];
    sugEl.innerHTML = matches.length ? `<div class="card" style="padding:2px 12px;margin:6px 0 0">${
      matches.map(m=>`<div class="person menu-row" data-id="${esc(m.id)}" style="cursor:pointer;padding:9px 2px" role="button" tabindex="0" aria-label="${esc(m.name)}로 전환">
        <div style="font-size:19px;width:24px;text-align:center">${esc(m.emoji||"🥤")}</div>
        <div class="pname" style="font-size:14px">${esc(m.name)}</div></div>`).join("")}</div>` : "";
    if(isDecline){
      addBtn.textContent = "🙅 오늘은 생략하시는 거죠? — 안 마실게요로 저장";
      addBtn.classList.remove("btn-brand"); addBtn.classList.add("btn-soft");
    } else if(exactMatch){
      addBtn.textContent = `✋ 이미 있는 메뉴예요 — ${exactMatch.emoji||"🥤"} ${exactMatch.name}로 주문`;
      addBtn.classList.remove("btn-brand"); addBtn.classList.add("btn-soft");
    } else {
      addBtn.textContent = "추가하고 주문";
      addBtn.classList.remove("btn-soft"); addBtn.classList.add("btn-brand");
    }
  }
  nameEl.addEventListener("input", refreshSuggestions);
  if(prefillName) refreshSuggestions();   // 검색창에서 넘어온 값도 바로 자동완성/오타매칭 판정
  sugEl.addEventListener("click", e=>{ const r=e.target.closest(".menu-row"); if(!r) return; const m=pool.find(x=>x.id===r.dataset.id); if(m) goToExisting(m); });

  addBtn.onclick=async()=>{
    if(isDecline){ goToSkip(); return; }
    if(exactMatch){ goToExisting(exactMatch); return; }
    const name=document.getElementById("cname").value.trim(), note=document.getElementById("cnote").value.trim();
    if(!name){ toast("메뉴 이름을 입력해주세요"); return; }
    forceGrid=false;
    if(!(await safeWrite(Sync.setOrder(ME,{type:"drink",menuId:"c:"+name,menuName:name,temp,extras:[],note},SESSION.seq)))) return;
    bumpFreq("c:"+name);
    // 직접입력 메뉴는 이 셀 주문(menu_name)으로만 저장 — 그날 이 셀 그리드에 표시(customMenusFromOrders).
    // (공유 카페로의 자동 승격은 익명 오염 방지를 위해 제거; 카페 공식 메뉴 추가는 관리자만)
    closeSheet(); toast("추가해서 담았어요 🙏"); render(); };
  document.getElementById("cClose").onclick=closeSheet;
  setTimeout(()=>{ const el=document.getElementById("cname"); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } },60);
}

function openFullMenuSheet(curId, carryNote){
  // 목록을 '한 번만' 그리고, 검색은 보이기/숨기기 토글만 → 덜컹임 없음
  const listHtml = CATEGORIES.map(c=>{
    const items=MENUS.filter(m=>m.cat===c.id);
    if(!items.length) return "";
    return `<div class="mcat"><div class="label" style="margin-top:14px">${c.label}</div><div class="card" style="padding:4px 14px">`+
      items.map(m=>`<div class="person menu-row${m.id===curId?' picksel':''}" data-id="${esc(m.id)}" data-name="${esc(norm(m.name))}" style="cursor:pointer" role="button" tabindex="0" aria-pressed="${m.id===curId}" aria-label="${esc(m.name)} 주문">
        <div style="font-size:21px;width:30px;text-align:center">${esc(m.emoji)}</div>
        <div class="pname">${esc(m.name)}</div>
        <span class="pmenu" style="margin-left:auto">${m.id===curId?'현재 선택 · ':''}${m.temps.length?m.temps.join("/"):"·"}</span></div>`).join("")+`</div></div>`;
  }).join("");
  openSheet(`
    <div style="flex:none;background:var(--bg);z-index:10;margin:0 -16px 0;padding:6px 16px 10px">
      <div class="row-between" style="margin-bottom:8px"><h3 style="margin:0">📋 전체 메뉴판</h3><button class="sheet-x btn-close" id="mCloseX" aria-label="닫기">✕</button></div>
      <input type="search" id="mq" placeholder="🔍 메뉴 검색 (예: 자몽, ㅇㅁㄹ)" aria-label="메뉴 검색 — 초성으로도 찾을 수 있어요" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" />
    </div>
    <div class="sheet-scroll">
      <div class="sheet-count" id="mCount"></div>
      <div id="mResults">${listHtml}<p class="muted center" id="mEmpty" style="margin-top:24px;display:none">검색 결과가 없어요</p></div>
      <div style="height:14px"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-soft" id="freeInput">목록에 없어요 — 직접 입력</button>
      <div style="height:8px"></div><button class="btn btn-ghost btn-close" id="mClose">닫기</button>
    </div>`);
  const mq=document.getElementById("mq"), results=document.getElementById("mResults"), empty=document.getElementById("mEmpty");
  // 오타 허용 검색: 직접입력과 같은 matchesName 기준 — "아메리카노"를 "아메리카노"로 오타쳐도 목록에서 바로 찾힘
  const count=document.getElementById("mCount");
  // 초성 검색: "ㅇㅁㄹ" → 아메리카노
  function applyFilter(){
    const ql=norm(mq.value); let any=false, n=0;
    results.querySelectorAll(".mcat").forEach(cat=>{
      let catVisible=false;
      cat.querySelectorAll(".menu-row").forEach(r=>{ const hit=nameHit(r.dataset.name,ql); r.style.display=hit?"":"none"; if(hit){ catVisible=true; n++; } });
      cat.style.display=catVisible?"":"none"; if(catVisible) any=true;
    });
    empty.style.display=any?"none":"";
    // 검색 전에는 같은 자리에 초성 검색 힌트를 보여준다 — 줄을 새로 만들지 않아 세로 공간이 안 든다
    count.textContent = ql ? ("검색 결과 "+n+"개") : "💡 초성으로도 찾아요 — ㅇㅁㄹ → 아메리카노";
  }
  mq.addEventListener("input", applyFilter);
  applyFilter();   // 시트를 열자마자 초성 힌트가 보이도록 한 번 실행(빈 질의라 목록은 그대로)
  // 검색 키를 누르면 키보드를 내려 목록 전체를 보여준다(보낼 폼이 없으므로 제출은 무의미)
  mq.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); mq.blur(); } });
  // 클릭은 이벤트 위임 (재바인딩 없음) — 메모는 넘겨받은 그대로 새 메뉴에 이어감
  results.addEventListener("click", e=>{ const r=e.target.closest(".menu-row"); if(r) openOrderSheet(r.dataset.id, carryNote?{note:carryNote}:null); });
  document.getElementById("freeInput").onclick=()=>openCustomSheet(null, mq.value, carryNote);
  document.getElementById("mClose").onclick=closeSheet;
  document.getElementById("mCloseX").onclick=closeSheet;
  // 자동 포커스 안 함 — 키보드가 올라와 목록을 가리지 않도록(스크롤로 훑어보기 우선)
}

/* ---------- 대시보드 ----------
   조각(stats·사람별·주문서)을 따로 두어 열린 섬김에서는 상위 탭이 직접 꺼내 쓰고,
   마감 화면에서는 예전처럼 한 덩어리(dashboardHtml)로 쓴다. */
let dashTab="people";
function dashSplit(){ return {
  ordered: MEMBERS.filter(m=>ORDERS[m.id]&&ORDERS[m.id].type==="drink"),
  skipped: MEMBERS.filter(m=>ORDERS[m.id]&&ORDERS[m.id].type==="skip"),
  pending: MEMBERS.filter(m=>!ORDERS[m.id]) }; }
function dashStatsHtml(){ const {ordered,skipped,pending}=dashSplit();
  return `<div class="stats">
    <div class="stat"><div class="num" style="color:var(--green)">${ordered.length}</div><div class="lbl">주문</div></div>
    <div class="stat"><div class="num" style="color:var(--sub)">${skipped.length}</div><div class="lbl">안마심</div></div>
    <div class="stat"><div class="num" style="color:var(--accent-ink)">${pending.length}</div><div class="lbl">미응답</div></div></div>`; }
function dashPeopleHtml(){ const {ordered,skipped,pending}=dashSplit();
  const row=(m,kind)=>{ const o=ORDERS[m.id]; let menu="",pill="";
    if(kind==="ordered"){ const d=orderDisplay(o);
      menu=`${esc(d.emoji+" "+d.name)}${o.temp?(' · '+o.temp):''}${(o.extras&&o.extras.length)?(' · '+esc(o.extras.join(", "))):''}${o.note?(' · 📝'+esc(o.note)):''}`;
      pill=`<span class="pill ordered">주문</span>`; }
    else if(kind==="skip"){ menu="오늘은 안 마심"; pill=`<span class="pill skip">안마심</span>`; }
    else { menu="아직 응답 없음"; pill=`<span class="pill pending">미응답</span>`; }
    return `<div class="person"><div class="avatar" style="${kind==='pending'||kind==='skip'?'background:var(--sub)':''}">${esc(initials(m.name))}</div>
      <div><div class="pname">${esc(m.name)}</div><div class="pmenu">${menu}</div></div>${pill}</div>`; };
  let body=`<div class="card" style="padding:6px 18px">${ordered.map(m=>row(m,"ordered")).join("")}${skipped.map(m=>row(m,"skip")).join("")}${pending.map(m=>row(m,"pending")).join("")}</div>`;
  if(pending.length && SESSION.state==="open") body+=`<button class="btn btn-soft" id="nudge">📢 미응답 ${pending.length}명 안내 문구 복사</button>`;
  return body; }
function dashCafeHtml(){
  return `<div class="card"><div class="muted" style="margin-bottom:10px">카페에 그대로 보여주거나 복사하세요 (이름 없이 수량만)</div>
      <div class="order-box" id="orderBox">${esc(cafeText())}</div><div style="height:12px"></div>
      <button class="btn btn-brand" id="copyCafe">📋 주문서 복사</button></div>`; }
function dashboardHtml(){   // 마감 화면 전용 — 안쪽 탭 그대로
  const stats=dashStatsHtml();
  const tabs=`<div class="tabs" id="dashTabs">
    <div class="tab ${dashTab==='people'?'on':''}" data-t="people">사람별 / 전달하기</div>
    <div class="tab ${dashTab==='cafe'?'on':''}" data-t="cafe">카페 주문서</div></div>`;
  let body;
  if(dashTab==="people"){
    body=dashPeopleHtml();
  } else {
    body=dashCafeHtml();
  }
  return stats+tabs+body;
}
function wireDashboard(){
  const t=document.getElementById("dashTabs"); if(t) t.querySelectorAll(".tab").forEach(el=> el.onclick=()=>{ dashTab=el.dataset.t; rerenderDash(); });
  const cp=document.getElementById("copyCafe"); if(cp) cp.onclick=()=>copyText(cafeText(),"주문서를 복사했어요");
  const nd=document.getElementById("nudge"); if(nd) nd.onclick=()=>{ const names=MEMBERS.filter(m=>!ORDERS[m.id]).map(m=>m.name).join(", ");
    const h=memberById(SESSION.hostId); const hostClause=h?`${hon(h.name)}이 `:"";   // host가 구성원에서 빠져도 안전
    copyText(`☕ 아직 메뉴 안 고르신 분: ${names}\n${hostClause}오늘 음료로 섬기십니다. 링크에서 골라주세요!`,"안내 문구 복사됨"); };
}
function rerenderDash(){ if(SESSION.state==="closed") renderClosed(); else render(); }
function countDrinks(){ return MEMBERS.filter(m=>ORDERS[m.id]&&ORDERS[m.id].type==="drink").length; }
function cafeText(){
  const map={};
  MEMBERS.forEach(m=>{ const o=ORDERS[m.id]; if(!o||o.type!=="drink") return; const nm=orderDisplay(o).name;
    const note=(o.note||"").trim();   // 메모(예: 우유많이)도 주문서에 포함 — 메모 다르면 별도 줄로 집계
    const k=nm+(o.temp?` (${o.temp})`:"")+(o.extras&&o.extras.length?` [${o.extras.join("/")}]`:"")+(note?` · 📝${note}`:""); map[k]=(map[k]||0)+1; });
  const lines=Object.keys(map).sort((a,b)=>a.localeCompare(b,"ko")).map(k=>`${k}  x${map[k]}`); const total=countDrinks();
  if(!total) return "아직 주문이 없습니다.";
  return lines.join("\n")+`\n────────────\n합계  ${total}잔`;
}
// 현황은 더 이상 별도 페이지가 아니라 '현황' 탭이다. 예전 호출부(폴링·외부 진입)를 위해 이름만 남긴다.

function renderBottom(){

    if(!s.hostId){                              // 호스트 없는(인계 대기) 열린 섬김 → 누구나 이어받기 / 게임으로 정하기
      html=`<button class="btn btn-soft" id="gamepickBar">🎲 게임으로 정하기</button><button class="btn btn-brand" id="takeover">🙋 제가 섬길게요</button>`;

  } else {                                       // closed(섬김 보기 중)
    html = (amHost ? `<button class="btn btn-ghost btn-close" id="reopen">마감 취소</button>` : `<button class="btn btn-soft" disabled style="opacity:.6">주문 마감됨</button>`)

  $bottom.innerHTML = html ? `<div class="bottombar"><div class="inner">${html}</div></div>` : "";
  document.body.classList.toggle("no-bottom", !html);   // 하단바가 없으면 본문 아래 여백도 걷는다
  bind("startserv",()=>{ if(CAFE_LIST.length<=1) doStartServing((CELL&&CELL.homeCafeId)||CAFE_LIST[0].id); else openClaimCafeSheet(); });
  bind("takeover",()=>doClaim(SESSION.cafeId||(CELL&&CELL.homeCafeId)||CAFE_LIST[0].id));
  bind("gamepickBar",()=>{ gameInit(); openGameSheet(); });
  bind("unclaim",async()=>{ const seq=SESSION.seq; if(await askConfirm("이 섬김을 취소할까요?\n(주문이 있으면 다른 분이 이어받게 남고, 없으면 이 섬김은 사라져요)",{ok:"섬김 취소",danger:true})){ if(await safeWrite(Sync.unclaim(seq))){ viewSeq=null; render(); } }});
  bind("close",async()=>{ const seq=SESSION.seq; if(await askConfirm("주문을 마감할까요?\n마감 후에도 '마감 취소'로 다시 열 수 있어요.",{ok:"마감하기"})){ if(await safeWrite(Sync.close(seq))){ viewSeq=seq; render(); } }});
  bind("reopen",async()=>{ const seq=SESSION.seq; if(await safeWrite(Sync.reopen(seq),"다시 열 수 없어요 — 다른 섬김이 진행 중입니다")){ viewSeq=null; render(); } });
  bind("toOverview",()=>{ viewSeq=null; render(); });
}

/* ===================== 랜덤 게임 — 섬길 사람 정하기 =====================
   1) 절대 자동으로 뜨지 않는다. 자진해서 섬기려던 분의 마음을 게임이 가로채면 안 되므로,
      [🎲 게임으로 정하기]를 직접 눌렀을 때만 시작한다. 호스트가 있는 섬김은 '그 호스트만' 열 수 있다.
   2) 결과에 구속력이 없다. [확정]을 누르기 전에는 서버에 아무것도 쓰지 않고, [한 판 더]가 늘 있다.
   3) 주문이 모인 뒤에 돌린다 — 안 마시는 분이 자동으로 빠져 후보가 정확해지고,
      unclaim→claim 으로 호스트를 갈아끼워도 섬김이 사라지지 않는다(주문이 없으면 unclaim 이 섬김째 지운다).
   4) 흔들기·기울이기(DeviceMotion)는 쓰지 않는다 — 카톡 인앱 브라우저에서 권한 프롬프트가 안 뜨는 사례가 많다. */
const GAME_COLORS = ["#7a4a12","#1f6b3a","#2a5f8f","#97371c","#5b4080","#14615c","#8f2f2c","#35435c","#6b5220","#4a6b1f"];
const gcolor = i => GAME_COLORS[i % GAME_COLORS.length];
const lessMotion = ()=> !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
const pickOne = arr => arr[Math.floor(Math.random()*arr.length)];
function shortName(n,k){ n=String(n||""); return n.length>k ? n.slice(0,k) : n; }
function gvibe(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }   // iOS 는 진동 API 자체가 없다 — 시각 효과가 본체
function $gv(){ return document.getElementById("gameOv"); }

let gameOpen=false, gameOff=new Set(), gameKind=null, gameTimers=[], gameTeardown=null;

// 오늘 안 마시는 분은 애초에 후보가 아니다. 그 외 제외는 gameOff 하나로만 관리한다.
function gameRoster(){ return MEMBERS.filter(m=>{ const o=ORDERS[m.id]; return !(o&&o.type==="skip") && !gameOff.has(m.id); }); }
function gameEligible(){ return MEMBERS.filter(m=>!(ORDERS[m.id]&&ORDERS[m.id].type==="skip")).length>=2; }
function gameServedIds(){ return new Set(SERVINGS.map(s=>s.hostId).filter(Boolean)); }
function gameInit(){   // 진입 때 기본 후보: 오늘 이미 섬긴 분을 빼되, 그래서 못 돌리게 되면 전원 참가로 되돌린다
  gameOff = gameServedIds();
  if(gameRoster().length<2) gameOff = new Set();
}

function gtimer(fn,ms){ const t=setTimeout(fn,ms); gameTimers.push(t); return t; }
function clearGameTimers(){ gameTimers.forEach(clearTimeout); gameTimers=[]; }
function openGameOv(title, bodyHtml){
  const el=$gv();
  el.innerHTML=`<div class="game-head"><div class="game-title">${title}</div>
      <button class="sheet-x" id="gvX" aria-label="닫기">✕</button></div>
    <div class="game-body" id="gvBody">${bodyHtml}</div>
    <div class="game-foot" id="gvFoot"></div>`;
  el.classList.add("show");
  // 뒤로가기로 닫히도록 하위 상태 1칸 확보(시트에서 넘어왔으면 이미 있으므로 재사용)
  if(!gameOpen){ gameOpen=true; pushSub(); }
  document.getElementById("gvX").onclick=closeGame;
}
function setGameFoot(html){ const f=document.getElementById("gvFoot"); if(f) f.innerHTML=html; }
function closeGame(){
  clearGameTimers();
  if(gameTeardown){ try{ gameTeardown(); }catch(e){} gameTeardown=null; }
  const el=$gv(); el.classList.remove("show"); el.innerHTML=""; gameOpen=false;
}

      <button class="game-pick" data-g="finger"><span class="gp-em">☝️</span><span><b>손가락 룰렛</b><small>폰 하나에 다 같이 손가락을 올려요</small></span></button>
      <button class="game-pick" data-g="wheel"><span class="gp-em">🎡</span><span><b>돌림판</b><small>가장 빠르게 · 한 번에 끝</small></span></button>`

/* ---------- 참가자 바꾸기 ---------- */
function openRosterSheet(){
  const served=gameServedIds();
  function draw(){
    const rows=MEMBERS.map(m=>{
      const o=ORDERS[m.id], skip=!!(o&&o.type==="skip"), on=!skip&&!gameOff.has(m.id);
      const sub = skip ? "오늘은 안 마셔요 — 후보에서 빠짐"
                : (served.has(m.id) ? "오늘 이미 섬기셨어요" : (o ? "주문 완료" : "아직 주문 전"));
      return `<div class="person"><div class="avatar" style="${on?'':'background:var(--sub)'}">${esc(initials(m.name))}</div>

        ${skip?`<span class="pill skip">안마심</span>`

    }).join("");
    openSheet(`

      <p class="muted" style="margin-top:0">현재 <b>${gameRoster().length}명</b>. '안 마실게요' 하신 분은 넣을 수 없어요.</p>
      <div class="row-2" style="margin-bottom:10px">
        <button class="btn btn-sm btn-soft" id="gAll">전원 참가</button>
        <button class="btn btn-sm btn-soft" id="gServed">오늘 섬긴 분 빼기</button></div>
      <div class="card" style="padding:6px 14px">${rows}</div>
      <div style="height:10px"></div><button class="btn btn-brand" id="gDone">완료</button>`);
    $sheet.querySelectorAll(".gtog").forEach(b=> b.onclick=()=>{ const id=b.dataset.id;
      if(gameOff.has(id)) gameOff.delete(id); else gameOff.add(id); draw(); });
    document.getElementById("gAll").onclick=()=>{ gameOff=new Set(); draw(); };
    document.getElementById("gServed").onclick=()=>{ gameOff=new Set(served); draw(); };
    document.getElementById("gDone").onclick=openGameSheet;
  }
  draw();
}

function startGame(kind){
  const roster=gameRoster();
  if(roster.length<2){ toast("참가자가 2명 이상이어야 해요"); return; }
  gameKind=kind;
  // 결과를 먼저 뽑고 그림이 그 결과를 향하게 한다 — 애니메이션이 결과를 만들면 확률이 고르지 않다
  if(kind==="ladder") playLadder(roster, pickOne(roster));
  else if(kind==="wheel") playWheel(roster, pickOne(roster));
  else playFinger(roster);
}

// 확정 = 여기서 처음으로 서버에 쓴다. 호스트가 이미 있으면 비운 뒤(unclaim) 당첨자가 이어받는다(claim).
// unclaim 은 주문이 없으면 섬김 자체를 지우므로, 게임 진입점은 주문이 1건 이상일 때만 노출한다.
async function commitGameWinner(w){
  const seq=SESSION.seq, prevHost=SESSION.hostId, cafeId=SESSION.cafeId||activeCafeId();
  await guardWrite(async()=>{
    toast("확정하는 중…");
    try{
      if(prevHost) await Sync.unclaim(seq);
      const ok=await Sync.claim(w.id, cafeId);
      closeGame(); viewSeq=null;
      if(ok) toast(w.id===ME ? "🎲 제가 섬기게 됐어요 — 메뉴는 지금도 바꿀 수 있어요"

      else toast("앗, 방금 다른 분이 먼저 이어받으셨어요!");
      render();
      // 게임을 연 자리(현황 탭)에 그대로 둔다. 단 당첨자 본인은 메뉴를 다시 고를 수 있어야 하므로
      // '내 주문' 탭으로 보낸다 — 사는 줄 모르고 고른 메뉴를 바꿀 기회를 주는 게 이 흐름의 예의다.

  });
}

/* ---------- 🪜 사다리타기 ---------- */
function playLadder(roster, winner){
  const n=roster.length, W=340, PAD=24, LABEL_Y=15, Y0=28, RUN=300;
  const LEV=Math.min(14, Math.max(6, n*2)), STEP=RUN/LEV, Y1=Y0+RUN, BOX_Y=Y1+9, BOX_H=26, H=BOX_Y+BOX_H+6;
  const colX=i=> PAD + i*(W-2*PAD)/(n-1);
  // 세로줄 간격보다 이름이 넓으면 위쪽 이름이 서로 겹쳐 못 읽는다 → 인원에 맞춰 글자수·크기를 줄인다.
  // 짧게 잘려도 전체 이름은 결과 발표와 <title> 에 그대로 나온다.
  const GAP=(W-2*PAD)/(n-1), NCH= n<=7?4 : n<=9?3 : 2, NFS= n<=7?11 : n<=9?10 : 8.5;
  const BOX_W=Math.min(30, GAP*0.82);
  const rowY=l=> Y0 + (l+0.5)*STEP;
  // 가로줄: 같은 높이에서 이웃끼리 겹치면 경로가 갈라지지 않는다 → 인접 금지.
  // 가로줄이 너무 적거나, 아무도 자리를 안 바꾸는(제자리) 사다리는 그림이 밋밋해서 다시 만든다.
  const trace=(rungs,start)=>{ let col=start; const pts=[[colX(col),Y0-6]];
    for(let l=0;l<LEV;l++){ const row=rungs[l];
      const to = row.indexOf(col)>=0 ? col+1 : (row.indexOf(col-1)>=0 ? col-1 : null);
      if(to!==null){ pts.push([colX(col),rowY(l)]); pts.push([colX(to),rowY(l)]); col=to; } }
    pts.push([colX(col),BOX_Y-2]); return {pts,end:col}; };
  let rungs=[], paths=[];
  for(let t=0;t<60;t++){
    rungs=[]; let total=0;
    for(let l=0;l<LEV;l++){ const row=[];
      for(let i=0;i<n-1;i++){ if(row.indexOf(i-1)>=0) continue; if(Math.random()<0.45){ row.push(i); total++; } }
      rungs.push(row); }
    paths=roster.map((m,i)=>trace(rungs,i));
    if(total>=n && paths.some((p,i)=>p.end!==i)) break;
  }
  const wi=roster.indexOf(winner), goal=paths[wi].end;   // ☕ 는 당첨자가 도착하는 칸에 놓는다
  // 같은 가로줄을 두 사람이 지날 때 색이 덮이지 않도록 사람마다 아주 조금 어긋나게 그린다
  const dOf=(pts,i)=>{ const off=(i-(n-1)/2)*0.8;
    return pts.map((p,k)=>(k?"L":"M")+p[0].toFixed(1)+" "+(p[1]+off).toFixed(1)).join(" "); };

  openGameOv("🪜 사다리타기", `
    <div class="game-say" id="gvSay">한 폰을 다 같이 보세요 — 내려갑니다…</div>
    <div class="game-stage"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="사다리타기 진행 중">
      ${roster.map((m,i)=>`<text x="${colX(i)}" y="${LABEL_Y}" text-anchor="middle" font-size="${NFS}" font-weight="800" fill="${gcolor(i)}"><title>${esc(m.name)}</title>${esc(shortName(m.name,NCH))}</text>`).join("")}
      ${roster.map((m,i)=>`<line x1="${colX(i)}" y1="${Y0}" x2="${colX(i)}" y2="${Y1}" stroke="#e7ddcf" stroke-width="3" stroke-linecap="round"/>`).join("")}
      ${rungs.map((row,l)=>row.map(i=>`<line x1="${colX(i)}" y1="${rowY(l)}" x2="${colX(i+1)}" y2="${rowY(l)}" stroke="#e7ddcf" stroke-width="3" stroke-linecap="round"/>`).join("")).join("")}
      ${roster.map((m,i)=>`<path class="lpath" d="${dOf(paths[i].pts,i)}" fill="none" stroke="${gcolor(i)}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`).join("")}
      ${roster.map((m,i)=>`<g class="lbox" data-c="${i}"><rect x="${(colX(i)-BOX_W/2).toFixed(1)}" y="${BOX_Y}" width="${BOX_W.toFixed(1)}" height="${BOX_H}" rx="9" fill="#fff" stroke="#e7ddcf" stroke-width="1.5"/>
        <text x="${colX(i)}" y="${BOX_Y+18}" text-anchor="middle" font-size="14" font-weight="800" fill="#6f6253">?</text></g>`).join("")}
    </svg></div>
    <div id="gvWin"></div>`);
  setGameFoot(`<button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button>`);
  bind("gvCancel",closeGame);

  const DUR = lessMotion() ? 10 : 2400, STAG = lessMotion() ? 0 : 130;
  const els=[...$gv().querySelectorAll(".lpath")];
  els.forEach(p=>{ const len=p.getTotalLength();
    p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
    p.style.transition="stroke-dashoffset "+DUR+"ms cubic-bezier(.45,.05,.25,1)"; });
  requestAnimationFrame(()=> els.forEach(p=> p.style.strokeDashoffset=0));

  const boxes=[...$gv().querySelectorAll(".lbox")];
  const openBox=(c,hit)=>{ const g=boxes[c]; if(!g) return;
    g.querySelector("rect").setAttribute("fill", hit?"#fbe9e3":"#f6f1ea");
    if(hit) g.querySelector("rect").setAttribute("stroke", "#c2552f");
    const t=g.querySelector("text"); t.textContent=hit?"☕":"·"; t.setAttribute("fill", hit?"#a8401f":"#b6a99a"); };
  gtimer(()=>{
    const rest=roster.map((m,i)=>i).filter(i=>i!==goal);
    rest.forEach((c,k)=> gtimer(()=>openBox(c,false), k*STAG));
    gtimer(()=>{ openBox(goal,true); showGameResult(winner); }, rest.length*STAG + (lessMotion()?0:340));
  }, DUR+120);
}

/* ---------- 🎡 돌림판 ---------- */
function playWheel(roster, winner){
  const n=roster.length, R=100, a=360/n, wi=roster.indexOf(winner);
  const sectors=roster.map((m,i)=>{
    const s=(i*a-90)*Math.PI/180, e=((i+1)*a-90)*Math.PI/180, big=a>180?1:0;
    return `<path d="M0 0 L ${(R*Math.cos(s)).toFixed(2)} ${(R*Math.sin(s)).toFixed(2)} A ${R} ${R} 0 ${big} 1 ${(R*Math.cos(e)).toFixed(2)} ${(R*Math.sin(e)).toFixed(2)} Z" fill="${gcolor(i)}" stroke="#fff" stroke-width="1.2"/>`;
  }).join("");
  // 핀은 12시. 12시에서 시계방향 mid 만큼 떨어진 조각을 핀 아래로 보내려면 그만큼 되돌려 감는다.
  const mid=(wi+0.5)*a, jitter=(Math.random()-0.5)*Math.max(0, a-10), spin=360*5 - mid + jitter;
  // 이름은 판과 같이 돌면 멈췄을 때 거꾸로 선다. 판이 도는 만큼 글자를 제자리에서 되돌려 놔
  // 멈춘 순간 항상 똑바로 읽히게 한다(폰에서는 가로로 놓인 2~4글자가 제일 잘 읽힌다).
  const labels=roster.map((m,i)=>{ const t=((i+0.5)*a-90)*Math.PI/180, lr=R*0.62;
    const x=lr*Math.cos(t), y=lr*Math.sin(t);
    return `<text x="${x.toFixed(2)}" y="${(y+4).toFixed(2)}" transform="rotate(${(-spin).toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)})" text-anchor="middle" font-size="${n>8?11:13}" font-weight="800" fill="#fff">${esc(shortName(m.name,4))}</text>`;
  }).join("");
  openGameOv("🎡 돌림판", `
    <div class="game-say" id="gvSay">돌아갑니다…</div>
    <div class="wheel-wrap"><div class="wheel-pin">🔻</div>
      <div id="wRot" style="transform:rotate(0deg)"><svg viewBox="-108 -108 216 216" role="img" aria-label="돌림판 회전 중">
        ${sectors}${labels}<circle cx="0" cy="0" r="13" fill="#fff" stroke="#e7ddcf" stroke-width="2"/></svg></div></div>
    <div id="gvWin"></div>`);
  setGameFoot(`<button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button>`);
  bind("gvCancel",closeGame);

  const slow=!lessMotion(), DUR= slow?4400:220;
  const rot=document.getElementById("wRot");
  if(slow) rot.style.transition="transform 4.2s cubic-bezier(.16,.72,.14,1)";
  requestAnimationFrame(()=> rot.style.transform="rotate("+spin.toFixed(2)+"deg)");
  gtimer(()=>showGameResult(winner), DUR);
}

/* ---------- ☝️ 손가락 룰렛 ---------- */
function playFinger(roster){
  openGameOv("☝️ 손가락 룰렛", `
    <div class="game-say" id="gvSay">폰을 가운데 놓고 <b>다 같이 손가락</b>을 올려주세요</div>
    <div class="fp-pad" id="fpPad"></div><div class="fp-mid" id="fpMid"></div>
    <div id="gvWin"></div>`);
  setGameFoot(`<button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button>`);
  bind("gvCancel",closeGame);

  const body=document.getElementById("gvBody"), pad=document.getElementById("fpPad"), mid=document.getElementById("fpMid");
  // 이 게임만은 세로 스크롤도 막는다 — 손가락이 미끄러질 때 화면이 따라 움직이면 좌표가 어긋난다
  body.style.touchAction="none"; body.style.overflowY="hidden";
  const pts=new Map(); let seq=0, cdT=null, picked=false;
  const stop=()=>{ if(cdT){ clearInterval(cdT); cdT=null; } };
  function refresh(){
    if(picked) return; stop();
    if(pts.size>=2){
      let k=3; mid.innerHTML=`<div class="fp-cnt">${k}</div>`; gvibe(12);
      cdT=setInterval(()=>{ k--;
        if(k<=0){ stop(); choose(); } else { mid.innerHTML=`<div class="fp-cnt">${k}</div>`; gvibe(12); } }, 800);
    } else mid.innerHTML=`<div class="game-hint">손가락 ${pts.size}개 — 두 개 이상 올리면 셉니다</div>`;
  }
  function choose(){
    picked=true; mid.innerHTML="";
    const win=pickOne([...pts.keys()]);
    pts.forEach((p,id)=>{ if(id===win){ p.el.classList.add("win"); p.el.style.width="98px"; p.el.style.height="98px"; }
                          else p.el.classList.add("lose"); });
    gvibe([30,70,30]);
    document.getElementById("gvSay").innerHTML="당첨된 손가락, <b>누구세요?</b>";
    setGameFoot(`<div class="chips" style="justify-content:center;margin-bottom:2px">${roster.map(m=>`<div class="chip gwho" role="button" tabindex="0" data-id="${esc(m.id)}">${esc(m.name)}</div>`).join("")}</div>
      <button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button>`);
    $gv().querySelectorAll(".gwho").forEach(c=> c.onclick=()=>{ teardown(); showGameResult(roster.find(m=>m.id===c.dataset.id)); });
    bind("gvCancel",closeGame);
  }
  const at=e=>{ const r=body.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  const onDown=e=>{ if(picked) return; e.preventDefault();
    const [x,y]=at(e), d=document.createElement("div"); d.className="fp-dot";
    d.style.cssText=`left:${x}px;top:${y}px;width:74px;height:74px;background:${gcolor(seq++)}`;
    pad.appendChild(d); pts.set(e.pointerId,{el:d}); refresh(); };
  const onMove=e=>{ const p=pts.get(e.pointerId); if(picked||!p) return; e.preventDefault();
    const [x,y]=at(e); p.el.style.left=x+"px"; p.el.style.top=y+"px"; };
  const onUp=e=>{ const p=pts.get(e.pointerId); if(picked||!p) return; p.el.remove(); pts.delete(e.pointerId); refresh(); };
  // touch-action:none 으로 막히지만, 인앱 웹뷰가 무시하는 경우가 있어 핀치 줌은 이벤트로도 한 번 더 막는다
  const noGesture=e=>e.preventDefault();
  body.addEventListener("pointerdown",onDown,{passive:false});
  body.addEventListener("pointermove",onMove,{passive:false});
  body.addEventListener("pointerup",onUp); body.addEventListener("pointercancel",onUp); body.addEventListener("pointerleave",onUp);
  body.addEventListener("touchmove",noGesture,{passive:false});
  document.addEventListener("gesturestart",noGesture); document.addEventListener("gesturechange",noGesture);
  function teardown(){ stop();
    body.removeEventListener("pointerdown",onDown); body.removeEventListener("pointermove",onMove);
    body.removeEventListener("pointerup",onUp); body.removeEventListener("pointercancel",onUp); body.removeEventListener("pointerleave",onUp);
    body.removeEventListener("touchmove",noGesture);
    document.removeEventListener("gesturestart",noGesture); document.removeEventListener("gesturechange",noGesture); }
  gameTeardown=teardown;
  refresh();
}

// 구성원 저장: 링크(id) 아는 사람이 그 셀 하나만 갱신(단건 RPC, 코드검증 없음 #6)
// set_members 호출 — actor 포함(감사 로그용). 구버전(2-인자) DB면 자동으로 actor 없이 재시도(배포 순서 무관).
async function rpcSetMembers(id, members, actor){
  let res = await Sync.client.rpc("set_members",{p_id:id,p_members:members,p_actor:(actor||null)});
  if(res.error && (res.error.code==="PGRST202" || /could not find the function/i.test(res.error.message||""))){
    res = await Sync.client.rpc("set_members",{p_id:id,p_members:members});   // 옛 스키마 폴백(로그 미기록)
  }
  return res;
}
async function saveMembers(arr, actor){
  if(SHARED){ const {error}=await rpcSetMembers(CELL.id, arr, (actor||meName())); if(error){ toast("저장 실패: "+(error.message||"")); return false; }
    const fresh=await fetchCell(CELL.id); if(fresh) CELL=fresh;
  } else { CELL.members=arr; DB_CELLS[CELL.id]=CELL; localStorage.setItem("coffee_local_cells",JSON.stringify(DB_CELLS)); }
  applyCellGlobals(); rememberCell(CELL);
  // 호스트가 명단에서 빠지면 섬김이 open으로 잠겨 아무도 마감 못 함 → 자동 해제(주문 있으면 인계 대기)
  if(activeSeq!=null && SESSION.hostId && !memberById(SESSION.hostId)){

// 자기 셀만 단건 조회 (열거 불가). SHARED=DB(get_cell) 단건, 로컬=DB_CELLS/CODE 폴백.
async function fetchCell(id){
  if(SHARED){
    try{ const {data,error}=await Sync.client.rpc("get_cell",{p_id:id});
      const row=Array.isArray(data)?data[0]:data;
      if(error||!row) return null;
      const cell={id:row.id,roomId:row.room_id,name:row.name,members:Array.isArray(row.members)?row.members:[],homeCafeId:row.home_cafe||"gil"};
      DB_CELLS[id]=cell; rememberCell(cell); return cell;
    }catch(e){ return null; }
  }
  return DB_CELLS[id] || CODE_CELLS[id] || null; // 로컬모드 폴백
}

function slugify(s){ return (s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,20); }
function rand36(n){ let s=""; while(s.length<n) s+=Math.random().toString(36).slice(2); return s.slice(0,n); }
function genCellId(name){ let base=slugify(name); if(base.length<2) base="cell"; let id; do{ id=base+"-"+rand36(14); }while(cellById(id)); return id; } // 유추 불가 랜덤

function openEditCellSheet(cell){
  let cafeId = cell.homeCafeId || "gil";
