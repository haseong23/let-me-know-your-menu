      <div class="inline-form" style="margin-top:8px"><input autocomplete="off" type="text" id="ecNewM" maxlength="40" placeholder="구성원 추가" aria-label="구성원 추가"/><button class="btn btn-soft btn-sm" id="ecAddM" style="flex:none">추가</button></div>
      <div class="label">홈 카페 (기본 카페)</div>
      <div class="chips" id="ecCafe">${CAFE_LIST.map(c=>`<div class="chip ${c.id===cafeId?'sel':''}" data-c="${c.id}">${c.emoji} ${esc(c.name)}</div>`).join("")}</div>
      <p class="muted" style="margin-top:10px">초대 링크(코드)는 그대로예요: <b>${esc(cell.id)}</b></p>
      <div style="height:14px"></div>
      <button class="btn btn-brand" id="ecSave">저장</button>
      <div style="height:8px"></div><button class="btn btn-ghost btn-close" id="ecClose">닫기</button>`);
    document.getElementById("ecName").oninput=e=>{ nameVal=e.target.value; };
    $sheet.querySelectorAll(".ecm").forEach(inp=> inp.oninput=()=>{ mlist[+inp.dataset.i].name=inp.value; });   // 이름만 갱신(id 보존)
    $sheet.querySelectorAll(".ecmdel").forEach(b=> b.onclick=()=>{ mlist.splice(+b.dataset.i,1); draw(); });
    document.getElementById("ecAddM").onclick=()=>{ const el=document.getElementById("ecNewM"), v=el.value.trim(); if(v){ mlist.push({id:genMemberId(), name:v}); draw(); } };
    const chips=document.getElementById("ecCafe");
    chips.querySelectorAll(".chip").forEach(c=> c.onclick=()=>{ cafeId=c.dataset.c; chips.querySelectorAll(".chip").forEach(x=>x.classList.toggle("sel",x.dataset.c===cafeId)); });
    document.getElementById("ecClose").onclick=closeSheet;
    document.getElementById("ecSave").onclick=()=>guardWrite(async()=>{
      const name=(nameVal||"").trim();
      const seen={}, out=[];
      for(const m of mlist){ const nm=(m.name||"").trim().slice(0,40); if(!nm||seen[m.id]) continue; seen[m.id]=1; out.push({id:m.id, name:nm}); }
      const members=out.slice(0,60);
      if(!name){ toast("셀 이름을 입력해주세요"); return; }
      if(members.length<1){ toast("구성원을 1명 이상 입력해주세요"); return; }
      if(!SHARED){ toast("운영(연결) 모드에서만 수정돼요"); return; }
      // 동시편집 충돌 감지: 최신 구성원과 스냅샷이 다르면 덮어쓰지 말고 최신 반영+경고
      const {data:cur}=await Sync.client.from("cells").select("members").eq("id",cell.id).maybeSingle();
      if(cur && memSig(cur.members)!==baseline){
        mlist=memObjs(cur.members).map(m=>({id:m.id,name:m.name})); baseline=memSig(mlist);
        toast("이 셀의 구성원이 다른 곳에서 바뀌었어요 — 최신을 불러왔어요. 다시 확인 후 저장해주세요"); draw(); return;
      }
      const {error:eMem}=await rpcSetMembers(cell.id, members, "관리자");   // 멤버 변경 → 감사 로그 기록
      if(eMem){ toast("저장 실패: "+(eMem.message||"")); return; }
      const {error}=await Sync.client.from("cells").update({name,home_cafe:cafeId}).eq("id",cell.id);
      if(error){ toast("저장 실패: "+(error.message||"")); return; }
      if(DB_CELLS[cell.id]){ DB_CELLS[cell.id].name=name; DB_CELLS[cell.id].members=members; DB_CELLS[cell.id].homeCafeId=cafeId; }
      closeSheet(); toast("셀을 수정했어요"); renderAdminDash();
    });
  }
  draw();
}

  $app.querySelectorAll(".delcell").forEach(b=> b.onclick=async()=>{ if(!(await askConfirm("이 셀을 삭제할까요?\n지난 주문 데이터는 남지만 링크 접근은 막힙니다.",{ok:"삭제",danger:true}))) return;
    if(SHARED){ const {error}=await Sync.client.from("cells").delete().eq("id",b.dataset.id); if(error){ toast("삭제 실패: "+(error.message||"")); return; } }
    delete DB_CELLS[b.dataset.id]; if(!SHARED) localStorage.setItem("coffee_local_cells",JSON.stringify(DB_CELLS));
    toast("삭제됨"); renderAdminDash(); });
}

/* ---------- 관리자 대시보드 ----------
   위계: ① 히어로+KPI ② 추세(단일 색 막대) ③ 사람별 참여(미터) ④ 많이 마신 메뉴.
   원칙 두 가지 —
   (a) 상태를 색만으로 구분하지 않는다. 마감/진행중은 채움 vs 윤곽 + 라벨 범례.
       (--brand #6f4e37 와 --accent-ink #96631f 는 정상 시야 ΔE 10.2 로 기준 15 미달이었다)
   (b) 값 라벨은 최댓값·마지막만. 모든 막대에 숫자를 붙이지 않는다. */
let dashFrom = null, dashTo = null;   // 조회 구간 'YYYY-MM-DD' (기본 최근 30일)
let dashRangeRPC = true;             // 기간 지정 RPC 사용 가능 여부(마이그레이션 적용 여부)
let dashReload = null;               // 기간을 바꿨을 때 다시 부를 렌더 함수(화면마다 다름)
const DASH_CELLS = {};  // 드릴다운 시트가 참조할 셀 원본. dashCardHtml 이 채운다
let dashSeq = 0;

// 'YYYY-MM-DD' → "7/12<br>(토)" (2줄). UTC 파싱으로 타임존 드리프트 방지.
function dashColLabel(dateStr){
  const [y,m,d]=dateStr.split("-").map(Number); const dt=new Date(Date.UTC(y,m-1,d));
  const wk=["일","월","화","수","목","금","토"][dt.getUTCDay()];
  return `${m}/${d}<br><span class="wk">${wk}</span>`;
}
// ① 리드 숫자 하나 + KPI 4칸. 이전에는 "N일 · N회" pill 안에 파묻혀 있었다.
function dashHeroHtml(c){
  const days=c.days||[];
  const servings=c.servings_total||0, used=c.used_days||0;
  const closed=days.reduce((a,d)=>a+(d.closed||0),0);
  const multi=days.filter(d=>(d.servings||0)>=2).length;      // 하루 2회 이상 섬긴 날
  const cups=(c.members||[]).reduce((s,m)=>s+(m.menus||[]).reduce((a,x)=>a+(x.count||0),0),0);
  const avg=used?(servings/used):0;
  const rate=servings?Math.round(closed/servings*100):0;      // 날이 아니라 '섬김' 기준 마감률
  return `<div class="hero"><div class="hero-n">${servings}</div>
    <div class="hero-l">이 기간 섬김 횟수</div>
    <div class="hero-sub">${used}일 동안 · 하루 평균 ${avg.toFixed(1)}회</div></div>
    <div class="kpis">
      <div class="kpi" data-tip="섬김을 연 날 수(중복 없이)"><div class="n">${used}</div><div class="l">활동한 날</div></div>
      <div class="kpi" data-tip="하루에 2번 이상 섬긴 날 — 이 앱은 하루 여러 번 섬김을 지원한다"><div class="n">${multi}</div><div class="l">2회+ 인 날</div></div>
      <div class="kpi" data-tip="이 기간 주문된 음료 총 잔 수(섬김마다 따로 셈)"><div class="n">${cups}</div><div class="l">총 잔</div></div>
      <div class="kpi" data-tip="섬김 ${servings}회 중 ${closed}회 마감"><div class="n">${rate}<span style="font-size:12px">%</span></div><div class="l">마감률</div></div>
    </div>`;
}
// ② 사용 빈도 — 한 색. 마감=채움 / 진행중=윤곽. 데이터가 있는 날만 나열(빈 날 미표시).
function usageBarsHtml(days){
  const list=(days||[]).slice().sort((a,b)=> a.date<b.date?-1:1);
  const head=`<div class="row-between" style="padding:2px 0 4px"><b style="font-size:13px">☕ 사용 빈도</b>
    <span class="legend"><span><i></i>마감</span><span><i class="open"></i>진행중</span></span></div>`;
  if(!list.length) return head+`<div class="muted" style="font-size:12px;padding:6px 0">이 기간 섬김 기록이 없어요</div>`;
  const max=Math.max(1, ...list.map(x=>x.servings)), lastI=list.length-1;
  return head+`<div class="usage-wrap"><div class="usage">${list.map((x,i)=>{
    const n=x.servings||0, cl=Math.min(x.closed||0, n), op=n-cl;
    const h=Math.max(8,Math.round(n/max*54));
    // 하루에 여러 번 섬길 수 있으므로 막대 하나를 마감/진행중으로 쪼갠다.
    // 예전엔 closed>0 이면 통째로 '마감'이라 2회 중 1회만 마감한 날이 잘못 보였다.
    const gap=(cl&&op)?2:0;                       // 두 구간 사이 2px — 총 높이에서 미리 빼야 안 잘린다
    const hc=n?Math.round((h-gap)*cl/n):0, ho=h-gap-hc;
    const seg=(cl?`<i class="cl" style="height:${hc}px"></i>`:"")+(op?`<i class="op" style="height:${ho}px"></i>`:"");
    const show = n===max || i===lastI;   // 값 라벨은 최댓값·마지막만
    return `<div class="ubar" data-tip="${esc(x.date)} · 섬김 ${n}회${n>=2?' (하루 여러 번)':''} — 마감 ${cl} · 진행중 ${op}">
      <div class="ubar-n"${show?'':' style="visibility:hidden"'}>${n}</div>
      <div class="ubar-b" style="height:${h}px">${seg}</div>
      <div class="ubar-d">${dashColLabel(x.date)}</div></div>`;
  }).join("")}</div></div>`;
}
// ③ 사람별 참여 — 세로로 읽히는 목록이라 가로 스크롤이 없다. 날짜별 매트릭스는 드릴다운으로.
function peopleListHtml(c, key){
  const ms=c.members||[];
  // 마이그레이션(db-migration-dashboard-range.sql) 적용 시 '횟수'가 온다. 없으면 날짜 개수로 폴백.
  const byCt = ms.some(m=>m.attend_ct!=null);
  const denom = byCt ? (c.servings_total||0) : (c.used_days||0);
  const unit  = byCt ? "회" : "일";
  const rows=ms.map(m=>({ name:m.name,
      a: m.attend_ct!=null ? m.attend_ct : (m.dates||[]).length,
      s: m.serve_ct!=null  ? m.serve_ct  : (m.serve_dates||[]).length,
      t: m.attend_total||0 }))
    .sort((x,y)=> y.a-x.a || y.s-x.s || x.name.localeCompare(y.name,"ko"));
  const head=`<div class="row-between" style="padding:2px 0 4px"><b style="font-size:13px">🙌 사람별 참여</b>
    <button class="nav-link" data-mx="${key}" style="font-size:12px">날짜별 보기</button></div>`;
  if(!rows.length) return head+`<p class="muted center" style="padding:8px 0">구성원이 없어요</p>`;
  return head+rows.map(r=>{
    const pct=denom?Math.min(100,Math.round(r.a/denom*100)):0;
    const tip = byCt
      ? `${r.name} · 섬김 ${denom}회 중 ${r.a}회 참여 (${pct}%) · 직접 섬김 ${r.s}회 · 누적 참여 ${r.t}회`
      : `${r.name} · 활동한 ${denom}일 중 ${r.a}일 출석 (${pct}%) · 섬긴 날 ${r.s}일 · 누적 ${r.t} — 하루에 여러 번 섬겨도 날 기준으로 셉니다`;
    return `<div class="prow" data-tip="${esc(tip)}">
      <div class="row-between" style="margin-bottom:5px">
        <span class="prow-n">${esc(r.name)}</span>
        <span class="muted" style="font-size:11.5px;flex:none">${r.a}/${denom}${unit}${r.s?` · ☕${r.s}${unit}`:''} · 누적 ${r.t}</span></div>
      <div class="meter"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
}
// ④ 많이 마신 메뉴 — 가로 막대 Top 8. 나머지는 묶어서 개수를 밝힌다(조용히 자르지 않는다).
function menuTopHtml(c, key){
  const agg={};
  (c.members||[]).forEach(m=>(m.menus||[]).forEach(x=>{ agg[x.name]=(agg[x.name]||0)+(x.count||0); }));
  const list=Object.keys(agg).map(k=>({name:k,n:agg[k]})).sort((a,b)=> b.n-a.n || a.name.localeCompare(b.name,"ko"));
  if(!list.length) return "";
  const top=list.slice(0,8), rest=list.slice(8);
  const max=Math.max(1,...top.map(x=>x.n));
  const rows=top.map(x=>`<div class="hbar" data-tip="${esc(x.name)} · ${x.n}잔">
      <div class="row-between"><span class="hbar-name">${esc(x.name)}</span><span class="hbar-n">${x.n}</span></div>
      <div class="hbar-track"><i style="width:${Math.round(x.n/max*100)}%"></i></div></div>`).join("");
  const more = rest.length
    ? `<div class="muted" style="font-size:11.5px;padding:6px 2px 0">그 외 ${rest.length}종 ${rest.reduce((s,x)=>s+x.n,0)}잔</div>` : "";
  return `<div style="height:12px"></div>
    <div class="row-between" style="padding:2px 0 4px"><b style="font-size:13px">🥤 많이 마신 메뉴</b>
      <button class="nav-link" data-mbm="${key}" style="font-size:12px">사람별로 보기</button></div>${rows}${more}`;
}
// 누가 자주 섬겼는지 — 이 기간 섬김(호스트) 횟수 랭킹 칩
function serveRankHtml(c){
  const ranked=(c.members||[]).map(m=>({name:m.name, ct:(m.serve_dates||[]).length}))
    .filter(x=>x.ct>0).sort((a,b)=> b.ct-a.ct || a.name.localeCompare(b.name,"ko"));
  if(!ranked.length) return "";
  return `<div class="muted" style="font-size:12px;margin:10px 0 4px">👑 이 기간 누가 섬겼나</div>
    <div class="logchips" style="margin-bottom:2px">${ranked.map((r,i)=>
      `<span class="logchip ${i===0?'add':''}" style="font-size:12px">${i===0?'👑 ':''}${esc(r.name)} <b>${r.ct}회</b></span>`).join("")}</div>`;
}
// 드릴다운 A: 구성원 × 날짜 매트릭스. ☕=섬김 / ●=출석 / ·=없음.
function attendMatrixHtml(c){
  const members=c.members||[];
  const colSet={}; (c.days||[]).forEach(d=>colSet[d.date]=1);
  members.forEach(m=>{ (m.dates||[]).forEach(d=>colSet[d]=1); (m.serve_dates||[]).forEach(d=>colSet[d]=1); });
  const cols=Object.keys(colSet).sort();
  if(!cols.length) return `<p class="muted center" style="padding:8px 0">이 기간 출석 기록이 없어요</p>`;
  const head=`<tr><th class="mx-name">구성원</th>${cols.map(d=>`<th class="mx-date">${dashColLabel(d)}</th>`).join("")}<th class="mx-sum">출석·섬김</th></tr>`;
  const rows=members.length ? members.map(m=>{
    const att={}; (m.dates||[]).forEach(d=>att[d]=1);
    const srv={}; (m.serve_dates||[]).forEach(d=>srv[d]=1);
    const cells=cols.map(d=> srv[d] ? `<td class="mx-cell srv" data-tip="${esc(m.name)} · ${esc(d)} 섬김">☕</td>`
      : att[d] ? `<td class="mx-cell att" data-tip="${esc(m.name)} · ${esc(d)} 출석">●</td>`
      : `<td class="mx-cell">·</td>`).join("");
    const aCt=(m.dates||[]).length, sCt=(m.serve_dates||[]).length, at=m.attend_total||0;
    return `<tr><td class="mx-name">${esc(m.name)}</td>${cells}<td class="mx-sum" data-tip="이 기간 출석 ${aCt} · 섬김 ${sCt} · 누적 출석 ${at}">${aCt}<span class="muted" style="font-weight:600">·</span>☕${sCt}<span class="muted" style="font-weight:600;font-size:11px"> · 누적${at}</span></td></tr>`;
  }).join("") : `<tr><td class="mx-name">—</td><td class="mx-cell" colspan="${cols.length+1}">구성원이 없어요</td></tr>`;
  return `<p class="muted" style="margin:0 0 6px;font-size:12px">☕ 섬김 · ● 출석 · · 기록 없음</p>
    <div class="mx-wrap"><table class="mx"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}
// 드릴다운 B: 사람별로 어떤 메뉴를 몇 번 주문했는지
function menuByMemberHtml(c){
  const members=(c.members||[]).filter(m=>(m.menus||[]).length);
  if(!members.length) return `<p class="muted center" style="padding:8px 0">이 기간 주문 기록이 없어요</p>`;
  return members.map(m=>{
    const tot=(m.menus||[]).reduce((s,x)=>s+(x.count||0),0);
    const chips=(m.menus||[]).map(x=>`<span class="logchip" style="font-size:12px">${esc(x.name)} <b>${x.count}</b></span>`).join("");
    return `<div style="padding:8px 2px;border-bottom:1px solid var(--line)">
      <div class="row-between" style="margin-bottom:5px"><span style="font-weight:700;font-size:13px">${esc(m.name)}</span>
        <span class="muted" style="font-size:11px">총 ${tot}잔</span></div>
      <div class="logchips">${chips}</div></div>`;
  }).join("");
}
// 셀 카드 1개 (관리자 대시보드·셀 단위 대시보드 공용)
function dashCardHtml(c, opts){ opts=opts||{};
  const key="d"+(++dashSeq); DASH_CELLS[key]=c;
  const meta = opts.showCode ? ` · 초대코드 ${esc(c.cell_id)} · ${c.member_count||0}명` : ` · ${c.member_count||0}명`;
  return `<div class="card" style="padding:14px 16px 12px">
    <div class="row-between dash-card-head" style="margin-bottom:2px">
      <div style="min-width:0"><b style="font-size:16px">${esc(c.name)}</b>
        <span class="muted" style="font-size:12px">${meta}</span></div>
    </div>
    ${dashHeroHtml(c)}
    ${usageBarsHtml(c.days)}
    ${serveRankHtml(c)}
    <div style="height:12px"></div>
    ${peopleListHtml(c, key)}
    ${menuTopHtml(c, key)}
  </div>`;
}
// 드릴다운 시트 + 기간 필터 — 문서에 한 번만 거는 위임 핸들러
document.addEventListener("click", e=>{
  const pr=e.target.closest("[data-preset]");
  if(pr){ const r=presetRange(pr.dataset.preset); dashFrom=r[0]; dashTo=r[1];
    if(dashReload) dashReload(); return; }
  const cc=e.target.closest("[data-cell]");
  if(cc){ dashSel=cc.dataset.cell; paintAdminDash(true); return; }
  const mx=e.target.closest("[data-mx]");
  if(mx){ const c=DASH_CELLS[mx.dataset.mx];
    if(c) openSheet(`<h3>📅 ${esc(c.name)} · 날짜별 출석</h3>
      <div class="sheet-scroll">${attendMatrixHtml(c)}</div>
      <div class="sheet-foot"><button class="btn btn-ghost btn-close" id="dxClose">닫기</button></div>`);
    const b1=document.getElementById("dxClose"); if(b1) b1.onclick=closeSheet; return; }
  const mb=e.target.closest("[data-mbm]");
  if(mb){ const c=DASH_CELLS[mb.dataset.mbm];
    if(c) openSheet(`<h3>🥤 ${esc(c.name)} · 사람별 메뉴</h3>
      <div class="sheet-scroll">${menuByMemberHtml(c)}</div>
      <div class="sheet-foot"><button class="btn btn-ghost btn-close" id="dmClose">닫기</button></div>`);
    const b2=document.getElementById("dmClose"); if(b2) b2.onclick=closeSheet; }
});
// 기간 달력 — 바꾸면 서버를 다시 부른다(집계 구간이 달라지므로)
document.addEventListener("change", e=>{
  const t=e.target; if(t.id!=="dFrom" && t.id!=="dTo") return;
  const v=t.value; if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
  if(t.id==="dFrom") dashFrom=v; else dashTo=v;
  if(dashFrom>dashTo){ const tmp=dashFrom; dashFrom=dashTo; dashTo=tmp; }   // 뒤집힌 입력 교정
  if(dashReload) dashReload();
});
// 셀·사람 검색 — 서버를 다시 부르지 않고 캐시된 결과만 다시 그린다.
// 조합 중(ㅎ→하→하ㅅ)에도 그대로 그린다 — 입력창은 갈아끼우지 않으므로 IME 가 끊기지 않고,
// 자음 하나만 쳐도 초성 검색이 걸려 결과가 바로 좁혀진다.
document.addEventListener("input", e=>{
  if(e.target.id!=="dQ") return;
  dashQ=e.target.value; paintAdminDash(true);
});
// 탭 툴팁 — title= 은 터치에서 아예 안 뜬다. [data-tip] 을 누르면 화면 안쪽으로 물려 띄운다.
(function tipLayer(){
  let $tip=null;
  const hide=()=>{ if($tip) $tip.classList.remove("show"); };
  const show=el=>{
    const t=el.getAttribute("data-tip"); if(!t) return hide();
    if(!$tip){ $tip=document.createElement("div"); $tip.className="tip"; document.body.appendChild($tip); }
    $tip.textContent=t; $tip.classList.add("show");
    const r=el.getBoundingClientRect(), b=$tip.getBoundingClientRect();
    $tip.style.left=Math.max(8, Math.min(r.left+r.width/2-b.width/2, window.innerWidth-b.width-8))+"px";
    $tip.style.top=(r.top-b.height-8 < 8 ? r.bottom+8 : r.top-b.height-8)+"px";
  };
  document.addEventListener("click", e=>{ const el=e.target.closest("[data-tip]"); el?show(el):hide(); });
  document.addEventListener("scroll", hide, true);
  window.addEventListener("resize", hide);
})();
// 셀 단위 대시보드 — ?cell=<id>&view=dashboard (관리자 로그인 없이 그 셀만)
async function renderCellDashboard(cellId){
  inPicker=false; adminMode=false; curView="celldash"; $bottom.innerHTML=""; document.body.classList.add("no-bottom");
  const cellLink=`${esc(location.pathname)}?cell=${esc(cellId)}`;
  if(!SHARED){
    $app.innerHTML=`<header><div class="room-name" style="padding-top:6px">📊 대시보드</div>
      <div class="date">공유(Supabase 연결) 환경에서만 동작해요</div></header>`;
    return;
  }
  $app.innerHTML=`
    <header><div class="h-row"><div><div class="room-name">📊 대시보드</div><div class="date">불러오는 중…</div></div>
      <a href="${cellLink}" class="nav-link" style="font-size:14px">← 셀로</a></div></header>
    <div class="loading"><div class="spinner"></div>집계하는 중…</div>`;
  let payload=null, err=null;
  try{ const r=await fetchDash(cellId); if(r.error) throw r.error; payload=r.data; }
  catch(e){ err=e; }
  if(err){
    $app.innerHTML=`<header><div class="room-name" style="padding-top:6px">📊 대시보드</div><div class="date">불러오기 실패</div></header>
      <div class="card"><p class="muted" style="margin:0;line-height:1.7">집계 함수를 불러오지 못했어요.<br><b>db-migration-admin-dashboard.sql</b> 을 Supabase에서 실행했는지 확인해주세요.<br><br><span style="font-size:12px;color:var(--red)">${esc(err.message||String(err))}</span></p></div>
      <p class="center" style="margin-top:12px"><a href="${cellLink}" class="nav-link">← 셀로 돌아가기</a></p>`;
    return;
  }
  if(!payload || !payload.cell){
    $app.innerHTML=`<header><div class="room-name" style="padding-top:6px">📊 대시보드</div><div class="date">셀을 찾을 수 없어요</div></header>
      <div class="card"><p class="muted center" style="margin:0;padding:8px 0">이 링크의 셀을 찾을 수 없어요. 링크를 다시 확인해주세요.</p></div>
      <p class="center" style="margin-top:12px"><a href="${esc(location.pathname)}" class="nav-link">← 처음으로</a></p>`;
    return;
  }
  dashReload=()=>renderCellDashboard(cellId);
  const c=payload.cell, today=(payload&&payload.today)||todayKey();
  $app.innerHTML=`
    <header><div class="h-row"><div style="min-width:0"><div class="room-name">📊 ${esc(c.name)}</div>
      <div class="date">${esc(today)} 기준 · 우리 셀 현황</div></div>
      <a href="${cellLink}" class="nav-link" style="font-size:14px">← 셀로</a></div></header>
    ${dashPeriodHtml()}
    ${dashCardHtml(c,{showCode:false})}
    <p class="muted center" style="margin:14px 0 0;font-size:12px;line-height:1.7">사용 = 섬김 오픈/마감<br>출석 = 이 앱에서 주문·안마심으로 의사표현한 날<br>누적 출석은 표시 기간과 무관하게 전체</p>`;
  scrollPresetIntoView();
}
/* ---------- 관리자 대시보드: 컨트롤 → 셀 그리드 → 연동 상세 ----------
   그리드에서 셀을 고르면 아래 상세가 그 셀로 바뀐다. 검색·선택은 재집계 없이
   캐시된 payload 로 다시 그리므로 즉각 반응한다(기간 변경만 서버를 다시 부른다). */
let dashPayload=null, dashQ="", dashSel=null;

function shiftDate(ds, n){ const d=new Date(ds+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function dashSpanDays(){ return Math.round((Date.parse(dashTo)-Date.parse(dashFrom))/86400000)+1; }

/* 기간 프리셋 — '며칠치'가 아니라 달력 기준(이번주·이번달·올해…)이다.
   기준일은 todayKey() 라 KST 고정이고, 계산은 'YYYY-MM-DD' 문자열 + UTC 로만 해서 시간대 밀림이 없다.
   아직 안 온 날은 데이터가 없으므로 진행 중 구간(이번주·이번달·올해)의 끝은 오늘로 자른다. */
const DASH_PRESETS=[["이번주","week"],["지난달","lastmon"],["이번달","month"],
                    ["최근3개월","q3"],["올해","year"],["작년","lastyear"]];
function presetRange(key){
  const t=todayKey(), y=+t.slice(0,4), m=+t.slice(5,7);
  const p=(yy,mm,dd)=>`${yy}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
  const lastDay=(yy,mm)=>new Date(Date.UTC(yy,mm,0)).getUTCDate();   // mm 은 1-based — 0일 = 그 달 말일
  switch(key){
    // 일요일 시작 — 교회 한 주가 주일부터라 달력과 감각이 맞는다
    case "week":    return [shiftDate(t, -new Date(t+"T00:00:00Z").getUTCDay()), t];
    case "month":   return [p(y,m,1), t];
    case "lastmon":{ const yy=m===1?y-1:y, mm=m===1?12:m-1; return [p(yy,mm,1), p(yy,mm,lastDay(yy,mm))]; }
    case "q3":      return [shiftDate(t,-89), t];   // 달력 분기가 아니라 오늘 기준 90일 롤링
    case "year":    return [p(y,1,1), t];
    case "lastyear":return [p(y-1,1,1), p(y-1,12,31)];
  }
  return [p(y,m,1), t];
}
function ensureDashRange(){ if(!dashFrom || !dashTo){ const r=presetRange("month"); dashFrom=r[0]; dashTo=r[1]; } }
// 가로 스크롤 줄이라 선택한 버튼이 화면 밖으로 밀릴 수 있다 — 다시 그린 뒤 가운데로 당겨온다
function scrollPresetIntoView(){
  const row=document.querySelector(".dash-filter"), on=row&&row.querySelector(".tab.on");
  if(row&&on) row.scrollLeft=Math.max(0, on.offsetLeft-(row.clientWidth-on.offsetWidth)/2);
}

// 기간 지정 RPC 를 먼저 시도하고, 없으면(마이그레이션 전) 레거시 p_days 로 떨어진다.
// 폴백 시 실제 구간은 '오늘부터 N일 전'이고 서버가 31일로 자르므로 화면에 그 사실을 밝힌다.
async function fetchDash(cellId){
  ensureDashRange();
  const fn = cellId ? "get_cell_dashboard" : "get_admin_dashboard";
  if(dashRangeRPC){
    const args = cellId ? {p_cell:cellId, p_from:dashFrom, p_to:dashTo} : {p_from:dashFrom, p_to:dashTo};
    const {data,error}=await Sync.client.rpc(fn,args);
    if(!error) return {data:data, error:null};
    dashRangeRPC=false;   // 이 시그니처가 없다 → 이후로는 레거시만 쓴다
  }
  const days=Math.min(31, Math.max(1, dashSpanDays()));
  const legacy = cellId ? {p_cell:cellId, p_days:days} : {p_days:days};
  return await Sync.client.rpc(fn,legacy);
}

// 달력 2개 + 프리셋 줄 — 셀 대시보드와 관리자 대시보드가 함께 쓴다
function dashDatesHtml(today){
  return `<div class="dash-dates">
      <input type="date" id="dFrom" value="${dashFrom}" max="${today}" aria-label="시작일">
      <span class="muted" style="flex:none">~</span>
      <input type="date" id="dTo" value="${dashTo}" max="${today}" aria-label="종료일">
    </div>`;
}
function dashPresetsHtml(){
  return `<div class="tabs dash-filter" role="group" aria-label="기간 선택">${DASH_PRESETS.map(([l,k])=>{
    const r=presetRange(k), on=(dashFrom===r[0] && dashTo===r[1]);
    return `<button class="tab${on?' on':''}" data-preset="${k}" aria-pressed="${on}">${l}</button>`;
  }).join("")}</div>`;
}
function dashWarnHtml(){
  if(dashRangeRPC) return "";
  return `<p class="dash-warn">⚠️ <b>db-migration-dashboard-range.sql</b> 미적용 — 서버가 최근 ${Math.min(31,dashSpanDays())}일까지만 집계합니다(오늘 기준). 날짜 지정과 지난달·최근3개월·올해·작년은 이 파일을 Supabase 에서 실행해야 동작해요.</p>`;
}
// 셀 단위 대시보드용 — 통합 검색은 없고 기간만
function dashPeriodHtml(){
  ensureDashRange();
  return `<div class="card dash-ctl">${dashDatesHtml(todayKey())}${dashPresetsHtml()}${dashWarnHtml()}</div>`;
}
// 관리자 컨트롤 바 — 달력 2개 + 프리셋 + 통합 검색
function dashControlsHtml(){
  ensureDashRange();
  return `<div class="card dash-ctl">
    ${dashDatesHtml(todayKey())}
    ${dashPresetsHtml()}
    <input type="search" id="dQ" value="${esc(dashQ)}" placeholder="🔍 셀·사람 이름 (예: 2셀, ㅎㅅ)"
      aria-label="셀 또는 사람 이름 검색 — 초성·오타 허용" autocomplete="off" autocorrect="off"
      autocapitalize="off" spellcheck="false" enterkeyhint="search">
    ${dashWarnHtml()}
  </div>`;
}
// 검색: 셀 이름이 걸리면 셀째로, 사람 이름이 걸리면 그 사람이 속한 셀을 남긴다.
function dashFilter(cells){
  const ql=norm(dashQ);
  if(!ql) return {list:cells, people:[]};
  const people=[];
  const list=cells.filter(c=>{
    const byCell=nameHit(c.name, ql);
    const hits=(c.members||[]).filter(m=>nameHit(m.name, ql));
    hits.forEach(m=>people.push({cell:c.name, name:m.name, ct:(m.serve_ct!=null?m.serve_ct:(m.serve_dates||[]).length)}));
    return byCell || hits.length>0;
  });
  return {list, people};
}
// 14일치 미니 막대 — 그리드 타일에서 추세를 한눈에
function sparkHtml(days, max){
  const list=(days||[]).slice().sort((a,b)=> a.date<b.date?-1:1).slice(-14);
  if(!list.length) return `<span class="cc-none">기록 없음</span>`;
  return list.map(d=>`<i style="height:${Math.max(2,Math.round((d.servings||0)/max*16))}px"></i>`).join("");
}
// 전체 요약 — 필터가 걸리면 걸린 셀들만 합산한다
function dashTotalsHtml(cells){
  const sv=cells.reduce((a,c)=>a+(c.servings_total||0),0);
  const cups=cells.reduce((a,c)=>a+(c.members||[]).reduce((s,m)=>s+(m.menus||[]).reduce((t,x)=>t+(x.count||0),0),0),0);
  const active=cells.filter(c=>(c.servings_total||0)>0).length;
  const multi=cells.reduce((a,c)=>a+(c.days||[]).filter(d=>(d.servings||0)>=2).length,0);
  return `<div class="kpis" style="margin:0 0 14px">
    <div class="kpi" data-tip="이 기간 모든 셀의 섬김 합계"><div class="n">${sv}</div><div class="l">총 섬김</div></div>
    <div class="kpi" data-tip="한 번이라도 섬김을 연 셀"><div class="n">${active}</div><div class="l">활동 셀</div></div>
    <div class="kpi"><div class="n">${cups}</div><div class="l">총 잔</div></div>
    <div class="kpi" data-tip="하루에 2번 이상 섬긴 날(모든 셀 합)"><div class="n">${multi}</div><div class="l">2회+ 인 날</div></div>
  </div>`;
}
// 셀 활용도 그리드 — 많이 쓴 순. 누르면 아래 상세가 바뀐다.
function cellGridHtml(cells){
  const sorted=cells.slice().sort((a,b)=> (b.servings_total||0)-(a.servings_total||0)
    || (b.used_days||0)-(a.used_days||0) || a.name.localeCompare(b.name,"ko"));
  const max=Math.max(1,...sorted.map(c=>c.servings_total||0));
  const head=`<div class="row-between" style="padding:2px 2px 6px"><b style="font-size:13px">🏆 많이 활용한 셀</b>
    <span class="muted" style="font-size:11.5px">누르면 아래 상세가 바뀝니다</span></div>`;
  if(!sorted.length) return head+`<div class="card"><p class="muted center" style="margin:0;padding:10px 0">조건에 맞는 셀이 없어요</p></div>`;
  return head+`<div class="cellgrid">${sorted.map((c,i)=>{
    const n=c.servings_total||0;
    return `<button class="cellcard${dashSel===c.cell_id?' on':''}" data-cell="${esc(c.cell_id)}" aria-pressed="${dashSel===c.cell_id}">
      <div class="cc-top"><span class="cc-rank">${i+1}</span><span class="cc-name">${esc(c.name)}</span></div>
      <div class="cc-n">${n}<span>회</span></div>
      <div class="cc-spark">${sparkHtml(c.days,max)}</div>
      <div class="cc-meta">${c.used_days||0}일 · ${c.member_count||0}명</div></button>`;
  }).join("")}</div>`;
}
// 사람 검색이 걸렸을 때: 어느 셀의 누구인지 먼저 보여준다
function dashPeopleHitHtml(people){
  if(!people.length) return "";
  return `<div class="card" style="padding:12px 14px;margin-bottom:12px">
    <div class="muted" style="font-size:12px;margin-bottom:6px">🙋 이름이 걸린 사람 ${people.length}명</div>
    <div class="logchips">${people.slice(0,20).map(p=>
      `<span class="logchip" style="font-size:12px">${esc(p.name)} <span class="muted">· ${esc(p.cell)}</span>${p.ct?` <b>☕${p.ct}</b>`:''}</span>`).join("")}</div>
    ${people.length>20?`<div class="muted" style="font-size:11.5px;padding-top:6px">그 외 ${people.length-20}명</div>`:''}</div>`;
}
// 컨트롤 바 아래 본문 — 검색·셀 선택으로 바뀌는 건 전부 여기 안에 있다
function dashBodyHtml(list, people, sel){
  return `${dashPeopleHitHtml(people)}
    ${dashTotalsHtml(list)}
    ${cellGridHtml(list)}
    <div style="height:14px"></div>
    ${sel?dashCardHtml(sel,{showCode:true}):'<div class="card"><p class="muted center" style="margin:0;padding:10px 0">셀을 선택하면 상세가 보입니다</p></div>'}
    <p class="muted center" style="margin:14px 0 0;font-size:12px;line-height:1.7">사용 = 섬김 오픈/마감<br>출석 = 이 앱에서 주문·안마심으로 의사표현한 것<br>누적은 표시 기간과 무관하게 전체</p>`;
}
/* 캐시된 payload 로 다시 그리기 — 검색·셀 선택은 서버를 다시 부르지 않는다.
   bodyOnly=true 면 컨트롤 바를 건드리지 않고 #dashBody 만 갈아끼운다. 이게 한글 검색의 핵심 —
   input 을 통째로 다시 만들면 조합 중이던 IME 가 끊겨 "하성"이 "ㅎㅏㅅㅓㅇ"으로 풀린다.
   검색어·셀 선택은 컨트롤 바를 바꾸지 않으므로 다시 그릴 이유도 없다. */
function paintAdminDash(bodyOnly){
  if(!dashPayload) return;
  const all=dashPayload.cells||[];
  const {list,people}=dashFilter(all);
  const sorted=list.slice().sort((a,b)=> (b.servings_total||0)-(a.servings_total||0));
  if(!sorted.some(c=>c.cell_id===dashSel)) dashSel = sorted.length?sorted[0].cell_id:null;
  const sel=sorted.find(c=>c.cell_id===dashSel);
  const count=`${esc(dashPayload.from||dashFrom)} ~ ${esc(dashPayload.to||dashTo)} · 셀 ${list.length}/${all.length}개`;

  const body=bodyOnly && document.getElementById("dashBody");
  if(body){
    body.innerHTML=dashBodyHtml(list, people, sel);
    const h=document.getElementById("dashCount"); if(h) h.innerHTML=count;
    return;
  }

  $app.innerHTML=`
    <header><div class="h-row"><div style="min-width:0"><div class="room-name">📊 대시보드</div>
      <div class="date" id="dashCount">${count}</div></div>
      <button class="nav-link" id="dback">← 관리자</button></div></header>
    ${dashControlsHtml()}
    <div id="dashBody">${dashBodyHtml(list, people, sel)}</div>`;

  const b=document.getElementById("dback");
  if(b) b.onclick=()=>{ if(subActive) history.back(); else renderAdminDash(); };
  scrollPresetIntoView();
}
async function renderAdminDashboard(){
  if(!SHARED){ toast("Supabase 연결 필요"); return; }
  if(curView!=="admindash") pushSub();
  curView="admindash"; dashReload=renderAdminDashboard; ensureDashRange();
  $app.innerHTML=`
    <header><div class="h-row"><div><div class="room-name">📊 대시보드</div><div class="date">불러오는 중…</div></div>
      <button class="nav-link" id="dback">← 관리자</button></div></header>
    <div class="loading"><div class="spinner"></div>집계하는 중…</div>`;
  const bk=document.getElementById("dback");
  if(bk) bk.onclick=()=>{ if(subActive) history.back(); else renderAdminDash(); };

  const {data,error}=await fetchDash(null);
  if(error){
    $app.innerHTML=`
      <header><div class="h-row"><div><div class="room-name">📊 대시보드</div><div class="date">불러오기 실패</div></div>
        <button class="nav-link" id="dback">← 관리자</button></div></header>
      <div class="card"><p class="muted" style="margin:0;line-height:1.7">집계 함수를 불러오지 못했어요.<br><b>db-migration-admin-dashboard.sql</b> 을 Supabase에서 실행했는지 확인해주세요.<br><br><span style="font-size:12px;color:var(--red)">${esc(error.message||String(error))}</span></p></div>`;
    const b2=document.getElementById("dback");
    if(b2) b2.onclick=()=>{ if(subActive) history.back(); else renderAdminDash(); };
    return;
  }
  dashPayload=data||{cells:[]};
  paintAdminDash();
}

// 셀별 구성원 수정 내역(관리자 전용 열람) — member_logs 최신순
async function openCellLogSheet(cell){

    <h3>🕘 ${esc(cell.name)} · 수정 내역</h3>
    <p class="muted" style="margin-top:0">누가 구성원을 추가/이름변경/삭제했는지 (최신순${logs.length>=100?" · 최근 100건":""})</p>

    <div style="height:10px"></div><button class="btn btn-ghost btn-close" id="lclose">닫기</button>`);

// 섬김 정리(관리자) — 셀의 섬김 목록 + 진행 중 섬김 마감/삭제
async function openServingAdminSheet(cell){
  openSheet(`<h3>🧹 ${esc(cell.name)} · 섬김 정리</h3><p class="muted" style="margin-top:0">불러오는 중…</p>`);
  async function draw(){

    try{ const {data,error}=await Sync.client.rpc("admin_list_servings",{p_room:cell.roomId||cell.id}); if(error) throw error; list=data||[]; }

      openSheet(`<h3>🧹 ${esc(cell.name)} · 섬김 정리</h3><p class="muted">불러오기 실패: ${esc(e.message||e)}<br><br><b>db-migration-admin-tools.sql</b> 실행 여부를 확인해주세요.</p><button class="btn btn-ghost btn-close" id="sclose">닫기</button>`);
      document.getElementById("sclose").onclick=closeSheet; return;
    }
    const rows = list.length ? list.map(s=>{
      const host = s.host_id ? esc((memInCell(cell,s.host_id))||s.host_id) : "호스트 없음";

      return `<div class="person serving-row" style="align-items:center">
        <div style="flex:1;min-width:0">
          <div class="pname">${esc(s.dt)} · ${s.seq}번째 ${badge}</div>
          <div class="pmenu">주문 ${s.n_orders}건 · ${host}</div>
        </div>
        <div class="serving-actions" style="display:flex;gap:6px;flex:none">
          ${s.state==="open"?`<button class="btn btn-brand btn-sm servclose" data-d="${esc(s.dt)}" data-s="${s.seq}">주문 마감</button>`:""}
          <button class="btn btn-danger btn-sm servdel" data-d="${esc(s.dt)}" data-s="${s.seq}">삭제</button>
        </div>
      </div>`;
    }).join("") : '<p class="muted center" style="padding:14px 0">섬김 기록이 없어요.</p>';
    openSheet(`
      <h3>🧹 ${esc(cell.name)} · 섬김 정리</h3>
      <p class="muted" style="margin-top:0">진행 중인 주문을 마감하거나 실수로 만들어진 섬김을 지웁니다. 삭제하면 <b>그 섬김의 주문도 함께 삭제</b>되며 되돌릴 수 없어요.</p>
      <div class="card" style="padding:2px 14px">${rows}</div>
      <div style="height:10px"></div><button class="btn btn-ghost btn-close" id="sclose">닫기</button>`);
    document.getElementById("sclose").onclick=closeSheet;
    $sheet.querySelectorAll(".servclose").forEach(b=> b.onclick=async()=>{
      if(!(await askConfirm(`${b.dataset.d} · ${b.dataset.s}번째 섬김의 주문을 마감할까요?`,{ok:"마감하기"}))) return;
      const {error}=await Sync.client.rpc("admin_close_serving",{p_room:cell.roomId||cell.id,p_date:b.dataset.d,p_seq:+b.dataset.s});
      if(error){ toast("마감 실패: "+(error.message||"")); return; }
      toast("주문을 마감했어요"); draw();
    });
    $sheet.querySelectorAll(".servdel").forEach(b=> b.onclick=async()=>{
      if(!(await askConfirm(`${b.dataset.d} · ${b.dataset.s}번째 섬김을 삭제할까요?\n이 섬김의 주문도 함께 지워집니다.`,{ok:"삭제",danger:true}))) return;
      const {error}=await Sync.client.rpc("admin_delete_serving",{p_room:cell.roomId||cell.id,p_date:b.dataset.d,p_seq:+b.dataset.s});
      if(error){ toast("삭제 실패: "+(error.message||"")); return; }
      toast("삭제됨"); draw();
    });
  }
  draw();
}
function memInCell(cell,id){ const m=(cell.members||[]).find(x=> (x&&typeof x==="object")? x.id===id : x===id); return m ? (m.name||m) : null; }

// 셀 URL(초대코드) 변경(관리자) — 데이터·대시보드 전부 이관
function openRenameCellSheet(cell){
  const old=cell.id;
  openSheet(`
    <h3>🔗 주소(초대코드) 변경</h3>
    <p class="muted" style="margin-top:0"><b>${esc(cell.name)}</b>의 링크를 바꿉니다. 기존 주문·섬김·출석(대시보드)·수정내역이 <b>새 주소로 모두 이관</b>돼요.</p>
    <div class="banner-warn" style="margin:0 0 10px">⚠️ 예전 링크(<b>${esc(old)}</b>)는 더 이상 열리지 않습니다. 바꾼 뒤 <b>새 링크를 다시 공유</b>하세요.</div>
    <div class="label" id="lbl-newid">새 초대코드</div>
    <input type="text" id="newid" maxlength="40" value="${esc(old)}" placeholder="영문 소문자·숫자·하이픈(-)" autocapitalize="off" autocomplete="off" spellcheck="false" aria-labelledby="lbl-newid" />
    <p class="muted" style="font-size:12px;margin:6px 0 0">3~40자, 소문자/숫자/하이픈만. 새 링크: <span id="prev" style="word-break:break-all;color:var(--brand)"></span></p>
    <div style="height:16px"></div>
    <button class="btn btn-brand" id="dorename">주소 변경 + 데이터 이관</button>
    <div style="height:8px"></div><button class="btn btn-ghost btn-close" id="rclose">닫기</button>`);
  const inp=document.getElementById("newid"), prev=document.getElementById("prev");
  const norm=v=> (v||"").toLowerCase().replace(/[^a-z0-9-]/g,"");
  const upd=()=>{ const v=norm(inp.value); if(inp.value!==v) inp.value=v; prev.textContent=`${location.origin}${location.pathname}?cell=${v}`; };
  inp.oninput=upd; upd();
  document.getElementById("rclose").onclick=closeSheet;
  document.getElementById("dorename").onclick=()=>guardWrite(async()=>{
    const nid=norm(inp.value);
    if(!/^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/.test(nid)){ toast("초대코드 형식을 확인해주세요(3~40자, 소문자/숫자/-)"); return; }
    if(nid===old){ toast("기존과 다른 주소를 입력해주세요"); return; }
    if(cellById(nid)){ toast("이미 사용 중인 초대코드예요"); return; }
    if(!(await askConfirm(`주소를 '${old}' → '${nid}' 로 바꾸고 데이터를 이관할까요?\n예전 링크는 열리지 않게 됩니다.`,{ok:"변경",danger:true}))) return;
    const {error}=await Sync.client.rpc("admin_rename_cell",{p_old:old,p_new:nid});
    if(error){ toast("변경 실패: "+(error.message||"")); return; }
    closeSheet(); toast("주소를 바꾸고 데이터를 이관했어요"); await loadDbCells(); renderAdminDash();
  });
}

function renderLogEntry(l){
  const chips=(l.changes||[]).map(c=>
    c.op==="add"    ? `<span class="logchip add">+ ${esc(c.name||"")}</span>` :
    c.op==="remove" ? `<span class="logchip rem">− ${esc(c.name||"")}</span>` :
    c.op==="rename" ? `<span class="logchip ren">${esc(c.from||"")} → ${esc(c.to||"")}</span>` : ""
  ).join("");
  return `<div class="logrow"><div class="logmeta"><b>${esc(l.actor||"익명")}</b> · ${esc(fmtLogTime(l.created_at))}</div><div class="logchips">${chips}</div></div>`;
}
function fmtLogTime(iso){ try{ const p=new Intl.DateTimeFormat("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Seoul"}).formatToParts(new Date(iso)); const g=t=>(p.find(x=>x.type===t)||{}).value||""; return `${g("month")}/${g("day")} ${g("hour")}:${g("minute")}`; }catch(e){ return iso||""; } }

// 카페 메뉴 관리 (관리자) — DB(cafe_menus) CRUD + 코드 76개 시드
async function openCafeMenuAdmin(cafeId){
  if(!SHARED){ toast("Supabase 연결 필요"); return; }
  if(curView!=="adminmenu") pushSub();
  curView="adminmenu";
  delete CAFEMENU_CACHE[cafeId]; const menus=await loadCafeMenus(cafeId);
  const sorted=menus.slice().sort((a,b)=>(a.sort-b.sort)||a.name.localeCompare(b.name,"ko"));
  const rows=sorted.map(m=>`<div class="person" data-id="${esc(m.id)}">
      <div style="font-size:20px;width:26px;text-align:center">${esc(m.emoji||"🥤")}</div>
      <div style="flex:1;min-width:0"><div class="pname">${esc(m.name)}</div><div class="pmenu">${esc(CAT_LABEL[m.cat]||m.cat||"기타")} · ${esc((m.temps||[]).join("/")||"-")}</div></div>
      <button class="btn btn-sm ${m.popular?'btn-brand':'btn-soft'} mpop" data-id="${esc(m.id)}" style="flex:none">${m.popular?'⭐인기':'인기'}</button>
      <button class="mdel2" data-id="${esc(m.id)}" aria-label="메뉴 삭제" style="background:none;border:none;color:var(--red);font-size:18px;flex:none;cursor:pointer;padding:12px 10px;margin:-12px -10px -12px 0;line-height:1">✕</button>
    </div>`).join("") || '<p class="muted">메뉴가 없어요. 아래 "기본 메뉴 불러오기"로 시작하세요.</p>';
  $app.innerHTML=`
    <header><div class="h-row"><div><div class="room-name">🍽️ 카페길 메뉴</div><div class="date">${menus.length}개 · 관리자</div></div>
      <button class="nav-link" id="mback" style="font-size:14px">← 관리자</button></div></header>
    ${menus.length?'':'<button class="btn btn-brand" id="seed">📥 기본 메뉴 76개 불러오기(시드)</button><div style="height:10px"></div>'}
    <button class="btn btn-soft" id="addMenu">➕ 메뉴 추가</button>
    ${menus.length?'<div style="height:6px"></div><button class="btn btn-ghost" id="reseed" style="font-size:13px">기본 메뉴 다시 덮어쓰기</button>':''}
    <div style="height:12px"></div>
    <div class="card" style="padding:6px 16px">${rows}</div>`;
  document.getElementById("mback").onclick=()=>{ if(subActive) history.back(); else renderAdminDash(); };
  const seedBtn=document.getElementById("seed")||document.getElementById("reseed");
  if(seedBtn) seedBtn.onclick=async()=>{ if(seedBtn.id==="reseed"&&!(await askConfirm("코드 기본 76개 메뉴로 덮어쓸까요?\n(같은 메뉴는 갱신됩니다)",{ok:"덮어쓰기",danger:true}))) return;
    const payload=GIL_MENUS.map((m,i)=>({cafe_id:cafeId,menu_id:m.id,name:m.name,emoji:m.emoji,cat:m.cat,temps:m.temps,extras:m.extras,popular:!!m.popular,sort:i}));
    const {error}=await Sync.client.from("cafe_menus").upsert(payload,{onConflict:"cafe_id,menu_id"});
    if(error){ toast("시드 실패: "+(error.message||"")); return; } delete CAFEMENU_CACHE[cafeId]; toast("기본 메뉴 등록됨"); openCafeMenuAdmin(cafeId); };
  document.getElementById("addMenu").onclick=()=>openMenuEditSheet(cafeId,null);
  $app.querySelectorAll(".mpop").forEach(b=> b.onclick=async()=>{ const m=menus.find(x=>x.id===b.dataset.id);
    const {error}=await Sync.client.from("cafe_menus").update({popular:!m.popular}).eq("cafe_id",cafeId).eq("menu_id",b.dataset.id);
    if(error){ toast("실패: "+error.message); return; } delete CAFEMENU_CACHE[cafeId]; openCafeMenuAdmin(cafeId); });
  $app.querySelectorAll(".mdel2").forEach(b=> b.onclick=async()=>{ if(!(await askConfirm("이 메뉴를 삭제할까요?",{ok:"삭제",danger:true}))) return;
    const {error}=await Sync.client.from("cafe_menus").delete().eq("cafe_id",cafeId).eq("menu_id",b.dataset.id);
    if(error){ toast("삭제 실패: "+error.message); return; } delete CAFEMENU_CACHE[cafeId]; toast("삭제됨"); openCafeMenuAdmin(cafeId); });
}
function openMenuEditSheet(cafeId, existing){
  let temps = existing? [...(existing.temps||["ICE","HOT"])] : ["ICE","HOT"];
  let cat = existing? (existing.cat||"coffee") : "coffee";
  function tchip(t){ return `<div class="chip ${temps.includes(t)?'sel':''}" data-t="${t}">${t}</div>`; }
  openSheet(`
    <h3>${existing?'메뉴 수정':'메뉴 추가'}</h3>
    <div class="label" id="lbl-mname">이름</div><input autocomplete="off" type="text" id="mname" maxlength="40" value="${esc(existing?existing.name:'')}" placeholder="예: 흑임자라떼" aria-labelledby="lbl-mname"/>
    <div class="label" id="lbl-memoji">이모지(선택)</div><input autocomplete="off" type="text" id="memoji" maxlength="4" value="${esc(existing?(existing.emoji||''):'')}" placeholder="🥤" aria-labelledby="lbl-memoji"/>
    <div class="label" id="lbl-mcat">분류</div>
    <select id="mcat" aria-labelledby="lbl-mcat" style="width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fff">${CAT_ORDER.map(c=>`<option value="${c}" ${c===cat?'selected':''}>${CAT_LABEL[c]}</option>`).join("")}</select>
    <div class="label">온도</div><div class="chips" id="mtemps">${tchip("ICE")}${tchip("HOT")}</div>
    <div style="height:14px"></div>
    <button class="btn btn-brand" id="msave">${existing?'수정':'추가'}</button>
    <div style="height:8px"></div><button class="btn btn-ghost btn-close" id="mcancel">닫기</button>`);
  document.getElementById("mtemps").querySelectorAll(".chip").forEach(c=> c.onclick=()=>{ const t=c.dataset.t,i=temps.indexOf(t); i>=0?temps.splice(i,1):temps.push(t); c.classList.toggle("sel"); });
  document.getElementById("mcancel").onclick=closeSheet;
  document.getElementById("msave").onclick=async()=>{
    const name=document.getElementById("mname").value.trim().slice(0,40); if(!name){ toast("이름을 입력해주세요"); return; }
    const emoji=document.getElementById("memoji").value.trim().slice(0,4)||"🥤"; cat=document.getElementById("mcat").value;
    const id=existing?existing.id:("m:"+name);
    const {error}=await Sync.client.from("cafe_menus").upsert({cafe_id:cafeId,menu_id:id,name,emoji,cat,temps,extras:existing?existing.extras:[],popular:existing?!!existing.popular:false},{onConflict:"cafe_id,menu_id"});
    if(error){ toast("저장 실패: "+error.message); return; } delete CAFEMENU_CACHE[cafeId]; closeSheet(); toast("저장됨"); openCafeMenuAdmin(cafeId); };
}

// 구성원 편집 (이 셀 링크를 가진 누구나) — set_members RPC
function openMembersSheet(){
  let list = MEMBERS.map(m=>({id:m.id, name:m.name}));   // 객체로 편집 — 이름 바꿔도 숨은 id 유지
  let baseline = memSig(list);                            // 동시편집 충돌 감지용 스냅샷(순서무관)
  function draw(){
    openSheet(`
      <h3>👥 ${esc(ROOM_NAME)} 구성원 편집</h3>
      <p class="muted" style="margin-top:0">이 셀 링크를 가진 누구나 편집할 수 있어요. <b>이름을 고쳐도 기존 주문은 그대로 따라옵니다.</b></p>
      <div class="card" style="padding:6px 14px" id="mlist">${list.length?list.map((m,i)=>`<div class="person"><div class="avatar">${esc(initials(m.name))}</div><input autocomplete="off" type="text" class="medit" data-i="${i}" value="${esc(m.name)}" maxlength="40" aria-label="구성원 이름" style="flex:1;border:none;background:transparent;font-size:16px;font-weight:600;color:var(--ink)" /><button class="mdel" data-i="${i}" aria-label="구성원 삭제" style="background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;flex:none;padding:12px 10px;margin:-12px -10px -12px 0;line-height:1">✕</button></div>`).join(""):'<p class="muted">구성원이 없어요</p>'}</div>
      <div class="inline-form" style="margin-top:10px"><input autocomplete="off" type="text" id="newM" maxlength="40" placeholder="구성원 이름 추가" aria-label="구성원 이름 추가"/><button class="btn btn-soft btn-sm" id="addM" style="flex:none">추가</button></div>
      <div style="height:14px"></div>
      <button class="btn btn-brand" id="saveM">저장</button>
      <div style="height:8px"></div><button class="btn btn-ghost btn-close" id="closeM">닫기</button>`);
    $sheet.querySelectorAll(".medit").forEach(inp=> inp.oninput=()=>{ list[+inp.dataset.i].name=inp.value; });   // 이름만 갱신, id 보존
    $sheet.querySelectorAll(".mdel").forEach(b=> b.onclick=()=>{ list.splice(+b.dataset.i,1); draw(); });
    document.getElementById("addM").onclick=()=>{ const el=document.getElementById("newM"), v=el.value.trim(); if(v){ list.push({id:genMemberId(), name:v}); draw(); } };
    document.getElementById("saveM").onclick=()=>guardWrite(async()=>{
      // 동시편집 충돌 감지(OCC): 저장 직전 최신 멤버 확인 → 바뀌었으면 덮어쓰지 말고 최신 반영+경고
      if(SHARED){ const fresh=await fetchCell(CELL.id);
        if(fresh && memSig(fresh.members)!==baseline){
          CELL=fresh; applyCellGlobals(); list=MEMBERS.map(m=>({id:m.id,name:m.name})); baseline=memSig(list);
          toast("다른 분이 방금 구성원을 바꿨어요 — 최신 목록을 불러왔어요. 다시 확인 후 저장해주세요"); draw(); return;
        }
      }
      const seen={}, out=[];
      for(const m of list){ const name=(m.name||"").trim().slice(0,40); if(!name||seen[m.id]) continue; seen[m.id]=1; out.push({id:m.id, name}); }
      const final=out.slice(0,60);
      if(!final.length){ toast("구성원을 1명 이상 두세요"); return; }
      if(await saveMembers(final)){ if(ME && !final.some(m=>m.id===ME)) setMe(null); closeSheet(); toast("구성원 명단을 저장했어요"); render(); }
    });
    document.getElementById("closeM").onclick=closeSheet;
  }
  draw();
}

/* ===================== 부팅 ===================== */
// 스케일 완화: 백그라운드 탭은 실시간 구독 해제, 복귀 시 재구독+새로고침 (동시접속 절감)
document.addEventListener("visibilitychange", async ()=>{
  if(!SHARED || !CELL || adminMode || inPicker) return;
  if(document.hidden){ if(Sync.pause) Sync.pause(); }
  else { try{ const c=await fetchCell(CELL.id); if(c){ CELL=c; applyCellGlobals(); } }catch(e){}   // 멤버(이름변경/추가) 최신화
         try{ await Sync.resubscribe(); }catch(e){}
         if(sheetOpen || confirmOpen) return;                    // 입력 중이면 화면 유지
         if(curView==="pick") renderPickMe(); else render(); }   // 이름 선택 중이면 메인으로 튕기지 않음
});
function onRemote(){ if(inPicker || adminMode) return;
  if(curView==="pick" || sheetOpen || confirmOpen) return;   // 이름 선택/시트/확인창 사용 중엔 폴링이 화면을 갈아엎지 않음(선택 화면이 스스로 닫히던 문제)
  render(); }
(async function boot(){
  console.log("[오늘은 제가 섬기겠습니다] build "+APP_VERSION);  // 캐시/배포 확인용
  updateOffline();   // 오프라인 초기 표시
  // 무한 로딩 방지: 8초 내 첫 렌더 안 되면 재시도 안내
  setTimeout(()=>{ if(document.querySelector("#app > .loading")) $app.innerHTML='<div class="loading">연결이 지연되고 있어요 📡<br><br><button class="btn btn-soft" onclick="location.reload()" style="max-width:200px;margin:0 auto">다시 시도</button></div>'; }, 8000);
  try { await Sync.init(onRemote); }
  catch(e){ console.error(e); $app.innerHTML=`<div class="loading">연결 오류: ${esc(e.message||"")}<br>설정을 확인해주세요.</div>`; return; }
  if(!SHARED) loadLocalCells();   // 일반 사용자는 전체 셀 열거 안 함(자기 셀만 단건 조회)
  const params=new URLSearchParams(location.search);
  try {
    if(params.has("admin")){ await renderAdmin(); }   // 숨은 관리자 경로(전체 셀 대시보드는 여기)
    else { const target=params.get("cell"); // 바 URL은 최근 셀 자동입장 안 함 — 랜딩만
      if(target && params.get("view")==="dashboard") await renderCellDashboard(target);  // ?cell=..&view=dashboard → 그 셀 대시보드(무로그인)
      else if(target) await enterCell(target);   // ?cell= 링크만 단건 입장
      else renderCellPicker(); }            // 바 URL → 개발자 메시지/앱 안내 랜딩
  } catch(e){ console.error("초기 렌더 실패",e); }
})();
</script>
