  return `<div class="game-legend" role="list" aria-label="번호와 이름">${players.map((m,i)=>
    `<span class="gl-it" role="listitem"><i class="gl-sw" style="background:${gcolor(i, n)}"></i><span class="gl-no">${i+1}</span><span class="gl-nm">${esc(m.name)}</span></span>`).join("")}</div>`;
}
function gvibe(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }   // iOS 는 진동 API 자체가 없다 — 시각 효과가 본체
function $gv(){ return document.getElementById("gameOv"); }

// 게임 상태는 '보고 있는 섬김' 하나에 매인다. 섬김이 바뀌면 통째로 버린다.
// 열림 여부·제외 명단·게임 종류·타이머·정리 함수가 각자 전역으로 흩어져 있었다. 하나로 모아야
// 명단 연동과 확률 정책을 얹을 자리가 생긴다. 게임을 한 번도 열지 않았으면 null 이다.
let GS = null;
// {
//   seq:        number|null   이 상태가 속한 섬김
//   on:         Set<memberId> 사용자가 명시적으로 '참가'로 켠 사람
//   off:        Set<memberId> 사용자가 명시적으로 '제외'로 끈 사람
//   kind:       "ladder"|"wheel"|"finger"|null
//   policy:     "soft"|"skip"|"even"      직전 섬긴 분 확률 정책
//   lastHostId: string|null|undefined     undefined = 아직 조회 안 됨
//   sig:        string|null   게임 시작 시점의 참가자 서명(도중 변경 감지용)
//   open:       boolean       오버레이가 떠 있는지
//   pushed:     boolean       오버레이가 히스토리 1칸을 쥐고 있는지
//   opener:     Element|null  오버레이를 연 버튼(포커스 복귀용)
//   timers:     number[]      진행 중 예약된 타이머
//   teardown:   fn|null       진행 중 게임의 정리 함수
// }

// 명단은 게임을 열기 전에도(렌더 중 canGame 계산) 물어볼 수 있어야 한다.
// GS 가 없는 상태는 '아무도 켜거나 끄지 않았고 정책도 기본값'인 상태와 같다 — 그렇게 읽고 던지지 않는다.
const GS_NONE = new Set();
function gsOn(){  return GS ? GS.on  : GS_NONE; }
function gsOff(){ return GS ? GS.off : GS_NONE; }
function gsPolicy(){ return GS ? GS.policy : "soft"; }          // 기본 soft — 명단을 줄이지 않는다
function gsLastHost(){ return GS ? GS.lastHostId : undefined; }  // undefined = 아직 조회 안 됨, '없음'과 같게 다룬다

/* ---------- 직전에 섬긴 분 조회 (R5) ----------
   조회 결과를 (방, 날짜, 보고 있는 섬김) 조합당 한 번만 가져온다. 시트를 여러 번 열어도
   재조회하지 않고, 섬김을 옮기면 키가 달라져 다시 조회된다.
   키에 seq 가 빠지면 2번째 섬김에서 얻은 값이 3번째 섬김에도 그대로 보여 '직전'이 틀어진다. */
let LAST_HOST = { key:null, id:null };
function lastHostKey(){ return ROOM + "|" + todayKey() + "|" + (SESSION.seq ?? 0); }

// 폴백: 오늘의 SERVINGS 안에서만 찾는다 (R5-6, R5-9). SERVINGS 는 [{seq,state,hostId,...}] 이고
// '오늘' 것만 담으므로 날짜를 넘는 조회는 못 한다 — 그래서 RPC 가 따로 있다.
// hostId 가 있는 것만 보므로 인계 대기(unclaim) 섬김은 자연히 빠진다. 현재 섬김은 seq 로 잘라낸다 —
// 보고 있는 섬김이 없으면(seq null) 오늘 전체가 대상이다.
function lastHostFromToday(){
  const cur = SESSION.seq ?? Infinity;
  const past = SERVINGS.filter(s=>s.hostId && s.seq < cur).sort((a,b)=>b.seq-a.seq);
  return past.length ? past[0].hostId : null;
}

// 공유 모드에서만 RPC 를 부르고, 실패하면 조용히 오늘 기록으로 폴백한다.
// rpcSetMembers 의 구버전 폴백과 같은 정신인데, 여기엔 재시도할 대체 시그니처가 없어서
// 폴백값을 그대로 쓴다 — 그래서 마이그레이션 적용 전에도 게임이 정상 동작한다 (R5-6, R5-8).
async function fetchLastHost(){
  const key = lastHostKey();
  if(LAST_HOST.key===key) return LAST_HOST.id;
  let id = lastHostFromToday();          // 로컬 모드(R5-9)와 RPC 실패의 공통 기본값
  if(SHARED){
    try{
      const { data, error } = await Sync.client.rpc("get_last_host",
        { p_room:ROOM, p_date:todayKey(), p_seq:SESSION.seq ?? null });
      // RPC 미배포(PGRST202)·오프라인·기타 오류를 구분하지 않는다 — 어느 쪽이든 할 일이 같고,
      // 사용자에게 드러낼 실패가 아니다. cells 로드 실패와 같은 급의 console.warn 만 남긴다.
      if(error) console.warn("get_last_host 실패 — 오늘 기록으로 폴백", error);
      else if(typeof data==="string" && data) id = data;
      // data 가 null 이면 서버에도 이력이 없다는 뜻이지만 폴백값을 굳이 덮지 않는다.
      // 공유 모드의 SERVINGS 는 서버에서 온 것이라 보통 둘 다 비어 있고, 어긋난다면
      // RPC 의 state 조건이 더 좁은 경우뿐이라 폴백이 더 많이 아는 쪽이다.
    }catch(e){ console.warn("get_last_host 실패 — 오늘 기록으로 폴백", e); }
  }
  if(id && !memberById(id)) id = null;   // 명단에서 사라진 분은 없는 것으로 (R5-7)
  LAST_HOST = { key, id };
  return id;
}

function gameEnsure(opener){
  const seq = SESSION.seq ?? null;   // 호스트 없는 섬김에서 하단바로 들어오면 null — 그대로 키로 쓴다
  if(!GS || GS.seq !== seq){         // 보고 있는 섬김이 바뀌면 명단·정책을 그 섬김의 기본값으로 되돌린다
    GS = { seq, on:new Set(), off:new Set(), kind:null,
           policy:"soft", lastHostId:undefined, sig:null,
           open:false, pushed:false, opener:null, timers:[], teardown:null };
  }
  GS.opener = opener || null;        // 같은 섬김이면 명단·정책은 그대로 살아 있다
}

// 기본 참가 = 음료를 주문한 분 (R2-1). 무응답은 기본 제외지만 토글로 넣을 수 있다.
function gameDefaultOn(m){ const o=ORDERS[m.id]; return !!(o && o.type==="drink"); }
// '오늘은 안 마실게요'는 되돌릴 수 없는 제외다 — 토글로도 넣지 못한다 (R2-5).
function gameIsSkip(m){ const o=ORDERS[m.id]; return !!(o && o.type==="skip"); }

// 명단과 추첨 대상은 저장하지 않고 매번 파생시킨다 — 주문이 실시간으로 바뀌어도 사용자가 직접
// 켜고 끈 것이 살아남아야 하기 때문이다(R3-5). 판단 규칙은 위 마커 블록의 순수 함수에만 두고
// 아래 둘은 전역을 읽어 넘겨주는 껍데기로만 남긴다 — 규칙이 두 곳에 생기면 화면에 보이는 인원과
// 실제 추첨 대상이 어긋난다.
// '오늘 섬긴 분 전원 자동 제외'는 없어졌다 — 직전 한 명은 확률 정책으로 다룬다.
function gameRoster(){ return rosterFrom(MEMBERS, ORDERS, gsOn(), gsOff()); }
// 참가자 수 표기와 게임 가능 판정의 단일 출처 (R3-6, R6-6). 정책이 명단을 줄이는 경우까지 여기서 반영된다.
function gamePlayers(){ return playersFrom(gameRoster(), gsPolicy(), gsLastHost()); }
// 렌더 도중 canGame 이 부르므로 GS 없이도 답이 나와야 한다 — 위 널 안전 리더들이 그 경로를 받친다.
// 기본값 규칙과 같은 출처를 쓰므로, 음료 주문자가 2명 미만이면 진입점이 뜨지 않는다 (R2-8).
function gameEligible(){ return gamePlayers().length >= 2; }
/* 게임이 도는 동안 추첨 대상이 바뀌었는지 알아보는 서명 (R17-1).
   id 만 모아 정렬한다 — MEMBERS 는 이름순이라 누가 개명하면 배열 순서가 바뀌는데, 그건 명단이
   바뀐 게 아니다. 정렬하면 순서가 id 에만 매이므로 개명은 서명을 흔들지 않고, 사람이 들어오거나
   빠진 경우만 잡힌다. 값 비교라 감시자·구독이 필요 없고, 필요한 두 지점(결과 표시·확정)에서
   그때그때 늦게 비교한다. */
function gameRosterSig(){ return gamePlayers().map(m=>m.id).sort().join(","); }
// 수동 [오늘 섬긴 분 빼기] 전용으로 남는다 — 더 이상 진입 시 자동 적용하지 않는다
function gameServedIds(){ return new Set(SERVINGS.map(s=>s.hostId).filter(Boolean)); }

// 토글은 두 Set 을 함께 갱신한다. 한쪽만 만지면 '켰다 껐다' 한 사람이 기본값으로 돌아가버린다 (R3-5).
// 아래 세 함수는 사용자가 시트에서 조작할 때만 불리므로 GS 는 이미 있다.
function gameToggle(id, on){
  if(on){ GS.on.add(id);  GS.off.delete(id); }
  else  { GS.off.add(id); GS.on.delete(id);  }
}
// 전원 참가 (R2-10): 안 마시는 분을 뺀 전원을 '명시적 참가'로 — 나중에 주문이 들어와도 흔들리지 않는다
function gameAllOn(){ GS.off.clear(); GS.on = new Set(MEMBERS.filter(m=>!gameIsSkip(m)).map(m=>m.id)); }
// 오늘 섬긴 분 빼기 (R2-9): 그분들만 끄고 나머지 명단은 그대로 둔다
function gameDropServed(){ gameServedIds().forEach(id=>gameToggle(id,false)); }

/* ---------- 확률 정책 (R6) ----------
   가중치 계산은 전역(GS)을 읽으므로 마커 블록 밖에 둔다. 검증 대상인 추첨 자체는 위 pickWeighted 가 맡고
   여기서는 '누구에게 얼마를 줄지'만 정한다 — 순수한 부분과 상태를 읽는 부분의 경계가 그 선이다.
   soft 만 가중치를 쓴다. skip 은 gamePlayers() 가 이미 명단에서 빼므로 남은 사람은 전원 1 이 되고,
   even 은 애초에 전원 1 이다. 그래서 정책별 분기가 여기 한 줄로 끝난다.
   직전 섬긴 분이 없거나(null) 아직 조회가 안 끝났으면(undefined) 조건이 falsy 라서 전원 1 이다 —
   undefined 가 실수로 어떤 구성원의 id 와 같아질 일은 없으므로 별도 방어가 필요하지 않다 (R6-12).
   사용자가 그분을 이미 껐으면 명단에 없으니 가중치가 걸릴 자리도 없다 (R6-13). */
function gameWeights(players){
  const soft = gsPolicy()==="soft", last = gsLastHost();
  return players.map(m => (soft && last && m.id===last) ? GS_SOFT_W : 1);
}
function gamePickWinner(players){ return pickWeighted(players, gameWeights(players)); }

function gtimer(fn,ms){ const t=setTimeout(fn,ms); if(GS) GS.timers.push(t); return t; }
function clearGameTimers(){ if(!GS) return; GS.timers.forEach(clearTimeout); GS.timers=[]; }

/* ---------- 모달 접근성 (R13) ----------
   #gameOv 는 role="dialog" aria-modal="true" 를 갖고 있지만, 그것만으로는 포커스가 배경에 남고
   스크린리더가 뒤쪽 화면을 계속 읽는다. 아래 세 함수가 '진짜 모달'의 나머지 절반이다.
   gameA11yPrev 가 null 이 아니면 '켜져 있음'을 뜻한다 — openGameOv 는 한 판마다 다시 불리므로
   켜기는 여러 번 들어오고, 닫기는 popstate·✕·그만두기·확정 네 경로에서 들어온다. */
let gameA11yPrev = null;

function gameA11yOn(){
  const el=$gv();
  // 진입점(gamepick/gamepickBar)이 opener 를 넘겨주지만, 그 경로를 안 거치고 열리는 일이 생기면
  // 지금 포커스를 돌아갈 자리로 삼는다 — 닫을 때 갈 곳이 없는 상태를 만들지 않는다.
  const act=document.activeElement;
  if(GS && !GS.opener && act && act!==document.body) GS.opener=act;   // body 는 돌아갈 자리가 아니다 — 그냥 비워 두고 아래 폴백에 맡긴다
  // 복원 상태는 처음 켤 때 한 번만 잡는다. '한 판 더'로 두 번 잡으면 이미 aria-hidden 이 걸린
  // 상태를 원래 모습으로 기억해, 닫아도 배경이 계속 숨겨진 채로 남는다.
  if(!gameA11yPrev){
    gameA11yPrev=[$app,$bottom];
    // #gameOv 는 이 둘의 형제라 자기 자신은 숨겨지지 않는다 — 배경만 스크린리더에서 사라진다 (R13-1~3)
    gameA11yPrev.forEach(n=>{ if(n) n.setAttribute("aria-hidden","true"); });
    // 오버레이가 아니라 document 에 건다. 결과가 나오면 setGameFoot 이 푸터를 다시 그리는데,
    // 그때 포커스가 있던 [그만두기]가 사라지면 포커스는 <body> 로 떨어진다. 오버레이에만 걸린
    // 리스너는 body 에서 올라오는 Tab 을 아예 못 보므로 그 순간 덫이 풀려버린다.
    document.addEventListener("keydown", gameTrap);
  }
  // 열릴 때마다 ✕ 는 새로 그려진 엘리먼트다. 이전 포커스는 DOM 에서 사라졌으니 다시 잡아준다 (R13-1)
  const first=el && el.querySelector("#gvX");
  if(first) first.focus();
}
function gameA11yOff(){
  if(!gameA11yPrev) return;   // 한 번도 안 열었거나 이미 되돌렸다 — 두 번 불려도 아무 일도 하지 않는다
  document.removeEventListener("keydown", gameTrap);
  gameA11yPrev.forEach(n=>{ if(n) n.removeAttribute("aria-hidden"); });
  gameA11yPrev=null;
  // 여는 버튼으로 돌아간다 (R13-3). 그 버튼이 render() 로 이미 사라졌으면 포커스가 <body> 에 남는데,
  // 그러면 다음 Tab 이 문서 맨 처음부터 시작해 사용자가 자리를 잃는다 → 앱 컨테이너에 세운다.
  const back=GS && GS.opener;
  const home=()=>{ if($app){ $app.setAttribute("tabindex","-1"); try{ $app.focus(); }catch(e){} } };  // -1 = 프로그램으로만 잡힘, Tab 순서엔 안 들어간다
  if(back && document.body.contains(back)){
    try{ back.focus(); }catch(e){}
    // 확정 경로는 closeGame() 바로 뒤에 render() 로 #app 을 다시 그린다 — 방금 잡은 버튼이 그때
    // 사라져 포커스가 <body> 로 떨어진다. 한 프레임 뒤에 확인해서 떨어졌으면 컨테이너로 올린다.
    requestAnimationFrame(()=>{ if(document.activeElement===document.body) home(); });
  } else home();
  if(GS) GS.opener=null;
}
// Tab 순환을 오버레이 안에 묶는다 (R13-2).
// .game-ov 자체가 position:fixed 라 그 자손의 offsetParent 는 오버레이(또는 .game-body)다 —
// null 이 되는 건 오버레이가 닫혀 display:none 일 때뿐이라, 이 필터가 '보이는 것만' 검사로 정확히 맞는다.
function gameTrap(e){
  if(e.key!=="Tab") return;
  const el=$gv();
  if(!el || !el.classList.contains("show")) return;
  const f=[...el.querySelectorAll('button:not([disabled]), [tabindex="0"]')].filter(x=>x.offsetParent!==null);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1], cur=document.activeElement;
  if(!el.contains(cur)){ e.preventDefault(); (e.shiftKey?last:first).focus(); return; }   // 푸터 재렌더로 포커스를 잃은 경우 회수
  if(e.shiftKey && cur===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && cur===last){ e.preventDefault(); first.focus(); }
}

function openGameOv(title, bodyHtml){
  const el=$gv();
  el.innerHTML=`<div class="game-head"><div class="game-title">${title}</div>
      <button class="sheet-x" id="gvX" aria-label="닫기">✕</button></div>
    <div class="game-body" id="gvBody">${bodyHtml}</div>
    <div class="game-foot" id="gvFoot"></div>`;
  el.classList.add("show");
  // 오버레이는 자기 히스토리 항목을 직접 소유한다. pushSub() 을 쓰지 않는 이유:
  // pushSub 은 subActive 가 이미 true 면 no-op 이라, 현황 탭·게임 시트·오버레이가 한 칸을 공유했다.
  // 그래서 뒤로가기 한 번에 게임이 닫히면서 탭의 항목까지 함께 사라져 다음 뒤로가기가 앱을 나갔다.
  // subActive 와 무관하게 1칸을 push 하면 탭·시트의 뒤로가기 한 칸이 그대로 살아 있다.
  if(!GS.open){
    GS.open=true; GS.pushed=true;
    try{ history.pushState({sub:1, game:1},""); }catch(e){ GS.pushed=false; }   // push 실패면 소비할 항목도 없다
  }
  document.getElementById("gvX").onclick=()=>closeGame();   // 이벤트 객체가 opts 로 들어오지 않게 감싼다
  gameA11yOn();   // ✕ 를 배선한 뒤·show 를 켠 뒤라야 포커스가 걸린다(display:none 엔 포커스가 안 간다)
}
function setGameFoot(html){ const f=document.getElementById("gvFoot"); if(f) f.innerHTML=html; }
// opts.fromPop — 뒤로가기(popstate)로 들어온 호출. 그 경우 항목은 브라우저가 이미 소비했으므로
// 다시 back() 을 부르면 한 칸을 더 먹어 탭·시트의 뒤로가기가 사라진다.
function closeGame(opts){
  const fromPop = !!(opts && opts.fromPop);
  clearGameTimers();
  if(GS && GS.teardown){ try{ GS.teardown(); }catch(e){} GS.teardown=null; }
  const el=$gv(); el.classList.remove("show"); el.innerHTML="";
  if(GS){
    GS.open=false;
    gameA11yOff();   // 배경 aria-hidden 해제 + 포커스 복귀. 네 경로(popstate·✕·그만두기·확정) 모두 여기를 지난다.
    // 버튼·✕·확정으로 닫을 때만 우리가 쥔 항목을 되돌린다. 증감은 짝을 맞춘다.
    if(!fromPop && GS.pushed){ ignorePop++; try{ history.back(); }catch(e){ ignorePop--; } }
    GS.pushed=false;
  }
}
// 탭·시트가 쌓아둔 하위 항목 1칸을 정리한다. 확정 후 '내 주문' 탭으로 직접 넘어갈 때만 쓴다(12.2).
function clearSubEntry(){
  if(subActive){ subActive=false; ignorePop++; try{ history.back(); }catch(e){ ignorePop--; } }
}

/* ---------- 게임 고르기 시트 ----------
   두 함수로 나눈다. openGameSheet 은 '진입'이라 비동기 조회를 걸고, drawGameSheet 은 '그리기'라
   동기로 끝난다. 나눠야 하는 이유는 둘이다 — 조회를 기다리지 않고 즉시 그려야 하고(R5-10),
   참가자 고르기에서 돌아올 때는 조회를 다시 걸지 않고 그리기만 다시 불러야 한다(R11-7).
   시트는 블록 단위로 쪼개 그린다. 정책 칩이 참가자 수를 바꾸므로 시트 전체를 다시 그리지 않고
   블록만 갈아끼워야 스크롤이 유지된다(R7-6) — 그래서 각 블록에 감싸는 div 와 HTML 생성 함수가 있다. */
function openGameSheet(){
  if(!GS) gameEnsure();          // 진입점을 거치지 않고 열리는 경로가 생겨도 상태 없이 돌지 않게
  drawGameSheet();
  // 조회는 시트 렌더를 기다리게 하지 않는다 (R5-10). 위에서 이미 그렸고, 결과가 오면 그 블록만 갈아끼운다.
  // 조회를 여기(진입)에만 두는 이유: 이 가드는 GS.lastHostId 로 '조회했는지'만 보므로,
  // 응답이 오기 전에 openGameSheet 이 또 불리면 같은 RPC 가 두 번 나간다. 시트를 다시 그리는
  // 경로(backToGameSheet)는 drawGameSheet 을 부르게 해서 그 창을 아예 없앤다.
  if(GS.lastHostId === undefined){
    const seq = GS.seq;                     // 응답이 늦게 와도 '조회를 시작한 그 섬김'에만 쓴다
    fetchLastHost().then(id=>{
      // 시트를 닫고 섬김을 바꾼 뒤 응답이 도착하면 남의 상태를 오염시킨다 — 그때는 버린다.
      // 같은 섬김이면 gameEnsure 가 GS 를 새로 만들지 않으므로 seq 비교로 충분하다.
      if(!GS || GS.seq !== seq) return;
      GS.lastHostId = (id === undefined) ? null : id;   // 조회가 끝났으면 undefined 를 되쓰지 않는다 — '없음'은 null
      // 시트가 아직 열려 있으면 정책 블록만 채운다. 닫혔으면 syncPolicyBlock 이 스스로 아무것도 하지 않는다.
      syncPolicyBlock();
    });
  }
}

// 참가자 카드 (블록 2). 인원은 gamePlayers() 하나에서만 나온다 — 참가자 고르기 시트의 '현재 N명'과
// 같은 값이어야 하고(R3-6), 정책이 명단을 줄이는 경우까지 그 함수가 이미 반영한다.
// 기준 안내 한 줄이 필요한 이유: 무응답인 분이 왜 안 보이는지 여기서 말하지 않으면 [바꾸기]를
// 열어봐야 알 수 있다 (R2-6). 예전의 '오늘 이미 섬긴 분은 기본으로 빠져 있어요'는 이제 사실이
// 아니라서 2.1 에서 지웠다 — 오늘 섬긴 분 제외는 수동 버튼으로만 남는다.
function gamePlayerCardHtml(){
  const players=gamePlayers();
  return `<div class="card" style="padding:13px 14px;margin-bottom:12px">
      <div class="row-between"><b style="font-size:14px">참가자 ${players.length}명</b>
        <button class="btn btn-sm btn-soft" id="gRoster">바꾸기</button></div>
      <div class="muted" style="margin-top:6px">${players.length?players.map(m=>esc(m.name)).join(" · "):"—"}</div>
      <div class="muted" style="margin-top:6px;font-size:12px">메뉴를 고른 분이 기본으로 들어가 있어요</div>
    </div>`;
}

/* ---------- 확률 정책 카드 (블록 3, R6-1~R6-3) ----------
   GS.lastHostId 는 세 상태다 — undefined(아직 조회 안 됨) · null(직전에 섬긴 분이 없음) · string(있음).
   문자열일 때만 그린다. 조회 중에 자리를 잡아두는 스켈레톤도 넣지 않는다: 첫 섬김이거나 이력이 없는
   방에서는 끝까지 안 뜨는 자리라, 깜빡였다 사라지는 쪽이 아무것도 없는 쪽보다 나쁘다 (R6-12).
   응답이 오면 syncPolicyBlock() 이 이 블록만 채운다 — 시트를 다시 그리지 않으므로 스크롤이 그대로다(R7-6). */
const GS_POLICIES = [
  { k:"soft", label:"확률 낮추기" },   // 기본값 (R6-3)
  { k:"skip", label:"제외" },
  { k:"even", label:"평등" }
];

// 칩 이름만으로는 '얼마나' 낮추는지 알 수 없다 — 1/3 이라는 실제 크기를 글로 적어 준다 (R6-4, R6-5).
// [제외]는 참가자 수까지 바꾸므로 그 사실을 미리 말한다(누르고 나서 숫자가 줄면 사고처럼 보인다).
function gamePolicyHint(p){
  if(p==="skip") return "이번 판에는 아예 안 넣어요. 참가자 수도 한 분 줄어요.";
  if(p==="even") return "다른 분들과 똑같은 확률로 걸려요.";
  return "다른 분 한 분의 1/3 확률로만 걸려요. 아예 안 걸리는 건 아니에요.";
}

// 단일선택 칩은 파일에 이미 쓰는 패턴이 있다(주문 옵션 그룹) — .chips + role="radiogroup" +
// role="radio" · aria-checked. 세 개를 aria-pressed 버튼 세 개로 두면 '3개 중 1개'라는 관계가
// 안 읽히므로 그쪽을 그대로 따른다. 전역 keydown 심은 role 이 아니라 .chip 클래스도 보므로
// Enter/Space 는 그대로 동작한다. 그룹 이름은 위의 이름 줄을 aria-labelledby 로 가리켜 얻는다.
function gamePolicyCardHtml(){
  const last = gsLastHost();
  if(typeof last !== "string" || !last) return "";      // undefined·null 은 둘 다 아무것도 그리지 않는다
  const m = memberById(last);
  if(!m) return "";                                     // fetchLastHost 가 이미 걸러주지만, 조회 후 명단이 바뀔 수도 있다 (R5-7)
  const p = gsPolicy();
  // 명단 판정은 gameRoster() 로 한다. gamePlayers() 는 skip 정책이 이미 뺀 결과라, 그걸로 보면
  // [제외]를 누르는 순간 '명단에 없어요' 안내가 켜져 사용자가 방금 한 조작을 오해한다.
  const inRoster = gameRoster().some(x=>x.id===last);
  // 사용자가 그분을 직접 끈 상태여도 카드는 남긴다 (R6-13). 칩을 감추면 [바꾸기]에서 다시 켤 때
  // 카드가 나타났다 사라지는 것처럼 보이고, 정책이 어디로 갔는지 물을 자리가 없어진다 —
  // 대신 '지금은 영향 없음'을 한 줄로 밝혀 아무 일도 안 하는 칩을 조용히 두지 않는다.
  return `<div class="card" style="padding:13px 14px;margin-bottom:12px">
      <b id="gPolicyName" style="font-size:14px">직전에 섬긴 분: ${esc(hon(m.name))}</b>
      <div class="chips" id="gPolicyChips" role="radiogroup" aria-labelledby="gPolicyName">${
        GS_POLICIES.map(o=>`<div class="chip ${o.k===p?"sel":""}" role="radio" tabindex="0" aria-checked="${o.k===p}" data-p="${o.k}">${o.label}</div>`).join("")}</div>
      <div class="muted" id="gPolicyHint" style="margin-top:8px;font-size:12px">${gamePolicyHint(p)}</div>
      ${inRoster?"":`<div class="muted" style="margin-top:4px;font-size:12px">지금은 이분이 명단에서 빠져 있어 이 설정이 결과를 바꾸지 않아요. [바꾸기]로 다시 넣으면 적용돼요.</div>`}
    </div>`;
}

// 2명 미만인 이유는 갈린다 — 주문이 아직 안 모였거나, 사용자가 명단에서 뺐거나, 정책이 한 분을
// 뺐거나. "2명 이상이어야 돌릴 수 있어요" 한 문장만 보여주면 어느 손잡이를 당겨야 하는지 알 수 없다.
// 그래서 사유와 다음 동작을 함께 적는다 (R2-7).
function gameShortReason(){
  const ordered = MEMBERS.filter(gameDefaultOn).length;   // 기본 참가 후보 = 메뉴를 고른 분
  const roster  = gameRoster().length;
  const players = gamePlayers().length;
  // ① 정책이 줄인 경우를 먼저 본다. 명단에는 두 분이 보이는데 못 돌리는 유일한 경우라
  //    [바꾸기]로 보내면 헛걸음한다. 이 배너 위에 정책 카드가 그대로 남아 있으므로
  //    [확률 낮추기] 칩을 누르는 것만으로 바로 풀린다 — 그래서 문구가 그쪽을 먼저 가리킨다.
  if(players < roster) return { why:"직전에 섬긴 분을 [제외]로 둬서 한 분만 남았어요",
                                how:"정책을 [확률 낮추기]로 돌리거나 참가자를 늘려주세요" };
  // ② 다 켜도 두 분이 안 되는 경우. 토글로는 안 풀리니 주문을 기다리는 쪽을 먼저 말한다.
  if(ordered < 2) return { why: ordered ? "지금까지 메뉴를 고른 분이 한 분뿐이에요" : "아직 주문이 모이지 않았어요",
                           how:"조금 기다리거나, 아직 안 고른 분을 직접 넣어도 돼요" };
  // ③ 주문은 모였는데 사용자가 껐다. 다시 켜면 바로 풀린다.
  return { why:"명단에서 빠진 분이 있어요", how:"빠진 분을 다시 켜면 바로 돌릴 수 있어요" };
}

/* 인원 상한 초과 처리 (R10-4). 상한값은 GAME_MAX 한 곳에서만 나온다 — 마크업에 숫자를 박으면
   상한을 고쳐도 화면이 옛 숫자를 말한다. 사유에 상한과 '지금 몇 명인지'를 함께 적는 이유:
   숫자 하나만 보여주면 몇 명을 빼야 풀리는지 사용자가 셈을 해야 한다.
   사유는 새 노드가 아니라 원래 있던 <small> 자리에 들어간다 — 줄을 하나 더 붙이면 세 버튼의
   높이가 들쭉날쭉해지고, 막힌 버튼이 오히려 더 커 보인다. */
function gamePickOff(kind, n){ return gameFits(kind, n) ? "" : " disabled"; }
function gamePickSub(kind, n, sub){
  return gameFits(kind, n) ? sub : GAME_MAX[kind]+"명까지 — 지금 "+n+"명이라 화면에 안 들어가요";
}

// 게임 고르기 블록 (블록 4). 참가자가 2명 미만이면 게임 대신 사유 배너 + [바꾸기]를 보여준다 (R2-7).
// 상한 판정은 이 배너 분기 '뒤'에만 있다 — 2명 미만이면 어떤 상한도 넘을 수 없으므로 볼 필요가 없다.
// 손가락 룰렛은 GAME_MAX 가 Infinity 라 어떤 인원에서도 살아남는다. 그래서 네 개가 동시에
// 막히는 상태는 만들어지지 않는다 — 사용자가 고를 게 하나도 없는 화면을 보지 않는다.
// 순서는 '짧은 것 → 긴 것'이 아니라 기존 세 개를 그대로 두고 구슬 레이스를 맨 끝에 붙인다 (R19-1).
// 20초짜리를 위로 올리면 이미 익숙한 배치가 흐트러지고, 제일 오래 걸리는 게임이 첫 선택지가 된다.
function gamePickBlockHtml(){
  const n=gamePlayers().length;
  if(n<2){
    const r=gameShortReason();
    return `<div class="banner-warn"><b>${r.why}</b><br>${r.how}</div>
      <button class="btn btn-soft" id="gRosterB">참가자 바꾸기</button>`;
  }
  return `<div class="label">게임 고르기</div>
      <button class="game-pick" data-g="ladder"${gamePickOff("ladder",n)}><span class="gp-em">🪜</span><span><b>사다리타기</b><small>${gamePickSub("ladder",n,"한 폰을 다 같이 보며 · 제일 두근거려요")}</small></span></button>
      <button class="game-pick" data-g="finger"${gamePickOff("finger",n)}><span class="gp-em">☝️</span><span><b>손가락 룰렛</b><small>${gamePickSub("finger",n,"폰 하나에 다 같이 손가락을 올려요")}</small></span></button>
      <button class="game-pick" data-g="wheel"${gamePickOff("wheel",n)}><span class="gp-em">🎡</span><span><b>돌림판</b><small>${gamePickSub("wheel",n,"가장 빠르게 · 한 번에 끝")}</small></span></button>
      <button class="game-pick" data-g="race"${gamePickOff("race",n)}><span class="gp-em">🏁</span><span><b>구슬 레이스</b><small>${gamePickSub("race",n,"다 같이 20초 · 제일 오래 즐겨요")}</small></span></button>`;
}

// 블록을 다시 그린 뒤에도 그대로 부를 수 있게 배선을 한 곳에 모은다 — 부분 갱신이
// 리스너를 잃지 않게 하는 유일한 방법이 '다시 배선하는 지점을 하나로 두는 것'이다.
// 블록 안의 노드만 다루므로 시트 밖으로 새지 않는다.
function bindGameSheet(){
  bind("gRoster",  openRosterSheet);
  bind("gRosterB", openRosterSheet);   // 사유 배너의 CTA — 같은 곳으로 보낸다 (R2-7)
  // 상한을 넘어 disabled 인 버튼도 그냥 함께 배선한다 — <button disabled> 는 브라우저가 click 을
  // 아예 발생시키지 않으므로 이 핸들러가 돌 길이 없고, 탭 순서에서도 빠진다(gameTrap 의
  // 'button:not([disabled])' 도 같은 이유로 건너뛴다). 배선 쪽에 조건을 또 두면 상한 규칙이 두 곳에 생긴다.
  $sheet.querySelectorAll(".game-pick").forEach(b=> b.onclick=()=>{ const k=b.dataset.g; closeSheet(); startGame(k); });
  const pc=document.getElementById("gPolicyChips");
  if(pc) pc.querySelectorAll(".chip").forEach(c=> c.onclick=()=>setGamePolicy(c.dataset.p));
}

// 참가자 수를 쓰는 두 블록은 항상 함께 그린다 — 따로 그리면 '참가자 2명'인데 아래엔 사유 배너가
// 떠 있는 중간 상태가 한 프레임 보인다. innerHTML 을 갈므로 그 안의 [바꾸기]·게임 버튼이 새 노드가
// 되어 리스너를 잃는다 → 마지막에 반드시 다시 배선한다. $sheet 자체는 건드리지 않으니 스크롤은 그대로다.
function syncGameCountBlocks(){
  const pl=document.getElementById("gPlayerBlock"), pk=document.getElementById("gPickBlock");
  if(!pl || !pk) return;               // 게임 고르기 시트가 아니면 아무것도 하지 않는다
  pl.innerHTML=gamePlayerCardHtml();
  pk.innerHTML=gamePickBlockHtml();
  bindGameSheet();
}

// 칩은 제자리에서 고친다. 정책 카드까지 innerHTML 로 갈아버리면 방금 누른 칩이 사라져 포커스가
// <body> 로 떨어지고, 키보드로 정책을 바꾼 사용자는 자리를 잃는다(참가자 행 patch 와 같은 이유).
function patchPolicyChips(){
  const box=document.getElementById("gPolicyChips");
  if(!box) return;
  const p=gsPolicy();                  // 화면은 GS 를 읽는다 — 지역 변수를 따로 들면 두 값이 갈라진다
  box.querySelectorAll(".chip").forEach(c=>{ const on=c.dataset.p===p;
    c.classList.toggle("sel", on); c.setAttribute("aria-checked", on?"true":"false"); });
  const hint=document.getElementById("gPolicyHint");
  if(hint) hint.textContent=gamePolicyHint(p);
}

// 칩 클릭. 인원이 실제로 달라졌을 때만 아래 두 블록을 다시 그린다 — skip↔나머지 전환이 그 경우다.
// '어느 정책이 명단을 줄이는가'를 여기 적어두면 정책이 늘 때 같이 고쳐야 하므로, 전후 인원을 세서 판단한다.
function setGamePolicy(p){
  if(!GS || GS.policy===p) return;
  const before=gamePlayers().length;
  GS.policy=p;                         // 정책은 GS 에만 있다 — 게임 종류를 바꾸거나 한 판 더 돌려도 살아남는다 (R6-8)
  patchPolicyChips();
  if(gamePlayers().length!==before) syncGameCountBlocks();
}

// 직전 섬긴 분 조회가 끝난 뒤 그 블록만 채운다. 시트가 이미 닫혔거나 다른 시트가 떠 있으면
// #gPolicyBlock 이 없으므로 아무것도 하지 않는다 — 그 경우 다시 그릴 때 GS.lastHostId 를 읽어 함께 그려진다.
function syncPolicyBlock(){
  const el=sheetOpen ? document.getElementById("gPolicyBlock") : null;
  if(!el) return;
  el.innerHTML=gamePolicyCardHtml();
  // 조회가 끝나는 시점의 정책은 사실상 항상 기본값(soft)이지만, 명단을 줄이는 정책이 살아 있었다면
  // 인원 표기가 지금 틀린 상태다. 그때만 두 블록을 함께 고친다.
  if(gsPolicy()==="skip") syncGameCountBlocks();
  bindGameSheet();                     // 새로 생긴 칩에 리스너를 붙인다
}

// 그리기만 한다. 비동기 조회는 openGameSheet 이 맡으므로 여기서는 아무것도 기다리지 않는다.
// 여러 번 불려도 안전하다 — openSheet 의 pushSub() 은 subActive 가 이미 true 면 no-op 이라
// 히스토리 항목이 늘지 않는다 (R11-7).
function drawGameSheet(){
  openSheet(`
    <h3>🎲 섬길 사람 정하기</h3>
    <p class="muted" style="margin-top:0">결과는 <b>[확정하기]</b>를 누르기 전까진 아무것도 바꾸지 않아요. 마음에 안 들면 한 판 더 돌리면 됩니다.</p>
    <div id="gPlayerBlock">${gamePlayerCardHtml()}</div>
    <!-- 블록 3: 확률 정책 카드. GS.lastHostId 가 문자열일 때만 내용이 생긴다 — 조회 전에 그리면
         빈 div 로 남고, 조회가 끝나면 syncPolicyBlock() 이 이 div 만 채운다. -->
    <div id="gPolicyBlock">${gamePolicyCardHtml()}</div>
    <div id="gPickBlock">${gamePickBlockHtml()}</div>
    <div style="height:8px"></div><button class="btn btn-ghost btn-close" id="gClose">닫기</button>`);
  bind("gClose", closeSheet);
  bindGameSheet();
}

/* ---------- 참가자 바꾸기 ---------- */
/* ---------- 참가 토글 스위치 ---------- */
// 이름 노드에 붙일 id 규약. 스위치가 aria-labelledby 로 같은 행의 이름을 가리켜야
// "김요셉, 스위치, 켜짐"으로 읽힌다 (R1-5). 행 마크업도 반드시 이 함수로 id 를 만든다.
// 구성원 id 는 보통 genMemberId() 가 만든 "m_" + [0-9a-z]{10} 이지만, 옛 데이터에서는
// memObjs() 가 이름 문자열을 그대로 id 로 쓴다({id:m, name:m}) — 공백이 섞이면 HTML id 로
// 쓸 수 없다. 그래서 [A-Za-z0-9-] 밖의 글자는 "_코드36_"으로 감싼다. 구분자로 감싸므로
// 서로 다른 id 가 같은 라벨 id 로 뭉개지지 않는다(이름이 다른 사람의 스위치가 되는 사고 방지).
function gswLabelId(id){
  return "gswl-" + String(id).replace(/[^A-Za-z0-9-]/g, c => "_" + c.codePointAt(0).toString(36) + "_");
}
// 스위치 한 개의 HTML 을 만드는 순수 문자열 생성기. 상태는 aria-checked 로만 싣고
// 색·손잡이 위치는 CSS 가 파생시킨다. <button> 이라 Space/Enter 와 포커스가 공짜로 들어온다 (R1-6).
// type="button" 은 지금 감싸는 form 이 없어도 붙여 둔다 — 나중에 form 안으로 들어가도 제출로 새지 않는다.
function gswHtml(id, on, labelId){
  return `<button type="button" class="gsw" role="switch" aria-checked="${on?"true":"false"}"`
       + ` aria-labelledby="${esc(labelId || gswLabelId(id))}" data-id="${esc(id)}">`
       + `<span class="gsw-track"></span><span class="gsw-knob"></span></button>`;
}

/* ---------- 참가자 고르기 시트 (R7) ----------
   토글마다 openSheet() 을 다시 부르던 draw() 구조를 버린다. openSheet 은 $sheet.innerHTML 을
   갈아치우고 scrollTop=0 을 실행하므로, 명단 아래쪽 사람을 연달아 조정할 수 없었다 —
   매번 맨 위로 튀고 방금 누른 버튼도 사라졌다. 구성원이 많으면 시트 자체를 쓸 수 없다.
   그래서 렌더는 최초 1회로 고정하고, 조작 결과는 '그 행 + 상단 카운트'만 제자리에서 고친다. */

// 한 번의 갱신에 필요한 값을 그 순간 gameRoster()/gsLastHost() 에서 다시 읽어 묶는다.
// 화면이 자기 상태를 들고 있으면 보이는 인원과 실제 추첨 대상이 어긋나므로(design 13) 오래 들고 있지 않는다 —
// 여러 행을 함께 고칠 때 행마다 명단을 다시 계산하지 않기 위한 한 번짜리 묶음이다.
function rosterNow(){
  return { on:new Set(gameRoster().map(m=>m.id)), served:gameServedIds(), last:gsLastHost() };
}

// 행 부제의 우선순위를 여기 한 곳에서 정한다. 한 사람이 여러 조건에 동시에 걸리므로(주문도 했고
// 오늘 섬겼고 직전 호스트이기도 하다) 순서를 못 박아야 화면이 흔들리지 않는다. 위에서부터:
//   1. 안 마심        — 되돌릴 수 없는 제외라 나머지가 무의미하다 (R2-5)
//   2. 아직 주문 전   — 왜 기본 제외인지와 무엇을 하면 되는지를 말하는 유일한 문구다 (R2-4)
//   3. 직전에 섬기신 분 — 정책 카드가 이름으로 가리키는 사람이라 행에서도 찾을 수 있어야 한다
//   4. 오늘 이미 섬기셨어요
//   5. 주문 완료
// 2가 3보다 위인 대가: 주문을 안 한 사람이 직전 호스트이기도 하면 '아직 주문 전'만 보인다.
// 그 경우 그분은 기본 명단에 없고, 정책 카드가 이름을 그대로 적어 주므로 정보가 사라지지는 않는다.
// 켜져 있을 때는 CTA('넣으려면 켜주세요')를 떼어낸다 — 이미 켜 둔 사람에게 켜라고 말하면 안 된다.
// last 가 undefined(아직 조회 안 됨)면 falsy 라서 '직전' 문구가 뜨지 않는다 — '없음'과 같게 다룬다.
function rosterSubText(m, on, snap){
  if(gameIsSkip(m))     return "오늘은 안 마셔요 — 후보에서 빠짐";
  if(!gameDefaultOn(m)) return on ? "아직 주문 전" : "아직 주문 전 — 넣으려면 켜주세요";
  if(snap.last && m.id===snap.last) return "직전에 섬기신 분";
  if(snap.served.has(m.id)) return "오늘 이미 섬기셨어요";
  return "주문 완료";
}

// 행 마크업. 아바타 배경을 --sub 로 바꾸던 처방은 없앴다 — 상태는 스위치가 말하고,
// 제외된 행은 .gs-off 로 이름·부제만 흐려진다 (R1-9는 CSS 쪽 주석 참고).
function rosterRowHtml(m, snap){
  const skip=gameIsSkip(m), on=snap.on.has(m.id), lid=gswLabelId(m.id);
  return `<div class="person${on?"":" gs-off"}" data-id="${esc(m.id)}">
    <div class="avatar">${esc(initials(m.name))}</div>
    <div><div class="pname" id="${esc(lid)}">${esc(m.name)}</div>
      <div class="pmenu">${esc(rosterSubText(m,on,snap))}</div></div>
    ${skip?`<span class="pill skip">안마심</span>`:gswHtml(m.id,on,lid)}</div>`;
}

// 행 하나를 '제자리에서' 고친다. innerHTML 을 다시 넣지 않고 속성·클래스·텍스트만 건드리는 것이
// 핵심이다 — 노드가 살아 있으니 방금 누른 스위치의 포커스가 애초에 날아갈 일이 없다 (R7-2).
function patchRosterRow(row, snap){
  const m=memberById(row.dataset.id);
  if(!m) return;                                    // 갱신 중 명단에서 사라진 행은 건드리지 않는다
  const on=snap.on.has(m.id);
  row.classList.toggle("gs-off", !on);
  const sw=row.querySelector(".gsw");
  if(sw) sw.setAttribute("aria-checked", on?"true":"false");   // 색·손잡이 위치는 CSS 가 여기서 파생시킨다
  const sub=row.querySelector(".pmenu"), t=rosterSubText(m,on,snap);
  if(sub && sub.textContent!==t) sub.textContent=t;
}

function rosterRows(){ const l=document.getElementById("gRosterList"); return l ? l.querySelectorAll(".person") : []; }

// data-id 를 CSS 선택자에 끼워 찾지 않는다 — 옛 데이터의 구성원 id 는 이름 문자열이라 따옴표·공백이
// 섞일 수 있다. 구성원은 최대 60명이라 훑는 비용이 무의미하다.
function syncRosterRow(id){
  const snap=rosterNow(); id=String(id);
  rosterRows().forEach(row=>{ if(row.dataset.id===id) patchRosterRow(row, snap); });
}
// 게임 고르기 시트와 같은 값이어야 한다 — 그래서 gamePlayers() 하나만 본다 (R3-6).
function syncRosterCount(){
  const el=document.getElementById("gRosterCount");
  if(el) el.textContent=gamePlayers().length+"명";
}
// 컨테이너를 다시 만들지 않으므로 scrollTop 이 유지되고, 위임 리스너도 그대로 살아 있다 (R7-4).
function syncRosterAll(){
  const snap=rosterNow();
  rosterRows().forEach(row=>patchRosterRow(row, snap));
  syncRosterCount();
}

// [완료] 는 '되돌아가기'다 — 히스토리 항목이 늘어나면 뒤로가기가 한 번 헛돈다 (R11-7).
// openSheet 안의 pushSub() 은 subActive 가 이미 true 면 no-op 이라 실제로 늘지는 않지만,
// 그 no-op 에 기대는 계약은 조용히 깨진다. 늘어났으면 개발 중에 드러나게 확인만 남긴다.
// openGameSheet 이 아니라 drawGameSheet 을 부른다. 진입은 이미 한 번 있었고 직전 섬긴 분 조회도
// 그때 걸렸으므로, 여기서 다시 진입하면 응답이 오기 전이었을 때 같은 RPC 가 두 번 나간다.
// (fetchLastHost 의 캐시는 응답이 도착한 뒤에야 채워진다 — 진행 중인 조회를 합쳐주지 않는다.)
// 조회가 이 시트가 닫혀 있는 동안 끝났더라도, 아래 그리기가 GS.lastHostId 를 읽어 정책 카드까지 함께 그린다.
function backToGameSheet(){
  const had=subActive;
  drawGameSheet();
  if(!had && subActive) console.warn("참가자 고르기 [완료]가 히스토리 항목을 늘렸다 (R11-7)");
}

function openRosterSheet(){
  if(!GS) gameEnsure();
  const snap=rosterNow();
  openSheet(`
    <h3>참가자 고르기</h3>
    <p class="muted" style="margin-top:0">현재 <b id="gRosterCount">${gamePlayers().length}명</b>. '안 마실게요' 하신 분은 넣을 수 없어요.</p>
    <div class="row-2" style="margin-bottom:10px">
      <button class="btn btn-sm btn-soft" id="gAll">전원 참가</button>
      <button class="btn btn-sm btn-soft" id="gServed">오늘 섬긴 분 빼기</button></div>
    <div class="card" id="gRosterList" style="padding:6px 14px">${MEMBERS.map(m=>rosterRowHtml(m,snap)).join("")}</div>
    <div style="height:10px"></div><button class="btn btn-brand" id="gDone">완료</button>`);
  // 리스너는 목록 컨테이너에 하나만 건다. 행을 제자리에서 고치니 재배선할 일이 없고,
  // 컨테이너가 살아 있는 동안(=시트가 열려 있는 동안) 위임이 유지된다.
  // 스위치가 없는 '안 마심' 행은 .gsw 가 없어 여기 걸리지 않고, 설령 강제로 켜도
  // rosterFrom 이 안 마시는 분을 먼저 잘라내므로 명단에 들어가지 못한다 (R2-5).
  const list=document.getElementById("gRosterList");
  list.addEventListener("click", e=>{
    const sw=e.target.closest(".gsw");
    if(!sw || !list.contains(sw)) return;
    gameToggle(sw.dataset.id, sw.getAttribute("aria-checked")!=="true");   // 상태의 출처는 화면이 아니라 GS 지만, 뒤집을 기준은 방금 보고 누른 값이다
    syncRosterRow(sw.dataset.id);   // 그 행만
    syncRosterCount();              // 상단 카운트만 — 컨테이너를 다시 만들지 않으니 scrollTop 이 그대로다 (R7-1, R7-3)
    sw.focus();                     // iOS 사파리는 버튼을 눌러도 포커스를 주지 않는다 — 여기서 못 박는다 (R7-2)
  });
  bind("gAll",    ()=>{ gameAllOn();      syncRosterAll(); });   // R2-10
  bind("gServed", ()=>{ gameDropServed(); syncRosterAll(); });   // R2-9 — 오늘 섬긴 분만 꺼지고 나머지 명단은 그대로다
  bind("gDone",   backToGameSheet);
}

/* ---------- 실행 ---------- */
function startGame(kind){
  if(!GS) gameEnsure();
  const players=gamePlayers();   // 시트에 보인 인원과 같은 출처 — 정책 적용 후 1명이 되는 경우도 여기서 막힌다
  if(players.length<2){
    // 사유를 갈라 말한다 (R6-14). [제외] 때문에 줄어든 경우에 "2명 이상이어야 해요"만 띄우면
    // 명단에는 두 명이 보이는데 왜 안 되는지 알 수 없고, 어느 손잡이를 당길지도 모른다.
    const dropped = gameRoster().length >= 2;
    toast(dropped ? "[제외] 때문에 참가자가 "+players.length+"명이에요 — 정책을 바꾸거나 참가자를 늘려주세요"
                  : "참가자가 2명 이상이어야 해요");
    return;
  }
  // 상한은 시트에서 이미 막았지만 [한 판 더]는 시트를 지나지 않고 startGame(GS.kind) 을 직접 부른다.
  // 게임 도중 누가 주문을 넣어 명단이 16명을 넘으면, 시트에서는 비활성인 사다리가 여기로 다시
  // 들어와 라벨이 겹친 화면을 그린다. 그래서 판정을 실행 지점에도 둔다. 문구는 시트의 사유와 같다 (R10-4).
  // GAME_MAX[kind] 가 없는(=모르는) kind 는 판정하지 않는다 — Infinity·16·24 는 모두 truthy 다.
  if(GAME_MAX[kind] && !gameFits(kind, players.length)){
    toast(GAME_MAX[kind]+"명까지 — 지금 "+players.length+"명이라 화면에 안 들어가요");
    return;
  }
  GS.kind=kind;   // [한 판 더]가 같은 게임을 다시 돌릴 수 있게 기억해 둔다 (R6-8)
  // 서명도 여기서 남긴다 — 위 두 가드를 통과한 뒤라야 한다. 가드에 걸려 돌아가는 경우까지 덮어쓰면
  // 화면에 남아 있는 지난 결과의 기준이 '시작하지도 않은 판'의 명단으로 갈려 경고가 사라진다.
  // [한 판 더]도 이 지점을 다시 지나므로 서명이 새로 잡히고, 그러면 경고가 저절로 걷힌다 (R17-1).
  GS.sig=gameRosterSig();
  // 결과를 먼저 뽑고 그림이 그 결과를 향하게 한다 — 애니메이션이 결과를 만들면 확률이 고르지 않다.
  // 그래서 확률 정책이 여기 한 지점에만 얹힌다 (R6-9).
  if(kind==="ladder") playLadder(players, gamePickWinner(players));
  else if(kind==="wheel") playWheel(players, gamePickWinner(players));
  // 구슬 레이스도 같은 지점에서 당첨자를 먼저 뽑는다 — 확률 정책이 그대로 반영된다 (R19-4).
  // 명단도 여기서 읽은 players 를 그대로 넘긴다. [한 판 더]가 이 지점을 다시 지나므로 그때의
  // gamePlayers() 로 새로 뽑히고, playRace 는 명단을 어디에도 캐시하지 않는다 (R19-15).
  else if(kind==="race") startRace(players, gamePickWinner(players));
  // 손가락 룰렛은 예외다 (R6-10). 당첨되는 건 화면에 올라온 물리적 손가락이고 그게 누구인지는
  // 사후에 사람이 지목한다 — 미리 뽑아 강제하면 사람의 지목을 몰래 덮어쓰게 되므로 뽑지 않는다.
  // 명단도 넘기지 않는다. 이름 칩은 지목하는 그 순간의 gamePlayers() 를 읽어야 하므로(R3-7)
  // 시작 시점의 배열을 들고 있으면 오히려 낡은 값을 쓸 위험만 생긴다.
  else playFinger();
}

/* 그림판의 aria-label 을 '진행 중'에서 결과로 바꾼다 (R13-6, R19-16).
   사다리와 돌림판 두 곳이 같은 문제를 갖고 있어 각자 고치면 처방이 갈라진다. 세 게임이 반드시
   지나가는 showGameResult 한 지점에 얹는 이유는 여기가 (a) 게임마다 한 번씩 불리고 (b) 이미
   당첨자를 쥐고 있어서다. 문구만 GS.kind 로 갈린다.
   선택자에 canvas 를 함께 넣는다 — 구슬 레이스의 그림판은 <canvas role="img"> 라서 svg 만 찾으면
   조용히 지나가고 라벨이 '진행 중'으로 남는다. '무엇으로 그렸는지'가 아니라 'role=img 인 그림판'이
   이 함수가 찾는 대상이므로, 종류별 분기를 늘리는 대신 선택자를 그 뜻에 맞게 넓힌다.
   손가락 룰렛은 그림판이 없으므로 querySelector 가 null 을 돌려주고 조용히 지나간다 — 손가락은
   화면에 '진행 중' 라벨을 걸지 않으니 되돌릴 것도 없다.
   [한 판 더]는 openGameOv 가 마크업을 다시 그리므로 라벨이 '진행 중'으로 저절로 되돌아온다. */
function gameStageDone(w){
  const ov=$gv(); if(!ov) return;
  const stage=ov.querySelector('svg[role="img"], canvas[role="img"]');   // 오버레이 안의 그림판. 게임마다 하나뿐이다
  if(!stage) return;
  const kind=GS && GS.kind;
  const head= kind==="ladder" ? "사다리타기 결과: "
            : kind==="wheel"  ? "돌림판 결과: "
            : kind==="race"   ? "구슬 레이스 결과: " : "게임 결과: ";
  stage.setAttribute("aria-label", head + hon(w.name));
}

function showGameResult(w){
  gvibe([28,60,28]);
  gameStageDone(w);   // 진행 중 라벨을 결과로 갱신 (R13-6)
  // role="status"(= aria-live polite + atomic)는 이 안에 꽂는 마크업이 아니라 빈 #gvWin 컨테이너에 미리 걸려 있다.
  // 라이브 리전은 '이미 DOM 에 등록된 영역이 바뀔 때' 읽힌다 — 내용과 함께 새로 삽입되면 안 읽히는 리더가 있다 (R13-4).
  const box=document.getElementById("gvWin");
  /* 게임이 도는 사이 명단이 바뀌었는지는 여기서 처음 본다 (R17-1, R17-2). 감시자를 걸지 않는 이유는
     이 값이 쓰이는 순간이 둘뿐이라서다 — 결과가 걸릴 때와 확정할 때. 그 사이에 알아도 할 일이 없다.
     결과를 몰래 다시 뽑거나 오버레이를 닫지는 않는다. 사용자가 방금 본 그림과 이름은 그대로 두고
     '이 결과를 그대로 쓸지'만 사용자가 고르게 한다.
     gone(당첨자가 지금 추첨 대상이 아님)이 더 강한 조건이다 — 명단에서 빠진 분을 호스트로 앉히는
     것이 실제 사고이고, changed 는 남이 주문을 넣은 정도의 변화도 함께 잡는다. */
  const changed = !!(GS && GS.sig!==null && GS.sig!==gameRosterSig());
  const gone = !gamePlayers().some(m=>m.id===w.id);
  const warn = gone    ? "당첨되신 분이 방금 명단에서 빠졌어요 — 한 판 더 돌려주세요"
             : changed ? "게임 도중 참가자가 바뀌었어요 — 한 판 더 돌리시겠어요?" : "";
  // 배너를 #gvWin 안, 결과 블록 '위'에 넣는다. 따로 만든 div 를 바깥에 끼우면 새로 삽입된 영역이라
  // 라이브 리전으로 안 읽히는 리더가 있고, 리전을 하나 더 두면 결과와 경고가 두 번에 나눠 읽힌다.
  // 여기 넣으면 role="status"(atomic) 가 '경고 + 당첨자'를 한 번에 읽는다 — #gvWin 의 속성은 그대로다.
  if(box) box.innerHTML=`${warn?`<div class="game-warn">${esc(warn)}</div>`:""}<div class="game-win"><div class="we">☕</div>
    <div class="wn">${esc(hon(w.name))}</div>
    <div class="ws">오늘 음료로 섬겨주실 분${w.id===ME?" — 바로 나!":""}</div></div>`;
  const say=document.getElementById("gvSay"); if(say) say.innerHTML="결과가 나왔어요";
  const same = SESSION.hostId===w.id;
  // 라벨에서 이름을 뺀다 (R18-3, R18-4). 당첨자 이름은 바로 위 .game-win .wn 에 25px 로 크게 나와
  // 있으니 버튼에서 되풀이할 이유가 없고, 이름을 빼면 길이에 따른 넘침과 이름 뒤 조사 문제가
  // 함께 사라진다 — 조사를 다른 자리로 옮기는 게 아니라 없애는 쪽이다.
  const okLabel = same ? "확인" : "✅ 이분으로 확정하기";
  /* 명단에서 빠진 분을 호스트로 앉히는 길을 아예 없앤다 (R17-2). 비활성 버튼으로 남기지 않는 이유는
     푸터가 이미 [한 판 더]로 다음 행동을 주고 있어서다 — 못 누르는 버튼을 하나 더 보여줄 이유가 없다.
     same(당첨자가 이미 호스트)인 경우는 막지 않는다. 그 버튼은 [확인]이라 서버에 쓰는 것이 없고
     '그대로 섬깁니다'도 여전히 사실이다 — 막으면 현상 유지를 받아들일 길만 사라진다. */
  const blocked = gone && !same;
  setGameFoot(`${blocked?"":`<button class="btn btn-brand" id="gvOk">${okLabel}</button>`}
    <div class="row-2"><button class="btn btn-soft" id="gvAgain">🎲 한 판 더</button>
      <button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button></div>`);
  bind("gvOk", async()=>{
    // 호스트가 이미 당첨자면 서버에 쓸 것이 없다 — 잠글 이유도 없으므로 두 갈래를 구분해 둔다.
    // 위에서 잡아둔 same 이 아니라 눌린 시점의 SESSION 을 다시 읽는다 (R17-3). 결과 화면이 떠 있는
    // 동안 폴링이 호스트를 갈아끼울 수 있고, 낡은 same 으로 갈리면 남이 이어받은 섬김을 두고
    // '그대로 섬깁니다'라고 말하거나(true→false), 이미 호스트인 분을 다시 인계한다(false→true).
    if(SESSION.hostId===w.id){ closeGame(); toast(hon(w.name)+"이 그대로 섬깁니다 🙏"); return; }
    // guardWrite 는 busyWrite 가 이미 true 면 fn 을 아예 부르지 않는다. 그 상태에서 잠그면
    // 되돌릴 계기가 없는 disabled 로 남을 수 있으니, 잠그기 전에 확인해서 그때는 손대지 않는다.
    if(busyWrite) return;
    const b=document.getElementById("gvOk");
    // await 앞에서 동기로 잠근다 — 재진입 차단은 guardWrite 가 하고 여기서는 시각 상태만 얹는다(R18-1).
    if(b){ b.disabled=true; b.textContent="확정하는 중…"; }
    try{ await commitGameWinner(w); }
    finally{
      // 성공 경로에서는 closeGame() 이 오버레이를 비웠으므로 이 버튼은 이미 DOM 에 없다.
      // 되돌리기가 의미 있는 건 오버레이가 남아 있는 실패 경로뿐이라 contains 로 확인한다.
      if(b && document.body.contains(b)){ b.disabled=false; b.textContent=okLabel; }
    }
  });
  bind("gvAgain",()=>{ clearGameTimers(); if(GS && GS.teardown){ try{ GS.teardown(); }catch(e){} GS.teardown=null; } startGame(GS && GS.kind); });
  bind("gvCancel",()=>closeGame());   // closeGame(opts) — 이벤트 객체를 opts 로 흘려보내지 않는다
  // 인원이 많거나 화면이 짧으면 발표가 접힌 아래에 생긴다 — 끝까지 내려서 보여준다.
  // 버튼이 다 들어간 뒤라야 푸터 높이가 확정되므로 반드시 setGameFoot 다음, 레이아웃 한 프레임 뒤에 잰다.
  // (확정이 막힌 경우엔 두 개다 — 높이가 달라지므로 여기서 재는 순서가 더 중요해진다.)
  requestAnimationFrame(()=>{ const bd=document.getElementById("gvBody"); if(!bd || bd.scrollHeight<=bd.clientHeight) return;
    try{ bd.scrollTo({top:bd.scrollHeight, behavior:lessMotion()?"auto":"smooth"}); }catch(e){ bd.scrollTop=bd.scrollHeight; } });
}

/* 확정 = 여기서 처음으로 서버에 쓴다. 호스트가 이미 있으면 비운 뒤(unclaim) 당첨자가 이어받는다(claim).
   unclaim 은 주문이 0건이면 섬김 자체를 지우고, 그러면 claim 이 새 seq 로 섬김을 다시 만든다 —
   'N번째 섬김'이 사라지고 번호가 튀는 사고다. 이 방어는 예전엔 진입점 조건
   (Object.keys(ORDERS).length>0)에 있었는데, 그 자리로는 두 경우를 못 막는다:
     ① 시트가 열려 있는 동안 마지막 주문이 취소되는 경우 — 화면 조건은 이미 통과했다.
     ② [전원 참가](gameAllOn)로 GS.on 을 채우면 rosterFrom 이 주문과 무관하게 참가로 세므로
        '참가자 2명 + 주문 0건'이 성립하는 경우.
   그래서 쓰기 바로 앞으로 옮겼다. 인계가 필요 없는 경우(prevHost 없음)엔 unclaim 을 부르지
   않으므로 조건도 걸지 않는다 — 호스트 없는 빈 섬김을 게임으로 가져가는 건 안전하다 (R16-5). */
async function commitGameWinner(w){
  await guardWrite(async()=>{
    /* SESSION 을 함수 진입 시점이 아니라 쓰기 직전에 읽는다 (R17-3). 게임은 몇십 초를 도는 동안
       폴링이 SESSION 을 계속 갈아끼우므로, 미리 잡아둔 prevHost 로 판단하면 두 가지가 어긋난다 —
       그사이 남이 이어받았는데도 '호스트 없음'으로 보고 unclaim 을 건너뛰거나, 반대로 이미 비워진
       섬김을 또 비운다. 0건 가드도 같은 값을 봐야 하므로 한 번 읽어 둘이 함께 쓴다.
       읽는 자리를 guardWrite 안으로 옮긴 것도 같은 이유다 — 지금은 이 앞에 await 가 없어 값이
       같지만, 나중에 확인창 같은 await 가 앞에 끼면 밖에서 읽은 값이 곧 낡은 값이 된다. */
    const seq=SESSION.seq, prevHost=SESSION.hostId, cafeId=SESSION.cafeId||activeCafeId();
    if(prevHost && !Object.keys(ORDERS).length){
      toast("아직 주문이 없어서 지금 넘기면 이 섬김이 사라져요 — 주문이 모인 뒤에 확정해주세요");
      return;   // 오버레이는 그대로 둔다 — [한 판 더]나 닫기를 사용자가 고르게 한다
    }
    toast("확정하는 중…");
    try{
      if(prevHost) await Sync.unclaim(seq);
      const ok=await Sync.claim(w.id, cafeId);
      /* claim 은 'host_id is null' 일 때만 성공하므로 false = 그 찰나에 남이 먼저 이어받았다는 뜻이다.
         이 경우엔 오버레이를 닫지 않는다 (R17-4). 닫으면 우리가 시도한 결과가 화면에서 사라지고
         [한 판 더]도 함께 없어져, 다시 돌리려면 시트를 처음부터 다시 열어야 한다 — 복구 가능해야
         한다는 요구와 반대다. 성공 경로만 닫고, 실패 경로는 결과 화면을 남긴 채 사유를 알린다.
         render() 는 실패 경로에서도 부른다 — 아래 화면이 새 호스트를 반영해야 하고, 오버레이는
         #app 밖에 있어 재렌더에 닫히지 않는다 (R17-5). */
      if(!ok){
        toast("앗, 방금 다른 분이 먼저 이어받으셨어요 — [한 판 더]로 다시 돌려보세요");
        render();
        return;
      }
      closeGame(); viewSeq=null;   // 게임이 쥔 히스토리 항목을 여기서 소비한다
      toast(w.id===ME ? "🎲 제가 섬기게 됐어요 — 메뉴는 지금도 바꿀 수 있어요"
                      : "🎲 "+hon(w.name)+"이 오늘의 섬김을 맡았어요");
      // 게임을 연 자리에 그대로 둔다(R12-4). 단 당첨자 본인은 메뉴를 다시 고를 수 있어야 하므로
      // 합친 화면(기본 탭 order)으로 보낸다 — 사는 줄 모르고 고른 메뉴를 바꿀 기회를 주는 게
      // 이 흐름의 예의다.
      // setOpenTab 을 쓰지 않는 이유가 둘이다: openTab 이 이미 "order"(합친 화면에서 게임을 열었을 때)면
      // 즉시 return 해서 forceGrid 가 화면에 반영되지 않고, 다른 탭이면 history.back() 이라는 부수효과가
      // 방금 closeGame() 이 맞춰둔 히스토리 장부와 부딪힌다. 그래서 직접 대입한다.
      if(w.id===ME){          // 여기까지 왔으면 성공 경로다 — 실패는 위에서 이미 return 했다
        clearSubEntry();      // 내 주문 탭으로 넘어가므로 탭·시트가 쥔 1칸도 함께 정리한다 (7.3)
        forceGrid=true;
        openTab="order";
      }
      render();   // 분기 '뒤'에 딱 한 번. 먼저 부르면 forceGrid 가 반영될 기회가 없다 (R12-1)
    }catch(e){ console.error(e); closeGame(); toast("확정 실패 — 네트워크 확인 후 다시 시도해주세요"); render(); }
  });
}

/* ---------- 🪜 사다리타기 ---------- */
function playLadder(roster, winner){
  const n=roster.length, W=340, PAD=24, LABEL_Y=15, Y0=28, RUN=300;
  const LEV=Math.min(14, Math.max(6, n*2)), STEP=RUN/LEV, Y1=Y0+RUN, BOX_Y=Y1+9, BOX_H=26, H=BOX_Y+BOX_H+6;
  const colX=i=> PAD + i*(W-2*PAD)/(n-1);
  // 세로줄 간격보다 이름이 넓으면 위쪽 이름이 서로 겹쳐 못 읽는다 → 인원에 맞춰 글자수·크기를 줄인다.
  // 짧게 잘려도 전체 이름은 결과 발표와 <title> 에 그대로 나온다.
  /* 미측정 (R13-5): 이 값들은 SVG 사용자 단위다. viewBox 340 을 .game-stage(max-width
     min(400px,50vh))에 맞추므로 320px 화면에서 배율이 0.84 이고, n=10 의 NFS 8.5u 는
     CSS 7.1px 로 렌더된다(375px 화면에서 8.3px). 번호로 바뀌는 시점이 n>10 이라 n=10 이
     최악이면서 두 글자 한글을 그 크기로 그린다.
     크기를 올리면 GAP·BOX_W 와 겹치므로 단독으로 못 바꾼다 — 실기기에서 판독 여부를 잰 뒤,
     안 읽히면 크기가 아니라 GAME_LABEL_MAX 를 9 로 내려 번호+범례 경로로 보내는 게 맞다. */
  const GAP=(W-2*PAD)/(n-1), NCH= n<=7?4 : n<=9?3 : 2, NFS= n<=7?11 : n<=9?10 : 8.5;
  const BOX_W=Math.min(30, GAP*0.82);
  // 11명부터는 라벨을 번호로 바꾼다. 이름 축소는 2글자·8.5px 에서 멈추므로 그 아래로는 겹칠 뿐이고,
  // 2글자로 자른 이름은 어차피 못 읽는다. 번호는 아래 범례가 이름과 이어준다 (R10-1, R10-2).
  // 숫자는 한글보다 좁아서 두 자리가 10px 로도 ≈11px — 세로줄 간격이 가장 좁은 16명(19.5px)에도
  // 들어간다. NFS(8.5px)까지 줄일 이유가 없으므로 읽기 쉬운 쪽을 고른다.
  const NUMS = n > GAME_LABEL_MAX, LFS = NUMS ? 10 : NFS;
  // 도착 상자 안 기호 크기. 상자 폭에 비례로 묶어야 16명(BOX_W≈15.96)에서 ☕ 가 상자를 넘지
  // 않는다 (R4-7, R10-3). ☕ 는 이모지라 마침표보다 넓고 폰트에 따라 1em 을 살짝 넘기도 하는데,
  // 0.62em 이면 넘쳐도 상자 폭의 ~75% 라서 테두리 안에 남는다. 14px 상한은 2~12명에서 지금과
  // 같은 크기를 유지하기 위한 것이다.
  const BFS = Math.min(14, BOX_W*0.62);
  // 기호를 상자 정중앙에 놓는 베이스라인. 글자 크기가 인원에 따라 변하므로 상수 18 을 쓰면
  // 작은 상자에서 글자가 아래로 처진다. 중심(BOX_Y+BOX_H/2)에서 대문자 높이 절반(≈0.36em)만큼
  // 내린다 — BFS=14 에서 BOX_Y+18.0 으로 기존 값과 같다.
  const BTY = BOX_Y + BOX_H/2 + BFS*0.36;
  const rowY=l=> Y0 + (l+0.5)*STEP;
  // 가로줄: 같은 높이에서 이웃끼리 겹치면 경로가 갈라지지 않는다 → 인접 금지.
  // 가로줄이 너무 적거나, 아무도 자리를 안 바꾸는(제자리) 사다리는 그림이 밋밋해서 다시 만든다.
  const trace=(rungs,start)=>{ let col=start; const pts=[[colX(col),Y0-6]];
    for(let l=0;l<LEV;l++){ const row=rungs[l];
      const to = row.indexOf(col)>=0 ? col+1 : (row.indexOf(col-1)>=0 ? col-1 : null);
      if(to!==null){ pts.push([colX(col),rowY(l)]); pts.push([colX(to),rowY(l)]); col=to; } }
    pts.push([colX(col),BOX_Y-2]); return {pts,end:col}; };
  let rungs=[], paths=[];
  for(let t=0;t<60;t++){
    rungs=[]; let total=0;
    for(let l=0;l<LEV;l++){ const row=[];
      for(let i=0;i<n-1;i++){ if(row.indexOf(i-1)>=0) continue; if(Math.random()<0.45){ row.push(i); total++; } }
      rungs.push(row); }
    paths=roster.map((m,i)=>trace(rungs,i));
    if(total>=n && paths.some((p,i)=>p.end!==i)) break;
  }
  const wi=roster.indexOf(winner), goal=paths[wi].end;   // ☕ 는 당첨자가 도착하는 칸에 놓는다
  // 같은 가로줄을 두 사람이 지날 때 색이 덮이지 않도록 사람마다 아주 조금 어긋나게 그린다
  const dOf=(pts,i)=>{ const off=(i-(n-1)/2)*0.8;
    return pts.map((p,k)=>(k?"L":"M")+p[0].toFixed(1)+" "+(p[1]+off).toFixed(1)).join(" "); };
  // 색은 gcolor(i, n) 으로 뽑는다. n 을 안 넘기면 11명째부터 0번과 색이 겹쳐 두 사람의
  // 경로선을 구분할 수 없다 (R9-1·R9-3). n 은 이 판을 그릴 때 쓴 roster.length 그대로 —
  // 그리는 중에 명단이 바뀌어도 라벨 색과 경로 색이 어긋나지 않는다.
  // 도착 상자(.lbox)는 첫 프레임부터 확정된 모습으로 그린다 — goal 칸은 강조 배경·굵은 테두리에
  // ☕, 나머지는 중립 배경에 · 만 둔다. ? 로 시작해 뒤늦게 하나씩 여는 연출을 없앴다
  // (R4-1·R4-2·R4-5·R4-8). 왼쪽부터 열리던 예전 연출은 소거법으로 답이 새기도 했다.
  // 긴장은 선이 2.4초 동안 위에서 아래로 내려오는 데서 나온다.

  openGameOv("🪜 사다리타기", `
    <div class="game-say" id="gvSay" aria-live="polite">한 폰을 다 같이 보세요 — 내려갑니다…</div>
    <div class="game-stage"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="사다리타기 진행 중">
      ${roster.map((m,i)=>`<text x="${colX(i)}" y="${LABEL_Y}" text-anchor="middle" font-size="${LFS}" font-weight="800" fill="${gcolor(i, n)}"><title>${esc(m.name)}</title>${NUMS ? (i+1) : esc(shortName(m.name,NCH))}</text>`).join("")}
      ${roster.map((m,i)=>`<line x1="${colX(i)}" y1="${Y0}" x2="${colX(i)}" y2="${Y1}" stroke="#e7ddcf" stroke-width="3" stroke-linecap="round"/>`).join("")}
      ${rungs.map((row,l)=>row.map(i=>`<line x1="${colX(i)}" y1="${rowY(l)}" x2="${colX(i+1)}" y2="${rowY(l)}" stroke="#e7ddcf" stroke-width="3" stroke-linecap="round"/>`).join("")).join("")}
      ${roster.map((m,i)=>`<path class="lpath" d="${dOf(paths[i].pts,i)}" fill="none" stroke="${gcolor(i, n)}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`).join("")}
      ${roster.map((m,i)=>{ const hit = i===goal;
        return `<g class="lbox" data-c="${i}"><rect x="${(colX(i)-BOX_W/2).toFixed(1)}" y="${BOX_Y}" width="${BOX_W.toFixed(1)}" height="${BOX_H}" rx="9" fill="${hit?"#fbe9e3":"#f6f1ea"}" stroke="${hit?"#c2552f":"#e7ddcf"}" stroke-width="${hit?2:1.5}"/>
        <text x="${colX(i)}" y="${BTY.toFixed(1)}" text-anchor="middle" font-size="${BFS.toFixed(1)}" font-weight="800" fill="${hit?"#a8401f":"#b6a99a"}">${hit?"☕":"·"}</text></g>`; }).join("")}
    </svg></div>
    ${gameLegendHtml(roster, n)}
    <div id="gvWin" role="status"></div>`);
  setGameFoot(`<button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button>`);
  bind("gvCancel",()=>closeGame());   // closeGame(opts) — 이벤트 객체를 opts 로 흘려보내지 않는다

  // 4800ms — 예전 2400 의 절반 속도다. 2.4초는 선 여섯 줄이 동시에 내려오는 걸 눈으로 좇기엔
  // 빨라서 "누가 어디로 갔는지"가 안 보였다. 돌림판(4.4초)과도 대역이 맞는다.
  const DUR = lessMotion() ? 10 : 4800;
  // 선이 위에서 아래로 그려지는 애니메이션. 두 가지를 지켜야 실제로 움직인다:
  //   ① 길이에 단위를 붙인다 — CSS 의 stroke-dashoffset 은 <length> 라 단위 없는 숫자는 0 으로 떨어진다.
  //   ② 시작값을 브라우저가 한 번 반영한 뒤에 끝값을 준다 — 안 그러면 두 값이 같은 스타일 재계산에
  //      묶여 보간할 구간이 없고 그냥 완성된 채로 나타난다(rAF 한 번으로는 부족하다).
  const els=[...$gv().querySelectorAll(".lpath")];
  els.forEach(p=>{ const len=p.getTotalLength();
    p.style.transition="none";
    p.style.strokeDasharray=len+"px"; p.style.strokeDashoffset=len+"px"; });
  void $gv().offsetHeight;   // 시작값 커밋(리플로우 1회)
  els.forEach(p=>{ p.style.transition="stroke-dashoffset "+DUR+"ms cubic-bezier(.45,.05,.25,1)";
                   p.style.strokeDashoffset="0px"; });

  // 선이 다 내려오면 곧바로 발표한다. 상자는 이미 다 보이므로 열어 보일 것이 없다 (R4-5).
  // 120ms 는 마지막 선의 끝점이 상자에 닿은 걸 눈이 확인할 여유다.
  gtimer(()=>showGameResult(winner), DUR+120);
}

/* ---------- 🎡 돌림판 ---------- */
function playWheel(roster, winner){
  const n=roster.length, R=100, a=360/n, wi=roster.indexOf(winner);
  // 조각 색은 gcolor(i, n). n 을 안 넘기면 11명째에 0번과 같은 색이 되고, 그 둘은 바로
  // 옆 조각이라 흰 구분선만 남아 경계가 사실상 사라진다 (R9-1·R9-2).
  const sectors=roster.map((m,i)=>{
    const s=(i*a-90)*Math.PI/180, e=((i+1)*a-90)*Math.PI/180, big=a>180?1:0;
    return `<path d="M0 0 L ${(R*Math.cos(s)).toFixed(2)} ${(R*Math.sin(s)).toFixed(2)} A ${R} ${R} 0 ${big} 1 ${(R*Math.cos(e)).toFixed(2)} ${(R*Math.sin(e)).toFixed(2)} Z" fill="${gcolor(i, n)}" stroke="#fff" stroke-width="1.2"/>`;
  }).join("");
  // 핀은 12시. 12시에서 시계방향 mid 만큼 떨어진 조각을 핀 아래로 보내려면 그만큼 되돌려 감는다.
  const { spin, labelEnd } = wheelSpin(n, wi, Math.random);
  // 이름은 판과 같이 돌면 멈췄을 때 거꾸로 선다. 판이 도는 만큼 글자를 제자리에서 되돌려 놔
  // 멈춘 순간 항상 똑바로 읽히게 한다(폰에서는 가로로 놓인 2~4글자가 제일 잘 읽힌다).
  // 다만 그 되돌림을 '상수'로 박아 두면 정지 상태의 기울기가 곧 당첨 조각의 각도가 되어
  // 산수로 답이 샌다 (R6). 그래서 라벨은 어느 경로에서든 rotate(0) 으로 그려 두고, 되돌림은
  // 나중에 넣는다 — 판과 같은 이징으로 0 → labelEnd 로 보간하거나(주 경로), 회전이 한창일 때
  // 한 번에 바꾸거나(폴백). 최종 역회전 값은 data-rot 에 실어 둔다.
  // 11명부터는 조각 라벨도 번호만 넣는다 — 조각 각도가 15°(24명)까지 좁아지면 2글자 이름조차
  // 이웃 조각으로 넘어간다. 역회전은 번호에도 그대로 걸어야 멈춘 순간 똑바로 선다 (R14-4, R6-4).
  // 글자 크기는 기존 식(n>8?11:13)을 건드리지 않는다. 번호 경로는 항상 n>10 이라 그 식이 이미
  // 11px 을 주고, 두 자리 숫자가 ≈12px 이라 24명의 라벨 간격(반지름 62 · 15° ≈ 16px)에 들어간다.
  // 더 줄일 이유가 없으니 줄이지 않는다.
  const NUMS = n > GAME_LABEL_MAX;
  const labels=roster.map((m,i)=>{ const t=((i+0.5)*a-90)*Math.PI/180, lr=R*0.62;
    const x=lr*Math.cos(t), y=lr*Math.sin(t);
    // font-size 는 SVG 사용자 단위다 — viewBox 216 을 .wheel-wrap(max-width min(320px,50vh))에
    // 맞추므로 배율이 1.31~1.48 이고 화면에서는 CSS 14.5~19.3px 로 렌더된다. 이 파일에서 가장
    // 큰 본문급 글자이며, 값 자체는 위 폭 예산에 묶여 있어 바꾸지 않는다 (R13-23).
    // transform 을 아예 안 건다 = rotate(0) = 똑바로. 최종 역회전은 data-rot 에만 실어 두고
    // 아래에서 시간이 흐른 뒤에 적용한다 — 여기에 박아 넣는 순간 정지 화면이 답을 말한다.
    return `<text class="wlab" x="${x.toFixed(2)}" y="${(y+4).toFixed(2)}" data-rot="${labelEnd.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)}" text-anchor="middle" font-size="${n>8?11:13}" font-weight="800" fill="#fff">${NUMS ? (i+1) : esc(shortName(m.name,4))}</text>`;
  }).join("");
  openGameOv("🎡 돌림판", `
    <div class="game-say" id="gvSay" aria-live="polite">돌아갑니다…</div>
    <div class="wheel-wrap"><div class="wheel-pin">🔻</div>
      <div id="wRot" style="transform:rotate(0deg)"><svg viewBox="-108 -108 216 216" role="img" aria-label="돌림판 회전 중">
        ${sectors}${labels}<circle cx="0" cy="0" r="13" fill="#fff" stroke="#e7ddcf" stroke-width="2"/></svg></div></div>
    ${gameLegendHtml(roster, n)}
    <div id="gvWin" role="status"></div>`);
  setGameFoot(`<button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button>`);
  bind("gvCancel",()=>closeGame());   // closeGame(opts) — 이벤트 객체를 opts 로 흘려보내지 않는다

  const slow=!lessMotion(), DUR= slow?4400:220;
  const rot=document.getElementById("wRot");
  // 회전 시작을 사다리(playLadder 의 stroke-dashoffset)와 같은 처방으로 맞춘다 (R14-1).
  // [한 판 더]는 openGameOv 가 오버레이 마크업을 통째로 갈아치우므로 #wRot 은 매번 방금 만든
  // 노드이고, 갓 삽입된 요소는 첫 스타일 계산에서 시작값과 끝값이 한 덩어리로 묶여 보간할 구간이
  // 없다 — 완성된 각도로 그냥 나타난다. 그래서 시작값(0deg)을 명시하고 강제 리플로우로 한 번
  // 커밋한 뒤에 끝값을 준다. 믿을 수 있는 건 rAF 가 아니라 리플로우다 — rAF 는 '다음 프레임 직전'
  // 이라는 시점만 잡아주고 그 사이 스타일이 커밋됐음을 보장하지 않아서, 브라우저가 두 변경을 한
  // 재계산으로 합쳐버릴 수 있다. offsetHeight 읽기는 레이아웃을 그 자리에서 강제로 확정시킨다.
  /* 라벨의 역회전을 넣는 방법이 둘이다. 어느 쪽이든 정지 상태는 rotate(0) 이라 거기서 새는
     것이 없고(R6-1, R6-5), 멈추면 똑바로 선다(R6-3). 갈리는 건 그 사이뿐이다.
       ① transform-box:fill-box 를 아는 브라우저 — 판과 같은 시간·같은 이징으로 0 → labelEnd
          를 보간한다. 글자의 절대 각도가 내내 0 이라 조각만 돌고 이름은 서 있는 관람차 모양.
       ② 모르는 브라우저 — CSS transform 을 걸면 회전축이 viewBox 좌상단이 되어 라벨이 판
          밖으로 날아간다. 그래서 SVG transform 속성을 쓰되, 그 값을 처음부터 박아 넣지 않고
          회전이 한창일 때 한 번에 바꾼다. 바꾸는 순간 라벨은 초당 1,000° 넘게 도는 구간이라
          (반지름 62 기준 프레임당 18px 이동) 값이 튀는 게 눈에 안 띄고, 그 뒤로는 판과 함께
          0 으로 수렴하므로 멈출 때 튀지도 않는다. 정지 화면이 답을 말하지 않는 쪽을 택한 것이며,
          '이름이 읽힌다'는 성질도 함께 지킨다. */
  const labelsAnimate = !!(window.CSS && CSS.supports && CSS.supports("transform-box","fill-box"));
  const labs = [...$gv().querySelectorAll(".wlab")];
  const EASE="transform 4.2s cubic-bezier(.16,.72,.14,1)";
  rot.style.transition="none";
  rot.style.transform="rotate(0deg)";
  if(labelsAnimate) labs.forEach(el=>{ el.style.transition="none"; el.style.transform="rotate(0deg)"; });
  void $gv().offsetHeight;   // 시작값 커밋(리플로우 1회) — 판과 라벨을 한 덩어리로 묶는다
  // lessMotion() 이면 transition 을 아예 걸지 않는다 — 위에서 넣은 "none" 이 그대로 남아 끝값이
  // 즉시 적용되고, DUR(220ms) 뒤에 결과가 뜬다. 회전 연출만 사라지고 결과는 바로 나온다 (R14-2).
  if(slow){ rot.style.transition=EASE; if(labelsAnimate) labs.forEach(el=> el.style.transition=EASE); }
  rot.style.transform="rotate("+spin.toFixed(2)+"deg)";
  if(labelsAnimate){
    labs.forEach(el=> el.style.transform="rotate("+labelEnd.toFixed(2)+"deg)");
  }else{
    // 폴백 ②. lessMotion 이면 판이 이미 끝값으로 뛴 뒤라 같은 프레임에 바로 넣는다 — 기다리면
    // 글자만 기울어 있는 프레임이 생긴다. 아니면 회전이 가장 빠른 구간(350ms)에 넣는다.
    const swap=()=>labs.forEach(el=> el.setAttribute("transform","rotate("+el.dataset.rot+")"));
    if(slow) gtimer(swap, 350); else swap();
  }
  gtimer(()=>showGameResult(winner), DUR);
}

/* ---------- ☝️ 손가락 룰렛 ---------- */
function playFinger(){
  // 확률 정책 안내 (R6-10, R6-11). [확률 낮추기]가 켜져 있어도 이 게임에서는 아무 일도 하지 않는다 —
  // 당첨은 화면에 올라온 물리적 손가락에서 결정되고 그게 누구인지는 사후에 사람이 지목하니 가중치를
  // 얹을 지점이 없다. 그래서 결과가 아니라 시작 화면에 적는다. 결과에 적으면 "왜 직전에 섬긴 분이
  // 또 걸렸지"를 이미 겪은 뒤라 늦다. 잘못된 상태가 아니라 정상 동작이므로 경고가 아닌 설명으로 쓴다.
  // 직전 섬긴 분을 모르는 동안(undefined)이나 없을 때는 조정할 대상 자체가 없으니 띄우지 않는다.
  // [제외]는 gamePlayers() 가 명단에서 빼주므로 안내가 필요 없다 — 이름 칩에도 애초에 나오지 않는다.
  const policyNote = (gsPolicy()==="soft" && gsLastHost())
    ? `<div class="game-hint" style="margin-bottom:8px">이 게임은 확률 조정이 적용되지 않아요</div>` : "";
  // .fp-pad 는 inset:0 인 absolute 라 이 한 줄이 흐름에 끼어들어도 좌표 기준(gvBody 의 패딩 박스)은
  // 그대로다 — at() 의 클램프 계산에 영향이 없다.
  openGameOv("☝️ 손가락 룰렛", `
    <div class="game-say" id="gvSay" aria-live="polite">폰을 가운데 놓고 <b>다 같이 손가락</b>을 올려주세요</div>
    ${policyNote}
    <div class="fp-pad" id="fpPad"></div><div class="fp-mid" id="fpMid" role="status" aria-live="polite"></div>
    <div id="gvWin" role="status"></div>`);
  setGameFoot(`<button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button>`);
  bind("gvCancel",()=>closeGame());   // closeGame(opts) — 이벤트 객체를 opts 로 흘려보내지 않는다

  const body=document.getElementById("gvBody"), pad=document.getElementById("fpPad"), mid=document.getElementById("fpMid");
  // 이 게임만은 세로 스크롤도 막는다 — 손가락이 미끄러질 때 화면이 따라 움직이면 좌표가 어긋난다 (R8-4)
  // 걸기 전 값을 그대로 기억해 두고 teardown 에서 되돌린다 (R8-1, R8-3). 빈 문자열이라고 가정하지
  // 않는 이유: 여기서 아는 건 '내가 덮어쓴다'는 사실뿐이고, 원래 값은 읽어서만 알 수 있다.
  const prevBody={ touchAction: body.style.touchAction, overflowY: body.style.overflowY };
  body.style.touchAction="none"; body.style.overflowY="hidden";
  // 안내 한 줄을 위에 붙여 .fp-mid(50% 절대배치)와 겹치지 않게 한다 — 자세한 건 .fp-live 주석.
  body.classList.add("fp-live");
  // 고정된 값을 다시 쓰기만 하므로 몇 번 불러도 결과가 같다 — teardown 이 두 번 들어와도 안전하다.
  const restoreBody=()=>{ body.style.touchAction=prevBody.touchAction; body.style.overflowY=prevBody.overflowY;
    body.classList.remove("fp-live"); };
  const pts=new Map(); let seq=0, cdT=null, settleT=null, picked=false;
  // 손가락 수가 바뀌면 곧바로 3부터 세지 않고, SETTLE 동안 '변화가 없음'을 먼저 기다린다 (R15-3, R15-4).
  // 예전에는 두 번째 손가락이 닿는 순간 카운트가 시작돼 세 번째 사람이 올릴 틈이 없었다.
  // 마지막 손가락이 닿은 뒤 당첨까지 SETTLE + 3×800 ≈ 3.3초 — 예전 2.4초보다 길어진 건 의도한 값이다.
  // 기다리는 기준은 '많아짐'이 아니라 '안 바뀜'이라, 손가락이 빠져도 똑같이 다시 기다린다.
  const SETTLE=900;
  // 두 타이머를 한 자리에서 끈다 — 부르는 쪽이 지금 어느 단계인지 몰라도 되고, teardown 도 이것만 부른다.
  const stop=()=>{ if(cdT){ clearInterval(cdT); cdT=null; } if(settleT){ clearTimeout(settleT); settleT=null; } };
  // 안정화가 끝난 뒤의 3·2·1. 문구를 안정화 단계와 갈라놓아 "언제 세기 시작하는가"라는 규칙이 화면에
  // 드러나게 한다 — 한 화면에 둘을 같이 띄우면 다시 규칙이 안 보인다.
  /* 손가락 수와 참가자 수가 다르면 카운트다운을 걸지 않고 한 번 묻는다 (R4).
     예전에는 pts.size<2 만 봤다 — 참가자 5명인데 3명만 올려도 그대로 3·2·1 이 돌고 당첨자는
     애초에 그 3명 중에서만 나왔다. 반대로 한 사람이 두 개 올려도 아무 말이 없었다.
     승인은 불리언이 아니라 '승인 당시의 손가락 수'로 들고 있는다 (okAt). 그래야 손가락이
     하나라도 늘거나 줄면 okAt !== pts.size 가 되어 승인이 저절로 무효가 된다 (R4-9) —
     지우는 자리를 따로 두면 빠뜨릴 수 있다.
     참가자 수는 시작 시점 스냅샷이 아니라 그 순간의 gamePlayers() 를 읽는다 (R4-1) —
     renderWho() 가 같은 이유로 이미 그렇게 한다. */
  let okAt=null;
  // 불일치를 다시 보는 지점은 셋뿐이라 감시자를 따로 걸지 않는다 (R4-11).
  //   ① refresh()      — 손가락이 늘거나 줄 때
  //   ② countdown() 진입 — SETTLE 이 끝나 세기 직전
  //   ③ 3·2·1 매 틱     — 세는 동안 폴링으로 참가자가 바뀌는 경우. 이미 도는 타이머 위에서
  //                      보므로 비용이 없고, 카운트다운을 소리 없이 방치하지 않는다.
  const mismatch=()=>{
    if(picked || pts.size<2) return null;               // '두 개 이상' 안내가 우선한다 (R4-10)
    const need=gamePlayers().length;
    if(need===pts.size || okAt===pts.size) return null;  // 같거나, 이 손가락 수로 이미 승인받았다
    return need;
  };
  function askMismatch(need){
    stop();
    const why = pts.size < need
      ? "아직 안 올린 분이 있어요?"
      : "한 분이 두 개 올렸거나, 참가자가 아닌 분이 올렸을 수 있어요";
    mid.innerHTML=`<div class="fp-plate">
      <div class="fp-nums">손가락 ${pts.size}개 · 참가자 ${need}명</div>
      <div class="fp-why">${why}</div>
      <button type="button" class="fp-go" id="fpGo">이대로 시작</button></div>`;
    const go=document.getElementById("fpGo"); if(!go) return;
    // 이 버튼의 pointerdown 은 body 까지 올려보내지 않는다 — 올라가면 onDown 이 점을 하나 만들고
    // setPointerCapture 까지 걸어 '버튼을 눌렀는데 손가락이 하나 늘었다'가 된다 (R5-4).
    // stopPropagation 만 하고 preventDefault 는 하지 않는다 — 터치에서 click 은 pointerdown 의
    // 호환 이벤트라, 여기서 기본 동작을 막으면 버튼이 아예 안 눌리는 기기가 생긴다.
    go.addEventListener("pointerdown",e=>{ e.stopPropagation(); });
    go.onclick=()=>{ okAt=pts.size; refresh(); };
  }
  function countdown(){
    settleT=null;                      // 이미 발화한 타이머 — 남겨두면 stop() 이 죽은 id 를 지운다
    if(picked || pts.size<2){ refresh(); return; }   // 타이머와 포인터 사이의 틈을 세기 직전에 한 번 더 확인
    const bad=mismatch(); if(bad!==null){ askMismatch(bad); return; }        // ②
    let k=3; mid.innerHTML=`<div class="fp-plate"><div class="fp-cnt">${k}</div></div>`; gvibe(12);
    cdT=setInterval(()=>{
      const late=mismatch(); if(late!==null){ stop(); askMismatch(late); return; }   // ③
      k--;
      if(k<=0){ stop(); choose(); }
      else { mid.innerHTML=`<div class="fp-plate"><div class="fp-cnt">${k}</div></div>`; gvibe(12); } }, 800);
  }
  // 손가락이 늘 때(onDown)와 줄 때(onUp) 모두 여기로 온다. 어느 쪽이든 stop() 으로 진행 중인 카운트다운을
  // 버리고 처음부터 다시 기다리므로, 카운트다운 중에 2명 미만으로 떨어지면 '두 개 이상' 안내로 돌아간다.
  function refresh(){
    if(picked) return; stop();
    if(pts.size<2){ mid.innerHTML=`<div class="fp-plate"><div class="fp-why">손가락 ${pts.size}개 — 두 개 이상 올려주세요</div></div>`; return; }
    const bad=mismatch(); if(bad!==null){ askMismatch(bad); return; }        // ①
    mid.innerHTML=`<div class="fp-plate"><div class="fp-why">손가락 ${pts.size}개 — 다 올리셨으면 곧 시작해요</div></div>`;
    settleT=setTimeout(countdown, SETTLE);
  }
  function choose(){
    picked=true; mid.innerHTML="";
    const win=pickOne([...pts.keys()]);
    pts.forEach((p,id)=>{ if(id===win){ p.el.classList.add("win"); p.el.style.width="98px"; p.el.style.height="98px"; }
                          else p.el.classList.add("lose"); });
    gvibe([30,70,30]);
    document.getElementById("gvSay").innerHTML="당첨된 손가락, <b>누구세요?</b>";
    renderWho();
  }
  /* 이름 칩은 시작 시점에 잡아둔 배열이 아니라 그리는 순간의 gamePlayers() 를 읽는다 (R3-7).
     게임이 도는 사이에 주문이 들어오거나 참가자 토글이 바뀔 수 있고, 그때 낡은 명단으로 칩을 그리면
     이미 명단에서 빠진 사람을 지목할 수 있게 된다. [제외] 정책도 gamePlayers() 가 이미 걸러주므로
     여기서 따로 볼 것이 없다 (R6-10).
     탭 시점에도 명단을 다시 읽는다 — 칩을 그린 뒤 탭까지의 사이도 같은 창이다. 그 사이 빠진 분이면
     결과로 넘기지 않고 칩만 다시 그린다(teardown 전이라 게임은 그대로 살아 있다). */
  function renderWho(){
    setGameFoot(`<div class="chips" style="justify-content:center;margin-bottom:2px">${gamePlayers().map(m=>`<div class="chip gwho" role="button" tabindex="0" data-id="${esc(m.id)}">${esc(m.name)}</div>`).join("")}</div>
      <button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button>`);
    $gv().querySelectorAll(".gwho").forEach(c=> c.onclick=()=>{
      const m=gamePlayers().find(p=>p.id===c.dataset.id);
      if(!m){ toast("방금 명단에서 빠진 분이에요 — 다시 골라주세요"); renderWho(); return; }
      teardown(); showGameResult(m); });
    bind("gvCancel",()=>closeGame());   // closeGame(opts) — 이벤트 객체를 opts 로 흘려보내지 않는다
  }
  /* 좌표를 본문 경계 안으로 클램프한다 (R15-1). 손가락이 헤더·푸터 쪽으로 조금 밀려도 점은
     가장자리에 붙어 남고, 그 손가락은 계속 살아 있는 것으로 센다.
     기준이 body 의 rect 인 이유: .fp-pad 는 inset:0 인 absolute 라 위치 기준이 body 의 패딩 박스이고,
     테두리가 없으니 그 박스가 getBoundingClientRect() 와 정확히 같은 사각형이다 — 즉 rect 좌표를
     그대로 점의 left/top 으로 써도 어긋나지 않는다. 패딩 10px 16px 은 pad 안쪽이 아니라 pad 가
     덮는 영역이므로 빼지 않는다. */
  const at=e=>{ const r=body.getBoundingClientRect();
    return [ Math.max(0, Math.min(r.width,  e.clientX-r.left)),
             Math.max(0, Math.min(r.height, e.clientY-r.top)) ]; };
  // seq 는 화면에 올라온 손가락 순번이라 참가자 수와 아무 상관이 없다 — 그래서 여기만
  // n 을 넘기지 않고 GAME_COLORS 순환을 그대로 쓴다 (gcolor 의 n 생략 경로). 한 폰에 올릴 수
  // 있는 손가락은 현실적으로 10개를 넘지 않으니 색이 겹칠 일도 없다. gcolor(seq++, n) 으로
  // "고치면" 참가자가 11명일 때 손가락 색이 팔레트를 벗어나므로 그대로 둔다.
  const onDown=e=>{ if(picked) return; e.preventDefault();
    // 포인터를 본문에 붙잡아 둔다. pointerleave 를 떼어낸 뒤 남는 구멍이 '경계 밖에서 손을 뗀
    // 포인터'다 — 그 pointerup 은 본문이 아닌 다른 엘리먼트에서 일어나므로 우리 리스너에 오지
    // 않고 점이 영원히 남는다. 터치는 브라우저가 암시적으로 캡처해 주지만 마우스·펜은 아니라서
    // 동작이 갈린다. 명시적으로 캡처하면 세 종류 모두 up/cancel 이 반드시 여기로 돌아온다.
    // document 에 up 을 얹는 대안을 쓰지 않은 이유: 같은 이벤트가 버블링으로 두 번 처리되고
    // 리스너 대상이 둘로 갈려 teardown 의 짝이 흐트러진다.
    try{ body.setPointerCapture(e.pointerId); }catch(err){}
    const [x,y]=at(e), d=document.createElement("div"); d.className="fp-dot";
    d.style.cssText=`left:${x}px;top:${y}px;width:74px;height:74px;background:${gcolor(seq++)}`;
    pad.appendChild(d); pts.set(e.pointerId,{el:d}); refresh(); };
  const onMove=e=>{ const p=pts.get(e.pointerId); if(picked||!p) return; e.preventDefault();
    const [x,y]=at(e); p.el.style.left=x+"px"; p.el.style.top=y+"px"; };
  // 실제로 손가락이 떨어질 때만 점을 지운다 (R15-2). pointerleave 는 여기에 걸지 않는다 —
  // 경계를 살짝 넘은 것과 화면에서 뗀 것은 다른 사건인데 같은 처리를 받아 카운트다운이 헛돌았다.
  const onUp=e=>{ const p=pts.get(e.pointerId); if(picked||!p) return; p.el.remove(); pts.delete(e.pointerId); refresh(); };
  // touch-action:none 으로 막히지만, 인앱 웹뷰가 무시하는 경우가 있어 핀치 줌은 이벤트로도 한 번 더 막는다
  const noGesture=e=>e.preventDefault();
  body.addEventListener("pointerdown",onDown,{passive:false});
  body.addEventListener("pointermove",onMove,{passive:false});
  body.addEventListener("pointerup",onUp); body.addEventListener("pointercancel",onUp);
  body.addEventListener("touchmove",noGesture,{passive:false});
  document.addEventListener("gesturestart",noGesture); document.addEventListener("gesturechange",noGesture);
  // 이름 칩 경로가 teardown() 을 직접 부르고, 그 뒤 결과 화면을 닫을 때 closeGame 이 GS.teardown 으로
  // 한 번 더 부른다. 두 번째 호출이 할 일은 없으므로 깃발로 막는다 — 되돌리기는 한 번이면 끝난다.
  let torn=false;
  function teardown(){ if(torn) return; torn=true;
    stop();
    restoreBody();   // 스크롤·터치 제한 해제 (R8-1, R8-3). 결과 화면이 넘치면 손가락으로 내릴 수 있다 (R8-2)
    body.removeEventListener("pointerdown",onDown); body.removeEventListener("pointermove",onMove);
    body.removeEventListener("pointerup",onUp); body.removeEventListener("pointercancel",onUp);
    body.removeEventListener("touchmove",noGesture);
    document.removeEventListener("gesturestart",noGesture); document.removeEventListener("gesturechange",noGesture); }
  GS.teardown=teardown;
  refresh();
}

/* ---------- 🏁 구슬 레이스 (R19) ----------
   순수 함수(raceCourse·raceSpeeds·raceSchedule·raceProgress·raceLeadChanges·raceXY)는 위 마커 블록에
   있고 난수를 인자로만 받는다. 아래 두 함수는 Math.random 을 부르고 DOM·캔버스를 만지므로 블록 밖이다 —
   그 경계가 R19-17(당첨자 1위·역전 3회를 결정론적으로 검증)의 전제다. */

/* 레이스 길이. 20000 이 아니라 25000 이다 — 되돌리지 말 것.
   R19-3 이 요구하는 '18~22초'는 화면에서 보이는 레이스 길이이고, 그건 duration 이 아니라
   '1위가 도착하는 시각'이다. 도착 배분은 duration*(0.80 ± 지터/2) 이라 실측 0.7925~0.8075 배 —
   duration=20000 이면 15.85~16.15초로 18초에 못 미친다. 25000 × 0.80 = 19.8~20.2초라야 맞는다.
   (레이스는 1위가 들어오면 끝난다. 꼴찌의 도착 시간 duration 은 화면에 나오지 않는다.) */
const RACE_DUR = 25000;
const RACE_TRIES = 40;           // 재생성 시도 횟수 — 사다리의 '제자리 사다리 다시 만들기'와 같은 처방
const RACE_SAMPLES = 120;        // 역전 횟수를 셀 표본 수

/* 역전 문턱이 인원에 따라 갈리는 이유 (R19-5).
   16.1 이 실측한 값이다: n>=3 은 40 회 안에 3 회 이상을 항상 찾지만, n=2 는 약 13.5% 가 40 회를
   다 써도 못 찾는다. 두 구슬의 도착 시간 차가 24%(0.80 vs 0.99)로 벌어져 있어서, 그 둘이 네 번
   교차하는(=선두가 3번 바뀌는) 스케줄이 구조적으로 드물다. 그래서 n=2 는 '한 번은 바뀐다'로 낮춘다 —
   1 회 역전도 "쫓고 쫓기는" 장면이 되고, 문턱을 못 지킬 코스를 억지로 통과시키는 것보다 정직하다.
   3 명 이상에서는 설계 그대로 3 회다. */
function raceGate(n){ return n===2 ? 1 : 3; }

/* 코스·속도·스케줄을 한 벌 만든다. order 는 [당첨자, ...나머지를 섞은 것] — 당첨자는 이미
   gamePickWinner 으로 뽑혀 있으므로 확률 정책이 그대로 반영된다 (R19-4).
   40 회를 다 써도 문턱을 못 넘으면 '마지막' 시도가 아니라 '가장 잘 나온' 시도를 쓴다. 마지막을 쓰면
   40 번 중 최악이 나올 수도 있어서, 실패했을 때 화면이 오히려 더 지루해진다. */
function raceBuild(players, winner, duration){
  const n = players.length;
  // -1 이면 order 가 망가져 당첨자가 1위로 도착하지 않는다. 호출부가 gamePlayers() 에서 뽑으므로
  // 일어나지 않지만, 조용히 틀린 결과를 그리는 것보다 0 번으로 떨어뜨리고 경고를 남기는 쪽이 낫다.
  let wi = players.indexOf(winner);
  if(wi < 0){ console.warn("구슬 레이스 — 당첨자가 참가자 명단에 없다", winner); wi = 0; }
  const rest = players.map((m,i)=>i).filter(i=>i!==wi);
  for(let i=rest.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=rest[i]; rest[i]=rest[j]; rest[j]=t; }
  const order = [wi].concat(rest);
  const gate = raceGate(n);
  let best = null;
  for(let k=0;k<RACE_TRIES;k++){
    const course = raceCourse(Math.random);
    const speeds = raceSpeeds(n, course.segs.length, Math.random);
    const sched  = raceSchedule(course, speeds, order, duration, Math.random);
    const changes = raceLeadChanges(course, sched, n, duration, RACE_SAMPLES);
    if(!best || changes > best.changes) best = { course, speeds, sched, order, wi, changes, tries:k+1 };
    if(changes >= gate) break;
  }
  return best;
}

/* 논리 치수. 캔버스 좌표는 전부 이 값들로 쓰고, devicePixelRatio 는 setTransform 한 줄로만 다룬다 —
   그림 코드에 dpr 이 섞이면 반지름·글자 크기가 기기마다 달라진다. */
const RACE_VIEW_H = 440;         // 캔버스 논리 높이 (폭은 course.W = 340)
const RACE_R = 11;               // 구슬 반지름. raceXY 의 x 는 (60,280) 이라 벽(±17)까지 넣어도 좌우 43px 이 남는다
const RACE_WALL = 6;             // 구슬과 벽 사이 여유
const RACE_CAM = 0.42;           // 선두를 화면 위에서 이 비율 지점에 둔다
const RACE_CAM_PAD = 24;         // 카메라 여유 — 코스 양 끝에서 선두가 화면 테두리에 걸치지 않게 한다
const RACE_HUD_MS = 200;         // HUD 갱신 간격 (R19-9)
const RACE_DPR_MAX = 3;          // 화면 캔버스 dpr 상한
/* 오프스크린 벽 캐시의 dpr 상한. 계산해 보면 상한이 필요한 이유가 드러난다 —
   코스는 340×2400 논리 px 이고, dpr 3 을 그대로 곱하면 1020×7200 = 7.34MP × 4B ≈ 29MB 다.
   폰에서 한 판에 29MB 를 잡는 것도 과하지만, 그보다 먼저 깨진다: iOS 사파리는 캔버스 한 변을
   4096px 로 제한해서 7200px 캔버스는 그냥 빈 화면이 된다.
   1.5 로 묶으면 510×3600 = 1.84MP × 4B ≈ 7.3MB 이고 한 변도 3600 < 4096 이라 안전하다.
   흐려지는 것은 장식인 벽선·페그뿐이고, 읽어야 하는 구슬 번호는 매 프레임 화면 dpr 그대로 그린다. */
const RACE_CACHE_DPR = 1.5;
// 캔버스는 CSS 를 상속받지 않으므로 폰트 스택을 여기 한 번 더 적는다 — body 의 스택과 같은
// 순서로 맞춘다. 예전 주석은 "같은 순서다"라고 적어 놓고 실제로는 'Malgun Gothic' 이 빠져
// 있었다 — Windows·일부 Android 에서 본문은 Malgun Gothic 인데 캔버스만 일반 sans-serif 로
// 떨어졌다 (R13-1). 여기를 고칠 땐 51행 body 규칙과 나란히 놓고 대조할 것.
const RACE_FONT = "-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', sans-serif";

/* playRace(players, winner[, onDone])
   그리고 움직이는 것까지만 한다. 게임 등록·건너뛰기 버튼·GS.teardown·결과 발표는 아래 startRace 가
   맡고, 그 둘을 잇는 이음매가 두 개다 — 돌려주는 ctl(raf·stop·finish)과 onDone 콜백이다.
   ctl.finish() 는 스스로 rAF 를 취소하므로 [건너뛰기]는 finish() 만 부르면 되고,
   ctl.stop() 은 예약된 프레임만 없앤다(결과를 만들지 않는다). */
function playRace(players, winner, onDone){
  const n = players.length;
  // prefers-reduced-motion 이면 10ms — 도착 시간이 8~10ms 라 첫 프레임(dt≈16ms)에서 이미 지나 있어
  // 연출이 사실상 생략된다 (R19-8). raceSchedule 의 구간 시간도 함께 줄어들 뿐 0 이 되지는 않으므로
  // raceProgress 의 나눗셈이 0/0 이 되는 경로는 생기지 않는다.
  const DUR = lessMotion() ? 10 : RACE_DUR;
  const build = raceBuild(players, winner, DUR);
  const course = build.course, sched = build.sched, wi = build.wi;
  const W = course.W, H = RACE_VIEW_H, END = sched.want[wi];

  openGameOv("🏁 구슬 레이스", `
    <div class="game-say" id="gvSay" aria-live="polite">출발!</div>
    <div class="race-wrap">
      <canvas id="raceCv" role="img" aria-label="구슬 레이스 진행 중"></canvas>
      <div class="race-hud" id="raceHud">
        <div class="bar"><i id="raceBar"></i></div>
        ${players.slice(0, 3).map((m,k)=>`<div class="rc-row"><b class="rc-rk">${k+1}</b><i class="rc-sw"></i><span class="rc-no"></span><span class="rc-nm"></span></div>`).join("")}
      </div>
    </div>
    ${gameLegendHtml(players, n)}
    <div id="gvWin" role="status"></div>`);
  setGameFoot(`<button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button>`);
  bind("gvCancel",()=>closeGame());   // closeGame(opts) — 이벤트 객체를 opts 로 흘려보내지 않는다

  const cv = document.getElementById("raceCv");
  const ctx = cv.getContext("2d");
  const dpr = Math.max(1, Math.min(RACE_DPR_MAX, window.devicePixelRatio || 1));
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // 이 뒤의 좌표는 전부 논리 px 이다

  /* ── 코스 벽·페그 캐시 ──
     벽은 정적이라 한 번만 그린다. 매 프레임 사인 곡선 600 점을 다시 잇는 것과 이미지 한 장을
     오려 붙이는 것의 차이가 24 구슬 × 60fps 에서 그대로 프레임 시간으로 나타난다. */
  const cDpr = Math.min(dpr, RACE_CACHE_DPR);
  const wallCv = document.createElement("canvas");
  wallCv.width = Math.round(W*cDpr); wallCv.height = Math.round(course.total*cDpr);
  drawCourse(wallCv.getContext("2d"));

  function drawCourse(g){
    g.setTransform(cDpr, 0, 0, cDpr, 0, 0);
    const half = RACE_R + RACE_WALL, step = 4;   // 4px 간격이면 진폭 110 사인도 각이 보이지 않는다
    const pts = [];
    for(let y=0; y<=course.total; y+=step) pts.push([raceXY(course, y/course.total).x, y]);
    if(pts[pts.length-1][1] < course.total) pts.push([raceXY(course, 1).x, course.total]);
    // 코스 안쪽을 한 겹 밝게 깔아 '길'로 읽히게 한다 — 캔버스 배경(#fffdf9)보다 밝은 흰색이다
    g.beginPath();
    pts.forEach((p,k)=> k ? g.lineTo(p[0]-half, p[1]) : g.moveTo(p[0]-half, p[1]));
    for(let k=pts.length-1;k>=0;k--) g.lineTo(pts[k][0]+half, pts[k][1]);
    g.closePath(); g.fillStyle = "#ffffff"; g.fill();
    // 벽 두 줄 (사다리의 세로줄과 같은 --line 색)
    g.lineWidth = 3; g.lineJoin = "round"; g.lineCap = "round"; g.strokeStyle = "#e7ddcf";
    [-half, half].forEach(off=>{ g.beginPath();
      pts.forEach((p,k)=> k ? g.lineTo(p[0]+off, p[1]) : g.moveTo(p[0]+off, p[1])); g.stroke(); });
    /* 페그 — 사인 극점의 '반대쪽'에 찍는다. 극점 위에 찍으면 구슬이 정확히 그 점을 지나가므로
       못이 구슬에 가려 보이지 않는다. 반대쪽은 진폭의 2배(>=80px)만큼 떨어져 있어 겹치지 않는다. */
    g.fillStyle = "#e7ddcf";
    let acc = 0;
    course.segs.forEach(sg=>{
      // sin' = 0 → u*2π*turns + phase = π/2 + kπ. turns 는 1~2 라 극점은 구간마다 2~4 개다.
      for(let k=0; k<8; k++){
        const u = ((Math.PI/2 + k*Math.PI) - sg.phase) / (Math.PI*2*sg.turns);
        if(u >= 1) break;
        if(u < 0) continue;
        const y = acc + u*sg.len, xe = raceXY(course, y/course.total).x;
        g.beginPath(); g.arc(2*course.CX - xe, y, 3.5, 0, Math.PI*2); g.fill();
      }
      acc += sg.len;
    });
    // 결승선 — 체커 두 줄. 1위가 도착하는 순간 화면에 무엇이 걸렸는지 보여야 한다 (R19-16 의 전제)
    const cell = 10, top = course.total - cell*2;
    for(let row=0; row<2; row++) for(let cx=0; cx<W; cx+=cell){
      g.fillStyle = ((cx/cell + row) % 2) ? "#2b2118" : "#ffffff";
      g.fillRect(cx, top + row*cell, cell, cell);
    }
  }

  /* ── HUD ── 200ms 마다 갱신한다 (R19-9).
     별도 setInterval 대신 루프 안에서 레이스 시각 t 를 검사한다. 이유가 셋이다:
       ① 중단 경로에서 끌 것이 rAF 하나로 유지된다 — 타이머를 두면 R19-13 이 지워야 할 대상이 늘어난다.
       ② dt 상한(아래)에 걸려 레이스가 실제 시간보다 늦게 흐를 때 HUD 도 같은 시계를 쓴다.
       ③ prefers-reduced-motion(DUR=10) 에서는 t 가 한 번에 끝까지 가므로 갱신이 한 번만 일어난다.
     DOM 은 처음 한 번 만들어 두고 바뀐 문자열만 갈아 넣는다 — 매 프레임 innerHTML 을 다시 쓰면
     레이아웃 비용이 프레임을 먹는다. */
  const barEl = document.getElementById("raceBar");
  const rowEls = [...document.querySelectorAll("#raceHud .rc-row")].map(r=>({
    sw: r.querySelector(".rc-sw"), no: r.querySelector(".rc-no"), nm: r.querySelector(".rc-nm"), cur: -1
  }));
  let hudAt = -Infinity, barCur = "";
  function drawHud(t, order, force){
    if(!force && t - hudAt < RACE_HUD_MS) return;
    hudAt = t;
    const pct = Math.round(prog[order[0]]*100) + "%";
    if(pct !== barCur){ barCur = pct; if(barEl) barEl.style.width = pct; }
    rowEls.forEach((row,k)=>{
      const i = order[k];
      if(i === undefined || row.cur === i) return;   // 순위가 그대로면 아무것도 만지지 않는다
      row.cur = i;
      row.sw.style.background = gcolor(i, n);
      row.no.textContent = (i+1) + ".";
      row.nm.textContent = players[i].name;
    });
  }

  /* ── 한 프레임 ── */
  const prog = new Array(n).fill(0);      // 진행률을 한 번만 계산해 카메라·그림·HUD 가 같은 값을 쓴다
  const rank = players.map((m,i)=>i);
  function draw(t){
    for(let i=0;i<n;i++) prog[i] = raceProgress(course, sched, i, t);
    rank.sort((a,b)=> prog[b]-prog[a]);   // 0 번이 선두. 뒤에서부터 그려 선두가 맨 위에 오게 한다
    const lead = rank[0], leadY = prog[lead]*course.total;
    /* 카메라 (R19-10). 선두를 화면 42% 지점에 두되 코스 밖을 보여주지 않는다.
       클램프 범위에 ±RACE_CAM_PAD 를 주는 이유: 0..total-H 로 묶으면 출발 순간 leadY=0 이
       화면 y=0 이 되어 구슬이 위쪽 테두리에 반쯤 잘린다. 24px 여유를 주면
         · 출발: camY=-24 → 선두가 화면 y=24 (반지름 11 이라 온전히 보인다)
         · 도착: camY=total-H+24=1984 → 선두가 화면 y=416, 아래 테두리까지 24px
       세 경우(여유 안 / 위 클램프 / 아래 클램프) 모두 선두가 [R, H-R] 안에 남는다. */
    const camY = Math.max(-RACE_CAM_PAD, Math.min(course.total - H + RACE_CAM_PAD, leadY - H*RACE_CAM));
    ctx.clearRect(0, 0, W, H);
    // 캐시에서 보이는 띠만 오려 붙인다. 코스 밖(camY<0 이거나 camY+H>total)은 캔버스 배경으로 남는다.
    const y0 = Math.max(0, camY), y1 = Math.min(course.total, camY + H);
    if(y1 > y0) ctx.drawImage(wallCv, 0, y0*cDpr, wallCv.width, (y1-y0)*cDpr, 0, y0-camY, W, y1-y0);
    for(let k=n-1;k>=0;k--){
      const i = rank[k], xy = raceXY(course, prog[i]);
      drawMarble(i, xy.x, xy.y - camY, k===0);
    }
    return rank;
  }

  // 구슬 = gcolor(i, n) 색 원 + 흰 번호 (R19-6). 선두만 어두운 테두리로 강조한다 —
  // 나머지의 흰 테두리는 구슬이 겹칠 때 경계를 남기는 용도다.
  function drawMarble(i, x, y, lead){
    ctx.beginPath(); ctx.arc(x, y, RACE_R, 0, Math.PI*2);
    ctx.fillStyle = gcolor(i, n); ctx.fill();
    ctx.lineWidth = lead ? 3 : 1.5;
    ctx.strokeStyle = lead ? "#2b2118" : "rgba(255,255,255,.92)";
    ctx.stroke();
    /* 두 자리 번호는 한 글자 크기로 그리면 원을 넘는다 — 10 이상만 줄인다(11명부터의 경로다).
       미측정 (R13-5): 이건 논리 캔버스 px 이라 화면 크기가 아니다. 논리 폭 340 을
       .race-wrap(max-width min(340px,45vh))에 맞추므로 320×568 화면에서 배율이 0.752 이고,
       10번째 이후 구슬의 숫자는 CSS 7.5px 로 렌더된다(667px 높이 화면에서 8.8px).
       크기는 RACE_R(11)에 묶여 있어 단독으로 못 올린다 — 키우려면 raceXY 의 벽 여유를 다시
       확인해야 한다. 실기기에서 판독 여부를 잰 뒤 결정한다. */
    ctx.font = "800 " + (i >= 9 ? 10 : 12.5) + "px " + RACE_FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff"; ctx.fillText(String(i+1), x, y+0.5);
  }

  /* ── 루프 ──
     dt 를 64ms(≈4프레임)로 묶는다. 탭이 숨었다 돌아오면 now-last 가 몇 초가 되는데, 그대로
     더하면 구슬이 화면 절반을 순간이동한다 (R19-14). 대가는 명확하다 — 숨어 있던 시간만큼
     레이스가 실제 시각보다 뒤처진다. 벽시계를 맞추는 것보다 '이어서 보이는' 쪽을 고른 것이다. */
  let t = 0, last = performance.now();
  const ctl = {
    raf: 0,
    done: false,
    stop(){ if(ctl.raf) cancelAnimationFrame(ctl.raf); ctl.raf = 0; ctl.done = true; },
    finish(){
      if(ctl.done) return;      // stop() 이 먼저 지나갔으면(중단) 결과를 만들지 않는다
      ctl.done = true;
      if(ctl.raf) cancelAnimationFrame(ctl.raf);
      ctl.raf = 0;
      drawHud(END, draw(END), true);   // 결승선 통과 상태를 마지막으로 그린다
      if(typeof onDone === "function") onDone();
    },
    canvas: cv,
    build: build
  };
  function frame(now){
    ctl.raf = 0;
    /* 오버레이가 닫힌 뒤 이미 예약돼 있던 프레임 방어. 정상 경로는 startRace 가 GS.teardown 에
       걸어둔 stop() 에서 끊기지만, 그 등록이 빠진 경로가 하나라도 생기면 여기서 멈춘다 —
       빈 캔버스에 계속 그리며 배터리를 먹는 상태를 남기지 않는다 (R19-13). */
    if(!cv.isConnected){ ctl.stop(); return; }
    const dt = Math.min(64, now - last);
    last = now; t += dt;
    if(t >= END){ ctl.finish(); return; }
    drawHud(t, draw(t), false);
    ctl.raf = requestAnimationFrame(frame);
  }
  // 첫 프레임은 즉시 그린다 — rAF 를 기다리면 출발 직전에 빈 캔버스가 한 번 보인다
  drawHud(0, draw(0), true);
  ctl.raf = requestAnimationFrame(frame);
  return ctl;
}

/* startRace — 한 판으로서 필요한 나머지를 playRace 위에 얹는다 (16.3).
   playRace 는 그리고 움직이는 일만 하고, 결과 발표·중단 처리·[건너뛰기]는 여기 모인다.
   startGame 안에 인라인하지 않고 함수로 뺀 이유: 다른 두 게임의 분기가 한 줄씩이라 그 자리에
   여섯 줄을 끼우면 '어떤 kind 가 어디로 가는지'가 한눈에 안 보인다.

   푸터를 playRace 안이 아니라 여기서 다시 그리는 이유 — [건너뛰기]의 핸들러가 ctl.finish 를 부르고,
   그 ctl 은 playRace 가 돌려준 뒤에야 존재한다. 푸터 HTML 만 인자로 넘겨도 배선은 결국 이 지점으로
   내려와야 하므로, 마크업과 배선을 두 곳으로 쪼개지 않고 한 곳에서 한다.
   두 버튼을 .row-2 로 한 줄에 놓는다 — .game-foot 은 형제 버튼을 위아래로 쌓아서, 그냥 두면
   푸터가 한 줄 더 두꺼워지고 그만큼 캔버스(max-width:min(340px,45vh))가 줄어든다. */
function startRace(players, winner){
  const ctl = playRace(players, winner, ()=>showGameResult(winner));
  /* 예약된 프레임을 없애는 정상 경로 (R19-13). ✕·뒤로가기·[그만두기]는 closeGame 이, [한 판 더]는
     gvAgain 이 GS.teardown 을 부른다 — 네 경로가 모두 여기 등록한 stop 하나로 끊긴다.
     playRace 의 frame() 이 보는 cv.isConnected 는 이 등록이 빠졌을 때를 위한 방어선이고,
     그것만 믿으면 오버레이가 닫힌 뒤에도 프레임이 한 번 더 돈다.
     ctl.stop 은 this 를 쓰지 않고 클로저의 ctl 을 보므로 메서드만 떼어 넘겨도 안전하고,
     이미 멈춘 뒤에 다시 불려도 아무 일도 하지 않는다(teardown 이 두 번 들어오는 경로 대비). */
  GS.teardown = ctl.stop;
  // [건너뛰기]는 취소가 아니라 결과를 앞당기는 것이다 (R19-7). ctl.finish() 가 rAF 를 취소하고
  // 결승선 통과 상태를 마지막으로 그린 뒤 onDone(=showGameResult) 을 부르므로, 여기서
  // cancelAnimationFrame 을 따로 부를 것이 없다 — 취소 지점이 두 곳으로 갈리지 않는다.
  setGameFoot(`<div class="row-2"><button class="btn btn-soft" id="gvSkip">⏭ 건너뛰기</button>
    <button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button></div>`);
  bind("gvSkip", ()=>ctl.finish());
  // playRace 가 붙인 푸터를 갈아치웠으므로 [그만두기]도 새 노드에 다시 배선한다
  bind("gvCancel",()=>closeGame());   // closeGame(opts) — 이벤트 객체를 opts 로 흘려보내지 않는다
}

function copyText(text,msg){ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(()=>fb(text,msg)); else fb(text,msg);
  function fb(t,m){ try{ const ta=document.createElement("textarea"); ta.value=t; ta.style.cssText="position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,t.length); const ok=document.execCommand("copy"); document.body.removeChild(ta); if(ok){ toast(m); return; } }catch(e){}
    // 카톡 등 인앱 브라우저 폴백: 길게 눌러 복사
    try{ prompt("복사가 안 되면 아래를 길게 눌러 복사하세요", t); }catch(e){ toast("복사 실패"); } } }

/* ===================== 셀(팀) 레이어 ===================== */
let inPicker=false;
let adminMode=false;

async function loadDbCells(){
  try{ const {data,error}=await Sync.client.from("cells").select("*"); if(error) throw error;
    DB_CELLS={}; (data||[]).forEach(c=>{ DB_CELLS[c.id]={id:c.id,roomId:c.room_id,name:c.name,members:Array.isArray(c.members)?c.members:[],homeCafeId:c.home_cafe||"gil"}; });
  }catch(e){ console.warn("cells 로드 실패",e); }
}
function loadLocalCells(){ try{ DB_CELLS=JSON.parse(localStorage.getItem("coffee_local_cells")||"{}")||{}; }catch(e){ DB_CELLS={}; } }
// 구성원 저장: 링크(id) 아는 사람이 그 셀 하나만 갱신(단건 RPC, 코드검증 없음 #6)
// set_members 호출 — actor 포함(감사 로그용). 구버전(2-인자) DB면 자동으로 actor 없이 재시도(배포 순서 무관).
async function rpcSetMembers(id, members, actor){
  let res = await Sync.client.rpc("set_members",{p_id:id,p_members:members,p_actor:(actor||null)});
  if(res.error && (res.error.code==="PGRST202" || /could not find the function/i.test(res.error.message||""))){
    res = await Sync.client.rpc("set_members",{p_id:id,p_members:members});   // 옛 스키마 폴백(로그 미기록)
  }
  return res;
}
async function saveMembers(arr, actor){
  if(SHARED){ const {error}=await rpcSetMembers(CELL.id, arr, (actor||meName())); if(error){ toast("저장 실패: "+(error.message||"")); return false; }
    const fresh=await fetchCell(CELL.id); if(fresh) CELL=fresh;
  } else { CELL.members=arr; DB_CELLS[CELL.id]=CELL; localStorage.setItem("coffee_local_cells",JSON.stringify(DB_CELLS)); }
  applyCellGlobals(); rememberCell(CELL);
  // 호스트가 명단에서 빠지면 섬김이 open으로 잠겨 아무도 마감 못 함 → 자동 해제(주문 있으면 인계 대기)
  if(activeSeq!=null && SESSION.hostId && !memberById(SESSION.hostId)){
    try{ await Sync.unclaim(activeSeq); }catch(e){}
  }
  return true;
}
// 자기 셀만 단건 조회 (열거 불가). SHARED=DB(get_cell) 단건, 로컬=DB_CELLS/CODE 폴백.
async function fetchCell(id){
  if(SHARED){
    try{ const {data,error}=await Sync.client.rpc("get_cell",{p_id:id});
      const row=Array.isArray(data)?data[0]:data;
      if(error||!row) return null;
      const cell={id:row.id,roomId:row.room_id,name:row.name,members:Array.isArray(row.members)?row.members:[],homeCafeId:row.home_cafe||"gil"};
      DB_CELLS[id]=cell; rememberCell(cell); return cell;
    }catch(e){ return null; }
  }
  return DB_CELLS[id] || CODE_CELLS[id] || null; // 로컬모드 폴백
}
// 방문한 셀만 picker에 표시(전체 열거 X)
function rememberCell(c){ try{ const m=knownCells(); m[c.id]={id:c.id,name:c.name,homeCafeId:c.homeCafeId,n:(c.members||[]).length}; localStorage.setItem("coffee_known_cells",JSON.stringify(m)); }catch(e){} }
function knownCells(){ try{ return JSON.parse(localStorage.getItem("coffee_known_cells")||"{}")||{}; }catch(e){ return {}; } }

async function enterCell(id){
  const c=await fetchCell(id);
  if(!c){ toast("셀을 찾을 수 없어요"); renderCellPicker(); return; }
  inPicker=false; adminMode=false; forceGrid=false; CELL=c; applyCellGlobals(); loadMe();
  localStorage.setItem("coffee_last_cell", CELL.id); rememberCell(c);
  try{ await Sync.resubscribe(); }catch(e){ console.error(e); }
  await loadHist();
  await loadCafeMenus(activeCafeId());
  applyCafeGlobals(); render();
}

function slugify(s){ return (s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,20); }
function rand36(n){ let s=""; while(s.length<n) s+=Math.random().toString(36).slice(2); return s.slice(0,n); }
function genCellId(name){ let base=slugify(name); if(base.length<2) base="cell"; let id; do{ id=base+"-"+rand36(14); }while(cellById(id)); return id; } // 유추 불가 랜덤

    $sheet.querySelectorAll(".ecm").forEach(inp=> inp.oninput=()=>{ mlist[+inp.dataset.i].name=inp.value; });   // 이름만 갱신(id 보존)
    $sheet.querySelectorAll(".ecmdel").forEach(b=> b.onclick=()=>{ mlist.splice(+b.dataset.i,1); draw(); });
    document.getElementById("ecAddM").onclick=()=>{ const el=document.getElementById("ecNewM"), v=el.value.trim(); if(v){ mlist.push({id:genMemberId(), name:v}); draw(); } };

      const {data:cur}=await Sync.client.from("cells").select("members").eq("id",cell.id).maybeSingle();
