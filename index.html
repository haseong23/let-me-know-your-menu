  }
  /* [⏹ 그만 돌리기] — 이제 이 버튼이 감속을 시작한다. 누른 순간의 각도가 출발점이고, 거기에
     감속하며 더 도는 양이 얹힌다. 둘 다 무작위라 누구도 결과를 고를 수 없다.
     두 번 눌러도 한 번만 먹는다 — 감속 도중에 다시 누르면 각도가 튄다. */
  function stopSpin(){
    if(!spinning || done) return;
    spinning = false; wf = 0;
    setGameSay("멈추는 중…");
    const b=document.getElementById("gvStop"); if(b) b.disabled = true;
  }
  if(GS) GS.teardown = ()=>{ done = true; if(GS && GS.raf) cancelAnimationFrame(GS.raf); };
  paint(0, 0);   // 정지 화면. 라벨은 rotate(0) 이라 어떤 각도도 답을 말하지 않는다 (R6)
  /* [▶ 돌리기!] 를 누른 뒤에 굴린다. 동작 줄이기도 이 문을 지나게 둔 것이 중요하다 —
     예전에는 lessMotion 갈래가 열자마자 settle() 을 불러, 아무것도 안 눌렀는데 결과가 떠 있고
     그 사이 [⏹ 그만 돌리기] 가 300ms 깜빡였다 (QA X-3). 이제 셋 다 '누르면 시작'으로 같다. */
  let started = false;
  /* mode 는 "manual" 아니면 "auto" 다. 물리도 감속 기록도 갈래와 무관하게 같은 sim 한 벌을 쓴다 —
     다른 건 stopSpin() 을 누가 부르느냐뿐이다. 자동의 등속 구간 길이(1.8~3.4초)는 무작위라,
     자동을 고른 사람도 결과를 고를 수 없다는 성질이 수동과 똑같이 유지된다.
     이 시간을 고정값으로 두면 안 된다 — 판이 늘 같은 시간을 등속으로 돌면 시작 각도가 곧
     최종 각도의 함수가 되어 결과가 예측 가능해진다 (R6 이 막아 온 것과 같은 새는 구멍이다). */
  const startSpin = (mode)=>{
    if(started || done) return;
    started = true;
    if(lessMotion()){ done = true; settle(); return; }   // 연출을 건너뛰고 결과로 간다
    if(mode==="auto"){
      setGameSay("돌고 있어요 — 알아서 멈춰요");
      autoFoot();
      // gtimer 에 실어 둔다 — 오버레이를 닫으면 GS.timers 가 통째로 정리되므로 죽은 뒤에 감속이
      // 시작되는 일이 없다. stopSpin() 자체도 done/spinning 을 다시 확인한다(이중 방어).
      gtimer(stopSpin, 1800 + Math.random()*1600);
    } else {
      setGameSay("돌고 있어요 — [그만 돌리기]를 누르면 멈춰요");
      runFoot();
    }
    if(GS) GS.raf = requestAnimationFrame(step);
  };
  // [▶ 돌리기!] 는 굴리지 않고 묻는다. 동작 줄이기 갈래도 이 문을 지난다 — 물어보고 나서
  // 건너뛰는 편이, 아무것도 안 물어보고 결과가 떠 있는 것보다 낫다(어느 쪽을 골라도 결과는 같다).
  bind("gvGo", askFoot);
}

/* ---------- ☝️ 손가락 룰렛 ---------- */
function playFinger(){
  // 확률 정책 안내 (R6-10, R6-11). [확률⬇️]가 켜져 있어도 이 게임에서는 아무 일도 하지 않는다 —
  // 당첨은 화면에 올라온 물리적 손가락에서 결정되고 그게 누구인지는 사후에 사람이 지목하니 가중치를
  // 얹을 지점이 없다. 그래서 결과가 아니라 시작 화면에 적는다. 결과에 적으면 "왜 직전에 섬긴 분이
  // 또 걸렸지"를 이미 겪은 뒤라 늦다. 잘못된 상태가 아니라 정상 동작이므로 경고가 아닌 설명으로 쓴다.
  // 직전 섬긴 분을 모르는 동안(undefined)이나 없을 때는 조정할 대상 자체가 없으니 띄우지 않는다.
  // [제외]는 gamePlayers() 가 명단에서 빼주므로 안내가 필요 없다 — 이름 칩에도 애초에 나오지 않는다.
  // .fp-pad 는 inset:0 인 absolute 라 이 한 줄이 흐름에 끼어들어도 좌표 기준(gvBody 의 패딩 박스)은
  // 그대로다 — at() 의 클램프 계산에 영향이 없다.
  openGameOv("☝️ 손가락 룰렛", `
    <div class="game-say" id="gvSay" aria-live="polite">폰을 가운데 놓고 <b>다 같이 손가락</b>을 올려주세요</div>
    <div class="fp-pad" id="fpPad"></div><div class="fp-mid" id="fpMid" role="status" aria-live="polite"></div>
    <div id="gvWin" role="status"></div>`);
  setGameFoot(`<button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button>`);
  bind("gvCancel",()=>closeGame());   // closeGame(opts) — 이벤트 객체를 opts 로 흘려보내지 않는다

  const body=document.getElementById("gvBody"), pad=document.getElementById("fpPad"), mid=document.getElementById("fpMid");
  // 이 게임만은 세로 스크롤도 막는다 — 손가락이 미끄러질 때 화면이 따라 움직이면 좌표가 어긋난다 (R8-4)
  // 걸기 전 값을 그대로 기억해 두고 teardown 에서 되돌린다 (R8-1, R8-3). 빈 문자열이라고 가정하지
  // 않는 이유: 여기서 아는 건 '내가 덮어쓴다'는 사실뿐이고, 원래 값은 읽어서만 알 수 있다.
  const prevBody={ touchAction: body.style.touchAction, overflowY: body.style.overflowY };
  body.style.touchAction="none"; body.style.overflowY="hidden";
  // 안내 한 줄을 위에 붙여 .fp-mid(50% 절대배치)와 겹치지 않게 한다 — 자세한 건 .fp-live 주석.
  body.classList.add("fp-live");
  // 고정된 값을 다시 쓰기만 하므로 몇 번 불러도 결과가 같다 — teardown 이 두 번 들어와도 안전하다.
  const restoreBody=()=>{ body.style.touchAction=prevBody.touchAction; body.style.overflowY=prevBody.overflowY;
    body.classList.remove("fp-live"); };
  const pts=new Map(); let seq=0, cdT=null, settleT=null, picked=false;
  // 손가락 수가 바뀌면 곧바로 3부터 세지 않고, SETTLE 동안 '변화가 없음'을 먼저 기다린다 (R15-3, R15-4).
  // 예전에는 두 번째 손가락이 닿는 순간 카운트가 시작돼 세 번째 사람이 올릴 틈이 없었다.
  // 마지막 손가락이 닿은 뒤 당첨까지 SETTLE + 3×800 ≈ 3.3초 — 예전 2.4초보다 길어진 건 의도한 값이다.
  // 기다리는 기준은 '많아짐'이 아니라 '안 바뀜'이라, 손가락이 빠져도 똑같이 다시 기다린다.
  const SETTLE=900;
  // 두 타이머를 한 자리에서 끈다 — 부르는 쪽이 지금 어느 단계인지 몰라도 되고, teardown 도 이것만 부른다.
  const stop=()=>{ if(cdT){ clearInterval(cdT); cdT=null; } if(settleT){ clearTimeout(settleT); settleT=null; } };
  // 안정화가 끝난 뒤의 3·2·1. 문구를 안정화 단계와 갈라놓아 "언제 세기 시작하는가"라는 규칙이 화면에
  // 드러나게 한다 — 한 화면에 둘을 같이 띄우면 다시 규칙이 안 보인다.
  /* 손가락 수와 참가자 수가 다르면 카운트다운을 걸지 않고 한 번 묻는다 (R4).
     예전에는 pts.size<2 만 봤다 — 참가자 5명인데 3명만 올려도 그대로 3·2·1 이 돌고 당첨자는
     애초에 그 3명 중에서만 나왔다. 반대로 한 사람이 두 개 올려도 아무 말이 없었다.
     승인은 불리언이 아니라 '승인 당시의 손가락 수'로 들고 있는다 (okAt). 그래야 손가락이
     하나라도 늘거나 줄면 okAt !== pts.size 가 되어 승인이 저절로 무효가 된다 (R4-9) —
     지우는 자리를 따로 두면 빠뜨릴 수 있다.
     참가자 수는 시작 시점 스냅샷이 아니라 그 순간의 gamePlayers() 를 읽는다 (R4-1) —
     renderWho() 가 같은 이유로 이미 그렇게 한다. */
  let okAt=null;
  // 불일치를 다시 보는 지점은 셋뿐이라 감시자를 따로 걸지 않는다 (R4-11).
  //   ① refresh()      — 손가락이 늘거나 줄 때
  //   ② countdown() 진입 — SETTLE 이 끝나 세기 직전
  //   ③ 3·2·1 매 틱     — 세는 동안 폴링으로 참가자가 바뀌는 경우. 이미 도는 타이머 위에서
  //                      보므로 비용이 없고, 카운트다운을 소리 없이 방치하지 않는다.
  const mismatch=()=>{
    if(picked || pts.size<2) return null;               // '두 개 이상' 안내가 우선한다 (R4-10)
    const need=gamePlayers().length;
    if(need===pts.size || okAt===pts.size) return null;  // 같거나, 이 손가락 수로 이미 승인받았다
    return need;
  };
  /* [이대로 시작]이 안 눌리던 이유 (실사용 제보).
     여러 손가락이 올라간 상태에서 그중 하나만 움직이거나 떨어져도 refresh() 가 돌고, 그때마다
     이 블록을 innerHTML 로 다시 그려서 버튼 노드가 통째로 갈렸다. click 은 같은 노드에서
     pointerdown 과 pointerup 이 이어져야 나는데, 그 사이에 노드가 사라지니 click 이 영영 안 났다.
     두 겹으로 막는다 —
       ① 내용이 같으면 다시 그리지 않는다(askSig). 노드가 살아 있으면 click 이 정상적으로 난다.
       ② 그래도 갈릴 수 있으니 pointerdown 에서 바로 승인한다. 손을 뗄 때까지 기다리지 않으므로
          중간에 노드가 갈려도 이미 승인이 끝나 있다. 드래그로 빠져나가 취소할 수 없게 되지만,
          손가락이 널린 화면에서는 '눌렀는데 안 되는 것'이 훨씬 나쁘다. */
  let askSig=null;
  const approve=()=>{ okAt=pts.size; refresh(); };
  function askMismatch(need){
    stop();
    const sig=pts.size+"/"+need;
    if(askSig===sig) return;                 // 같은 안내가 이미 떠 있다 — 버튼 노드를 살려 둔다
    askSig=sig;
    const why = pts.size < need
      ? "아직 안 올린 분이 있어요?"
      : "한 분이 두 개 올렸거나, 참가자가 아닌 분이 올렸을 수 있어요";
    mid.innerHTML=`<div class="fp-plate">
      <div class="fp-nums">손가락 ${pts.size}개 · 참가자 ${need}명</div>
      <div class="fp-why">${why}</div>
      <button type="button" class="fp-go" id="fpGo">이대로 시작</button></div>`;
    const go=document.getElementById("fpGo"); if(!go) return;
    // pointerdown 을 body 까지 올려보내지 않는다 — 올라가면 onDown 이 점을 하나 만들고
    // setPointerCapture 까지 걸어 '버튼을 눌렀는데 손가락이 하나 늘었다'가 된다 (R5-4).
    // preventDefault 는 하지 않는다 — 터치에서 click 은 pointerdown 의 호환 이벤트라,
    // 기본 동작을 막으면 마우스·키보드 경로가 함께 죽는다.
    go.addEventListener("pointerdown",e=>{ e.stopPropagation(); approve(); });
    go.onclick=approve;                      // 마우스·키보드 경로. 이미 승인됐으면 같은 값을 다시 쓸 뿐이다
  }
  // .fp-mid 를 다른 곳에서 쓸 때는 서명을 지운다 — 안 지우면 안내가 사라진 뒤에도 '같은 내용'으로
  // 판정되어 다시 그려야 할 때 안 그려진다.
  const midSet=html=>{ askSig=null; mid.innerHTML=html; };
  function countdown(){
    settleT=null;                      // 이미 발화한 타이머 — 남겨두면 stop() 이 죽은 id 를 지운다
    if(picked || pts.size<2){ refresh(); return; }   // 타이머와 포인터 사이의 틈을 세기 직전에 한 번 더 확인
    const bad=mismatch(); if(bad!==null){ askMismatch(bad); return; }        // ②
    let k=3; midSet(`<div class="fp-plate"><div class="fp-cnt">${k}</div></div>`); gvibe(12);
    cdT=setInterval(()=>{
      const late=mismatch(); if(late!==null){ stop(); askMismatch(late); return; }   // ③
      k--;
      if(k<=0){ stop(); choose(); }
      else { midSet(`<div class="fp-plate"><div class="fp-cnt">${k}</div></div>`); gvibe(12); } }, 800);
  }
  // 손가락이 늘 때(onDown)와 줄 때(onUp) 모두 여기로 온다. 어느 쪽이든 stop() 으로 진행 중인 카운트다운을
  // 버리고 처음부터 다시 기다리므로, 카운트다운 중에 2명 미만으로 떨어지면 '두 개 이상' 안내로 돌아간다.
  function refresh(){
    if(picked) return; stop();
    if(pts.size<2){ midSet(`<div class="fp-plate"><div class="fp-why">손가락 ${pts.size}개 — 두 개 이상 올려주세요</div></div>`); return; }
    const bad=mismatch(); if(bad!==null){ askMismatch(bad); return; }        // ①
    midSet(`<div class="fp-plate"><div class="fp-why">손가락 ${pts.size}개 — 다 올리셨으면 곧 시작해요</div></div>`);
    settleT=setTimeout(countdown, SETTLE);
  }
  function choose(){
    picked=true; midSet("");
    const win=pickOne([...pts.keys()]);
    pts.forEach((p,id)=>{ if(id===win){ p.el.classList.add("win"); p.el.style.width="98px"; p.el.style.height="98px"; }
                          else p.el.classList.add("lose"); });
    gvibe([30,70,30]);
    setGameSay("당첨된 손가락, <b>누구세요?</b>");
    renderWho();
  }
  /* 이름 칩은 시작 시점에 잡아둔 배열이 아니라 그리는 순간의 gamePlayers() 를 읽는다 (R3-7).
     게임이 도는 사이에 주문이 들어오거나 참가자 토글이 바뀔 수 있고, 그때 낡은 명단으로 칩을 그리면
     이미 명단에서 빠진 사람을 지목할 수 있게 된다. [제외] 정책도 gamePlayers() 가 이미 걸러주므로
     여기서 따로 볼 것이 없다 (R6-10).
     탭 시점에도 명단을 다시 읽는다 — 칩을 그린 뒤 탭까지의 사이도 같은 창이다. 그 사이 빠진 분이면
     결과로 넘기지 않고 칩만 다시 그린다(teardown 전이라 게임은 그대로 살아 있다). */
  function renderWho(){
    setGameFoot(`<div class="chips" style="justify-content:center;margin-bottom:2px">${gamePlayers().map(m=>`<div class="chip gwho" role="button" tabindex="0" data-id="${esc(m.id)}">${esc(m.name)}</div>`).join("")}</div>
      <button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button>`);
    $gv().querySelectorAll(".gwho").forEach(c=> c.onclick=()=>{
      const m=gamePlayers().find(p=>p.id===c.dataset.id);
      if(!m){ toast("방금 명단에서 빠진 분이에요 — 다시 골라주세요"); renderWho(); return; }
      teardown(); showGameResult(m); });
    bind("gvCancel",()=>closeGame());   // closeGame(opts) — 이벤트 객체를 opts 로 흘려보내지 않는다
  }
  /* 좌표를 본문 경계 안으로 클램프한다 (R15-1). 손가락이 헤더·푸터 쪽으로 조금 밀려도 점은
     가장자리에 붙어 남고, 그 손가락은 계속 살아 있는 것으로 센다.
     기준이 body 의 rect 인 이유: .fp-pad 는 inset:0 인 absolute 라 위치 기준이 body 의 패딩 박스이고,
     테두리가 없으니 그 박스가 getBoundingClientRect() 와 정확히 같은 사각형이다 — 즉 rect 좌표를
     그대로 점의 left/top 으로 써도 어긋나지 않는다. 패딩 10px 16px 은 pad 안쪽이 아니라 pad 가
     덮는 영역이므로 빼지 않는다. */
  const at=e=>{ const r=body.getBoundingClientRect();
    return [ Math.max(0, Math.min(r.width,  e.clientX-r.left)),
             Math.max(0, Math.min(r.height, e.clientY-r.top)) ]; };
  // seq 는 화면에 올라온 손가락 순번이라 참가자 수와 아무 상관이 없다 — 그래서 여기만
  // n 을 넘기지 않고 GAME_COLORS 순환을 그대로 쓴다 (gcolor 의 n 생략 경로). 한 폰에 올릴 수
  // 있는 손가락은 현실적으로 10개를 넘지 않으니 색이 겹칠 일도 없다. gcolor(seq++, n) 으로
  // "고치면" 참가자가 11명일 때 손가락 색이 팔레트를 벗어나므로 그대로 둔다.
  const onDown=e=>{ if(picked) return; e.preventDefault();
    // 포인터를 본문에 붙잡아 둔다. pointerleave 를 떼어낸 뒤 남는 구멍이 '경계 밖에서 손을 뗀
    // 포인터'다 — 그 pointerup 은 본문이 아닌 다른 엘리먼트에서 일어나므로 우리 리스너에 오지
    // 않고 점이 영원히 남는다. 터치는 브라우저가 암시적으로 캡처해 주지만 마우스·펜은 아니라서
    // 동작이 갈린다. 명시적으로 캡처하면 세 종류 모두 up/cancel 이 반드시 여기로 돌아온다.
    // document 에 up 을 얹는 대안을 쓰지 않은 이유: 같은 이벤트가 버블링으로 두 번 처리되고
    // 리스너 대상이 둘로 갈려 teardown 의 짝이 흐트러진다.
    try{ body.setPointerCapture(e.pointerId); }catch(err){}
    const [x,y]=at(e), d=document.createElement("div"); d.className="fp-dot";
    d.style.cssText=`left:${x}px;top:${y}px;width:74px;height:74px;background:${gcolor(seq++)}`;
    pad.appendChild(d); pts.set(e.pointerId,{el:d}); refresh(); };
  const onMove=e=>{ const p=pts.get(e.pointerId); if(picked||!p) return; e.preventDefault();
    const [x,y]=at(e); p.el.style.left=x+"px"; p.el.style.top=y+"px"; };
  // 실제로 손가락이 떨어질 때만 점을 지운다 (R15-2). pointerleave 는 여기에 걸지 않는다 —
  // 경계를 살짝 넘은 것과 화면에서 뗀 것은 다른 사건인데 같은 처리를 받아 카운트다운이 헛돌았다.
  const onUp=e=>{ const p=pts.get(e.pointerId); if(picked||!p) return; p.el.remove(); pts.delete(e.pointerId); refresh(); };
  // touch-action:none 으로 막히지만, 인앱 웹뷰가 무시하는 경우가 있어 핀치 줌은 이벤트로도 한 번 더 막는다
  const noGesture=e=>e.preventDefault();
  body.addEventListener("pointerdown",onDown,{passive:false});
  body.addEventListener("pointermove",onMove,{passive:false});
  body.addEventListener("pointerup",onUp); body.addEventListener("pointercancel",onUp);
  body.addEventListener("touchmove",noGesture,{passive:false});
  document.addEventListener("gesturestart",noGesture); document.addEventListener("gesturechange",noGesture);
  // 이름 칩 경로가 teardown() 을 직접 부르고, 그 뒤 결과 화면을 닫을 때 closeGame 이 GS.teardown 으로
  // 한 번 더 부른다. 두 번째 호출이 할 일은 없으므로 깃발로 막는다 — 되돌리기는 한 번이면 끝난다.
  let torn=false;
  function teardown(){ if(torn) return; torn=true;
    stop();
    restoreBody();   // 스크롤·터치 제한 해제 (R8-1, R8-3). 결과 화면이 넘치면 손가락으로 내릴 수 있다 (R8-2)
    body.removeEventListener("pointerdown",onDown); body.removeEventListener("pointermove",onMove);
    body.removeEventListener("pointerup",onUp); body.removeEventListener("pointercancel",onUp);
    body.removeEventListener("touchmove",noGesture);
    document.removeEventListener("gesturestart",noGesture); document.removeEventListener("gesturechange",noGesture); }
  GS.teardown=teardown;
  refresh();
}

/* ---------- 🏁 구슬 레이스 (물리) ----------
   순수 함수(raceMapBuild·raceSimulate·raceHit·raceRnd)는 위 마커 블록에 있고 난수를 인자로만
   받는다. 아래는 Math.random 을 부르고 캔버스를 만지므로 블록 밖이다 — 그 경계가 테스트의 전제다. */

/* 논리 치수. 캔버스 좌표는 전부 이 값들로 쓰고 devicePixelRatio 는 setTransform 한 줄로만 다룬다 —
   그림 코드에 dpr 이 섞이면 반지름·글자 크기가 기기마다 달라진다. */
/* 캔버스 크기는 화면 논리 px 다. 세계 단위(RACE_W=26)와 다른 축이라 섞으면 안 된다. */
const RACE_VIEW_W = 340, RACE_VIEW_H = 391;
/* 구슬 아래 이름표에 몇 글자까지 쓰나. 출발 간격(RACE_SPX)이 허락하는 폭에서 나온 값이다 —
   10px 한글은 글자당 ≈10px 이고 간격이 ≈33 논리 px 이라 세 글자까지 이웃을 안 문다.
   여기를 늘리려면 RACE_SPX 를 같이 늘려야 하고, 그건 출발 대형이 코스 폭에 들어가는 선까지다. */
const RACE_LABEL_CH = 3;
/* 미니맵이 차지하는 폭과 여백(화면 논리 px). 코스는 그 왼쪽에만 그린다 —
   COURSE_W 가 그 약속을 실제로 지키는 값이고, 미니맵의 왼쪽 모서리(mmX)와 같아야 한다. */
const RACE_MINI_W = 46, RACE_MINI_PAD = 8;
const RACE_HUD_MS = 200;         // HUD 갱신 간격
const RACE_DPR_MAX = 3;
// 캔버스는 CSS 를 상속받지 않으므로 폰트 스택을 여기 한 번 더 적는다 — body(51행) 스택과 같은 순서다.
const RACE_FONT = "-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', sans-serif";
/* 시드 재시도. 무엇을 보고 다시 뽑는지가 중요하다 — 승자는 보지 않는다. 소요 시간과 역동성만
   본다. 승자를 보고 다시 뽑으면 그게 거부 표집이고, 그러면 게임 앞에 설명할 수 없는 대기가 붙는다.
   한 판 계산이 24명에서 최대 27ms 라 몇 번 돌려도 사용자는 못 느낀다. */
const RACE_TRIES = 6;
/* 실측 분포(11.6~20.1초, 중앙 14.9)에 맞춘 창이다. 창을 좁게 잡으면 절반 넘는 시드가 문턱에
   걸려 재시도로 버려지고, 결국 문턱을 못 넘은 판을 쓰게 된다 — 채택 기준이 사실상 사라진다. */
const RACE_MIN_S = 12, RACE_MAX_S = 25;
/* 문턱은 leadChanges 가 아니라 '선두를 잡아 본 구슬 수'로 잡는다. 예전 문턱(역전 3회)은 계측해
   보니 아무것도 안 걸렀다 — 여섯 명 판에서도 하위 10% 가 4회라 첫 판이 거의 그대로 통과했다.
   즉 역동성을 고른 적이 없다. n 이 작을수록 구조적 상한이 낮아서 단을 나눈다(넷을 요구하면
   4인 판 통과율이 41% 로 떨어진다). 실측 통과율은 2인 91% · 8인 82% · 24인 96% 이고,
   가장 나쁜 4인 판도 여섯 번이면 98% 다. 못 넘어도 fallback 이 산다. */
const raceNeedLeaders = n => Math.min(n, n<=2 ? 2 : n<=5 ? 3 : 4);

/* 판 하나를 만든다. 승자를 미리 뽑지 않는다 — 물리가 정한다.
   문턱을 못 넘어도 완주한 판이 있으면 그걸 쓴다. 못 돌리는 것보다 조금 밋밋한 판이 낫다. */
/* raceBuild — 볼 만한 판이 나올 때까지 시드를 다시 뽑는다.
   물리를 미리 다 돌려 보고 고르는 것이라, 화면에 나가는 판은 길이와 역전이 이미 확인된 판이다.
   계측상 첫 시드가 그대로 통과하는 경우가 대부분이라 이 되돌림은 거의 안 돈다. */
function raceBuild(n){
  let fallback = null;
  for(let t=0; t<RACE_TRIES; t++){
    const rnd = raceRnd((Math.random()*0xffffffff)>>>0);
    const map = raceMapBuild(rnd);
    const sim = raceSimulate(map, n, rnd);
    if(!sim.ok) continue;
    if(!fallback) fallback = { map, sim };
    const secs = sim.winAt/60;      // 꼬리를 뺀 '판의 길이'
    if(secs >= RACE_MIN_S && secs <= RACE_MAX_S) return { map, sim };
  }
  return fallback;
}

/* playRace(players[, onDone])
   그리고 움직이는 것까지만 한다. 게임 등록·건너뛰기 버튼·GS.teardown·결과 발표는 아래 startRace 가
   맡고, 그 둘을 잇는 이음매가 두 개다 — 돌려주는 ctl(raf·stop·finish·winner)과 onDone 콜백이다.
   ctl.finish() 는 스스로 rAF 를 취소하므로 [건너뛰기]는 finish() 만 부르면 되고,
   ctl.stop() 은 예약된 프레임만 없앤다(결과를 만들지 않는다). */
function playRace(players, onDone){
  const n = players.length;
  const built = raceBuild(n);
  openGameOv("🏁 구슬 레이스", `
    <div class="game-say" id="gvSay" aria-live="polite">준비됐어요 — 내 이름을 찾아두세요</div>
    <div class="game-hint" style="margin-bottom:8px">부딪히고 튕기며 내려가요 — 결과는 아무도 몰라요</div>
    <div class="race-wrap">
      <canvas id="raceCv" role="img" aria-label="구슬 레이스 진행 중"></canvas>
      <!-- 순위는 전원. 아래 범례(번호↔이름 대응표)는 없앴다 — 구슬에 이름이 붙었으니
           번호를 이름으로 옮겨 적을 표가 더는 필요 없고, 색 칸은 이 목록이 그대로 갖고 있다. -->
      <div class="race-hud" id="raceHud">
        <div class="bar"><i id="raceBar"></i></div>
        <div class="rc-list">${players.map((m,k)=>`<div class="rc-row"><b class="rc-rk">${k+1}등</b><i class="rc-sw"></i><span class="rc-nm"></span></div>`).join("")}</div>
      </div>
    </div>
    <div id="gvWin" role="status"></div>`);
  setGameFoot(`<button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button>`);
  bind("gvCancel",()=>closeGame());   // closeGame(opts) — 이벤트 객체를 opts 로 흘려보내지 않는다

  const cv = document.getElementById("raceCv");
  const ctx = cv.getContext("2d");
  const dpr = Math.max(1, Math.min(RACE_DPR_MAX, window.devicePixelRatio || 1));
  /* 캔버스 크기는 화면 논리 px 다. 코스 폭(RACE_W=26)은 세계 단위라 여기에 쓰면 안 된다 —
     세계 → 화면 변환은 base 하나가 맡는다(줌 1 일 때 코스 폭이 COURSE_W 에 꽉 찬다). */
  const CW = RACE_VIEW_W, CH = RACE_VIEW_H;
  cv.width = Math.round(CW*dpr); cv.height = Math.round(CH*dpr);
  /* 코스가 쓰는 폭은 캔버스 전체가 아니라 미니맵 왼쪽까지다. 예전엔 base 를 CW 로 잡아 코스가
     캔버스를 꽉 채웠고, 그 위에 미니맵을 덮어 그려서 오른쪽 벽 근처 구슬이 미니맵 뒤로 들어갔다
     (QA F-3). 화면 좌표를 쓰는 곳(카메라 중심·이름표·결승선 글자)은 전부 CW/2 가 아니라
     COURSE_W/2 를 기준으로 삼아야 코스와 라벨이 같은 곳을 가리킨다. */
  const COURSE_W = CW - RACE_MINI_W - RACE_MINI_PAD;
  const base = COURSE_W / RACE_W;

  /* 시뮬레이션이 실패할 자리는 사실상 없지만(계측에서 360판 정체 0), 없다고 단정하지 않는다 —
     맵이나 물리를 고치다 한 번이라도 어긋나면 여기로 떨어진다. */
  if(!built || !built.sim){
    setGameSay("코스를 못 만들었어요 — 다시 해주세요");
    return { raf:0, done:true, started:false, winner:players[0], stop(){}, finish(){ if(typeof onDone==="function") onDone(); }, start(){}, canvas:cv };
  }
  const map = built.map, sim = built.sim, END = sim.frames*1000/60;
  const winner = players[sim.winner];   // 구슬 번호에 의미가 없으므로 이 대응이 곧 균등 추첨이다

  const barEl = document.getElementById("raceBar");
  const rowEls = [...document.querySelectorAll("#raceHud .rc-row")].map(r=>({
    sw:r.querySelector(".rc-sw"), nm:r.querySelector(".rc-nm"), cur:-1 }));
  let hudAt = -Infinity, barCur = "";
  function drawHud(t, order, force){
    if(!force && t - hudAt < RACE_HUD_MS) return;
    hudAt = t;
    const pct = Math.round(Math.min(1, Math.max(0, ypos[order[0]])/map.finishY)*100) + "%";
    if(pct !== barCur){ barCur = pct; if(barEl) barEl.style.width = pct; }
    rowEls.forEach((row,k)=>{
      const i = order[k];
      if(i === undefined || row.cur === i) return;
      row.cur = i;
      row.sw.style.background = gcolor(i, n);
      row.nm.textContent = players[i].name;
    });
  }

  const ypos = new Array(n).fill(0);
  const rank = players.map((m,i)=>i);
  let camX = RACE_W/2, camY = 0, camZ = 1;

  function frameAt(t){ return Math.max(0, Math.min(sim.frames-1, Math.floor(t*60/1000))); }

  /* 중계 대상 — 아직 순위가 확정되지 않았으면 선두, 몇이 확정됐으면 그 다음 다툼.
     1등만 뽑는 게임이지만 뒷 순위가 어떤 상황인지도 보여줘야 재미가 산다. */
  function targetIndex(f){
    let settled = 0;
    for(let i=0;i<n;i++) if(sim.done[i]>=0 && sim.done[i]<=f) settled++;
    return Math.min(n-1, settled);
  }

  /* ══ 미니맵 ══ 코스 전체를 오른쪽에 세로로 세운다. 줌이 들어가면 화면에 두어 명밖에 안 남아
     '지금 어디쯤이고 남은 길이 얼마인지' 볼 곳이 사라진다.
     지형은 판마다 고정이므로 한 번만 오프스크린에 굽고, 매 프레임에는 구슬과 시야 틀만 덧그린다. */
  const MM_W = RACE_MINI_W, MM_PAD = RACE_MINI_PAD, MM_TOP = -32, MM_BOT = map.total + 6;
  const mmH = Math.min(CH - MM_PAD*2, MM_W * (MM_BOT-MM_TOP) / RACE_W);
  const mmS = mmH / (MM_BOT - MM_TOP);
  const mmX = CW - MM_W - MM_PAD, mmY = MM_PAD;
  const mm2 = (x,y) => [mmX + (MM_W - RACE_W*mmS)/2 + x*mmS, mmY + (y-MM_TOP)*mmS];

  const miniBg = document.createElement("canvas");
  miniBg.width = Math.round(MM_W*dpr); miniBg.height = Math.round(mmH*dpr);
  (function bakeMini(){
    const g = miniBg.getContext("2d");
    g.setTransform(dpr,0,0,dpr,0,0);
    g.fillStyle="rgba(255,253,249,.94)"; g.fillRect(0,0,MM_W,mmH);
    g.translate((MM_W - RACE_W*mmS)/2, -MM_TOP*mmS); g.scale(mmS, mmS);
    g.lineCap="round";
    for(const b of map.bodies){
      // 도는 것은 자리를 알 수 있게 자기가 훑는 원으로, 나머지는 생긴 대로 그린다
      if(b.spin){ g.strokeStyle="rgba(160,138,106,.5)"; g.lineWidth=1.2/mmS;
        g.beginPath(); g.arc(b.cx,b.cy,b.hl,0,6.284); g.stroke(); continue; }
      g.strokeStyle = b.life ? "#e0b479" : b.e>1 ? "#d98a6a" : b.rad>0.4 ? "#b9a889" : "#ddd0bc";
      g.lineWidth = Math.max(2*b.rad, 1.1/mmS);
      g.beginPath(); g.moveTo(b.x1,b.y1); g.lineTo(b.x2,b.y2); g.stroke();
    }
    g.strokeStyle="#2b2118"; g.lineWidth=1.6/mmS;
    g.beginPath(); g.moveTo(0,map.finishY); g.lineTo(RACE_W,map.finishY); g.stroke();
  })();

  function drawMini(f, b0, vTop, vBot){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.save();
    ctx.shadowColor="rgba(43,33,24,.18)"; ctx.shadowBlur=6; ctx.shadowOffsetY=1;
    ctx.fillStyle="rgba(255,253,249,.94)";
    ctx.beginPath(); ctx.rect(mmX, mmY, MM_W, mmH); ctx.fill();
    ctx.restore();
    ctx.drawImage(miniBg, mmX, mmY, MM_W, mmH);

    const [ , y1] = mm2(0, vTop), [ , y2] = mm2(0, vBot);   // 지금 화면이 코스의 어디인지
    ctx.strokeStyle="rgba(43,33,24,.5)"; ctx.lineWidth=1;
    ctx.strokeRect(mmX+1.5, Math.max(mmY, y1), MM_W-3, Math.max(2, Math.min(y2,mmY+mmH)-Math.max(mmY,y1)));

    for(let k=n-1;k>=0;k--){
      const i=rank[k];
      if(sim.done[i]>=0 && sim.done[i]<f) continue;
      const [sx,sy] = mm2(sim.path[b0+i*2], ypos[i]);
      ctx.beginPath(); ctx.arc(sx, sy, k===0?2.6:1.9, 0, 6.284);
      ctx.fillStyle=gcolor(i,n); ctx.fill();
      if(k===0){ ctx.lineWidth=1; ctx.strokeStyle="#2b2118"; ctx.stroke(); }
    }
    ctx.strokeStyle="rgba(43,33,24,.22)"; ctx.lineWidth=1;
    ctx.strokeRect(mmX+.5, mmY+.5, MM_W-1, mmH-1);
  }

  /* ── 한 프레임 ── 물리는 이미 끝나 있다. 여기서는 녹화된 좌표를 읽어 그리기만 한다. */
  function draw(t){
    const f = frameAt(t), b0 = f*n*2;
    for(let i=0;i<n;i++) ypos[i] = sim.path[b0+i*2+1];
    raceOrder(rank, sim.done, ypos, f);
    const ti = targetIndex(f), tgt = rank[ti];
    const tx = sim.path[b0+tgt*2], ty = ypos[tgt];

    /* 줌은 두 갈래다.
       결승 근처(zoomY 기준 RACE_ZOOM_TRIG 안)에서는 예전대로 최대 RACE_ZOOM_MAX 까지 당긴다 —
       누가 먼저 닿느냐가 전부인 순간이라 거기서는 뒤쪽을 버리는 게 맞다.
       그 밖에서는 '선두와 꼴찌를 한 프레임에' 로 간다. 예전엔 여기서 줌이 늘 1 이라 화면에
       세로 35.5 세계단위만 들어왔는데, 살아 있는 구슬의 y 폭은 중앙값 18~24 · 90% 42~57 ·
       최대 80 이라 24명 기준 프레임의 37.5% 에서 누군가 화면 밖에 있었다(실측 12시드×4인원).
       그래서 폭에 맞춰 줌을 연다. 바닥을 RACE_ZOOM_MIN 으로 막는 이유는 그 아래로 열면 구슬이
       점이 되기 때문이다 — 다 담는 것과 무엇이 담겼는지 보이는 것은 다른 얘기다. */
    const goalDist = Math.abs(map.zoomY - ty);
    let wantZ, wantX, wantY, fitMode = false;
    if(goalDist < RACE_ZOOM_TRIG){
      wantZ = Math.max(1, (1 - goalDist/RACE_ZOOM_TRIG) * RACE_ZOOM_MAX);
      wantX = tx; wantY = ty;
    } else {
      fitMode = true;
      let lo=Infinity, hi=-Infinity;
      for(let i=0;i<n;i++){
        if(sim.done[i]>=0 && sim.done[i]<f) continue;   // 이미 들어온 구슬은 안 그리므로 폭에도 안 넣는다
        const y=ypos[i]; if(y<lo) lo=y; if(y>hi) hi=y;
      }
      if(lo>hi){ lo=hi=ty; }                            // 전원 골인 직후 — 마지막 목표를 그대로 본다
      const span = (hi-lo)*RACE_FIT_MARGIN + 2*RACE_R;
      wantZ = Math.max(RACE_ZOOM_MIN, Math.min(1, (CH - 2*RACE_FIT_PAD) / (base*span)));
      /* 가로는 코스 한가운데로 고정한다. 줌이 1 이하면 코스 폭(26)이 통째로 들어오므로 따라갈
         이유가 없고, 선두를 따라 좌우로 흔들면 다 담아 놓고도 화면이 계속 흔들린다. */
      wantX = RACE_W/2; wantY = (lo+hi)/2;
    }
    // 여는 쪽만 빠르게 — 뒤처진 구슬은 곧바로 담고, 다시 다가갈 때는 예전 속도로 부드럽게.
    camZ = raceLerp(camZ, wantZ, wantZ < camZ ? RACE_OPEN : 0);
    camX = raceLerp(camX, wantX);
    camY = raceLerp(camY, wantY, fitMode ? RACE_OPEN : 0);

    const z = base*camZ;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle="#f1ebe1"; ctx.fillRect(0,0,CW,CH);
    /* 코스와 라벨을 미니맵 왼쪽으로 잘라 둔다. base 를 COURSE_W 로 잡는 것만으로는 부족하다 —
       결승 줌(camZ>1)이 들어가면 코스 사각형이 화면 좌우로 COURSE_W 를 넘어 그려지고, 그러면
       미니맵 밑으로 다시 비집고 들어간다. 여기서 한 번 자르면 배율과 무관하게 약속이 지켜진다. */
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, COURSE_W, CH); ctx.clip();
    ctx.save();
    ctx.translate(COURSE_W/2, CH*0.42);
    ctx.scale(z, z);
    ctx.translate(-camX, -camY);

    ctx.fillStyle="#fffdf9"; ctx.fillRect(0, -30, RACE_W, map.total+40);   // 코스 안쪽을 밝게

    const vTop = camY - (CH*0.42)/z, vBot = camY + (CH*0.58)/z;
    for(const b of map.bodies){
      if(b.dead!=null && f>=b.dead) continue;       // 터진 버블
      if(b.y1b < vTop-2 || b.y0 > vBot+2) continue;
      let x1=b.x1,y1=b.y1,x2=b.x2,y2=b.y2;
      if(b.spin){ const a=b.ph+b.spin*(f*RACE_SUB*RACE_DT), ca=Math.cos(a), sa=Math.sin(a);
        x1=b.cx-b.hl*ca; y1=b.cy-b.hl*sa; x2=b.cx+b.hl*ca; y2=b.cy+b.hl*sa; }
      // 성격을 색으로 가른다 — 도는 것 · 세게 튕기는 것 · 터지는 것은 미리 알아볼 수 있어야 한다
      ctx.strokeStyle = b.spin ? "#a08a6a" : b.life ? "#c98a3a" : b.e>1 ? "#c2552f" : "#ddd0bc";
      ctx.lineCap = "round"; ctx.lineWidth = 2*b.rad;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      if(b.spin){ ctx.fillStyle="#7a6a52"; ctx.beginPath(); ctx.arc(b.cx,b.cy,0.16,0,6.284); ctx.fill(); }
    }
    /* 결승선 — 괘선 두 줄 사이에 글자를 넣는다. 체커 무늬는 줌이 4배까지 들어가면 칸이 커져
       '무슨 무늬'로만 보이고 어디가 선인지 안 읽힌다. 괘선은 배율과 무관하게 선이다. */
    if(map.finishY > vTop-3 && map.finishY < vBot+3){
      ctx.fillStyle="#2b2118";
      ctx.fillRect(0, map.finishY - RACE_GOAL_H/2, RACE_W, 0.16);
      ctx.fillRect(0, map.finishY + RACE_GOAL_H/2, RACE_W, 0.16);
    }
    // 구슬 — 뒤에서부터 그려 선두가 맨 위에
    for(let k=n-1;k>=0;k--){
      const i=rank[k];
      if(sim.done[i]>=0 && sim.done[i]<f) continue;         // 이미 들어온 구슬은 치운다
      const x=sim.path[b0+i*2], y=ypos[i];
      ctx.beginPath(); ctx.arc(x,y,RACE_R,0,6.284);
      ctx.fillStyle=gcolor(i,n); ctx.fill();
      ctx.lineWidth = (i===tgt ? 0.09 : 0.05);
      ctx.strokeStyle = (i===tgt ? "#2b2118" : "rgba(255,255,255,.92)");
      ctx.stroke();
    }
    ctx.restore();

    // 결승선 글자 · 이름표 — 화면 좌표로 그린다(줌과 무관하게 같은 크기)
    if(map.finishY > vTop-3 && map.finishY < vBot+3){
      ctx.font = "800 11px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillStyle="#2b2118"; ctx.fillText("결승선", COURSE_W/2, CH*0.42 + (map.finishY-camY)*z);
    }
    /* 구슬을 누구로 읽을 것인가 — 이름이다.
       구슬 자체는 지름 5.5px 라 그 안에 글자를 넣을 자리가 없다(반지름은 물리 상수 RACE_R 이라
       화면 사정으로 못 키운다). 그래서 식별은 구슬 아래 라벨이 진다.
       예전엔 번호를 썼다. 이 게임만 출발선에서 구슬이 한 덩어리로 모여 있어서, 자기 것을 찾아야
       하는 바로 그 순간에 이름표가 가장 심하게 겹치기 때문이었다(네 명에서도 뭉갰다).
       번호는 겹치지는 않았지만 대신 아래에 번호↔이름 대응표를 하나 더 두고, 사람이 판을 보다가
       그 표로 눈을 내렸다 올려야 했다 — 겹침을 지우는 대신 눈을 한 번 더 움직이게 한 거래였다.
       이름으로 되돌리되 겹침은 자리로 푼다: 출발 대형을 한 줄 여덟에서 여섯으로 줄이고 간격을
       2.2 → 3.0 세계단위(≈33 논리 px)로 넓혀, 세 글자(10px × 3 ≈ 30px)가 이웃을 안 물게 했다.
       RACE_LABEL_CH 를 넘는 이름은 자른다 — 전체 이름은 HUD 순위와 결과 발표에 그대로 있다.
       (예전엔 shortName 의 두 번째 인자를 빠뜨려 `길이 > undefined` = false 로 절삭이 죽어
        있었다 — QA F-3. 인자를 반드시 함께 준다.) */
    ctx.font = "800 10px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="top"; ctx.lineWidth=3; ctx.lineJoin="round";
    for(let k=n-1;k>=0;k--){
      const i=rank[k];
      if(sim.done[i]>=0 && sim.done[i]<f) continue;
      const sx = COURSE_W/2 + (sim.path[b0+i*2]-camX)*z, sy = CH*0.42 + (ypos[i]-camY)*z;
      if(sy<-14||sy>CH+8||sx<-20||sx>COURSE_W+20) continue;
      const nm = shortName(players[i].name, RACE_LABEL_CH);
      ctx.strokeStyle="rgba(255,253,249,.95)"; ctx.strokeText(nm, sx, sy + RACE_R*z + 1);
      ctx.fillStyle=gcolor(i,n);                ctx.fillText(nm, sx, sy + RACE_R*z + 1);
    }
    ctx.restore();   // 코스 클립 해제 — 미니맵은 그 바깥에 그린다
    drawMini(f, b0, vTop, vBot);
    return rank;
  }

  /* ── 루프 ──
     dt 를 64ms(≈4프레임)로 묶는다. 탭이 숨었다 돌아오면 now-last 가 몇 초가 되는데 그대로 더하면
     구슬이 화면 절반을 순간이동한다. 대가는 명확하다 — 숨어 있던 시간만큼 레이스가 뒤처진다. */
  let t = 0, last = performance.now();
  const ctl = {
    raf: 0,
    done: false,
    started: false,
    winner: winner,
    stop(){ if(ctl.raf) cancelAnimationFrame(ctl.raf); ctl.raf = 0; ctl.done = true; },
    finish(){
      if(ctl.done) return;
      ctl.done = true;
      if(ctl.raf) cancelAnimationFrame(ctl.raf);
      ctl.raf = 0;
      drawHud(END, draw(END), true);
      announce();
    },
    canvas: cv
  };
  /* 접전 슬로모션. 추적 대상이 결승 직전이고 바로 앞뒤에 경쟁자가 붙어 있을 때만 늦춘다.
     물리는 이미 다 끝나 녹화돼 있으므로 시간축만 늦추면 된다 — 결과도 도착 순서도 안 바뀐다.
     혼자 들어오는 장면은 늘려도 지루하기만 하므로 경쟁자가 없으면 그냥 간다. */
  function timeScale(){
    if(n<2) return 1;
    const f = frameAt(t), ti = targetIndex(f), tgt = rank[ti], ty = ypos[tgt];
    const goalDist = map.zoomY - ty;
    if(goalDist > RACE_ZOOM_TRIG || goalDist < -1) return 1;
    const near = (ti>0 && Math.abs(ypos[rank[ti-1]]-ty) < RACE_SLOW_NEAR)
              || (ti<n-1 && Math.abs(ty-ypos[rank[ti+1]]) < RACE_SLOW_NEAR);
    if(!near) return 1;
    return Math.max(RACE_SLOW_MIN, Math.max(0, goalDist)/RACE_ZOOM_TRIG);
  }
  /* 결과 발표는 '1등이 결승선을 지난 순간'이다. 그때 이미 누가 섬기는지는 정해졌으므로 더 끌
     이유가 없다. 다만 화면은 멈추지 않는다 — 꼴등이 궁금한 사람이 있고, 뒤엉킨 무리가 정리되는
     것이 이 게임에서 제일 볼만한 장면일 때가 있다.
     showGameResult 는 캔버스를 건드리지 않고 그 아래 #gvWin 과 푸터만 갈아 끼우므로, 발표한
     뒤에도 레이스는 그대로 돌아간다. 한 번만 부르면 되니 announced 로 잠근다. */
  let announced = false;
  function announce(){
    if(announced) return;
    announced = true;
    if(typeof onDone === "function") onDone();
  }
  function frame(now){
    ctl.raf = 0;
    if(!cv.isConnected){ ctl.stop(); return; }   // 오버레이가 닫힌 뒤 이미 예약돼 있던 프레임 방어
    const dt = Math.min(64, now - last) * timeScale();
    last = now; t += dt;
    if(t >= END){ ctl.finish(); return; }
    drawHud(t, draw(t), false);
    if(frameAt(t) >= sim.winAt) announce();
    ctl.raf = requestAnimationFrame(frame);
  }
  drawHud(0, draw(0), true);          // 첫 프레임은 즉시 — rAF 를 기다리면 빈 캔버스가 한 번 보인다
  /* 바로 굴리지 않는다. 출발선에 멈춰 있는 동안 "내가 몇 번인지" 찾을 시간이 생긴다 —
     그 확인 없이 시작하면 20명이 뒤엉킨 화면에서 자기 구슬을 끝까지 못 찾는다.
     last 를 시작 순간에 다시 잡는 게 중요하다 — 멈춰 있던 시간이 레이스 시각에 섞이면
     첫 프레임에 구슬이 화면 절반을 순간이동한다(dt 상한 64ms 가 있어도 여러 프레임 튄다). */
  ctl.start = ()=>{
    if(ctl.done || ctl.started) return;
    ctl.started = true;
    setGameSay("출발!");
    if(lessMotion()){ gtimer(()=>ctl.finish(), 10); return; }   // 연출을 건너뛰고 결과로 간다
    last = performance.now();
    ctl.raf = requestAnimationFrame(frame);
  };
  return ctl;
}

/* startRace — 한 판으로서 필요한 나머지를 playRace 위에 얹는다 (16.3).
   playRace 는 그리고 움직이는 일만 하고, 결과 발표·중단 처리·[건너뛰기]는 여기 모인다.
   startGame 안에 인라인하지 않고 함수로 뺀 이유: 다른 두 게임의 분기가 한 줄씩이라 그 자리에
   여섯 줄을 끼우면 '어떤 kind 가 어디로 가는지'가 한눈에 안 보인다.

   푸터를 playRace 안이 아니라 여기서 다시 그리는 이유 — [건너뛰기]의 핸들러가 ctl.finish 를 부르고,
   그 ctl 은 playRace 가 돌려준 뒤에야 존재한다. 푸터 HTML 만 인자로 넘겨도 배선은 결국 이 지점으로
   내려와야 하므로, 마크업과 배선을 두 곳으로 쪼개지 않고 한 곳에서 한다.
   두 버튼을 .row-2 로 한 줄에 놓는다 — .game-foot 은 형제 버튼을 위아래로 쌓아서, 그냥 두면
   푸터가 한 줄 더 두꺼워지고 그만큼 캔버스(max-width:min(340px,45vh))가 줄어든다. */
function startRace(players){
  /* 승자를 넘기지 않는다 — 이 게임만은 물리가 정하고, 이름은 시뮬레이션이 끝난 뒤 붙는다.
     그래서 결과 발표도 ctl.winner 를 읽는다(playRace 가 정한 그 사람). */
  const ctl = playRace(players, ()=>showGameResult(ctl.winner));
  /* 예약된 프레임을 없애는 정상 경로 (R19-13). ✕·뒤로가기·[그만두기]는 closeGame 이, [한 판 더]는
     gvAgain 이 GS.teardown 을 부른다 — 네 경로가 모두 여기 등록한 stop 하나로 끊긴다.
     playRace 의 frame() 이 보는 cv.isConnected 는 이 등록이 빠졌을 때를 위한 방어선이고,
     그것만 믿으면 오버레이가 닫힌 뒤에도 프레임이 한 번 더 돈다.
     ctl.stop 은 this 를 쓰지 않고 클로저의 ctl 을 보므로 메서드만 떼어 넘겨도 안전하고,
     이미 멈춘 뒤에 다시 불려도 아무 일도 하지 않는다(teardown 이 두 번 들어오는 경로 대비). */
  GS.teardown = ctl.stop;
  // [건너뛰기]는 취소가 아니라 결과를 앞당기는 것이다 (R19-7). ctl.finish() 가 rAF 를 취소하고
  // 결승선 통과 상태를 마지막으로 그린 뒤 onDone(=showGameResult) 을 부르므로, 여기서
  // cancelAnimationFrame 을 따로 부를 것이 없다 — 취소 지점이 두 곳으로 갈리지 않는다.
  /* 푸터가 두 단계다. 출발 전에는 [▶ 출발]만 있고, 누른 뒤에야 [⏭ 건너뛰기]로 바뀐다 —
     아직 시작도 안 한 판에 건너뛰기를 내어 주면 그게 무엇을 건너뛰는지 알 수 없다. */
  const runFoot = ()=>{
    setGameFoot(`<div class="row-2"><button class="btn btn-soft" id="gvSkip">⏭ 건너뛰기</button>
      <button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button></div>`);

/* copyText(text, msg[, btn])
   btn 을 주면 토스트 대신 그 버튼의 글자를 잠깐 바꾼다. 안드로이드 13 이상은 클립보드에 쓸 때
   시스템이 "복사했습니다" 알림을 스스로 띄우는데, 거기에 우리 토스트가 겹쳐 두 겹으로 떴다.
   시스템 알림이 뜨는지 알아낼 API 는 없으므로 겹치는 자리(토스트)를 피하는 쪽으로 바꾼다 —
   누른 버튼 자리에서 확인이 나면 시스템 알림과 겹치지도 않고, 시스템 알림이 없는 iOS·데스크톱
   에서도 피드백이 그대로 남는다. btn 없이 부르는 옛 호출부는 예전처럼 토스트다. */
function copyDone(msg, btn){
  if(!btn){ toast(msg); return; }
  if(btn.dataset.busy) return;              // 연타로 원래 글자를 잃지 않게
  btn.dataset.busy="1";
  const was=btn.textContent;
  btn.textContent="✅ 복사했어요";
  setTimeout(()=>{ btn.textContent=was; delete btn.dataset.busy; }, 1600);
}
function copyText(text,msg,btn){ track("copy_used",{ chars: (text||"").length });
  const ok=()=>copyDone(msg,btn);
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok).catch(()=>fb(text,msg)); else fb(text,msg);
  function fb(t,m){ try{ const ta=document.createElement("textarea"); ta.value=t; ta.style.cssText="position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,t.length); const done=document.execCommand("copy"); document.body.removeChild(ta); if(done){ copyDone(m,btn); return; } }catch(e){}
    // 카톡 등 인앱 브라우저 폴백: 길게 눌러 복사
    try{ prompt("복사가 안 되면 아래를 길게 눌러 복사하세요", t); }catch(e){ toast("복사 실패"); } } }

// 구성원 저장: 링크(id) 아는 사람이 그 셀 하나만 갱신(단건 RPC, 코드검증 없음 #6)
// set_members 호출 — actor 포함(감사 로그용). 구버전(2-인자) DB면 자동으로 actor 없이 재시도(배포 순서 무관).
async function rpcSetMembers(id, members, actor){
  let res = await Sync.client.rpc("set_members",{p_id:id,p_members:members,p_actor:(actor||null)});
  if(res.error && (res.error.code==="PGRST202" || /could not find the function/i.test(res.error.message||""))){
    res = await Sync.client.rpc("set_members",{p_id:id,p_members:members});   // 옛 스키마 폴백(로그 미기록)
  }
  return res;
}
async function saveMembers(arr, actor){
  if(SHARED){ const {error}=await rpcSetMembers(CELL.id, arr, (actor||meName())); if(error){ toast("저장 실패: "+(error.message||"")); return false; }
    const fresh=await fetchCell(CELL.id); if(fresh) CELL=fresh;
  } else { CELL.members=arr; DB_CELLS[CELL.id]=CELL; localStorage.setItem("coffee_local_cells",JSON.stringify(DB_CELLS)); }
  applyCellGlobals(); rememberCell(CELL);
  // 호스트가 명단에서 빠지면 섬김이 open으로 잠겨 아무도 마감 못 함 → 자동 해제(주문 있으면 인계 대기)
  if(activeSeq!=null && SESSION.hostId && !memberById(SESSION.hostId)){
    try{ await Sync.unclaim(activeSeq); }catch(e){}
  }
  return true;
}
// 자기 셀만 단건 조회 (열거 불가). SHARED=DB(get_cell) 단건, 로컬=DB_CELLS/CODE 폴백.
async function fetchCell(id){
  if(SHARED){
    try{ const {data,error}=await Sync.client.rpc("get_cell",{p_id:id});
      const row=Array.isArray(data)?data[0]:data;
      if(error||!row) return null;
      const cell={id:row.id,roomId:row.room_id,name:row.name,members:Array.isArray(row.members)?row.members:[],homeCafeId:row.home_cafe||"gil"};
      DB_CELLS[id]=cell; rememberCell(cell); return cell;
    }catch(e){ return null; }
  }
  return DB_CELLS[id] || CODE_CELLS[id] || null; // 로컬모드 폴백
}
// 방문한 셀만 picker에 표시(전체 열거 X)
function rememberCell(c){ try{ const m=knownCells(); m[c.id]={id:c.id,name:c.name,homeCafeId:c.homeCafeId,n:(c.members||[]).length}; localStorage.setItem("coffee_known_cells",JSON.stringify(m)); }catch(e){} }
function knownCells(){ try{ return JSON.parse(localStorage.getItem("coffee_known_cells")||"{}")||{}; }catch(e){ return {}; } }

async function enterCell(id){

}

function slugify(s){ return (s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,20); }
function rand36(n){ let s=""; while(s.length<n) s+=Math.random().toString(36).slice(2); return s.slice(0,n); }
function genCellId(name){ let base=slugify(name); if(base.length<2) base="cell"; let id; do{ id=base+"-"+rand36(14); }while(cellById(id)); return id; } // 유추 불가 랜덤

      <div style="height:14px"></div>
      <div class="row-2"><button class="btn btn-ghost btn-close" id="ecClose">닫기</button>
        <button class="btn btn-brand" id="ecSave">저장</button></div>`);
    document.getElementById("ecName").oninput=e=>{ nameVal=e.target.value; };
    // 이름만 갱신(id 보존) + 이니셜도 타이핑에 맞춰 (사용자용 구성원 편집 시트와 같은 처방).
    // 옆 아바타는 처음 그린 두 글자로 남아 있어서, 이름을 다 바꿔도 이니셜은 옛 이름이었다.

      if(cur && memSig(cur.members)!==baseline){
        mlist=memObjs(cur.members).map(m=>({id:m.id,name:m.name})); baseline=memSig(mlist);
        toast("이 셀의 구성원이 다른 곳에서 바뀌었어요 — 최신을 불러왔어요. 다시 확인 후 저장해주세요"); draw(); return;
      }
      const {error:eMem}=await rpcSetMembers(cell.id, members, "관리자");   // 멤버 변경 → 감사 로그 기록
      if(eMem){ toast("저장 실패: "+(eMem.message||"")); return; }
      const {error}=await Sync.client.from("cells").update({name,home_cafe:cafeId}).eq("id",cell.id);
      if(error){ toast("저장 실패: "+(error.message||"")); return; }
      if(DB_CELLS[cell.id]){ DB_CELLS[cell.id].name=name; DB_CELLS[cell.id].members=members; DB_CELLS[cell.id].homeCafeId=cafeId; }
      closeSheet(); toast("셀을 수정했어요"); renderAdminDash();
    }, ecb, "저장 중…");
  }
  draw();
}

/* ---------- 관리자 대시보드 ----------
   위계: ① 히어로+KPI ② 추세(단일 색 막대) ③ 사람별 참여(미터) ④ 많이 마신 메뉴.
   원칙 두 가지 —
   (a) 상태를 색만으로 구분하지 않는다. 마감/진행중은 채움 vs 윤곽 + 라벨 범례.
       (--brand #6f4e37 와 --accent-ink #96631f 는 정상 시야 ΔE 10.2 로 기준 15 미달이었다)
   (b) 값 라벨은 최댓값·마지막만. 모든 막대에 숫자를 붙이지 않는다. */
let dashFrom = null, dashTo = null;   // 조회 구간 'YYYY-MM-DD' (비어 있으면 ensureDashRange 가 '오늘'로 채운다)
let dashRangeRPC = true;             // 기간 지정 RPC 사용 가능 여부(마이그레이션 적용 여부)
let dashReload = null;               // 기간을 바꿨을 때 다시 부를 렌더 함수(화면마다 다름)
const DASH_CELLS = {};  // 드릴다운 시트가 참조할 셀 원본. dashCardHtml 이 채운다
let dashSeq = 0;

// 'YYYY-MM-DD' → "7/12<br>(토)" (2줄). UTC 파싱으로 타임존 드리프트 방지.
function dashColLabel(dateStr){
  const [y,m,d]=dateStr.split("-").map(Number); const dt=new Date(Date.UTC(y,m-1,d));
  const wk=["일","월","화","수","목","금","토"][dt.getUTCDay()];
  return `${m}/${d}<br><span class="wk">${wk}</span>`;
}
// ① 리드 숫자 하나 + KPI 4칸. 이전에는 "N일 · N회" pill 안에 파묻혀 있었다.
function dashHeroHtml(c){
  const days=c.days||[];
  const servings=c.servings_total||0, used=c.used_days||0;
  const closed=days.reduce((a,d)=>a+(d.closed||0),0);
  const multi=days.filter(d=>(d.servings||0)>=2).length;      // 하루 2회 이상 섬긴 날
  const cups=(c.members||[]).reduce((s,m)=>s+(m.menus||[]).reduce((a,x)=>a+(x.count||0),0),0);
  const avg=used?(servings/used):0;
  const rate=servings?Math.round(closed/servings*100):0;      // 날이 아니라 '섬김' 기준 마감률
  return `<div class="hero"><div class="hero-n">${servings}</div>
    <div class="hero-l">이 기간 섬김 횟수</div>
    <div class="hero-sub">${used}일 동안 · 하루 평균 ${avg.toFixed(1)}회</div></div>
    <div class="kpis">
      <div class="kpi" data-tip="섬김을 연 날 수(중복 없이)"><div class="n">${used}</div><div class="l">활동한 날</div></div>
      <div class="kpi" data-tip="하루에 2번 이상 섬긴 날 — 이 앱은 하루 여러 번 섬김을 지원한다"><div class="n">${multi}</div><div class="l">2회+ 인 날</div></div>
      <div class="kpi" data-tip="이 기간 주문된 음료 총 잔 수(섬김마다 따로 셈)"><div class="n">${cups}</div><div class="l">총 잔</div></div>
      <div class="kpi" data-tip="섬김 ${servings}회 중 ${closed}회 마감"><div class="n">${rate}<span style="font-size:12px">%</span></div><div class="l">마감률</div></div>
    </div>`;
}
// ② 사용 빈도 — 한 색. 마감=채움 / 진행중=윤곽. 데이터가 있는 날만 나열(빈 날 미표시).
function usageBarsHtml(days){
  const list=(days||[]).slice().sort((a,b)=> a.date<b.date?-1:1);
  const head=`<div class="row-between" style="padding:2px 0 4px"><b style="font-size:13px">☕ 사용 빈도</b>
    <span class="legend"><span><i></i>마감</span><span><i class="open"></i>진행중</span></span></div>`;
  if(!list.length) return head+`<div class="muted" style="font-size:12px;padding:6px 0">이 기간 섬김 기록이 없어요</div>`;
  const max=Math.max(1, ...list.map(x=>x.servings)), lastI=list.length-1;
  return head+`<div class="usage-wrap"><div class="usage">${list.map((x,i)=>{
    const n=x.servings||0, cl=Math.min(x.closed||0, n), op=n-cl;
    const h=Math.max(8,Math.round(n/max*54));
    // 하루에 여러 번 섬길 수 있으므로 막대 하나를 마감/진행중으로 쪼갠다.
    // 예전엔 closed>0 이면 통째로 '마감'이라 2회 중 1회만 마감한 날이 잘못 보였다.
    const gap=(cl&&op)?2:0;                       // 두 구간 사이 2px — 총 높이에서 미리 빼야 안 잘린다
    const hc=n?Math.round((h-gap)*cl/n):0, ho=h-gap-hc;
    const seg=(cl?`<i class="cl" style="height:${hc}px"></i>`:"")+(op?`<i class="op" style="height:${ho}px"></i>`:"");
    const show = n===max || i===lastI;   // 값 라벨은 최댓값·마지막만
    return `<div class="ubar" data-tip="${esc(x.date)} · 섬김 ${n}회${n>=2?' (하루 여러 번)':''} — 마감 ${cl} · 진행중 ${op}">
      <div class="ubar-n"${show?'':' style="visibility:hidden"'}>${n}</div>
      <div class="ubar-b" style="height:${h}px">${seg}</div>
      <div class="ubar-d">${dashColLabel(x.date)}</div></div>`;
  }).join("")}</div></div>`;
}
// ③ 사람별 참여 — 세로로 읽히는 목록이라 가로 스크롤이 없다. 날짜별 매트릭스는 드릴다운으로.
function peopleListHtml(c, key){
  const ms=c.members||[];
  // 마이그레이션(db-migration-dashboard-range.sql) 적용 시 '횟수'가 온다. 없으면 날짜 개수로 폴백.
  const byCt = ms.some(m=>m.attend_ct!=null);
  const denom = byCt ? (c.servings_total||0) : (c.used_days||0);
  const unit  = byCt ? "회" : "일";
  const rows=ms.map(m=>({ name:m.name,
      a: m.attend_ct!=null ? m.attend_ct : (m.dates||[]).length,
      s: m.serve_ct!=null  ? m.serve_ct  : (m.serve_dates||[]).length,
      t: m.attend_total||0 }))
    .sort((x,y)=> y.a-x.a || y.s-x.s || x.name.localeCompare(y.name,"ko"));
  const head=`<div class="row-between" style="padding:2px 0 4px"><b style="font-size:13px">🙌 사람별 참여</b>
    <button class="nav-link" data-mx="${key}" style="font-size:12px">날짜별 보기</button></div>`;
  if(!rows.length) return head+`<p class="muted center" style="padding:8px 0">구성원이 없어요</p>`;
  return head+rows.map(r=>{
    const pct=denom?Math.min(100,Math.round(r.a/denom*100)):0;
    const tip = byCt
      ? `${r.name} · 섬김 ${denom}회 중 ${r.a}회 참여 (${pct}%) · 직접 섬김 ${r.s}회 · 누적 참여 ${r.t}회`
      : `${r.name} · 활동한 ${denom}일 중 ${r.a}일 출석 (${pct}%) · 섬긴 날 ${r.s}일 · 누적 ${r.t} — 하루에 여러 번 섬겨도 날 기준으로 셉니다`;
    return `<div class="prow" data-tip="${esc(tip)}">
      <div class="row-between" style="margin-bottom:5px">
        <span class="prow-n">${esc(r.name)}</span>
        <span class="muted" style="font-size:var(--fs-sm);flex:none">${r.a}/${denom}${unit}${r.s?` · ☕${r.s}${unit}`:''} · 누적 ${r.t}</span></div>
      <div class="meter"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
}
// ④ 많이 마신 메뉴 — 가로 막대 Top 8. 나머지는 묶어서 개수를 밝힌다(조용히 자르지 않는다).
function menuTopHtml(c, key){
  const agg={};
  (c.members||[]).forEach(m=>(m.menus||[]).forEach(x=>{ agg[x.name]=(agg[x.name]||0)+(x.count||0); }));
  const list=Object.keys(agg).map(k=>({name:k,n:agg[k]})).sort((a,b)=> b.n-a.n || a.name.localeCompare(b.name,"ko"));
  if(!list.length) return "";
  const top=list.slice(0,8), rest=list.slice(8);
  const max=Math.max(1,...top.map(x=>x.n));
  const rows=top.map(x=>`<div class="hbar" data-tip="${esc(x.name)} · ${x.n}잔">
      <div class="row-between"><span class="hbar-name">${esc(x.name)}</span><span class="hbar-n">${x.n}</span></div>
      <div class="hbar-track"><i style="width:${Math.round(x.n/max*100)}%"></i></div></div>`).join("");
  const more = rest.length
    ? `<div class="muted" style="font-size:var(--fs-sm);padding:6px 2px 0">그 외 ${rest.length}종 ${rest.reduce((s,x)=>s+x.n,0)}잔</div>` : "";
  return `<div style="height:12px"></div>
    <div class="row-between" style="padding:2px 0 4px"><b style="font-size:13px">🥤 많이 마신 메뉴</b>
      <button class="nav-link" data-mbm="${key}" style="font-size:12px">사람별로 보기</button></div>${rows}${more}`;
}
// 누가 자주 섬겼는지 — 이 기간 섬김(호스트) 횟수 랭킹 칩
function serveRankHtml(c){
  const ranked=(c.members||[]).map(m=>({name:m.name, ct:(m.serve_dates||[]).length}))
    .filter(x=>x.ct>0).sort((a,b)=> b.ct-a.ct || a.name.localeCompare(b.name,"ko"));
  if(!ranked.length) return "";
  return `<div class="muted" style="font-size:12px;margin:10px 0 4px">👑 이 기간 누가 섬겼나</div>
    <div class="logchips" style="margin-bottom:2px">${ranked.map((r,i)=>
      `<span class="logchip ${i===0?'add':''}" style="font-size:12px">${i===0?'👑 ':''}${esc(r.name)} <b>${r.ct}회</b></span>`).join("")}</div>`;
}
// 드릴다운 A: 구성원 × 날짜 매트릭스. ☕=섬김 / ●=출석 / ·=없음.
function attendMatrixHtml(c){
  const members=c.members||[];
  const colSet={}; (c.days||[]).forEach(d=>colSet[d.date]=1);
  members.forEach(m=>{ (m.dates||[]).forEach(d=>colSet[d]=1); (m.serve_dates||[]).forEach(d=>colSet[d]=1); });
  const cols=Object.keys(colSet).sort();
  if(!cols.length) return `<p class="muted center" style="padding:8px 0">이 기간 출석 기록이 없어요</p>`;
  const head=`<tr><th class="mx-name">구성원</th>${cols.map(d=>`<th class="mx-date">${dashColLabel(d)}</th>`).join("")}<th class="mx-sum">출석·섬김</th></tr>`;
  const rows=members.length ? members.map(m=>{
    const att={}; (m.dates||[]).forEach(d=>att[d]=1);
    const srv={}; (m.serve_dates||[]).forEach(d=>srv[d]=1);

    <div class="mx-wrap"><table class="mx"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}
// 드릴다운 B: 사람별로 어떤 메뉴를 몇 번 주문했는지

// 기간 달력 — 바꾸면 서버를 다시 부른다(집계 구간이 달라지므로)

// 탭 툴팁 — title= 은 터치에서 아예 안 뜬다. [data-tip] 을 누르면 화면 안쪽으로 물려 띄운다.
(function tipLayer(){
  let $tip=null;
  const hide=()=>{ if($tip) $tip.classList.remove("show"); };
  const show=el=>{
    const t=el.getAttribute("data-tip"); if(!t) return hide();
    if(!$tip){ $tip=document.createElement("div"); $tip.className="tip"; document.body.appendChild($tip); }
    $tip.textContent=t; $tip.classList.add("show");
    const r=el.getBoundingClientRect(), b=$tip.getBoundingClientRect();
    $tip.style.left=Math.max(8, Math.min(r.left+r.width/2-b.width/2, window.innerWidth-b.width-8))+"px";
    $tip.style.top=(r.top-b.height-8 < 8 ? r.bottom+8 : r.top-b.height-8)+"px";
  };
  document.addEventListener("click", e=>{ const el=e.target.closest("[data-tip]"); el?show(el):hide(); });
  document.addEventListener("scroll", hide, true);
  window.addEventListener("resize", hide);
})();
// 셀 단위 대시보드 — ?cell=<id>&view=dashboard (관리자 로그인 없이 그 셀만)

/* ---------- 관리자 대시보드: 컨트롤 → 셀 그리드 → 연동 상세 ----------
   그리드에서 셀을 고르면 아래 상세가 그 셀로 바뀐다. 검색·선택은 재집계 없이
   캐시된 payload 로 다시 그리므로 즉각 반응한다(기간 변경만 서버를 다시 부른다). */
let dashPayload=null, dashQ="", dashSel=null;

/* 두 번째 마커 블록 — tests/game-logic.test.mjs 가 게임 블록과 함께 떼어내 평가한다.
   달·해 경계에서 틀리기 쉬운 산수만 여기 둔다. 게임 블록에 넣지 않는 이유는 유일한 호출부
   (presetRange)가 바로 아래라서다 — 도메인이 다른 함수를 한 블록에 몰면 그 블록이 서랍이 된다.
   블록 안에서는 DOM 도 전역 상태도 읽지 않는다. 시작 마커는 반드시 한 줄로 유지한다. */
/* @test-export:start */
// 기준일이 속한 주의 월요일까지 되돌릴 일수. getUTCDay() 는 일요일이 0 이므로 +6 %7 로
// 월(1)→0 · 화(2)→1 · … · 일(0)→6 이 된다.
function weekBackDays(ds){ return (new Date(ds+"T00:00:00Z").getUTCDay()+6)%7; }
// (이번 달 − 2)월. 1월 → 전년 11월, 2월 → 전년 12월. [연, 월(1-based)] 을 돌려준다.
function q3Start(y, m){ const mm=m-2; return mm<=0 ? [y-1, mm+12] : [y, mm]; }
/* @test-export:end */

function shiftDate(ds, n){ const d=new Date(ds+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function dashSpanDays(){ return Math.round((Date.parse(dashTo)-Date.parse(dashFrom))/86400000)+1; }

/* 기간 프리셋 — '며칠치'가 아니라 달력 기준(이번주·이번달·올해…)이다.
   기준일은 todayKey() 라 KST 고정이고, 계산은 'YYYY-MM-DD' 문자열 + UTC 로만 해서 시간대 밀림이 없다.
   아직 안 온 날은 데이터가 없으므로 진행 중 구간(이번주·이번달·올해)의 끝은 오늘로 자른다. */
/* 라벨 '최근3개월'을 '3개월'로 줄인 건 순전히 폭 때문이다 — 6개를 320px 한 줄에 넣으려면
   가장 넓은 라벨을 깎아야 한다(R3). 키(q3)와 계산은 그대로이고, 무슨 기간인지는
   dashPresetsHtml 이 title/aria-label 로 말한다. */
const DASH_PRESETS=[["오늘","today"],["이번주","week"],["지난달","lastmon"],["이번달","month"],
                    ["3개월","q3"],["올해","year"],["작년","lastyear"]];
function presetRange(key){
  const t=todayKey(), y=+t.slice(0,4), m=+t.slice(5,7);
  const p=(yy,mm,dd)=>`${yy}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
  const lastDay=(yy,mm)=>new Date(Date.UTC(yy,mm,0)).getUTCDate();   // mm 은 1-based — 0일 = 그 달 말일
  switch(key){
    // 하루짜리 구간. 시작과 끝이 같으면 그날 하루다 — 서버 _dash_range 도 같은 규칙으로 읽는다.
    case "today":   return [t, t];
    /* 월요일 시작 — 사용자 지시로 정한 값이다. 예전 근거("교회 한 주가 주일부터라 달력과
       감각이 맞는다")는 그 지시로 대체됐다. 끝은 그대로 오늘이다: '이번달'·'올해'가 이미
       오늘로 자르고 있고, 서버 _dash_range 가 미래 종료일을 오늘로 클램프하므로, 화면엔
       일요일까지 적어 놓고 서버는 오늘까지만 집계하는 어긋남을 애초에 만들지 않는다. */
    case "week":    return [shiftDate(t, -weekBackDays(t)), t];
    case "month":   return [p(y,m,1), t];
    case "lastmon":{ const yy=m===1?y-1:y, mm=m===1?12:m-1; return [p(yy,mm,1), p(yy,mm,lastDay(yy,mm))]; }
    // 달력 3개월 — '이번 달을 포함한 최근 세 달'이고 첫날은 항상 1일이다. 예전엔 오늘 기준
    // 90일 롤링이라 달 경계와 안 맞아 '지난달'과 겹치는 구간이 애매했다. 최대 92일이라
    // 서버 _dash_range 의 366일 상한에 걸리지 않는다.
    case "q3":      { const [qy,qm]=q3Start(y,m); return [p(qy,qm,1), t]; }
    case "year":    return [p(y,1,1), t];
    case "lastyear":return [p(y-1,1,1), p(y-1,12,31)];
  }
  return [p(y,m,1), t];
}
/* 기본값은 '오늘'이다. 대시보드를 여는 이유가 대개 '지금 이 판이 어떻게 돌아가고 있나'라서,
   한 달치 합계를 먼저 보여주면 오늘 것을 보려고 매번 한 번 더 눌러야 했다.
   더 넓은 구간은 프리셋 한 번이면 되고, 고른 구간은 그대로 남는다. */
function ensureDashRange(){ if(!dashFrom || !dashTo){ const r=presetRange("today"); dashFrom=r[0]; dashTo=r[1]; } }
// 가로 스크롤 줄이라 선택한 버튼이 화면 밖으로 밀릴 수 있다 — 다시 그린 뒤 가운데로 당겨온다
function scrollPresetIntoView(){
  const row=document.querySelector(".dash-filter"), on=row&&row.querySelector(".tab.on");
  if(row&&on) row.scrollLeft=Math.max(0, on.offsetLeft-(row.clientWidth-on.offsetWidth)/2);
}

// 기간 지정 RPC 를 먼저 시도하고, 없으면(마이그레이션 전) 레거시 p_days 로 떨어진다.
// 폴백 시 실제 구간은 '오늘부터 N일 전'이고 서버가 31일로 자르므로 화면에 그 사실을 밝힌다.
async function fetchDash(cellId){
  ensureDashRange();
  const fn = cellId ? "get_cell_dashboard" : "get_admin_dashboard";
  if(dashRangeRPC){
    const args = cellId ? {p_cell:cellId, p_from:dashFrom, p_to:dashTo} : {p_from:dashFrom, p_to:dashTo};
    const {data,error}=await Sync.client.rpc(fn,args);
    if(!error) return {data:data, error:null};
    dashRangeRPC=false;   // 이 시그니처가 없다 → 이후로는 레거시만 쓴다
  }
  const days=Math.min(31, Math.max(1, dashSpanDays()));
  const legacy = cellId ? {p_cell:cellId, p_days:days} : {p_days:days};
  return await Sync.client.rpc(fn,legacy);
}

// 달력 2개 + 프리셋 줄 — 셀 대시보드와 관리자 대시보드가 함께 쓴다
function dashDatesHtml(today){
  return `<div class="dash-dates">
      <input type="date" id="dFrom" value="${dashFrom}" max="${today}" aria-label="시작일">
      <span class="muted" style="flex:none">~</span>
      <input type="date" id="dTo" value="${dashTo}" max="${today}" aria-label="종료일">
    </div>`;
}
/* 라벨을 줄인 칩은 그 기간이 무엇인지 따로 말해준다 (R3-9). 접근성 이름은 보이는 라벨을
   포함해야 하므로(WCAG 2.5.3 Label in Name) 축약형을 앞에 두고 설명을 뒤에 붙인다.
   title 은 모바일에서 안 뜨지만 데스크톱 호버용으로 함께 둔다. */
const PRESET_HINT={ q3:"3개월 — 이번 달 포함 최근 3개월", week:"이번주 — 이번 주 월요일부터 오늘까지",
                    today:"오늘 하루" };
function dashPresetsHtml(){
  return `<div class="tabs dash-filter" role="group" aria-label="기간 선택">${DASH_PRESETS.map(([l,k])=>{
    const r=presetRange(k), on=(dashFrom===r[0] && dashTo===r[1]);
    const hint=PRESET_HINT[k] ? ` title="${esc(PRESET_HINT[k])}" aria-label="${esc(PRESET_HINT[k])}"` : "";
    return `<button class="tab${on?' on':''}" data-preset="${k}"${hint} aria-pressed="${on}">${l}</button>`;
  }).join("")}</div>`;
}
function dashWarnHtml(){
  if(dashRangeRPC) return "";
  return `<p class="dash-warn">⚠️ <b>db-migration-dashboard-range.sql</b> 미적용 — 서버가 최근 ${Math.min(31,dashSpanDays())}일까지만 집계합니다(오늘 기준). 날짜 지정과 지난달·최근3개월·올해·작년은 이 파일을 Supabase 에서 실행해야 동작해요.</p>`;
}
// 셀 단위 대시보드용 — 통합 검색은 없고 기간만
function dashPeriodHtml(){
  ensureDashRange();
  return `<div class="card dash-ctl">${dashDatesHtml(todayKey())}${dashPresetsHtml()}${dashWarnHtml()}</div>`;
}
// 관리자 컨트롤 바 — 달력 2개 + 프리셋 + 통합 검색
function dashControlsHtml(){
  ensureDashRange();
  return `<div class="card dash-ctl">
    ${dashDatesHtml(todayKey())}
    ${dashPresetsHtml()}
    <input type="search" id="dQ" value="${esc(dashQ)}" placeholder="🔍 셀·사람 이름 (예: 2셀, ㅎㅅ)"
      aria-label="셀 또는 사람 이름 검색 — 초성·오타 허용" autocomplete="off" autocorrect="off"
      autocapitalize="off" spellcheck="false" enterkeyhint="search">
    ${dashWarnHtml()}
  </div>`;
}
// 검색: 셀 이름이 걸리면 셀째로, 사람 이름이 걸리면 그 사람이 속한 셀을 남긴다.
function dashFilter(cells){
  const ql=norm(dashQ);
  if(!ql) return {list:cells, people:[]};
  const people=[];
  const list=cells.filter(c=>{
    const byCell=nameHit(c.name, ql);
    const hits=(c.members||[]).filter(m=>nameHit(m.name, ql));
    hits.forEach(m=>people.push({cell:c.name, name:m.name, ct:(m.serve_ct!=null?m.serve_ct:(m.serve_dates||[]).length)}));
    return byCell || hits.length>0;
  });
  return {list, people};
}
// 14일치 미니 막대 — 그리드 타일에서 추세를 한눈에
function sparkHtml(days, max){
  const list=(days||[]).slice().sort((a,b)=> a.date<b.date?-1:1).slice(-14);
  if(!list.length) return `<span class="cc-none">기록 없음</span>`;
  return list.map(d=>`<i style="height:${Math.max(2,Math.round((d.servings||0)/max*16))}px"></i>`).join("");
}
// 전체 요약 — 필터가 걸리면 걸린 셀들만 합산한다
function dashTotalsHtml(cells){
  const sv=cells.reduce((a,c)=>a+(c.servings_total||0),0);
  const cups=cells.reduce((a,c)=>a+(c.members||[]).reduce((s,m)=>s+(m.menus||[]).reduce((t,x)=>t+(x.count||0),0),0),0);
  const active=cells.filter(c=>(c.servings_total||0)>0).length;
  const multi=cells.reduce((a,c)=>a+(c.days||[]).filter(d=>(d.servings||0)>=2).length,0);
  return `<div class="kpis" style="margin:0 0 14px">
    <div class="kpi" data-tip="이 기간 모든 셀의 섬김 합계"><div class="n">${sv}</div><div class="l">총 섬김</div></div>
    <div class="kpi" data-tip="한 번이라도 섬김을 연 셀"><div class="n">${active}</div><div class="l">활동 셀</div></div>
    <div class="kpi"><div class="n">${cups}</div><div class="l">총 잔</div></div>
    <div class="kpi" data-tip="하루에 2번 이상 섬긴 날(모든 셀 합)"><div class="n">${multi}</div><div class="l">2회+ 인 날</div></div>
  </div>`;
}
// 셀 활용도 그리드 — 많이 쓴 순. 누르면 아래 상세가 바뀐다.
function cellGridHtml(cells){
  const sorted=cells.slice().sort((a,b)=> (b.servings_total||0)-(a.servings_total||0)
    || (b.used_days||0)-(a.used_days||0) || a.name.localeCompare(b.name,"ko"));
  const max=Math.max(1,...sorted.map(c=>c.servings_total||0));
  const head=`<div class="row-between" style="padding:2px 2px 6px"><b style="font-size:13px">🏆 많이 활용한 셀</b>
    <span class="muted" style="font-size:var(--fs-sm)">누르면 아래 상세가 바뀝니다</span></div>`;
  if(!sorted.length) return head+`<div class="card"><p class="muted center" style="margin:0;padding:10px 0">조건에 맞는 셀이 없어요</p></div>`;
  return head+`<div class="cellgrid">${sorted.map((c,i)=>{
    const n=c.servings_total||0;
    return `<button class="cellcard${dashSel===c.cell_id?' on':''}" data-cell="${esc(c.cell_id)}" aria-pressed="${dashSel===c.cell_id}">
      <div class="cc-top"><span class="cc-rank">${i+1}</span><span class="cc-name">${esc(c.name)}</span></div>
      <div class="cc-n">${n}<span>회</span></div>
      <div class="cc-spark">${sparkHtml(c.days,max)}</div>
      <div class="cc-meta">${c.used_days||0}일 · ${c.member_count||0}명</div></button>`;
  }).join("")}</div>`;
}
// 사람 검색이 걸렸을 때: 어느 셀의 누구인지 먼저 보여준다
function dashPeopleHitHtml(people){
  if(!people.length) return "";
  return `<div class="card" style="padding:12px 14px;margin-bottom:12px">
    <div class="muted" style="font-size:12px;margin-bottom:6px">🙋 이름이 걸린 사람 ${people.length}명</div>
    <div class="logchips">${people.slice(0,20).map(p=>
      `<span class="logchip" style="font-size:12px">${esc(p.name)} <span class="muted">· ${esc(p.cell)}</span>${p.ct?` <b>☕${p.ct}</b>`:''}</span>`).join("")}</div>

}
// 컨트롤 바 아래 본문 — 검색·셀 선택으로 바뀌는 건 전부 여기 안에 있다
function dashBodyHtml(list, people, sel){
  return `${dashPeopleHitHtml(people)}
    ${dashTotalsHtml(list)}
    ${cellGridHtml(list)}
    <div style="height:14px"></div>
    ${sel?dashCardHtml(sel,{showCode:true}):'<div class="card"><p class="muted center" style="margin:0;padding:10px 0">셀을 선택하면 상세가 보입니다</p></div>'}
    <p class="muted center" style="margin:14px 0 0;font-size:12px;line-height:1.7">사용 = 섬김 오픈/마감<br>출석 = 이 앱에서 주문·안마심으로 의사표현한 것<br>누적은 표시 기간과 무관하게 전체</p>`;
}
/* 캐시된 payload 로 다시 그리기 — 검색·셀 선택은 서버를 다시 부르지 않는다.
   bodyOnly=true 면 컨트롤 바를 건드리지 않고 #dashBody 만 갈아끼운다. 이게 한글 검색의 핵심 —
   input 을 통째로 다시 만들면 조합 중이던 IME 가 끊겨 "하성"이 "ㅎㅏㅅㅓㅇ"으로 풀린다.
   검색어·셀 선택은 컨트롤 바를 바꾸지 않으므로 다시 그릴 이유도 없다. */
function paintAdminDash(bodyOnly){
  if(!dashPayload) return;
  const all=dashPayload.cells||[];
  const {list,people}=dashFilter(all);
  const sorted=list.slice().sort((a,b)=> (b.servings_total||0)-(a.servings_total||0));
  if(!sorted.some(c=>c.cell_id===dashSel)) dashSel = sorted.length?sorted[0].cell_id:null;
  const sel=sorted.find(c=>c.cell_id===dashSel);
  const count=`${esc(dashPayload.from||dashFrom)} ~ ${esc(dashPayload.to||dashTo)} · 셀 ${list.length}/${all.length}개`;

  const body=bodyOnly && document.getElementById("dashBody");
  if(body){
    body.innerHTML=dashBodyHtml(list, people, sel);
    const h=document.getElementById("dashCount"); if(h) h.innerHTML=count;
    return;
  }

  $app.innerHTML=`
    <header><div class="h-row"><div style="min-width:0"><div class="room-name">📊 대시보드</div>
      <div class="date" id="dashCount">${count}</div></div>
      <button class="nav-link" id="dback">← 관리자</button></div></header>
    ${dashControlsHtml()}
    <div id="dashBody">${dashBodyHtml(list, people, sel)}</div>`;

  const b=document.getElementById("dback");
  if(b) b.onclick=()=>{ if(subActive) history.back(); else renderAdminDash(); };
  scrollPresetIntoView();
}

// 셀 URL(초대코드) 변경(관리자) — 데이터·대시보드 전부 이관
function openRenameCellSheet(cell){
  const old=cell.id;
  openSheet(`
    <h3>🔗 주소(초대코드) 변경</h3>
    <p class="muted" style="margin-top:0"><b>${esc(cell.name)}</b>의 링크를 바꿉니다. 기존 주문·섬김·출석(대시보드)·수정내역이 <b>새 주소로 모두 이관</b>돼요.</p>
    <div class="banner-warn" style="margin:0 0 10px">⚠️ 예전 링크(<b>${esc(old)}</b>)는 더 이상 열리지 않습니다. 바꾼 뒤 <b>새 링크를 다시 공유</b>하세요.</div>
    <div class="label" id="lbl-newid">새 초대코드</div>
    <input type="text" id="newid" maxlength="40" value="${esc(old)}" placeholder="영문 소문자·숫자·하이픈(-)" autocapitalize="off" autocomplete="off" spellcheck="false" aria-labelledby="lbl-newid" />
    <p class="muted" style="font-size:12px;margin:6px 0 0">3~40자, 소문자/숫자/하이픈만. 새 링크: <span id="prev" style="word-break:break-all;color:var(--brand)"></span></p>
    <div style="height:16px"></div>
    <button class="btn btn-brand" id="dorename">주소 변경 + 데이터 이관</button>
    <div style="height:8px"></div><button class="btn btn-ghost btn-close" id="rclose">닫기</button>`);
  const inp=document.getElementById("newid"), prev=document.getElementById("prev");
  const norm=v=> (v||"").toLowerCase().replace(/[^a-z0-9-]/g,"");
  const upd=()=>{ const v=norm(inp.value); if(inp.value!==v) inp.value=v; prev.textContent=`${location.origin}${location.pathname}?cell=${v}`; };
  inp.oninput=upd; upd();
  document.getElementById("rclose").onclick=closeSheet;
  // 여기만 busy 버튼을 안 붙인다 — askConfirm 이 guardWrite 안에 있어서, 확인창이 떠 있는 동안
  // 뒤 버튼이 "이관 중…"이라고 거짓말을 하게 된다. 확인창 자체가 이미 '진행 중'을 말하고 있다.
  document.getElementById("dorename").onclick=()=>guardWrite(async()=>{
    const nid=norm(inp.value);
    if(!/^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/.test(nid)){ toast("초대코드 형식을 확인해주세요(3~40자, 소문자/숫자/-)"); return; }
    if(nid===old){ toast("기존과 다른 주소를 입력해주세요"); return; }
    if(cellById(nid)){ toast("이미 사용 중인 초대코드예요"); return; }
    if(!(await askConfirm(`주소를 '${old}' → '${nid}' 로 바꾸고 데이터를 이관할까요?\n예전 링크는 열리지 않게 됩니다.`,{ok:"변경",danger:true}))) return;
    const {error}=await Sync.client.rpc("admin_rename_cell",{p_old:old,p_new:nid});
    if(error){ toast("변경 실패: "+(error.message||"")); return; }
    closeSheet(); toast("주소를 바꾸고 데이터를 이관했어요"); await loadDbCells(); renderAdminDash();
  });
}

  ).join("");

}
function fmtLogTime(iso){ try{ const p=new Intl.DateTimeFormat("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Seoul"}).formatToParts(new Date(iso)); const g=t=>(p.find(x=>x.type===t)||{}).value||""; return `${g("month")}/${g("day")} ${g("hour")}:${g("minute")}`; }catch(e){ return iso||""; } }

    </div>`).join("") || '<p class="muted">메뉴가 없어요. 아래 "기본 메뉴 불러오기"로 시작하세요.</p>';
  $app.innerHTML=`
    <header><div class="h-row"><div><div class="room-name">🍽️ 카페길 메뉴</div><div class="date">${menus.length}개 · 관리자</div></div>
      <button class="nav-link" id="mback" style="font-size:14px">← 관리자</button></div></header>
    ${menus.length?'':'<button class="btn btn-brand" id="seed">📥 기본 메뉴 76개 불러오기(시드)</button><div style="height:10px"></div>'}
    <button class="btn btn-soft" id="addMenu">➕ 메뉴 추가</button>
    ${menus.length?'<div style="height:6px"></div><button class="btn btn-ghost" id="reseed" style="font-size:13px">기본 메뉴 다시 덮어쓰기</button>':''}
    <div style="height:12px"></div>
    <div class="card" style="padding:6px 16px">${rows}</div>`;
  document.getElementById("mback").onclick=()=>{ if(subActive) history.back(); else renderAdminDash(); };
  const seedBtn=document.getElementById("seed")||document.getElementById("reseed");
  if(seedBtn) seedBtn.onclick=async()=>{ if(seedBtn.id==="reseed"&&!(await askConfirm("코드 기본 76개 메뉴로 덮어쓸까요?\n(같은 메뉴는 갱신됩니다)",{ok:"덮어쓰기",danger:true}))) return;
    const payload=GIL_MENUS.map((m,i)=>({cafe_id:cafeId,menu_id:m.id,name:m.name,emoji:m.emoji,cat:m.cat,temps:m.temps,extras:m.extras,popular:!!m.popular,sort:i}));
    const {error}=await Sync.client.from("cafe_menus").upsert(payload,{onConflict:"cafe_id,menu_id"});
    if(error){ toast("시드 실패: "+(error.message||"")); return; } delete CAFEMENU_CACHE[cafeId]; toast("기본 메뉴 등록됨"); openCafeMenuAdmin(cafeId); };
  document.getElementById("addMenu").onclick=()=>openMenuEditSheet(cafeId,null);
  $app.querySelectorAll(".mpop").forEach(b=> b.onclick=async()=>{ const m=menus.find(x=>x.id===b.dataset.id);
    const {error}=await Sync.client.from("cafe_menus").update({popular:!m.popular}).eq("cafe_id",cafeId).eq("menu_id",b.dataset.id);
    if(error){ toast("실패: "+error.message); return; } delete CAFEMENU_CACHE[cafeId]; openCafeMenuAdmin(cafeId); });
  $app.querySelectorAll(".mdel2").forEach(b=> b.onclick=async()=>{ if(!(await askConfirm("이 메뉴를 삭제할까요?",{ok:"삭제",danger:true}))) return;
    const {error}=await Sync.client.from("cafe_menus").delete().eq("cafe_id",cafeId).eq("menu_id",b.dataset.id);
    if(error){ toast("삭제 실패: "+error.message); return; } delete CAFEMENU_CACHE[cafeId]; toast("삭제됨"); openCafeMenuAdmin(cafeId); });
}
function openMenuEditSheet(cafeId, existing){
  let temps = existing? [...(existing.temps||["ICE","HOT"])] : ["ICE","HOT"];
  let cat = existing? (existing.cat||"coffee") : "coffee";
  function tchip(t){ return `<div class="chip ${temps.includes(t)?'sel':''}" data-t="${t}">${t}</div>`; }
  openSheet(`
    <h3>${existing?'메뉴 수정':'메뉴 추가'}</h3>
    <div class="label" id="lbl-mname">이름</div><input autocomplete="off" type="text" id="mname" maxlength="40" value="${esc(existing?existing.name:'')}" placeholder="예: 흑임자라떼" aria-labelledby="lbl-mname"/>
    <div class="label" id="lbl-memoji">이모지(선택)</div><input autocomplete="off" type="text" id="memoji" maxlength="4" value="${esc(existing?(existing.emoji||''):'')}" placeholder="🥤" aria-labelledby="lbl-memoji"/>
    <div class="label" id="lbl-mcat">분류</div>
    <select id="mcat" aria-labelledby="lbl-mcat" style="width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fff">${CAT_ORDER.map(c=>`<option value="${c}" ${c===cat?'selected':''}>${CAT_LABEL[c]}</option>`).join("")}</select>
    <div class="label">온도</div><div class="chips" id="mtemps">${tchip("ICE")}${tchip("HOT")}</div>
    <div style="height:14px"></div>
    <div class="row-2"><button class="btn btn-ghost btn-close" id="mcancel">닫기</button>
      <button class="btn btn-brand" id="msave">${existing?'수정':'추가'}</button></div>`);
  document.getElementById("mtemps").querySelectorAll(".chip").forEach(c=> c.onclick=()=>{ const t=c.dataset.t,i=temps.indexOf(t); i>=0?temps.splice(i,1):temps.push(t); c.classList.toggle("sel"); });
  document.getElementById("mcancel").onclick=closeSheet;
  document.getElementById("msave").onclick=async()=>{
    const name=document.getElementById("mname").value.trim().slice(0,40); if(!name){ toast("이름을 입력해주세요"); return; }
    const emoji=document.getElementById("memoji").value.trim().slice(0,4)||"🥤"; cat=document.getElementById("mcat").value;
    const id=existing?existing.id:("m:"+name);
    const {error}=await Sync.client.from("cafe_menus").upsert({cafe_id:cafeId,menu_id:id,name,emoji,cat,temps,extras:existing?existing.extras:[],popular:existing?!!existing.popular:false},{onConflict:"cafe_id,menu_id"});
    if(error){ toast("저장 실패: "+error.message); return; } delete CAFEMENU_CACHE[cafeId]; closeSheet(); toast("저장됨"); openCafeMenuAdmin(cafeId); };
}

// 구성원 편집 (이 셀 링크를 가진 누구나) — set_members RPC
/* ---------- 구성원 편집 (20b) ----------
   ✕ 를 눌러도 행을 지우지 않는다. 취소선 + [되돌리기] 로 남기고, 실제 삭제는 [저장] 때 일어난다 —
   지우는 것은 되돌릴 수 없는데 확인 한 번 없이 손끝에서 끝나던 자리였다.
   저장 전이라는 사실도 화면이 말한다("아직 저장 전이에요 — N명 삭제 대기"). */
function openMembersSheet(){
  let list = MEMBERS.map(m=>({id:m.id, name:m.name, del:false}));   // 객체로 편집 — 이름 바꿔도 숨은 id 유지
  let baseline = memSig(MEMBERS.map(m=>({id:m.id,name:m.name})));   // 동시편집 충돌 감지용 스냅샷(순서무관)
  function draw(){
    const delN = list.filter(m=>m.del).length;
    openSheet(`
      <h3>👥 ${esc(ROOM_NAME)} 구성원 편집</h3>
      <p class="muted" style="margin-top:0">이 셀 링크를 가진 누구나 편집할 수 있어요. <b>이름을 고쳐도 기존 주문은 그대로 따라옵니다.</b></p>
      <div class="card" style="padding:6px 14px" id="mlist">${list.length?list.map((m,i)=>`<div class="person mem-row${m.del?" del":""}"><div class="avatar" data-av="${i}">${esc(initials(m.name))}</div>${
        m.del ? `<span class="mem-name-del">${esc(m.name)}</span><button class="mundo" data-i="${i}">되돌리기</button>`
              : `<input autocomplete="off" type="text" class="medit" data-i="${i}" value="${esc(m.name)}" maxlength="40" aria-label="구성원 이름" /><button class="mdel" data-i="${i}" aria-label="${esc(m.name)} 삭제">✕</button>`
      }</div>`).join(""):'<p class="muted">구성원이 없어요</p>'}</div>
      <div class="inline-form" style="margin-top:10px"><input autocomplete="off" type="text" id="newM" maxlength="40" placeholder="구성원 이름 추가" aria-label="구성원 이름 추가"/><button class="btn btn-soft btn-sm" id="addM" style="flex:none">추가</button></div>
      ${delN?`<p class="mem-pending">아직 저장 전이에요 — <b>${delN}명 삭제 대기</b></p>`:""}
      <div style="height:14px"></div>
      <div class="row-2"><button class="btn btn-ghost btn-close" id="closeM">닫기</button>
        <button class="btn btn-brand" id="saveM">저장</button></div>`);
    /* 이니셜을 타이핑에 맞춰 갱신한다 (20b). 예전엔 oninput 이 배열만 고치고 옆 아바타는
       처음 그린 두 글자로 남아, 이름을 다 바꿔도 이니셜은 옛 이름이었다. */
    $sheet.querySelectorAll(".medit").forEach(inp=> inp.oninput=()=>{
      const i=+inp.dataset.i; list[i].name=inp.value;
      const av=$sheet.querySelector('.avatar[data-av="'+i+'"]'); if(av) av.textContent=initials(inp.value);
    });
    $sheet.querySelectorAll(".mdel").forEach(b=> b.onclick=()=>{ list[+b.dataset.i].del=true; draw(); });
    $sheet.querySelectorAll(".mundo").forEach(b=> b.onclick=()=>{ list[+b.dataset.i].del=false; draw(); });
    const addM=()=>{ const el=document.getElementById("newM"), v=el.value.trim(); if(v){ list.push({id:genMemberId(), name:v, del:false}); draw(); } };
    document.getElementById("addM").onclick=addM;
    // Enter 로도 추가 (20b) — 여러 명을 연달아 넣을 때 매번 버튼으로 손을 옮기지 않게
    document.getElementById("newM").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); addM(); } });
    const smb=document.getElementById("saveM");
    smb.onclick=()=>guardWrite(async()=>{
      // 동시편집 충돌 감지(OCC): 저장 직전 최신 멤버 확인 → 바뀌었으면 덮어쓰지 말고 최신 반영+경고
      if(SHARED){ const fresh=await fetchCell(CELL.id);
        if(fresh && memSig(fresh.members)!==baseline){
          CELL=fresh; applyCellGlobals(); list=MEMBERS.map(m=>({id:m.id,name:m.name,del:false})); baseline=memSig(MEMBERS.map(m=>({id:m.id,name:m.name})));
          toast("다른 분이 방금 구성원을 바꿨어요 — 최신 목록을 불러왔어요. 다시 확인 후 저장해주세요"); draw(); return;
        }
      }
      // 삭제 대기(del)는 여기서 처음 실제로 빠진다 — 저장이 곧 확정이다 (20b)
      const seen={}, out=[];
      for(const m of list){ if(m.del) continue; const name=(m.name||"").trim().slice(0,40); if(!name||seen[m.id]) continue; seen[m.id]=1; out.push({id:m.id, name}); }
      const final=out.slice(0,60);
      if(!final.length){ toast("구성원을 1명 이상 두세요"); return; }
      if(await saveMembers(final)){ if(ME && !final.some(m=>m.id===ME)) setMe(null); closeSheet(); toast("구성원 명단을 저장했어요"); render(); }
    }, smb, "저장 중…");
    document.getElementById("closeM").onclick=closeSheet;
  }
  draw();
}

/* ===================== 부팅 ===================== */
// 스케일 완화: 백그라운드 탭은 실시간 구독 해제, 복귀 시 재구독+새로고침 (동시접속 절감)
document.addEventListener("visibilitychange", async ()=>{
  if(!SHARED || !CELL || adminMode || inPicker) return;
  if(document.hidden){ if(Sync.pause) Sync.pause(); }
  else { try{ const c=await fetchCell(CELL.id); if(c){ CELL=c; applyCellGlobals(); } }catch(e){}   // 멤버(이름변경/추가) 최신화
         try{ await Sync.resubscribe(); }catch(e){}
         if(sheetOpen || confirmOpen) return;                    // 입력 중이면 화면 유지
         if(curView==="pick") renderPickMe(); else render(); }   // 이름 선택 중이면 메인으로 튕기지 않음
});
function onRemote(){ if(inPicker || adminMode) return;
  if(curView==="pick" || sheetOpen || confirmOpen) return;   // 이름 선택/시트/확인창 사용 중엔 폴링이 화면을 갈아엎지 않음(선택 화면이 스스로 닫히던 문제)
  render(); }
(async function boot(){
  console.log("[오늘은 제가 섬기겠습니다] build "+APP_VERSION);  // 캐시/배포 확인용
  updateOffline();   // 오프라인 초기 표시
  // 무한 로딩 방지: 8초 내 첫 렌더 안 되면 재시도 안내
  setTimeout(()=>{ if(document.querySelector("#app > .loading")) $app.innerHTML='<div class="loading">연결이 지연되고 있어요 📡<br><br><button class="btn btn-soft" onclick="location.reload()" style="max-width:200px;margin:0 auto">다시 시도</button></div>'; }, 8000);
  try { await Sync.init(onRemote); }
  catch(e){ console.error(e); $app.innerHTML=`<div class="loading">연결 오류: ${esc(e.message||"")}<br>설정을 확인해주세요.</div>`; return; }
  if(!SHARED) loadLocalCells();   // 일반 사용자는 전체 셀 열거 안 함(자기 셀만 단건 조회)
  const params=new URLSearchParams(location.search);
  try {
    if(params.has("admin")){ await renderAdmin(); }   // 숨은 관리자 경로(전체 셀 대시보드는 여기)
    else { const target=params.get("cell"); // 바 URL은 최근 셀 자동입장 안 함 — 랜딩만
      if(target && params.get("view")==="dashboard") await renderCellDashboard(target);  // ?cell=..&view=dashboard → 그 셀 대시보드(무로그인)
      else if(target) await enterCell(target);   // ?cell= 링크만 단건 입장
      else renderCellPicker(); }            // 바 URL → 개발자 메시지/앱 안내 랜딩
  } catch(e){ console.error("초기 렌더 실패",e); }
})();
</script>
