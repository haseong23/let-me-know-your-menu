<style>
  :root {
    --bg: #f6f1ea; --card: #ffffff; --ink: #2b2118; --sub: #6f6253; --line: #e7ddcf;
    --brand: #6f4e37; --brand-soft: #efe6da; --accent: #c98a3a; --green: #3f9d6b;
    --red: #c2552f; --gray: #b6a99a; --radius: 16px; --shadow: 0 6px 20px rgba(80,55,30,.08);
    /* --accent(#c98a3a)는 흰 배경 대비 2.92:1 이라 글자에 못 쓴다. 칠(배지·점)에만 쓰고 글자는 --accent-ink.
       --gray(2.05:1)도 글자 금지 — 보조문구는 --sub(5.27:1). */
    --accent-ink: #96631f;
    /* ---- 타입 스케일 (R13-7) ----
       142개로 흩어져 있던 font-size 를 일곱 값으로 모은다. <style> 블록에 리터럴로 남는 값은
       아래 열넷뿐이고, 각각 자기 letter-spacing·line-height 나 폭 예산과 한 세트로 조정된
       값이라 스케일에 넣으면 그 결합이 끊어진다.
         디스플레이 — 46(.hero-n) · 62(.fp-cnt) · 25(.game-win .wn) · 24(.stat .num) ·
                      23(.cc-n) · 21(.banner h2)
         아이콘·상자 — 44(.banner .emoji) · 38(.game-win .we) · 26(gp-em·wheel-pin) ·
                      22(.menu-tile .em) · 18(.sheet-x ✕)
         폭 예산    — 17(.kpi .n · 4칸 ≈65px 에 12px "%" 가 붙는다) ·
                      16(.game-title · 오버레이 제목은 화면 제목보다 한 단계 작다) ·
                      11(.gl-it · 범례 줄 수 예산, 위 R13-4 주석 참조)
       블록 밖에도 셋 있다 — 돌림판 SVG 의 11/13, 사다리의 NFS/LFS/BFS, 레이스 캔버스의 ctx.font.
       셋 다 px 이 아니라 사용자 단위·논리 px 이라 이 토큰이 닿을 수 없다.
       인라인 스타일 54곳은 이번 범위 밖이다 — 대부분 클래스와 싸우는 override 라 기계적 치환이
       안 되고 하나하나 판단이 필요하다.
       px 를 쓰는 이유: rem 으로 바꾸면 min-height:44px · .avatar 38px · .cc-rank 17px ·
       .mx-name 78px 같은 고정 치수가 전부 끌려 들어온다. 뷰포트 메타(7행)에 user-scalable=no 도
       maximum-scale 도 없어 WCAG 1.4.4 는 이미 충족이므로 급하지 않다.
       vw/vh/vmin 은 쓰지 않는다 — 확대가 뷰포트 단위를 바꾸지 않아 1.4.4 가 즉시 깨진다. */
    --fs-xs: 11px;      /* 배지 · 축 라벨 · 표 헤더 (숫자 위주) */
    --fs-sm: 12px;      /* 보조문구 · 메타 · 칩 수치 */
    --fs-md: 13px;      /* 라벨 · 이름 행 · 캡션 */
    --fs-base: 14px;    /* 본문 · 탭 · 칩 · 소형 버튼 */
    --fs-lg: 15px;      /* 사람 이름 · 다이얼로그 본문 · 온도 토글 */
    /* 16px 미만이면 iOS 가 포커스 시 화면을 확대한다 — 폼과 주 버튼의 하한이다. 줄이지 말 것. */
    --fs-input: 16px;
    --fs-title: 18px;   /* 화면·시트 제목 — 아래 두 티어에서 램프된다 */
    /* 차트 마크 전용. --brand 는 채도 0.057 이라 데이터 막대로 쓰면 회색으로 읽힌다(UI 색으로는 문제없음).
       #94520c 는 채도 0.104 로 floor 통과 + 흰 배경 대비 3:1 이상. */
    --data-1: #94520c;
  }
  /* --fs-title 만 티어마다 다시 정의한다 — 이 한 줄이 .room-name 과 .sheet h3 의 축소 계단을
     흡수해서 아래 미디어쿼리의 개별 override 를 없앤다 (R13-7). */
  @media (max-width: 440px){ :root{ --fs-title: 17px; } }
  @media (max-width: 330px){ :root{ --fs-title: 16px; } }
  /* 움직임 최소화 설정을 켠 사용자에게는 전환을 끈다 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased;
    word-break: keep-all; overflow-wrap: break-word;   /* 한글은 어절 단위로 줄바꿈(모바일 가독성) · 긴 URL 등은 안전하게 끊김 */
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding: 0 16px 120px; }
  body.no-bottom #app { padding-bottom: calc(28px + env(safe-area-inset-bottom)); }   /* 하단바 없는 화면의 빈 여백 제거 */
  header { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 14px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .h-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .room-name { margin: 0; font-size: var(--fs-title); font-weight: 800; letter-spacing: -.017em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .date { font-size: var(--fs-sm); color: var(--sub); margin-top: 1px; display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; }
  .dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
  .dot.off { background: var(--accent); }
  .me-chip { font-size: var(--fs-md); font-weight: 600; color: var(--brand); background: var(--brand-soft); border: 1px solid var(--line); padding: 7px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .me-chip small { color: var(--sub); font-weight: 500; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .muted { color: var(--sub); font-size: var(--fs-md); } .center { text-align: center; }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px; border-radius: 14px; font-size: var(--fs-input); font-weight: 700; transition: transform .05s ease, filter .15s; }
  .btn:active { transform: scale(.985); }
  .btn-brand { background: var(--brand); color: #fff; } .btn-soft { background: var(--brand-soft); color: var(--brand); border: 1px solid var(--line); }
  .btn-ghost { background: transparent; color: var(--sub); border: 1px solid var(--line); } .btn-danger { background: #fff; color: var(--red); border: 1px solid #f0d4c8; }
  /* '고를 수 있는 것' 전용 — 이 앱에서 누를 수 있는 건 전부 흰 카드다(메뉴 타일·사람 행).
     btn-ghost(투명 배경 + --sub 회색)로 두면 배경에 묻혀 '닫기' 같은 부속으로 읽힌다. */
  .btn-choice { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); box-shadow: 0 1px 3px rgba(80,55,30,.05); }
  /* '안 마실게요' 전용. 흰 카드(.btn-choice)로 올렸는데도 바로 위 메뉴 타일이 전부 흰 카드라
     그 사이에 묻혀 여전히 못 보고 지나갔다(B15 의 후속). 그래서 색으로 갈라 세운다 —
     실패(--red)가 아니라 '다른 갈래'라서 주의 계열(--accent)을 쓰고, 글자는 흰 배경 대비
     2.92:1 인 --accent 대신 --accent-ink(4.9:1)로 둔다. 주문 버튼(--brand)과도 색이 갈려
     '메뉴 고르기'와 헷갈리지 않는다. */
  .btn-skip { background:#fdf4e6; color:var(--accent-ink); border:1.5px solid var(--accent); font-weight:800; }
  .btn-sm { width: auto; padding: 9px 14px; font-size: var(--fs-base); border-radius: 10px; min-height: 44px; }
  .banner { text-align: center; padding: 26px 18px; } .banner .emoji { font-size: 44px; }
  /* 열린 섬김 머리말 — 높이를 고정한다.
     예전엔 호스트 유무와 내 주문 유무에 따라 이 카드가 커졌다 작아졌고, 그때마다 바로 아래
     탭 줄이 위아래로 움직였다. 탭은 손이 자리를 기억하는 컨트롤이라 움직이면 안 된다.
     높이를 지키는 장치가 셋이다 — ① height 고정 + 세로 가운데 정렬 ② 안내 한 줄(<p>)을
     상태와 무관하게 '항상' 그린다(내용만 바뀐다) ③ 호스트 이름을 말줄임으로 잘라 제목이
     두 줄로 접히지 않게 한다. 셋 중 하나만 빠져도 높이가 다시 흔들린다.
     예전 .banner(26px 패딩 + 44px 이모지 + 21px 제목)보다 낮다 — 이 화면은 축하가 아니라
     '지금 상태'를 말하는 자리고, 아래로 내려갈 내용이 길다. */
  /* 선택자를 .card.open-hero 로 둔다 — @media 안의 .card { padding:15px/13px } 가 이 규칙보다
     아래에 있어서, 같은 특이도(0-1-0)로 두면 좁은 화면에서 패딩을 도로 뺏긴다. */
  .card.open-hero { height:104px; padding:12px 14px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:3px; text-align:center; overflow:hidden; }
  .open-hero .emoji { font-size:26px; line-height:1; }
  .open-hero h2 { margin:0; font-size:var(--fs-title); font-weight:800; letter-spacing:-.017em;
    line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  /* 이름만 줄인다 — '님이 섬깁니다!'까지 잘리면 무슨 말인지 알 수 없다 */
  .open-hero .host-name { display:inline-block; max-width:52%; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; }
  .open-hero p { margin:0; color:var(--sub); font-size:var(--fs-md); line-height:1.4;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .banner h2 { margin: 10px 0 4px; font-size: 21px; letter-spacing: -.4px; } .banner p { margin: 0; color: var(--sub); font-size: var(--fs-base); }
  .host-name { color: var(--brand); font-weight: 800; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .menu-tile { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 8px; text-align: center; font-weight: 700; font-size: var(--fs-base); position: relative; transition: .12s; }
  .menu-tile.sel { border-color: var(--brand); background: var(--brand-soft); }
  .menu-tile .em { display:block; font-size: 22px; margin-bottom: 4px; }
  .menu-tile .cnt { display:block; font-size: var(--fs-xs); color: var(--accent-ink); margin-top: 3px; font-weight: 700; }
  .menu-tile .ck { position: absolute; top: 6px; right: 9px; color: var(--brand); font-weight: 900; opacity: 0; } .menu-tile.sel .ck { opacity: 1; }
  .menu-tile.add { border-style: dashed; color: var(--brand); background: #fbf8f3; }
  .seg-temp { display:flex; gap:8px; }
  .tbtn { flex:1; padding:14px; border-radius:12px; font-weight:800; font-size:var(--fs-lg); border:2px solid var(--line); background:#fff; color:var(--sub); }
  .tbtn.ice.on { background:#e8f1fb; border-color:#3b82c4; color:#2b6aa3; }
  .tbtn.hot.on { background:#fbe9e3; border-color:#c2552f; color:#a8401f; }
  .tbtn[disabled] { opacity:.95; }
  .seg { display:flex; gap:8px; }
  /* 알약(.pill)과 같은 자리에 선다 — 행마다 이름·메뉴 길이가 달라도 오른쪽 끝에 고정된다.
     margin-left:auto 가 없으면 가운데 블록 바로 뒤에 붙어 행마다 좌우로 흔들린다. */
  .sameas { flex:none; margin-left:auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  /* 온도·옵션 칩은 주문 핵심 경로 — 탭 영역 44px 확보 */
  .chip { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 14px; border-radius: 999px; font-size: var(--fs-base); font-weight: 600; background: #faf6f0; border: 1.5px solid var(--line); color: var(--ink); cursor: pointer; transition: transform .06s, background .12s, border-color .12s; }
  .chip:active { transform: scale(.94); }
  .chip.sel { background: var(--brand); color: #fff; border-color: var(--brand); }
  .label { font-size: var(--fs-md); font-weight: 700; color: var(--sub); margin: 16px 0 6px; }
  /* 구역 구분선 — '내 주문'과 '현황'을 한 화면에 합친 뒤(R12) 둘이 이어 붙어 보이던 걸 끊는다.
     .label 보다 한 단계 위의 구분이라 선을 함께 그린다. 제목을 선 가운데 얹어 "여기서부터
     다른 이야기"를 한 번에 읽히게 한다. 글자는 짧게 유지할 것 — 좌우 선이 flex:1 이라
     제목이 길어지면 선이 사라진다. */
  .sec-div { display:flex; align-items:center; gap:10px; margin:28px 0 14px;
    font-size:var(--fs-lg); font-weight:800; color:var(--brand); white-space:nowrap; }
  .sec-div::before, .sec-div::after { content:""; flex:1 1 0; min-width:12px; height:2px; border-radius:2px; background:var(--line); }
  /* 16px 하한의 근거는 :root 의 --fs-input 옆에 적어 뒀다 (R13-12) */
  input[type=text], input[type=search], textarea { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; font-size: var(--fs-input); font-family: inherit; background: #fff; color: var(--ink); -webkit-appearance: none; appearance: none; }
  /* select 도 body 폰트를 물려받게 한다 (R13-2). 위 규칙이 input/textarea 만 덮고 있어서
     앱의 유일한 드롭다운이 UA 기본 폰트로 렌더됐다 — 같은 줄에 선 입력들과 서체가 갈렸다.
     인라인 스타일 한 곳을 고치는 대신 여기 두는 이유: 앞으로 생길 <select> 까지 함께 덮는다. */
  select { font-family: inherit; }
  input, textarea, select { max-width: 100%; min-width: 0; }
  /* 테두리 색만 바꾸면 1.5px 변화라 포커스 표시가 약하다. box-shadow 링은 레이아웃을 밀지 않는다.
     키보드 사용자에게는 :focus-visible 로 더 진한 외곽선을 추가로 준다. */
  input:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(111,78,55,.22); }
  input:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .person { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
  .person:last-child { border-bottom: none; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 800; font-size: var(--fs-base); color: #fff; background: var(--brand); }
  .person .pname { font-weight: 700; font-size: var(--fs-lg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .person .pmenu { font-size: var(--fs-md); color: var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .person > div { min-width: 0; }
  .logrow { padding: 9px 2px; border-bottom: 1px solid var(--line); }
  .logrow:last-child { border-bottom: none; }
  .logmeta { font-size: var(--fs-sm); color: var(--sub); margin-bottom: 5px; }
  .logchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .logchip { font-size: var(--fs-md); font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--ink); }
  .logchip.add { background: #e6f4ea; color: #1e7a37; }
  .logchip.rem { background: #fdeaea; color: #b3261e; }
  .logchip.ren { background: #eaeef6; color: #33415c; }
  .pill { margin-left: auto; flex: none; font-size: var(--fs-sm); font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.ordered { background: #e7f4ec; color: #1e7a37; } .pill.skip { background: #f1eee9; color: var(--sub); } .pill.pending { background: #fbecdf; color: #8a5a1f; }
  .person.picksel { background: var(--brand-soft); border-radius: 12px; box-shadow: inset 0 0 0 2px var(--brand); }
  .stats { display: flex; gap: 8px; margin-bottom: 6px; }
  .stat { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 8px; text-align: center; }
  .stat .num { font-size: 24px; font-weight: 900; letter-spacing: -1px; line-height: 1.1; } .stat .lbl { font-size: var(--fs-sm); color: var(--sub); margin-top: 2px; } .stat.total .num { color: var(--brand); }
  .tabs { display: flex; gap: 6px; background: var(--brand-soft); padding: 5px; border-radius: 12px; margin-bottom: 14px; }
  /* div·button 둘 다로 쓰인다 — button 의 UA 기본 배경을 지우고 탭 영역 44px 을 보장한다 */
  .tab { flex: 1; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; text-align: center; padding: 9px; border-radius: 9px; font-size: var(--fs-base); font-weight: 700; color: var(--sub); background: none; } .tab.on { background: #fff; color: var(--brand); box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .order-box { background: #2b2118; color: #f6f1ea; border-radius: 14px; padding: 16px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--fs-base); line-height: 1.7; white-space: pre-wrap; word-break: keep-all; }
  .bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: linear-gradient(to top, var(--bg) 70%, rgba(246,241,234,0)); padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); }
  .bottombar .inner { max-width: 480px; margin: 0 auto; display: flex; gap: 10px; } .bottombar .inner > * { flex: 1; min-width: 0; }
  /* scrim 은 항상 화면 전체를 덮고, 키보드가 가린 높이(--kb)만큼 패딩으로 시트를 밀어올린다.
     바닥을 계산으로 만들지 않으므로 측정이 어긋나도 딤 안 된 틈이 드러나지 않는다(최악이어도 시트가 조금 짧아질 뿐). */
  .scrim { position: fixed; inset: 0; box-sizing: border-box; padding-bottom: var(--kb, 0px); background: rgba(40,28,16,.45); z-index: 40; display: none; align-items: flex-end; } .scrim.show { display: flex; }
  .sheet { background: var(--bg); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 22px 22px 0 0; padding: 0 16px calc(20px + env(safe-area-inset-bottom)); max-height: min(88vh, var(--vvh, 88vh)); overflow-y: auto; }
  /* 검색이 있는 시트: 시트 자체는 스크롤 안 하고 목록만 스크롤 → 타이핑 중에도 검색창·결과·하단바가 항상 보임 */
  .sheet.split { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }
  .sheet.split .sheet-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .sheet-count { font-size: var(--fs-sm); font-weight: 700; color: var(--sub); padding: 2px 2px 0; }
  .sheet .grip { width: 44px; height: 5px; background: var(--line); border-radius: 99px; margin: 8px auto 14px; } .sheet h3 { margin: 4px 0 4px; font-size: var(--fs-title); }
  /* 하단 고정 액션 바 — 긴 옵션 목록에서도 스크롤 없이 주문/취소 가능. 푸터가 있는 시트는 하단 패딩 0으로 밀착 */
  .sheet.has-foot { padding-bottom: 0; }
  .sheet-foot { position: sticky; bottom: 0; z-index: 3; background: var(--bg); margin: 16px -16px 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); box-shadow: 0 -10px 22px -12px rgba(40,28,16,.22); }
  .ord-sum { font-size: var(--fs-md); font-weight: 700; color: var(--brand); text-align: center; margin: 0 0 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 메뉴 바꾸기 — 기본 접힘. 시트 열리면 온도·옵션이 바로 보이도록(카톡 등 짧은 화면 대응) */
  .menu-switch { margin: 8px 0 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .menu-switch > summary { list-style: none; cursor: pointer; padding: 11px 14px; font-size: var(--fs-base); font-weight: 700; color: var(--sub); display: flex; align-items: center; justify-content: space-between; }
  .menu-switch > summary::-webkit-details-marker { display: none; }
  .menu-switch > summary::after { content: "▾"; color: var(--sub); font-size: var(--fs-sm); transition: transform .15s; }
  .menu-switch[open] > summary::after { transform: rotate(180deg); }
  .menu-switch > .grid { padding: 2px 12px 12px; }
  /* 주문 옵션 영역만 간격 촘촘화(온도~메모) — 옵션 그룹이 많은 메뉴도 스크롤 덜 하고 한눈에 */
  .order-opts .label { margin: 10px 0 5px; }
  .order-opts .chips { gap: 6px; margin-top: 5px; }
  .order-opts .chip { padding: 7px 12px; }
  /* 열린 섬김 없음(idle) 화면 — 헤더/하단바 사이 여백에 붕 떠 보이지 않도록 세로 중앙 정렬 */
  .idle-wrap { min-height: calc(100vh - 260px); display: flex; flex-direction: column; justify-content: center; }
  /* 닫기·취소 버튼 — 붉은 계열로 통일해 직관적으로(파괴적 액션인 danger 버튼은 이미 붉음) */
  .btn-close { color: var(--red); border-color: #f0d4c8; }
  /* 44px 탭 영역을 확보하되 음수 마진으로 시각적 위치는 그대로 둔다(hit slop) */
  .sheet-x { background: none; border: none; font-size: 18px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 0; margin: -6px -10px -6px 0; flex: none; }
  .chip:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .cscrim { position: fixed; inset: 0; background: rgba(40,28,16,.5); z-index: 70; display: none; align-items: center; justify-content: center; padding: 26px; } .cscrim.show { display: flex; }
  .cdialog { background: var(--card); width: 100%; max-width: 320px; border-radius: 18px; padding: 22px 20px 16px; box-shadow: 0 20px 50px rgba(40,28,16,.3); }
  .cdialog .cmsg { font-size: var(--fs-lg); line-height: 1.65; color: var(--ink); white-space: pre-line; margin-bottom: 18px; }
  .cdialog .crow { display: flex; gap: 8px; } .cdialog .crow .btn { flex: 1; margin: 0; }
  /* 설정·뒤로가기·로그아웃 진입점. 글자는 13px 그대로 두고 탭 영역만 44px 로 넓힌다(음수 마진으로 줄높이 유지) */
  .nav-link { font-size: var(--fs-md); color: var(--sub); text-decoration: underline; cursor: pointer; background: none; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 6px; margin: -11px -6px; }
  .toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); background: #2b2118; color: #fff; padding: 11px 18px; border-radius: 20px; font-size: var(--fs-base); font-weight: 600; line-height: 1.45; z-index: 60; opacity: 0; transition: opacity .2s, bottom .2s; pointer-events: none; max-width: min(88%, 340px); text-align:center; } .toast.show { opacity: 1; bottom: 110px; }
  .row-between { display:flex; align-items:center; justify-content: space-between; gap: 10px; min-width:0; }
  .row-between > :first-child { min-width:0; }
  /* 동등한 액션 2개를 나란히 — .bottombar .inner 와 같은 규칙(flex:1 + min-width:0) */
  .row-2 { display:flex; gap:10px; } .row-2 > * { flex:1; min-width:0; }
  .inline-form { display:flex; gap:8px; min-width:0; }
  .inline-form > input { flex:1; min-width:0; }
  .header-actions { display:flex; gap:6px; align-items:center; flex-shrink:0; min-width:0; }
  .banner-warn { background:#fbecdf; border:1px solid #f0d9c2; color:#8a5a1f; border-radius:12px; padding:10px 14px; font-size:var(--fs-md); margin-bottom:14px; }
  .loading { text-align:center; padding:80px 20px; color:var(--sub); }
  .spinner { width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--brand); margin:0 auto 14px; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #offline { position:fixed; left:0; right:0; bottom:0; z-index:80; display:none; background:var(--red); color:#fff; text-align:center; font-size:var(--fs-md); font-weight:700; padding:9px 12px calc(9px + env(safe-area-inset-bottom)); }
  #offline.show { display:block; }
  .demo-badge { display:inline-block; background:var(--accent); color:var(--ink); font-size:var(--fs-xs); font-weight:800; padding:2px 8px; border-radius:999px; margin-left:6px; vertical-align:middle; }
  /* iPhone/Galaxy 공통 모바일 폭(320~440px): 글자·아이콘·버튼의 가로 밀림 방지 */
  @media (max-width: 440px) {
    #app { padding-left: 14px; padding-right: 14px; }
    header { padding-top: 12px; }
    .h-row { gap: 6px; }
    .h-row > :first-child { min-width: 0; overflow:hidden; }
    .h-row > :last-child { flex-shrink:0; }
    /* .room-name 17px 은 :root 의 --fs-title 램프가 대신한다 (R13-7) */
    .me-chip { max-width: 42vw; padding: 7px 9px; overflow: hidden; text-overflow: ellipsis; }
    .card { padding: 15px; }
    .person { gap: 8px; padding-left: 2px; padding-right: 2px; }
    .avatar { width: 34px; height: 34px; font-size: var(--fs-md); }
    .btn { min-width: 0; max-width:100%; gap: 5px; padding: 14px 10px; font-size: var(--fs-lg); line-height: 1.25; white-space: normal; overflow-wrap:anywhere; }
    .btn-sm { padding: 8px 10px; font-size: var(--fs-md); border-radius: 9px; }
    .bottombar { padding-left: 14px; padding-right: 14px; }
    .bottombar .inner { gap: 7px; }
    .sheet { padding-left: 14px; padding-right: 14px; }
    .sheet-foot { margin-left: -14px; margin-right: -14px; padding-left: 14px; padding-right: 14px; }
    /* .sheet h3 18px 도 --fs-title 램프가 대신한다 — 이 티어에서 17px 이 된다 (R13-7, R13-10) */
    .seg, .seg-temp, .row-between, .row-2 { gap: 6px; }
    .stats { gap: 5px; }
    .stat { padding-left: 5px; padding-right: 5px; }
    .tab { padding-left: 5px; padding-right: 5px; font-size: var(--fs-md); }
    .serving-actions { gap: 4px !important; flex-wrap: wrap; justify-content: flex-end; max-width: 132px; }
    .serving-actions .btn-sm { padding-left: 8px; padding-right: 8px; }
    .dash-card-head { align-items:flex-start; }
    .dash-card-head .pill { max-width:44%; text-align:center; }
    .menu-row > :first-child { flex:none; }
  }
  @media (max-width: 360px) {
    #app { padding-left: 12px; padding-right: 12px; }
    .card { padding: 13px; }
    .bottombar { padding-left: 12px; padding-right: 12px; }
    .sheet { padding-left: 12px; padding-right: 12px; }
    .sheet-foot { margin-left:-12px; margin-right:-12px; padding-left:12px; padding-right:12px; }
    .person { gap:6px; }
    .pill { padding-left:8px; padding-right:8px; }
    .inline-form { gap:6px; }
    .inline-form .btn-sm { padding-left:8px; padding-right:8px; }
    .serving-row { flex-wrap:wrap; }
    .serving-row > :first-child { flex-basis:calc(100% - 42px); }
    .serving-row .serving-actions { width:100%; max-width:none; justify-content:flex-end; }
  }
  @media (max-width: 330px) {
    /* .room-name 16px 도 --fs-title 램프가 대신한다 (R13-7) */
    .date { font-size:var(--fs-xs); }
    .btn { font-size:var(--fs-base); padding-left:8px; padding-right:8px; }
    .tab { font-size:var(--fs-sm); }
    .row-between.mobile-stack { align-items:stretch; flex-direction:column; }
    .row-between.mobile-stack > .btn { width:100%; }
  }
  /* 대시보드 */
  .usage-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:4px 0 2px; }
  .usage { display:inline-flex; gap:8px; align-items:flex-end; height:66px; min-width:100%; padding-bottom:2px; }
  .ubar { flex:0 0 auto; width:38px; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .ubar-n { font-size:var(--fs-xs); font-weight:800; color:var(--ink); line-height:1; }
  /* 막대는 한 색. 마감/진행중은 채움 vs 윤곽으로 구분한다(색만으로 상태를 나누지 않는다) */
  .ubar-b { width:24px; border-radius:5px 5px 0 0; overflow:hidden; display:flex; flex-direction:column-reverse; gap:2px; }
  .ubar-b > i { display:block; width:100%; box-sizing:border-box; }
  .ubar-b > i.cl { background:var(--data-1); }
  .ubar-b > i.op { background:transparent; border:2px solid var(--data-1); }
  .legend { display:flex; gap:11px; align-items:center; font-size:var(--fs-xs); color:var(--sub); font-weight:700; flex:none; }
  .legend i { width:11px; height:11px; border-radius:3px; display:inline-block; vertical-align:-1px; margin-right:4px; background:var(--data-1); }
  .legend i.open { background:transparent; border:2px solid var(--data-1); }
  /* ① 히어로 + KPI */
  .hero { text-align:center; padding:8px 0 2px; }
  .hero-n { font-size:46px; font-weight:900; letter-spacing:-2px; color:var(--ink); line-height:1.02; }
  .hero-l { font-size:var(--fs-md); color:var(--sub); font-weight:700; margin-top:3px; }
  .hero-sub { font-size:var(--fs-sm); color:var(--sub); margin-top:3px; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:12px 0 10px; }
  .kpi { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:9px 4px; text-align:center; }
  .kpi .n { font-size:17px; font-weight:900; color:var(--ink); line-height:1.1; }
  .kpi .l { font-size:var(--fs-xs); color:var(--sub); font-weight:700; margin-top:2px; }
  /* 기간 프리셋 — 6개를 한 줄에 쭉. 좁은 화면에선 줄바꿈 대신 가로 스크롤(줄이 늘면 컨트롤 바가 화면을 먹는다).
     스크롤바는 숨기되 선택된 버튼은 렌더 후 JS 로 보이는 자리까지 당겨온다.
     320px 폰에서 여섯 개가 밀리지 않고 다 보여야 한다. 가용 폭은
       320 − #app 좌우 12×2 − .dash-ctl 좌우 14×2 = 268px
     이고(#app 패딩을 빼먹으면 292px 로 잘못 잡힌다), 한글 어드밴스가 1em 이므로 12px 기준
     글자 합계는 이번주 36 + 지난달 36 + 이번달 36 + 3개월 31 + 올해 24 + 작년 24 ≈ 187px 이다.
       361~440px: 187 + 패딩 7×2×6 84 + 간격 3×5 15 = 286  (가용 305)
       ~360px   : 187 + 패딩 5×2×6 60 + 간격 2×5 10 = 257  (가용 308 · 320px 에서 268)
     가로 스크롤과 scrollPresetIntoView() 는 지운 게 아니라 남겨둔 안전망이다 — 글자를 키운
     사용자(브라우저 글꼴 확대)나 앞으로 늘어날 라벨이 여기에 걸린다.
     탭 영역 높이는 .tab 본체의 min-height:44px 이 그대로 준다(WCAG 2.5.8 의 24px 을 넘는다). */
  .dash-filter { margin:0 0 10px; gap:3px; flex-wrap:nowrap; overflow-x:auto; overscroll-behavior-x:contain;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .dash-filter::-webkit-scrollbar { display:none; }
  /* 변경은 이 선택자 안으로만 한정한다 — .tab 은 메인 내비게이션과 공유하는 클래스라
     밖으로 새면 내비 탭까지 작아진다. 덤으로 330px 특이도 버그도 여기서 사라진다:
     예전엔 330px 티어의 .tab(특이도 0-1-0, 12px)이 .dash-filter .tab(0-2-0, 13px)에 져서
     프리셋 칩만 13px 로 남아 있었다. 이제 둘 다 --fs-sm 이라 그 버그가 성립하지 않는다. */
  .dash-filter .tab { flex:0 0 auto; padding:9px 7px; font-size:var(--fs-sm); white-space:nowrap; }
  @media (max-width:360px){
    .dash-filter { gap:2px; }
    .dash-filter .tab { padding-left:5px; padding-right:5px; }
  }
  .dash-ctl > .dash-filter:last-child { margin-bottom:0; }
  /* 컨트롤 바 — 달력 · 프리셋 · 통합 검색 */
  .dash-ctl { padding:12px 14px; margin-bottom:12px; }
  .dash-dates { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .dash-dates input[type=date] { flex:1; min-width:0; width:auto; padding:10px 10px; border:1.5px solid var(--line); border-radius:11px; font-size:var(--fs-lg); font-family:inherit; background:#fff; color:var(--ink); min-height:44px; -webkit-appearance:none; appearance:none; }
  .dash-warn { font-size:var(--fs-sm); line-height:1.55; color:var(--sub); background:#fbecdf; border-radius:10px; padding:8px 10px; margin:10px 0 0; }
  /* 셀 활용도 그리드 — 누르면 아래 상세가 바뀐다 */
  .cellgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .cellcard { text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:11px 12px; min-height:44px; cursor:pointer; transition:border-color .12s, background .12s; }
  .cellcard.on { border-color:var(--brand); background:var(--brand-soft); }
  .cc-top { display:flex; align-items:center; gap:6px; min-width:0; }
  .cc-rank { flex:none; font-size:var(--fs-xs); font-weight:800; color:#fff; background:var(--brand); border-radius:99px; min-width:17px; height:17px; display:inline-flex; align-items:center; justify-content:center; padding:0 4px; }
  .cc-name { font-size:var(--fs-md); font-weight:700; color:var(--ink); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cc-n { font-size:23px; font-weight:900; letter-spacing:-1px; color:var(--ink); line-height:1.1; margin-top:5px; }
  .cc-n span { font-size:var(--fs-sm); font-weight:700; color:var(--sub); margin-left:2px; letter-spacing:0; }
  .cc-spark { display:flex; align-items:flex-end; gap:2px; height:16px; margin:6px 0 4px; }
  .cc-spark i { flex:1; min-width:2px; background:var(--data-1); border-radius:2px 2px 0 0; }
  .cc-none { font-size:var(--fs-xs); color:var(--sub); }
  .cc-meta { font-size:var(--fs-xs); color:var(--sub); font-weight:700; }
  /* ③ 사람별 참여 — 세로 목록이라 가로 스크롤이 없다 */
  .prow { padding:8px 2px; border-top:1px solid var(--line); }
  .prow-n { font-weight:700; font-size:var(--fs-md); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meter { height:7px; border-radius:99px; background:var(--brand-soft); overflow:hidden; }
  .meter > i { display:block; height:100%; background:var(--data-1); border-radius:99px; }
  /* ④ 메뉴 Top — 가로 막대 */
  .hbar { padding:6px 0 2px; }
  .hbar-name { font-size:var(--fs-md); font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hbar-n { font-size:var(--fs-sm); font-weight:700; color:var(--sub); flex:none; }
  .hbar-track { height:8px; border-radius:99px; background:var(--brand-soft); margin-top:4px; }
  .hbar-track > i { display:block; height:100%; background:var(--data-1); border-radius:99px; }
  /* title= 은 모바일에서 안 뜬다. 탭·호버 모두 되는 툴팁 하나를 문서에 띄운다 */
  .tip { position:fixed; z-index:80; background:#2b2118; color:#fff; font-size:var(--fs-sm); font-weight:600; line-height:1.45; padding:7px 10px; border-radius:9px; max-width:min(78vw,270px); pointer-events:none; opacity:0; transition:opacity .12s; box-shadow:0 6px 18px rgba(40,28,16,.28); }
  .tip.show { opacity:1; }
  .ubar-d { font-size:var(--fs-xs); color:var(--sub); line-height:1.2; text-align:center; white-space:nowrap; }
  .ubar-d .wk { color:var(--sub); }
  .mx-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table.mx { border-collapse:collapse; font-size:var(--fs-sm); }
  table.mx th, table.mx td { padding:5px 3px; text-align:center; white-space:nowrap; }
  table.mx th.mx-date { font-weight:700; color:var(--sub); font-size:var(--fs-xs); line-height:1.15; }
  table.mx th.mx-date .wk { color:var(--sub); }
  table.mx .mx-name { text-align:left; font-weight:700; color:var(--ink); padding-right:8px; position:sticky; left:0; background:var(--card); max-width:78px; overflow:hidden; text-overflow:ellipsis; }
  table.mx thead .mx-name, table.mx th.mx-sum { color:var(--sub); font-weight:700; font-size:var(--fs-xs); }
  table.mx .mx-cell { color:var(--line); font-size:var(--fs-md); min-width:22px; }
  table.mx .mx-cell.att { color:var(--brand); }
  table.mx .mx-cell.srv { color:var(--accent-ink); font-size:var(--fs-md); }
  table.mx td.mx-sum { font-weight:700; color:var(--ink); padding-left:8px; position:sticky; right:0; background:var(--card); }
  table.mx tr + tr td { border-top:1px solid var(--line); }
  /* ===================== 랜덤 게임 =====================
     센서(흔들기·기울이기)는 쓰지 않는다 — 카톡 인앱 브라우저에서 권한 프롬프트가 안 뜨는 사례가 많다.
     멀티터치는 touch-action:none 이 없으면 브라우저가 핀치 줌으로 먹는다(뷰포트 확대는 접근성상 열어둬야 하므로
     전역이 아니라 이 오버레이 안에서만 막는다). z-index 는 하단바(30)·시트(40) 위, 토스트(60)·확인창(70) 아래. */
  /* pan-y = 세로 스크롤만 허용하고 핀치 줌·더블탭 줌은 막는다. 손가락 룰렛은 진행 중에만 none 으로 더 조인다. */
  .game-ov { position:fixed; inset:0; z-index:55; display:none; flex-direction:column; background:var(--bg);
    touch-action:pan-y; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .game-ov.show { display:flex; }
  .game-head { flex:none; display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line);
    padding:calc(9px + env(safe-area-inset-top)) 16px 7px; }
  .game-title { font-size:16px; font-weight:800; letter-spacing:-.006em; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* 인원이 많거나 화면이 짧으면 결과 블록까지 합쳐 세로가 넘친다. justify-content:center 로 가운데 두면
     넘칠 때 위쪽이 잘려 못 보게 되므로, auto 마진 pseudo 로 '여유 있으면 가운데 · 넘치면 스크롤'을 만든다. */
  .game-body { flex:1 1 auto; min-height:0; position:relative; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:10px 16px; }
  .game-body::before, .game-body::after { content:""; flex:none; margin:auto; }
  /* 손가락 룰렛만은 흐름 내용을 위로 붙인다. .fp-mid 는 body 의 50% 에 절대 배치되는데,
     이 게임의 흐름 내용은 안내 한 줄뿐이라 위 auto 마진이 그걸 딱 50% 로 데려가 두 글자
     덩어리가 정확히 겹쳤다. 안내를 위에 고정하면 가운데는 카운트다운 몫으로 비워진다.
     당첨자를 지목해 teardown 이 돌면 이 클래스를 떼서 결과 블록은 다시 가운데로 온다. */
  .game-body.fp-live::before, .game-body.fp-live::after { margin:0; }
  .game-foot { flex:none; padding:8px 16px calc(12px + env(safe-area-inset-bottom)); }
  .game-foot > * + * { margin-top:8px; }
  .game-say { position:relative; z-index:1; font-size:var(--fs-lg); font-weight:700; text-align:center; color:var(--sub); margin:0 0 10px; pointer-events:none; }
  .game-hint { font-size:var(--fs-md); color:var(--sub); text-align:center; font-weight:600; }
  /* 사다리·돌림판은 세로가 긴 화면에서 잘리지 않도록 뷰포트 높이로도 폭을 묶는다 */
  .game-stage { width:100%; max-width:min(400px, 50vh); }
  .game-stage svg { display:block; width:100%; height:auto; }
  /* 번호–색–이름 범례 (R9-5, R10-2). 11명을 넘으면 사다리·돌림판 라벨이 번호로 바뀌므로,
     번호와 사람을 잇는 표가 같은 화면에 없으면 그림을 읽을 방법이 사라진다.
     한 줄에 한 명씩 두면 24명이 500px 을 넘어 결과 블록을 화면 밖으로 밀어낸다 — 칩을 흘려 담아
     폭을 다 쓰게 하면 340px 화면에서 6줄 남짓으로 접힌다. 자리는 .game-body 안이라 SVG·결과와
     같은 스크롤에 실린다(바깥에 두면 세로가 넘칠 때 잘려서 안 보인다).
     max-width 는 .game-stage 와 같은 400px 로 맞춰 그림 폭에서 벗어나지 않게 한다. 다만 50vh
     상한은 두지 않는다 — 창이 낮을 때 폭까지 좁아지면 줄 수만 늘어난다. */
  .game-legend { display:flex; flex-wrap:wrap; justify-content:center; gap:4px 6px; width:100%; max-width:400px; margin-top:10px; }
  /* 11px 은 아래 줄 수 예산에 묶인 값이다 (R13-4). n>10 이면 이 칩이 이름을 읽을 수 있는
     유일한 자리인데도 이 파일에서 가장 작은 글자라는 건 진짜 절충이지 실수가 아니다 —
     12px 로 올리면 24명 범례가 7~8줄이 되어 결과 블록을 화면 밖으로 민다.
     실기기에서 24명 줄 수와 11px 한글 가독성을 재기 전에는 크기를 올리지 않는다. 대신 줄 수·폭에
     영향이 없는 굵기(700→800)만 올려 획을 굵힌다. 미측정 사실을 여기 남겨 둔다. */
  .game-legend .gl-it { display:inline-flex; align-items:center; gap:5px; min-width:0; max-width:100%;
    background:var(--card); border:1px solid var(--line); border-radius:9px; padding:3px 7px;
    font-size:11px; font-weight:800; color:var(--ink); line-height:1.35; }
  .game-legend .gl-sw { flex:none; width:9px; height:9px; border-radius:3px; }
  .game-legend .gl-no { flex:none; color:var(--sub); font-weight:800; font-variant-numeric:tabular-nums; }
  /* 긴 이름은 칩 안에서 접는다. 잘라내면 '잘린 이름을 온전히 읽는 자리'라는 범례의 존재 이유가 없어진다. */
  .game-legend .gl-nm { min-width:0; overflow-wrap:anywhere; }
  /* 게임 도중 명단이 바뀐 것을 알리는 배너 (R17-2). 자리는 #gvWin 안, 당첨자 블록 바로 위다 —
     결과와 같은 role="status" 에 실려 한 번에 읽히고, 스크롤도 결과와 함께 움직인다.
     실패(--red)가 아니라 주의라서 --accent 계열을 쓴다. 글자는 흰 배경 대비 2.92:1 인 --accent 가
     아니라 --accent-ink 로 — 배지가 아니라 읽어야 하는 문장이다. */
  .game-warn { max-width:340px; margin:6px auto 0; background:#fdf4e6; border:1px solid var(--accent);
    border-radius:12px; padding:8px 11px; font-size:var(--fs-md); font-weight:700; line-height:1.45;
    color:var(--accent-ink); text-align:center; word-break:keep-all; }
  .game-win { text-align:center; margin-top:12px; }
  .game-win .we { font-size:38px; line-height:1.15; }
  .game-win .wn { font-size:25px; font-weight:900; letter-spacing:-.6px; line-height:1.1; color:var(--brand); margin-top:2px; word-break:keep-all; }
  .game-win .ws { font-size:var(--fs-md); color:var(--sub); margin-top:5px; }
  .game-pick { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card);
    border:1.5px solid var(--line); border-radius:14px; padding:13px 14px; margin-bottom:8px; min-height:44px; transition:transform .05s ease; }
  .game-pick:active { transform:scale(.99); }
  .game-pick .gp-em { font-size:26px; flex:none; }
  .game-pick b { display:block; font-size:var(--fs-lg); color:var(--ink); }
  .game-pick small { display:block; font-size:var(--fs-sm); color:var(--sub); margin-top:1px; }
  /* 인원 상한을 넘어 막힌 게임 (R10-4). 눌리지 않는 것은 disabled 속성이 하고, 여기서는 '눌러도
     안 된다'를 보이게만 만든다 — 살아 있는 버튼과 똑같이 보이면 사용자는 자기 탭이 씹혔다고 읽는다.
     :active 의 scale 도 되돌린다(disabled 라 뜨지 않지만 규칙이 남아 있으면 나중에 되살아난다).
     opacity 는 버튼 전체를 한 겹으로 합성하므로 흰 카드(--card)도 시트 배경(--bg #f6f1ea)과 섞여
     #fbf9f6 이 된다. 그 위에서 팔레트 색을 그대로 .55 로 깔면 이름(--ink) 3.76:1 · 사유(--sub)
     2.38:1 로 AA(4.5:1)를 못 넘긴다. .gs-off 와 같은 처방으로 색을 미리 낮춰 #000 을 깔면
     합성 결과가 양쪽 다 4.93:1 이라 기준을 넘는다 — 크기·굵기 차이가 위계를 대신 맡는다. */
  .game-pick:disabled { opacity:.55; cursor:default; }
  .game-pick:disabled:active { transform:none; }
  .game-pick:disabled b, .game-pick:disabled small { color:#000; }
  /* 참가 토글 스위치 — 휴대폰 설정 앱에 있는 그 스위치다 (R1-1).
     상태의 출처는 aria-checked 하나뿐이고 색·손잡이 위치를 CSS 가 그 속성에서 파생시킨다.
     그래서 보이는 모양과 스크린리더가 읽는 값이 어긋날 수 없다 (R1-2, R1-5).
     켜짐/꺼짐을 트랙 색과 손잡이 위치 '둘'로 말한다 — 색만 바꾸면 색약 사용자가 못 읽는다 (R1-3).
     높이 44px = 보이는 32px + 위아래 padding 6px 로 탭 영역을 확보하고, 음수 margin 으로
     레이아웃 높이는 32px 로 되돌린다 — 행 높이를 밀지 않으면서 손가락 여유를 얻는다 (R1-4).
     가로는 트랙이 이미 52px 이라 44px 을 넘으므로 따로 넓히지 않는다.
     margin-left:auto 는 .pill 과 같은 처방 — 행 오른쪽 끝에 붙인다. */
  .gsw { position:relative; flex:none; width:52px; height:44px; padding:6px 0; margin:-6px 0 -6px auto;
    background:none; border:0; cursor:pointer; }
  .gsw-track { display:block; width:52px; height:32px; border-radius:16px; background:var(--gray); transition:background .18s ease; }
  /* 트랙 32 - 손잡이 26 = 6 → 위아래·좌우 여백 3px. 이동거리를 20px 로 두면 꺼짐 3px · 켜짐 23px
     (52-26-3=23)로 양쪽이 대칭이다. top:9px 은 padding(6)+3 — 절대배치 기준이 padding box 라서
     이 값이어야 트랙 안에서 가운데 온다.
     흰 손잡이는 꺼짐 트랙(--gray)과 대비가 2.30:1 밖에 안 되어 테두리 없이는 손잡이 위치가
     안 읽힌다. 반투명 어두운 테두리를 덧대 경계선 대비를 꺼짐 4.76:1 · 켜짐 6.43:1 로 올린다
     (비텍스트 대비 3:1 기준). 꺼짐 트랙 자체는 흰 카드 대비 2.30:1 이라 스위치 윤곽은 이 테두리가 맡는다. */
  .gsw-knob { position:absolute; left:3px; top:9px; width:26px; height:26px; border-radius:50%;
    background:#fff; border:1px solid rgba(40,28,16,.4); box-shadow:0 1px 3px rgba(40,28,16,.35);
    transition:transform .18s ease; }
  .gsw[aria-checked="true"] .gsw-track { background:var(--green); }
  .gsw[aria-checked="true"] .gsw-knob { transform:translateX(20px); }
  /* 브라우저 기본 링은 44px 박스에 그려져 보이는 스위치보다 크게 뜬다 — 트랙에 직접 링을 그린다.
     32px + outline-offset 2px + 2px = 40px 이라 44px 박스 안에 들어와 잘리지 않는다 (R1-6). */
  .gsw:focus-visible { outline:none; }
  .gsw:focus-visible .gsw-track { outline:2px solid var(--brand); outline-offset:2px; }
  /* prefers-reduced-motion 은 이 파일 맨 위 전역 블록이 모든 transition 을 이미 끈다 (R1-7).
     여기 같은 미디어쿼리를 또 두면 !important 인 전역 규칙에 밀려 죽은 CSS 가 되므로 두지 않는다. */
  /* 제외된 행 — 아바타 배경을 --sub 로 바꾸던 처방을 대신한다. 상태의 본 신호는 스위치가 말하므로
     아바타는 늘 --brand 로 두고, 이름·부제만 흐리게 해서 '지금 빠져 있다'를 한 번 더 얹는다.
     흐리게 하는 정도(.55)는 설계값 그대로지만 색은 함께 낮춘다 — 팔레트 색을 그대로 .55 로 깔면
     흰 카드(#fff) 위에서 이름(--ink)이 3.65:1, 부제(--sub)가 2.33:1 로 AA(4.5:1)를 못 넘긴다.
     특히 --sub 는 흰 카드 대비가 원래 5.92:1 이라 어떤 값으로 흐리게 해도(최대 .88) 기준을 못 지킨다.
     #000 을 .55 로 깔면 합성 결과가 #737373 이고 흰 카드 대비 4.76:1 이라 기준을 넘는다 (R1-9). */
  .person.gs-off .pname, .person.gs-off .pmenu { color:#000; opacity:.55; }
  /* 손가락 룰렛 */
  .fp-pad { position:absolute; inset:0; pointer-events:none; }
  .fp-dot { position:absolute; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 5px 16px rgba(40,28,16,.25);
    transition:opacity .3s ease, width .3s ease, height .3s ease; }
  .fp-dot.lose { opacity:.16; }
  .fp-dot.win { animation:fpwin .55s ease-out 3; }
  @keyframes fpwin { 0%,100% { box-shadow:0 5px 16px rgba(40,28,16,.25); } 50% { box-shadow:0 0 0 16px rgba(111,78,55,.2); } }
  .fp-mid { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; width:86%; }
  /* 가운데 문구·카운트다운은 74px 색 원들과 같은 공간을 쓴다. 반투명 판은 뒤에 무엇이 오느냐에
     따라 대비가 달라져 4.5:1 을 보장할 수 없으므로 불투명 판을 쓴다 — 그러면 글자 뒤 배경이
     항상 --card(#fff) 라서 --brand 7.36:1 · --sub 5.27:1 이 확정된다 (R5-2).
     대신 판이 손가락을 가리지 않도록 inline-block 으로 글자만큼만 차지하게 둔다 (R5-7) —
     .fp-mid 는 width:86% 라 그 자체에 배경을 주면 화면 가운데 띠가 생긴다.
     .fp-mid 가 아니라 그 '안쪽'에 두는 이유가 하나 더 있다: choose() 가 .fp-mid 를 비우면
     판도 함께 사라져 당첨 점을 가리지 않는다 (R5-9).
     transition 은 넣지 않는다 — 넣으면 맨 위 전역 reduced-motion 블록이 !important 로 끄게 되어
     규칙이 둘로 갈린다 (R5-8). */
  .fp-plate { display:inline-block; max-width:100%; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:8px 14px; box-shadow:0 4px 14px rgba(40,28,16,.18); }
  .fp-plate .fp-nums { font-size:var(--fs-md); font-weight:800; color:var(--ink); }
  .fp-plate .fp-why { font-size:var(--fs-md); font-weight:600; color:var(--sub); margin-top:2px; word-break:keep-all; }
  /* 컨테이너(.fp-mid)는 계속 통과시키고 이 버튼만 입력을 받는다 (R5-3) */
  .fp-plate .fp-go { pointer-events:auto; margin-top:9px; width:auto; padding:9px 16px; font-size:var(--fs-base);
    border-radius:10px; min-height:44px; background:var(--brand); color:#fff; font-weight:700; }
  .fp-cnt { font-size:62px; font-weight:900; color:var(--brand); letter-spacing:-3px; line-height:1; }
  /* 돌림판 */
  /* 라벨 역회전은 시간에 따라 변해야 한다 — 정지 상태에서 고정 0, 멈출 때 −spin 이어야
     당첨자가 기울기로 새지 않는다(근거는 wheelSpin 주석). 회전축은 판 중심이 아니라 글자
     자신이어야 하고(중심 기준으로 돌리면 라벨이 조각을 벗어나 역방향으로 궤도를 돈다),
     그래서 transform-box:fill-box 가 필요하다 — 기본값 view-box 는 축이 viewBox 좌상단이다.
     @supports 로 감싼 이유: 미지원 브라우저에서 이 규칙이 살아 있으면 축이 viewBox 좌상단이

     rotate(0) 으로 그려 두고(정지 상태에서 새는 것이 없다) 회전이 한창일 때 최종 역회전을
     한 번에 넣는다. 자세한 근거는 playWheel 의 폴백 주석에 있다. */
  @supports (transform-box: fill-box) {
    .wlab { transform-box:fill-box; transform-origin:center; transform:rotate(0deg); }
  }
  .wheel-wrap { position:relative; width:100%; max-width:min(320px, 50vh); margin:0 auto; padding-top:14px; }
  .wheel-pin { position:absolute; left:50%; top:-2px; transform:translateX(-50%); font-size:26px; line-height:1; z-index:1; filter:drop-shadow(0 2px 3px rgba(40,28,16,.3)); }

     width/height 속성 비율이 남아 있으므로 height:auto 로 세로가 따라온다(폰에서 흐릿하지 않게 하는 표준 처방).
     세로 상한은 설계(부록 A.5)의 62vh 대신 45vh 다. 340:440 = 1:1.29 라서 62vh 를 그대로 쓰면 캔버스
     높이가 80vh 가 되어 게임 안내 한 줄·HUD·결과 블록이 전부 스크롤 밖으로 밀린다. 45vh 면 높이가
     ≈58vh 로 사다리(50vh × 1:1.09 ≈ 54vh)와 같은 대역에 들어온다. */
  .race-wrap { position:relative; width:100%; max-width:min(340px, 45vh); margin:0 auto; }
  .race-wrap canvas { display:block; width:100%; height:auto; border-radius:12px;
                      background:#fffdf9; border:1.5px solid var(--line); }
  .race-hud { margin-top:8px; font-size:var(--fs-sm); color:var(--sub); font-weight:600; line-height:1.5; }
  .race-hud .bar { height:6px; border-radius:3px; background:var(--brand-soft); overflow:hidden; margin-bottom:6px; }
  /* 200ms 마다만 갱신하므로 그 간격만큼 선형 보간을 걸어 바가 계단처럼 튀지 않게 한다.
     prefers-reduced-motion 은 이 파일 맨 위 전역 블록이 모든 transition 을 끄므로 여기 미디어쿼리를 또 두지 않는다. */
  .race-hud .bar > i { display:block; width:0; height:100%; border-radius:3px; background:var(--brand); transition:width .2s linear; }
  .race-hud .rc-row { display:flex; align-items:center; gap:6px; min-width:0; }
  .race-hud .rc-rk { flex:none; width:13px; font-weight:800; color:var(--sub); font-variant-numeric:tabular-nums; }
  .race-hud .rc-sw { flex:none; width:9px; height:9px; border-radius:3px; }
  .race-hud .rc-no { flex:none; font-weight:800; color:var(--sub); font-variant-numeric:tabular-nums; }
  /* 이름은 한 줄로 자른다 — HUD 가 200ms 마다 바뀌는 자리라 줄 수가 늘었다 줄면 캔버스가 위아래로 흔들린다.
     전체 이름은 범례(11명 이상)와 결과 발표에 그대로 남는다. */
  .race-hud .rc-nm { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:var(--ink); font-weight:700; }
</style>

  MEMBERS = CELL.members.map(m=>({id:m.id,name:m.name})).sort((a,b)=>a.name.localeCompare(b.name,"ko")); }
const CAT_ORDER=["coffee","coldbrew","latte","tealatte","tea","icedtea","ade","fruitlatte","blended","handdrip","dessert","extra"];
const CAT_LABEL={coffee:"커피 · 에스프레소",coldbrew:"콜드브루",latte:"라떼",tealatte:"티 라떼",tea:"티 (차)",icedtea:"아이스티",ade:"에이드",fruitlatte:"과일 라떼",blended:"블렌디드 (스무디 · 쉐이크)",handdrip:"핸드드립",dessert:"아이스크림 · 요거트",extra:"기타"};

// 카페 메뉴 로드 — DB(cafe_menus) 전체. 테이블 없거나 로컬이면 빈 배열(→코드 폴백)
async function loadCafeMenus(cafeId){
  if(!SHARED) return [];
  if(CAFEMENU_CACHE[cafeId]) return CAFEMENU_CACHE[cafeId];
  try{ const {data,error}=await Sync.client.from("cafe_menus").select("*").eq("cafe_id",cafeId).limit(500); if(error) throw error;

    const codeCafe=CAFES[cafeId], codeById={}; (codeCafe&&codeCafe.menus||[]).forEach(m=>{ codeById[m.id]=m; });
    CAFEMENU_CACHE[cafeId]=(data||[]).map(r=>{ const cm=codeById[r.menu_id]||{};

        optionGroups:cm.optionGroups, decaf:cm.decaf}; });

// 주문 이력 집계 (셀 단위): #1 개인화 정렬용 H_byMemberId, #2 구성원 선호 메뉴용 H_topName
let HIST_ROOM="", H_byMemberId={}, H_topName={};
async function loadHist(){
  if(!SHARED){ H_byMemberId={}; H_topName={}; HIST_ROOM=ROOM; return; }
  if(HIST_ROOM===ROOM) return;
  try{
    // 오늘(KST) 주문은 제외 — 마감 후 익일이 되면 그날 주문이 +1로 반영됨(찍기만 해선 안 오름)
    // room_id를 아는 사람만 읽는 RPC. 실패 시 직접 SELECT로 우회하지 않는다.
    const { data, error } = await Sync.client.rpc("get_room_history",{p_room:ROOM,p_today:todayKey()});
    if(error) throw error;
    const byId={}, byName={};
    (data||[]).forEach(r=>{ const mid=r.member_id; if(!mid) return;
      if(r.menu_id){ byId[mid]=byId[mid]||{}; byId[mid][r.menu_id]=(byId[mid][r.menu_id]||0)+1; }
      const nm=r.menu_name||r.menu_id; if(nm){ byName[mid]=byName[mid]||{}; byName[mid][nm]=(byName[mid][nm]||0)+1; }
    });
    H_byMemberId=byId; H_topName={};
    // 최애 top-2: 빈도 desc 정렬(Array.sort는 stable이라 동률은 기존과 동일하게 먼저 나온 메뉴가 앞섬)
    Object.keys(byName).forEach(mid=>{ const o=byName[mid];
      const ranked=Object.keys(o).map(k=>({name:k,count:o[k]})).sort((a,b)=>b.count-a.count);
      H_topName[mid]={first:ranked[0]||null, second:ranked[1]||null}; });
    HIST_ROOM=ROOM;
  }catch(e){ console.warn("hist fail",e); }
}
// #1: 내가 자주 주문한 메뉴 먼저(빈도 desc) → popular → 상위 10. 이력 없으면 popular 폴백

  return MENUS.map(m=>({m, f:freq[m.id]||0, p:m.popular?1:0}))

}

function memberById(id){ return MEMBERS.find(m=>m.id===id); }

function memObjs(arr){ return (arr||[]).map(m => (m && typeof m==="object") ? {id:m.id, name:m.name} : {id:m, name:m}); }
// 동시편집 충돌 감지용: 배열 순서와 무관하게 {id,이름} 집합만 비교(정렬/입력순 차이로 인한 오탐 방지)

// 사용자가 추가한 메뉴(주문에 담긴 menuName 기준)를 모아 그리드에 노출
function customMenusFromOrders(){

function bumpFreq(menuId){ /* 오늘 주문은 횟수에 즉시 반영하지 않음 — 마감 후 익일에 loadHist로 +1 */ }
function tileHtml(m, selId){ const c=myMenuCount(m.id);
  return `<div class="menu-tile ${m.id===selId?'sel':''}" data-id="${esc(m.id)}" role="button" tabindex="0" aria-pressed="${m.id===selId}"><span class="ck">✓</span><span class="em">${esc(m.emoji)}</span>${esc(m.name)}${c?`<span class="cnt">총 ${c}회 주문</span>`:''}</div>`; }

let ME = null; // 셀별 스코프 — enterCell()에서 loadMe()로 채움

// 이름 뒤 존칭 '님' — 이미 '님'으로 끝나는 이름(목사님·전도사님·권사님·집사님 등)엔 중복해서 붙이지 않음.
// hon(): 존칭형 이름 전체("홍길동"→"홍길동님", "김목사님"→"김목사님"). nimSfx(): 하이라이트 뒤에 붙일 접미사("님" 또는 "").
function hon(name){ const n=(name==null?"":String(name)); return /님\s*$/.test(n) ? n : n+"님"; }

// 항상 한국시간(KST) 기준 — 기기 타임존/자정 경계로 세션이 갈라지는 문제 방지
function todayKey(){ return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }
function prettyDate(){ const o={}; new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",weekday:"short"}).formatToParts(new Date()).forEach(p=>o[p.type]=p.value); return `${o.month}월 ${o.day}일 (${o.weekday})`; }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function initials(n){ return n?n.slice(0,2):"?"; }

/* ===================== 동기화 레이어 ===================== */
// 공유 설정 (CONFIG 또는 localStorage 우선)
const sbUrl = localStorage.getItem("sb_url") || CONFIG.SUPABASE_URL;
const sbKey = localStorage.getItem("sb_key") || CONFIG.SUPABASE_ANON_KEY;
const SHARED = !!(sbUrl && sbKey && window.supabase);
// ROOM은 위에서 let으로 선언됨 (현재 셀의 roomId). 부팅 시 enterCell에서 설정.

// 공통 상태 (오늘 세션 + 주문)
let SESSION = { state:"idle", hostId:null, closeAt:null, cafeId:null };  // '현재 보고 있는 섬김'의 뷰
let ORDERS = {}; // memberId -> {type, menuId, temp, extras, note}  (현재 섬김의 주문)
let onChange = ()=>{};

// 다중 섬김(하루 N번, 순차): SERVINGS=오늘의 섬김 배열, activeSeq=열린 섬김, viewSeq=보고 있는 섬김(null=활성/개요)
let SERVINGS = [];      // [{seq,state,hostId,cafeId,closeAt, orders:{memberId:{...}}}]
let activeSeq = null;
let viewSeq = null;

const emptySession = ()=>({ state:"idle", hostId:null, closeAt:null, cafeId:null, seq:null });

function ordersObj(arr){ const o={}; (arr||[]).forEach(r=>{ o[r.member_id]={type:r.type,menuId:r.menu_id,menuName:r.menu_name||"",temp:r.temp,extras:r.extras||[],note:r.note||""}; }); return o; }
function servingsFromDB(arr){ return (arr||[]).map(s=>({seq:s.seq, state:s.state, hostId:s.host_id, cafeId:s.cafe_id||null, closeAt:s.close_at, orders:ordersObj(s.orders)})); }
function projectServing(seq){
  const s = SERVINGS.find(x=>x.seq===seq);
  if(s){ SESSION={state:s.state, hostId:s.hostId, closeAt:s.closeAt, cafeId:s.cafeId, seq:s.seq}; ORDERS=s.orders||{}; }
  else { SESSION=emptySession(); ORDERS={}; }
  applyCafeGlobals();
}
// 섬김 배열을 반영하고 SESSION/ORDERS를 활성(또는 보고 있는) 섬김으로 투영
function setServings(list){
  SERVINGS = list || [];
  const open = SERVINGS.find(x=>x.state==="open");
  activeSeq = open ? open.seq : null;
  if(viewSeq!=null && !SERVINGS.some(x=>x.seq===viewSeq)) viewSeq=null;  // 사라진 섬김 보기 정리
  projectServing(viewSeq!=null ? viewSeq : activeSeq);
}
function servingLabel(seq){ return seq ? (seq + "번째 섬김") : ""; }
function servingDrinks(s){ let n=0; const o=s&&s.orders||{}; for(const k in o){ if(o[k].type==="drink") n++; } return n; }

/* ---- 단독(로컬) 모드 ---- */
const LocalSync = () => {
  const key = ()=> `coffee_local_${ROOM}_${todayKey()}`;
  function read(){ try{ const r=localStorage.getItem(key()); if(r){ const d=JSON.parse(r); if(Array.isArray(d.servings)) return d; } }catch(e){} return {servings:[]}; }
  function write(d){ localStorage.setItem(key(), JSON.stringify(d)); apply(d); }
  function apply(d){ setServings((d.servings||[]).map(s=>({seq:s.seq,state:s.state,hostId:s.hostId,cafeId:s.cafeId||null,closeAt:s.closeAt,orders:s.orders||{}}))); }
  const nextSeq = d => d.servings.reduce((m,s)=>Math.max(m,s.seq),0)+1;
  return {
    shared:false,
    async init(cb){ onChange=cb;
      window.addEventListener("storage", e=>{ if(e.key===key()){ apply(read()); onChange(); }}); },
    async reload(){ apply(read()); },
    async resubscribe(){ apply(read()); },
    pause(){},
    async startServing(me,cafeId){ const d=read(); if(d.servings.some(s=>s.state==="open")){ apply(d); return 0; } const ns=nextSeq(d); d.servings.push({seq:ns,state:"open",hostId:me,cafeId:cafeId||null,closeAt:null,orders:{}}); write(d); return ns; },
    async claim(me,cafeId){ const d=read(); const o=d.servings.find(s=>s.state==="open"); if(o){ if(o.hostId){ apply(d); return false; } o.hostId=me; if(!o.cafeId) o.cafeId=cafeId||null; write(d); return true; } const ns=nextSeq(d); d.servings.push({seq:ns,state:"open",hostId:me,cafeId:cafeId||null,closeAt:null,orders:{}}); write(d); return true; },
    async unclaim(seq){ const d=read(); const s=d.servings.find(x=>x.seq===seq); if(!s){ apply(d); return; } if(!s.orders||!Object.keys(s.orders).length){ d.servings=d.servings.filter(x=>x.seq!==seq); } else { s.hostId=null; } write(d); }, // 빈 섬김 삭제/주문 있으면 인계
    async close(seq){ const d=read(); const s=d.servings.find(x=>x.seq===seq); if(s){ s.state="closed"; s.closeAt=Date.now(); } write(d); },
    async reopen(seq){ const d=read(); if(d.servings.some(s=>s.state==="open"&&s.seq!==seq)){ apply(d); throw new Error("다른 섬김이 열려 있어요"); } const s=d.servings.find(x=>x.seq===seq); if(s){ s.state="open"; s.closeAt=null; } write(d); },
    async setOrder(me,o,seq){ const d=read(); const s=d.servings.find(x=>x.seq===seq)||d.servings.find(x=>x.state==="open"); if(!s){ apply(d); return; } s.orders=s.orders||{}; s.orders[me]=o; write(d); },
    async removeOrder(me,seq){ const d=read(); const s=d.servings.find(x=>x.seq===seq)||d.servings.find(x=>x.state==="open"); if(s&&s.orders){ delete s.orders[me]; } write(d); },
  };
};

/* ---- Supabase(공유) 모드 ---- */
const SupabaseSync = () => {
  const client = window.supabase.createClient(sbUrl, sbKey);
  const date = ()=> todayKey();
  function nowIso(){ return new Date().toISOString(); }
  // 엄격 모드: anon 직접 SELECT 차단 → 폴링으로 갱신(실시간 미사용)
  let pollTimer=null;
  function startPolling(){ stopPolling(); pollTimer=setInterval(async()=>{ if(document.hidden) return; try{ await reload(); onChange(); }catch(e){} }, 10000); }
  function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
  async function reload(){
    // 하루 전체 섬김을 1회 조회(열거 불가 RPC). get_day 없으면 옛 get_room_day로 폴백(단일 섬김).
    const { data, error } = await client.rpc("get_day",{p_room:ROOM,p_date:date()});
    if(error){
      if(error.code==="PGRST202"){
        const r = await client.rpc("get_room_day",{p_room:ROOM,p_date:date()}); if(r.error) throw r.error;
        const s=r.data&&r.data.session;
        setServings(s ? [{seq:s.seq||1, state:s.state, hostId:s.host_id, cafeId:s.cafe_id||null, closeAt:s.close_at, orders:ordersObj(r.data.orders)}] : []);
        return;
      }
      throw error;
    }
    setServings(servingsFromDB(data&&data.servings));
  }
  return {
    shared:true, client,
    async init(cb){ onChange=cb; },           // 첫 reload/폴링은 enterCell에서
    reload,
    async resubscribe(){ await reload(); startPolling(); },
    pause(){ stopPolling(); },
    async startServing(me,cafeId){   // 새 섬김 시작 → 새 seq 반환(0=이미 열린 섬김 있음)
      const { data, error } = await client.rpc("start_serving",{p_room:ROOM,p_date:date(),p_me:me,p_cafe:cafeId||null});
      if(error) throw error; await reload(); return data|0;
    },
    async claim(me,cafeId){          // 열린(호스트 없는) 섬김 인계
      const { data, error } = await client.rpc("claim_host",{p_room:ROOM,p_date:date(),p_me:me,p_cafe:cafeId||null});
      if(error) throw error; await reload(); return !!data;
    },
    async unclaim(seq){ const {error}=await client.rpc("unclaim_serving",{p_room:ROOM,p_date:date(),p_seq:seq}); if(error) throw error; await reload(); },
    async close(seq){ const {error}=await client.rpc("set_serving_state",{p_room:ROOM,p_date:date(),p_seq:seq,p_state:"closed"}); if(error) throw error; await reload(); },

// 이는 불리언 시절 true 가 남던 것과 같은 노출이고 카운터가 더 나쁘게 만들지 않는다.

let confirmOpen=false, ignorePop=0, confirmResolve=null;

  return new Promise(resolve=>{

      </div></div>`;
    $cscrim.classList.add("show"); confirmOpen=true;
    try{ history.pushState({c:1},""); }catch(e){}

  });

function finishConfirm(result){ // 버튼으로 닫기: 히스토리 항목 소비(ignorePop)
  if(!confirmOpen) return; confirmOpen=false; $cscrim.classList.remove("show");
  const r=confirmResolve; confirmResolve=null;
  // 증감은 짝을 맞춘다: back() 이 던지면 곧바로 되돌려 카운터가 사용자의 실제 뒤로가기를 삼키지 않게 한다.
  ignorePop++; try{ history.back(); }catch(e){ ignorePop--; }

// 모바일 키보드가 가린 높이를 --kb 로, 실제 보이는 높이를 --vvh 로 노출한다.

//   Android(키보드가 레이아웃 뷰포트까지 줄임) → innerHeight 도 같이 줄어 --kb=0, inset:0 이 이미 정답
//   iOS(레이아웃 뷰포트는 그대로)              → --kb 가 곧 키보드 높이, 그만큼 시트를 밀어올림
(function syncViewport(){
  const vv=window.visualViewport; if(!vv) return;
  // ?vvdebug — 실기기에서 추측 말고 숫자를 보고 판단하려고 붙인 계측 표시줄
  const dbg = /[?&]vvdebug/.test(location.search) ? document.createElement("div") : null;
  let probe=null;
  if(dbg){ dbg.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:99;background:#2b2118;color:#fff;font:11px/1.5 ui-monospace,monospace;padding:4px 8px;text-align:center;pointer-events:none";
    probe=document.createElement("div"); probe.style.cssText="position:fixed;bottom:0;width:0;visibility:hidden;pointer-events:none;height:env(safe-area-inset-bottom,0px)"; }
  const apply=()=>{ const r=document.documentElement.style;
    const kb=Math.max(0, Math.round(window.innerHeight-(vv.height+vv.offsetTop)));
    r.setProperty("--vvh", Math.round(vv.height)+"px");
    r.setProperty("--kb", kb+"px");
    if(dbg){ if(!dbg.parentNode && document.body){ document.body.appendChild(probe); document.body.appendChild(dbg); }
      dbg.textContent=`inner ${window.innerHeight} · vv ${Math.round(vv.height)} · top ${Math.round(vv.offsetTop)} · kb ${kb} · sab ${probe?probe.offsetHeight:0} · ${APP_VERSION}`; } };
  // 삼성·구글 키보드는 자동완성/추천 줄이 뒤늦게 붙어 키보드가 더 높아진다. 한 번만 재면
  // 그 증가분이 시트와 키보드 사이 틈으로 남으므로, 이벤트 후 잠깐 동안 다시 잰다.
  const settle=()=>{ apply(); [60,160,320,600].forEach(ms=>setTimeout(apply,ms)); };
  vv.addEventListener("resize", settle); vv.addEventListener("scroll", apply);
  document.addEventListener("focusin", settle); document.addEventListener("focusout", settle);
  window.addEventListener("orientationchange", ()=>setTimeout(settle,250));
  settle();
})();

  // 다음 뒤로가기가 앱을 나간다. 확인창 처리보다는 뒤에 둬야 오버레이 위 확인창이 먼저 취소된다.
