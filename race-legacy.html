<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>구슬 레이스 — v9.97 백업</title>
<style>
  :root{--bg:#f6f1ea;--card:#fff;--ink:#2b2118;--sub:#6f6253;--line:#e7ddcf;--brand:#6f4e37;
    --brand-soft:#efe6da;--accent:#c98a3a;--green:#3f9d6b;--red:#c2552f;--gray:#b6a99a;
    --accent-ink:#96631f;--fs-xs:11px;--fs-sm:12px;--fs-md:13px;--fs-base:14px;--fs-lg:15px;--fs-input:16px;--fs-title:18px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif}
  .wrap{max-width:480px;margin:0 auto;padding:14px 16px 40px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;
    border-radius:14px;font-size:var(--fs-input);font-weight:700;border:none;cursor:pointer}
  .btn-brand{background:var(--brand);color:#fff}
  .btn-soft{background:var(--brand-soft);color:var(--brand);border:1px solid var(--line)}
  .btn-ghost{background:transparent;color:var(--sub);border:1px solid var(--line)}
  .row-2{display:flex;gap:10px}.row-2>*{flex:1;min-width:0}
  .game-say{font-size:var(--fs-lg);font-weight:700;text-align:center;color:var(--sub);margin:0 0 10px}
  .game-hint{font-size:var(--fs-md);color:var(--sub);text-align:center;font-weight:600}
  .game-win{text-align:center;margin-top:12px}
  .game-win .we{font-size:38px;line-height:1.15}
  .game-win .wn{font-size:25px;font-weight:900;letter-spacing:-.6px;line-height:1.1;color:var(--brand)}
  .game-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 6px;width:100%;max-width:400px;margin:10px auto 0}
  .game-legend .gl-it{display:inline-flex;align-items:center;gap:5px;background:var(--card);
    border:1px solid var(--line);border-radius:9px;padding:3px 7px;font-size:11px;font-weight:800}
  .game-legend .gl-sw{flex:none;width:9px;height:9px;border-radius:3px}
  .game-legend .gl-no{flex:none;color:var(--sub);font-weight:800}
  .race-wrap{position:relative;width:100%;max-width:min(340px,45vh);margin:0 auto}
  .race-wrap canvas{display:block;width:100%;height:auto;border-radius:12px;background:#fffdf9;border:1.5px solid var(--line)}
  .race-hud{margin-top:8px;font-size:var(--fs-sm);color:var(--sub);font-weight:600;line-height:1.5}
  .race-hud .bar{height:6px;border-radius:3px;background:var(--brand-soft);overflow:hidden;margin-bottom:6px}
  .race-hud .bar>i{display:block;width:0;height:100%;border-radius:3px;background:var(--brand);transition:width .2s linear}
  .race-hud .rc-row{display:flex;align-items:center;gap:6px;min-width:0}
  .race-hud .rc-rk{flex:none;width:13px;font-weight:800;color:var(--sub)}
  .race-hud .rc-sw{flex:none;width:9px;height:9px;border-radius:3px}
  .race-hud .rc-no{flex:none;font-weight:800;color:var(--sub)}
  .race-hud .rc-nm{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink);font-weight:700}
</style></head><body>
<div class="wrap">
  <h2 style="margin:0 0 4px;font-size:var(--fs-title)">구슬 레이스 <span style="font-size:var(--fs-sm);color:var(--sub);font-weight:600">v9.97 백업</span></h2>
  <p class="game-hint" style="text-align:left;margin:0 0 14px">
    index.html 의 레이스만 떼어낸 사본입니다. 앱에서 링크하지 않으며, 새 구현과 나란히 비교하려고 남겨 둡니다.</p>
  <div id="setup">
    <label style="display:block;font-size:var(--fs-md);color:var(--sub);font-weight:700;margin-bottom:6px">
      인원 <input id="cnt" type="number" min="2" max="24" value="8" style="width:70px;padding:8px;border:1.5px solid var(--line);border-radius:10px;font-size:var(--fs-input)"></label>
    <button class="btn btn-brand" id="go">레이스 만들기</button>
  </div>
  <div id="stage"></div>
  <div id="foot" style="margin-top:10px"></div>
</div>
<script>
const GS_SOFT_W = 1/3;              // 직전 섬긴 분의 확률 낮추기 강도. 0 이 아니라야 '평등하지 않을 뿐'이 된다
const GAME_LABEL_MAX = 10;          // 이보다 많으면 이름이 겹치므로 번호 + 범례로 바꾼다
const GAME_MAX = { ladder:16, wheel:24, finger:Infinity, race:24 };   // 화면에 들어가는 인원 한계
const GAME_COLORS = ["#7a4a12","#1f6b3a","#2a5f8f","#97371c","#5b4080","#14615c","#8f2f2c","#35435c","#6b5220","#4a6b1f"];

function gameFits(kind, n){ return n <= GAME_MAX[kind]; }

// 10명 이하는 지금 보이는 색 그대로 두고, 넘을 때만 골든앵글로 생성해 인접 인덱스끼리
// 색상차를 최대로 벌린다 — 돌림판에서 이웃 조각이 같은 색이 되는 걸 막는 게 목적이다.
// l 34% 는 기존 팔레트와 같은 명도대라서 흰 구분선·#e7ddcf 배경 위에서 그대로 식별된다.
// n 을 안 넘기면 예전처럼 팔레트를 순환한다 — 손가락 룰렛은 참가자 수와 무관한 손가락 순번으로
// 부르기 때문에 이 경로가 필요하다. 사다리·돌림판은 반드시 n 을 넘긴다.
function gcolor(i, n){
  if(n === undefined || n <= GAME_COLORS.length) return GAME_COLORS[i % GAME_COLORS.length];
  return "hsl(" + ((i*137.508) % 360).toFixed(1) + " 52% 34%)";
}

// 난수를 인자로 받는다 — 그래야 확률이 의도한 비율로 수렴하는지 결정론적으로 검증할 수 있다
function pickWeighted(players, w, rnd){
  const total = w.reduce((a,b)=>a+b, 0);
  let r = (rnd||Math.random)() * total;
  for(let i=0;i<players.length;i++){ r -= w[i]; if(r < 0) return players[i]; }
  return players[players.length-1];        // 부동소수 잔차 방어 — undefined 를 돌려주면 안 된다
}

// 명단 판단의 순수 버전. '안 마심'만 되돌릴 수 없는 제외이고, 그 위에 사용자의 명시적 선택이 얹힌다 —
// 주문이 실시간으로 바뀌어도 사용자가 직접 켜고 끈 것이 살아남아야 한다.
function rosterFrom(members, orders, on, off){
  return members.filter(m=>{
    const o = orders[m.id];
    if(o && o.type==="skip") return false;
    if(off.has(m.id)) return false;
    if(on.has(m.id))  return true;
    return !!(o && o.type==="drink");      // 기본 참가 = 음료를 주문한 사람
  });
}

// 추첨 대상 = 명단에 정책을 얹은 것. skip 만 명단을 줄이고 soft·even 은 가중치로만 다룬다
function playersFrom(roster, policy, lastHostId){
  if(policy==="skip" && lastHostId) return roster.filter(m=>m.id!==lastHostId);
  return roster;
}

/* 돌림판의 회전량과 라벨 각도 (R6).
   판을 A, 라벨 글리프의 역회전을 L 이라 하면 멈춘 순간 두 식이 동시에 성립해야 한다.
     ① 이름이 똑바로:  A(end) + L(end) ≡ 0 (mod 360)
     ② 승자가 핀 아래:  mid + A(end) ≡ 0 (mod 360)
   두 식에서 L(end) ≡ mid 다. 그런데 정지 상태에서 관찰자가 못 보는 값은 A(end) 하나뿐이고
   (조각 배치는 눈앞에 그대로 있다), L 이 상수면 L(0)=L(end)≡mid 가 그 값을 그대로 알려준다.
   그게 예전 버그였다 — 눈썰미가 아니라 산수로 당첨자를 알 수 있었다. 조각 배치를 통째로
   돌리는 상수를 더해도 그건 시작 상태에서 보이므로 소용이 없다. 즉 L 은 시간에 따라 변해야
   하고, 이 함수는 그 시작값과 끝값을 준다.
   labelStart 가 0(상수)인 것이 이 설계의 전부다. wi 와도 jitter 와도 무관하므로 정지 상태에서
   샐 것이 없다. 난수를 인자로 받는 이유도 그 성질을 결정론적으로 검증하기 위해서다. */
function wheelSpin(n, wi, rnd){
  const a=360/n;
  const mid=(wi+0.5)*a;
  const jitter=((rnd||Math.random)()-0.5)*Math.max(0, a-10);
  const spin=360*5 - mid + jitter;
  return { a, mid, spin, labelStart:0, labelEnd:-spin };
}

// 사다리 치수. 인원 상한(16)이 실제 한계와 맞는지 이 값으로 역검증한다.
// LEV(층 수)도 치수의 일부라 여기서 함께 돌려준다 — playLadder 와 테스트가 같은 공식을 두 번
// 적으면 한쪽만 고쳐도 아무도 못 알아챈다.
function ladderGeometry(n){
  const W=340, PAD=24, GAP=(W-2*PAD)/(n-1);
  return { GAP, BOX_W: Math.min(30, GAP*0.82), NCH: n<=7?4 : n<=9?3 : 2, NFS: n<=7?11 : n<=9?10 : 8.5,
           LEV: Math.min(14, Math.max(6, n*2)) };
}

/* 가로줄을 놓는다. 규칙 둘이 있다.
     ① 인접 금지 — 같은 높이에서 이웃끼리 겹치면 경로가 갈라지지 않는다.
     ② 세로줄마다 가로선이 최소 하나는 닿는다 — 하나도 안 닿는 줄에 선 사람은 처음부터 끝까지
        직진이라 게임을 구경만 한다(실사용 제보).

   ②를 확률로 굴린 뒤 걸러내지 않고 먼저 깔아 두는 것이 요점이다. 걸러내는 방식은 n=2·LEV=6 에서
   실패율이 2.8% 라 예순 번쯤 다시 뽑으면 사실상 통과하지만, 그건 "거의 항상"이지 "반드시"가
   아니다. 순서도 요점이다 — 확률로 먼저 채우면 인접 금지에 막혀 ①이 놓을 자리가 사라진다.

   난수를 인자로 받는 이유는 두 규칙이 실제로 지켜지는지 결정론적으로 검증하기 위해서다. */
function ladderRungs(n, LEV, rnd){
  const R = rnd || Math.random;
  const rows = Array.from({length:LEV}, ()=>[]);
  const has = (row,g)=> row.indexOf(g) >= 0;
  const canPut = (row,g)=> g>=0 && g<n-1 && !has(row,g) && !has(row,g-1) && !has(row,g+1);
  const touched = (c)=> rows.some(row=> has(row,c) || has(row,c-1));
  for(let c=0;c<n;c++){
    if(touched(c)) continue;
    // 세로줄 c 에 닿는 가로선은 왼쪽 간격(c-1) 아니면 오른쪽 간격(c) 이다. 양 끝 줄은 한쪽뿐.
    const gaps = c===0 ? [0] : c===n-1 ? [c-1] : [c-1, c];
    const cand = [];
    for(let l=0;l<LEV;l++) for(let k=0;k<gaps.length;k++) if(canPut(rows[l], gaps[k])) cand.push([l, gaps[k]]);
    // 이론상만 있는 경우다(그 줄의 양쪽 간격이 전 층에서 비었는데 그 '이웃' 간격이 전 층을 채운 상태).
    // 여기서 조용히 포기하지 않고 호출부가 다시 뽑게 한다 — 보장이 무너지는 유일한 통로를 막는다.
    if(!cand.length) return null;
    const pick = cand[Math.floor(R()*cand.length)];
    rows[pick[0]].push(pick[1]);
  }
  for(let l=0;l<LEV;l++) for(let g=0;g<n-1;g++) if(canPut(rows[l],g) && R()<0.45) rows[l].push(g);
  for(let l=0;l<LEV;l++) rows[l].sort((a,b)=>a-b);   // trace 는 순서를 안 보지만 읽기 위해 정렬한다
  return rows;
}

/* ─────────── 🏁 구슬 레이스 (물리) ───────────
   예전에는 모든 구슬이 같은 사인 곡선 위를 타고 속도만 달랐다. 그러면 화면에 남는 건
   "세로로 늘어선 점들이 나란히 흐르는 것"뿐이고, 구슬끼리 부딪혀 예측이 안 되는 재미가 없다.
   그래서 작은 강체 솔버를 직접 짰다(라이브러리는 여전히 0개다).

   구성 원칙:
     · 길은 세 가지다 — 1자길 · 지그재그길 · 깔때기길.
     · 속도를 흩는 일은 길이 아니라 장애물이 한다 — 못밭 · 큰 날 · 가운데 물길 · 범퍼 · 탄성 못밭.
     · 마찰은 없다. 에너지를 잃는 경로는 벽·장애물과의 반발과 구슬끼리의 반발뿐이고 나머지는
       중력이 준다. 그래서 RACE_TFRIC 이 없다(접선 방향을 아예 건드리지 않는다).

   확률 정책과의 관계 — 이 게임은 승자를 미리 뽑지 않는다. 물리가 정하고, 이름은 시뮬레이션이
   끝난 뒤 구슬에 붙는다. 구슬의 반지름·질량·반발이 모두 같고 출발 x 도 각자 독립 난수라
   구슬 번호에는 아무 의미가 없다 — 즉 이 게임은 언제나 '평등'이다. [확률⬇️]를 걸 자리가
   없고(손가락 룰렛과 같은 이유), [제외]는 gamePlayers() 가 명단에서 이미 빼주므로 지켜진다.

   난수는 예외 없이 인자(rnd)로 받는다. 블록 안에서 Math.random 을 부르면 같은 시드로 두 번
   돌렸을 때 같은 결과가 나오는지 검증할 수 없다. */
const RACE_W = 200;          // 논리 폭. 예전 340 에서 좁혔다 — 같은 화면 폭에서 배율이 커져 구슬 번호가 읽힌다
const RACE_R = 9;            // 구슬 반지름
const RACE_DT = 1/240;       // 물리 스텝
const RACE_SUB = 4;          // 프레임당 서브스텝 → 60fps 로 기록된다
const RACE_G = 1400;         // 중력
const RACE_VMAX = 780;       // 속도 상한. VMAX*DT = 3.25 < R 이라 한 스텝에 캡슐을 건너뛸 수 없다(터널링 방지)
const RACE_E_WALL = 0.34;    // 벽·장애물 반발
const RACE_E_BALL = 0.18;    // 구슬끼리 반발
const RACE_MAXF = 4200;      // 70초. 이 안에 1등이 안 나오면 그 시드는 버린다
const RACE_CELL = 140;       // 정적 물체 y 격자 셀 높이 — 구슬 하나가 훑을 물체를 이 단위로 줄인다
const RACE_ITER = 3;
/* 자유 회전체 각속도 상한. 터널링과 같은 근거다 — 팔이 가장 긴 것이 74 라 8 rad/s 면 날개 끝이
   592px/s, 한 스텝 2.5px 로 구슬 반지름 9 안에 들어온다. */
const RACE_RAV_MAX = 8;         // 구슬끼리 위치 분리 반복 횟수. 근거는 raceSimulate 안 주석에 있다
/* 1자 4 · 지그재그 2 · 깔때기 2. 장애물 여섯 종을 새로 짜면서 한 칸씩 줄였다 — 새 장애물이
   전부 묵직해서 예전 길이(5100)로는 한 판이 21초대가 됐다. 4260 으로 줄여 16.5~18.5초로 돌아왔고,
   3/4 지점 역전은 오히려 66% 로 올랐다(계측 200판).
   예전 근거: 깔때기를 셋에서 둘로 줄였다 — 한 줄로 세워 통과시키는 구간이라
   들어간 순서가 거의 그대로 나온다(실사용 제보: "깔때기에서는 순위 역전이 안 일어난다").
   그 자리를 1자길로 돌리면 장애물이 하나 더 들어가고, 순위를 흔드는 건 장애물이다.

   남은 둘은 그대로 둔다. 아예 없애는 것도 재봤는데 아무것도 안 바뀌었다 — 24명 판에서 3/4
   지점 역전 43%→42%, 순위 변동 3.07→3.15 로 오차 안이고, 2인 판만 길어졌다(>23초 2%→5.5%).
   빼서 얻는 게 없으면 한 줄로 흐르는 그림이라도 남기는 편이 낫다. 정작 문제였던 건 개수가
   아니라 '마지막이 항상 깔때기'라는 자리였고, 그건 raceMapBuild 아래에서 걷어냈다. */
const RACE_SEG_MIX = ["s","s","s","s","z","z","f","f"];

/* 캡슐 하나로 못·벽·경사·기둥을 전부 표현한다 — 원-선분 거리 계산 하나면 넷이 다 풀린다.
   회전 막대(큰 날)는 sp!==0 이고 매 스텝 끝점을 다시 잡는다. y0/y1b 는 격자에 넣을 때 쓰는
   세로 범위이고, 회전 막대는 어느 각도로도 돌 수 있으니 반지름 전체를 범위로 잡는다. */
function rcap(x1,y1,x2,y2,rad){ return {x1,y1,x2,y2,rad,sp:0,cx:0,cy:0,hl:0,ph:0,e:0,invI:0,lim:0,ri:-1,
  y0:Math.min(y1,y2)-rad, y1b:Math.max(y1,y2)+rad}; }
function rpeg(x,y,rad){ return rcap(x,y,x,y,rad); }
/* 다이아몬드(◆)와 피라미드(▲). 새 충돌 코드를 만들지 않고 캡슐 몇 개로 테두리를 닫는다 —
   원-선분 거리 하나로 다 풀리므로 물리는 그대로다. 테두리가 닫혀 있어 안쪽에 갇힐 일도 없다
   (한 스텝 최대 이동 3.25 가 캡슐 반지름+구슬 반지름보다 훨씬 작아 뚫고 들어가지 못한다). */
function rdia(B,cx,cy,d,rad,e){
  const p=[[cx,cy-d],[cx+d,cy],[cx,cy+d],[cx-d,cy]];
  for(let k=0;k<4;k++){ const a=p[k], c=p[(k+1)%4];
    const s=rcap(a[0],a[1],c[0],c[1],rad); if(e) s.e=e; B.push(s); }
}
function rtri(B,cx,cy,w,h,rad,e){
  const p=[[cx,cy-h/2],[cx+w/2,cy+h/2],[cx-w/2,cy+h/2]];
  for(let k=0;k<3;k++){ const a=p[k], c=p[(k+1)%3];
    const s=rcap(a[0],a[1],c[0],c[1],rad); if(e) s.e=e; B.push(s); }
}
// hl 은 축 오른쪽 팔, hl0 은 왼쪽 팔이다. hl0 을 안 주면 예전처럼 대칭이라 기존 호출부가 그대로 산다.
// 팔을 따로 두는 이유는 robVane 주석에 있다 — 대칭 막대는 돌고 있는 게 안 보인다.
/* 자유 회전체(비동력 로터). 등속으로 도는 막대는 무한 질량이라 구슬을 '밀어붙이기'만 한다 —
   폭을 거의 막는 큰 날에서 구슬이 벽과 날 사이에 짓눌리는 것처럼 보였던 것이 이 때문이다.
   충격을 받아 도는 물건으로 바꾸면 구슬이 때린 만큼 날이 물러나므로 그 압착이 사라진다.
   invI 는 관성 모멘트의 역수다. 가는 막대(길이 2L·질량 M)의 중심 관성은 M(2L)²/12 = ML²/3 이고,
   구슬 질량을 1 로 두었으므로 M 은 '구슬 몇 개 무게인가'가 된다. */
function rrotor(cx,cy,hl,rad,mass,ph,spin){
  const b=rbar(cx,cy,hl,rad,spin||0,ph);
  b.invI = 3/(mass*hl*hl);
  return b;
}
function rbar(cx,cy,hl,rad,sp,ph,hl0){
  const h0=(hl0===undefined?hl:hl0);
  const b={x1:cx-h0,y1:cy,x2:cx+hl,y2:cy,rad,sp,cx,cy,hl,hl0:h0,ph,e:0,invI:0,lim:0,ri:-1};
  const m=Math.max(hl,h0);
  b.y0=cy-m-rad; b.y1b=cy+m+rad; return b;
}

/* ══ 길 세 가지 ══ 좌우 바깥벽은 시뮬레이터가 직접 잡으므로 여기서는 안쪽 지형만 놓는다. */

// 1자길 — 지형이 없다. 이 구간의 성격은 안에 들어가는 장애물이 정한다.
function rpathStraight(B, y, rnd){ return 340; }

// 지그재그길 — 좌우에서 번갈아 나온 이빨이 통로를 좁히고, 그 통로가 줄마다 반대쪽으로 옮겨간다.
// 두 이빨이 마주 보지 않고 어긋나 있어 구슬이 낄 V 가 생기지 않는다.
function rpathZig(B, y, rnd){
  const rows=5, dy=84, r=4, reach=118;
  for(let j=0;j<rows;j++){
    const yy=y+34+j*dy;
    if(j%2===0) B.push(rcap(-8, yy, reach, yy+50, r));
    else        B.push(rcap(RACE_W+8, yy, RACE_W-reach, yy+50, r));
  }
  return 34+rows*dy+46;
}

// 깔때기길 — 모아서 문 하나로 내보낸다. 문 폭 36 은 지름 18 의 두 배라 한 줄로 통과하며 순서가 섞인다.
function rpathFunnel(B, y, rnd){
  const g=18, r=4;
  B.push(rcap(-8, y+30, RACE_W/2-g, y+210, r));
  B.push(rcap(RACE_W+8, y+30, RACE_W/2+g, y+210, r));
  return 300;
}

/* ══ 장애물 다섯 가지 ══ 1자길 안에만 들어간다.
   지그재그·깔때기 위에 겹쳐 봤더니 이빨의 아랫면과 기둥의 옆면이 만나 주머니가 생겨서, 계측한
   60판 중 54판이 그 자리에서 멈췄다. 벽이 이미 방향을 트는 길에 또 방향을 트는 물체를 두면 둘
   사이에 닫힌 구석이 반드시 나온다. 그래서 역할을 나눈다 — 지그재그·깔때기는 '벽으로',
   1자길은 '장애물로' 흐름을 바꾼다. */

// 못밭 — 바깥 못을 벽에서 26 이상 띄운다. 18 에 두면 벽에 붙은 구슬(중심 x=9)이 못과 벽 사이에
// 껴서 영원히 안 내려온다(중심 거리 9 < R + 못반지름 14). 벽 쪽에 통로가 생기지만 그대로 둔다 —
// 출발이 깔때기라 이 구간에 들어올 때의 x 는 출발 위치와 무관하고, 통로를 타는 건 그때그때의 운이다.
/* 점 하나에서 물체까지의 거리. 회전 막대는 '쓸고 지나가는 원' 전체를 물체로 친다 — 지금
   각도만 피해도 반 바퀴 뒤에는 그 자리에 팔이 온다. 배경 못을 깔 때만 쓴다. */
function rdistToBody(b, x, y){
  if(b.sp) return Math.sqrt((x-b.cx)*(x-b.cx)+(y-b.cy)*(y-b.cy)) - (b.hl + b.rad);
  const dx=b.x2-b.x1, dy=b.y2-b.y1, L2=dx*dx+dy*dy;
  let t = L2>0 ? ((x-b.x1)*dx+(y-b.y1)*dy)/L2 : 0;
  t = t<0?0 : t>1?1 : t;
  const qx=b.x1+t*dx, qy=b.y1+t*dy;
  return Math.sqrt((x-qx)*(x-qx)+(y-qy)*(y-qy)) - b.rad;
}

/* 배경 못 — 어떤 장애물이 뽑히든 그 위에 성기게 깔린다.
   계측이 이유다: 한 판의 정적 물체가 50개뿐이었고 그중 못은 5개였다(참고한 공개 구현은
   스테이지당 원만 ~58개다). 못이 없는 1자길은 '가만히 떨어지는 구간'이 되어, 코스 후반으로
   갈수록 선두 교체가 단조 감소했다.
   이미 놓인 물체에서 지름(18)+여유만큼 떨어진 자리에만 놓는다 — 정적 물체끼리 붙으면 그 사이가
   구슬보다 좁아져 낄 자리가 된다. from 은 '이 구간에서 처음 놓인 물체'의 인덱스다. */
function robBackPins(B, y, h, rnd, from){
  const dy=66, dx=54, r=4, need=r+2*RACE_R+7;
  for(let j=0; ; j++){
    const yy=y+44+j*dy;
    if(yy > y+h-34) break;
    const off=(j%2)?dx/2:0;
    for(let x=32+off; x<=RACE_W-32; x+=dx){
      let ok=true;
      for(let i=from;i<B.length;i++){ if(rdistToBody(B[i], x, yy) < need){ ok=false; break; } }
      if(ok) B.push(rpeg(x, yy, r));
    }
  }
}

/* ══ 장애물 여섯 종 ══ 1자길 안에만 들어간다.
   지그재그·깔때기 위에 겹쳐 봤더니 이빨의 아랫면과 기둥의 옆면이 만나 주머니가 생겨서, 계측한
   60판 중 54판이 그 자리에서 멈췄다. 벽이 이미 방향을 트는 길에 또 방향을 트는 물체를 두면 둘
   사이에 닫힌 구석이 반드시 나온다. 그래서 역할을 나눈다 — 지그재그·깔때기는 '벽으로',
   1자길은 '장애물로' 흐름을 바꾼다.

   여섯 종은 레퍼런스 영상 분석의 '주요 트랙 요소'를 그대로 옮긴 것이다 —
   경사로 · 고정 피라미드 · 회전 바 · 대각선 바운서 · 핀볼 격자 · 시소 게이트.

   배치를 지배하는 규칙 하나: 지나갈 수 있는 목은 구슬 지름(2*RACE_R = 18)보다 넓어야 한다.
   마찰이 0 이라 정체는 '접촉 법선들이 중력을 정적으로 떠받치는가'로만 결정되는데, 목이 지름보다
   좁으면 구슬이 양쪽에 동시에 닿아 그 조합이 성립한다. 예전 못밭이 벽 여유 18 로 겪은 사고다. */

/* ① 경사로 — 좌우로 꺾이는 급경사 레일. 무리를 세로 한 줄로 세운다. 여섯 중 가장 얌전해서
   세기 차례의 첫 자리다. 높은 쪽 끝은 벽 너머까지 밀어 넣는다 — 벽과 레일 사이에 지름(18)보다
   좁은 틈을 남기면 거기가 곧 주머니가 된다(대각선 바운서에서 그 사고를 겪었다). */
function robSlope(B, y, h, rnd){
  const rows=2, dy=h/(rows+1), r=4, reach=RACE_W*0.52;
  for(let j=0;j<rows;j++){
    const yy=y+dy*(j+0.9), left=(j%2===0);
    const x1=left? -8 : RACE_W+8, x2=left? reach : RACE_W-reach;
    B.push(rcap(x1, yy, x2, yy+38, r));
  }
}

/* ② 고정 피라미드 — 삼각형을 2-1-2 로 엇갈려 세운다. 빗면이 구슬을 좌우로 갈라 보내고,
   꼭짓점에 정확히 맞은 구슬만 잠깐 머문다(그마저 옆 구슬이 밀어낸다).

   자리를 식으로 굴리지 않고 표로 적는다. 처음에 인덱스 산술로 뿌렸더니 두 삼각형의 밑변이
   x 로 2px 겹쳐 그 위에 닫힌 주머니가 생겼고, 세 구슬이 코스 11% 지점에서 4200프레임을
   버텼다. 검산이 되는 형태로 적어 두면 그 사고가 다시 안 난다 —
     · 밑변 46(반폭 23) · 높이 34
     · 같은 줄 이웃: 140-23 - (60+23) = 34 > 지름 18 ✓
     · 벽 여유: 60-23 = 37 > 18 ✓
     · 줄 간격: h*0.27 = 92 > 높이 34 ✓ (위아래로도 안 겹친다) */
function robPyramid(B, y, h, rnd){
  const w=46, ph=34, r=3;
  const rows=[[60,140],[100],[60,140]];
  for(let j=0;j<rows.length;j++){
    const yy=y+h*(0.28+j*0.27);
    for(const x of rows[j]) rtri(B, x, yy, w, ph, r);
  }
}

/* ③ 회전 바 — 통로 가운데 축에 걸린 1자형 자유 회전체. 이 판에서 가장 많이 손본 물건이다.

   예전 것의 문제가 둘이었다. 첫째, 팔이 88 이라 회전 지름이 코스 폭의 94% 였다 — 양옆에 8px
   밖에 안 남아 지름 18 인 구슬이 지나갈 자리가 없었다. 둘째, 등속으로 돌려서(무한 질량) 구슬이
   때려도 날이 물러나지 않았다. 둘이 겹치면 구슬이 벽과 날 사이에서 짓눌리는 그림이 나온다 —
   실제로 그렇게 보인다는 제보를 받았다.

   레퍼런스 명세대로 고쳤다. 날개 반지름을 코스 폭의 37%(74)로, 회전 지름을 74% 로 줄여 양옆에
   26 씩 남긴다 — 지름 18 인 구슬이 지나갈 수 있는 폭이다. 그리고 비동력으로 바꿨다. 구슬이
   날개 끝을 때리면 그 충격량만큼 바가 돌고, 뒤따르는 구슬은 돌고 있는 날에 맞아 튕겨 나간다.
   질량은 구슬 5개분이다 — 더 가벼우면 한 번 맞고 팽이처럼 돌아 장애물 구실을 못 하고, 더
   무거우면 다시 '밀어붙이는 벽'이 된다.
   두께 3.5 는 구슬 지름의 1/4 이라는 명세를 따랐다. 축에는 구슬만 한 원을 박아 회전 중심을
   눈에 보이게 한다(명세: 레인 폭의 6~8%). */
function robSpinner(B, y, h, rnd, arm){
  const cy=y+h*0.5, hl=(arm||RACE_W*0.37);
  B.push(rpeg(RACE_W/2, cy, 7));                                  // 중심축
  B.push(rrotor(RACE_W/2, cy, hl, 3.5, 5, rnd()*6.283, (rnd()<0.5?1:-1)*(0.6+rnd()*0.8)));
}

/* ④ 대각선 바운서 — 사선 반발 패널을 3단으로 좌우 교대로 건다. 구슬이 지그재그로 튕기며
   궤적이 크게 꺾인다. 반발 0.55 는 경사로(0.34)와 핀볼 격자(0.88) 사이 — 세기 차례의 가운데다.

   패널의 높은 쪽 끝을 벽 너머(-8 / W+8)까지 밀어 넣는 것이 요점이다. 처음엔 벽에서 14 띄우고
   한 줄에 둘씩 걸었더니 40판이 전부 정체했다 — 같은 줄의 두 패널이 서로 마주 보며 ∨ 주머니를
   만들고, 벽과 패널 사이 14 도 지름 18 보다 좁아 구슬이 그 자리에 눌러앉았다. 벽에 박아 두면
   그쪽에는 애초에 틈이 없고, 열린 쪽 하나만 남아 주머니가 성립하지 않는다. */
function robDiagBumper(B, y, h, rnd){
  const rows=2, dy=h/(rows+1), r=5;
  for(let j=0;j<rows;j++){
    const yy=y+dy*(j+0.85), left=(j%2===0);
    const s=left ? rcap(-8, yy, RACE_W*0.66, yy+30, r)
                 : rcap(RACE_W+8, yy, RACE_W*0.34, yy+30, r);
    s.e=0.55; B.push(s);
  }
}

/* ⑤ 핀볼 격자 — 다이아몬드 핀을 3-2-3-2 로 촘촘히 깐다. 핀볼 기계의 핀 구간과 같은 물건이라
   튕김이 가장 무작위하다. 반쪽 대각선 13 에 중심 간격 60 이면 표면 사이가 34 로 지름보다 넓다.
   벽 여유는 40-13=27 이다. 반발 0.88 은 여섯 중 가장 세다 — 세기 차례의 끝자리다.
   모서리(다이아몬드)가 원보다 나은 이유: 같은 자리에 떨어져도 어느 면을 맞느냐로 방향이 갈린다. */
function robPinball(B, y, h, rnd){
  const d=13, r=3.5, e=0.88, s=60, dy=54;
  const rows=[3,2,3,2];
  const y0=y+h*0.5-(rows.length-1)*dy/2;
  for(let j=0;j<rows.length;j++){
    const cnt=rows[j], yy=y0+j*dy;
    for(let k=0;k<cnt;k++){
      const x=RACE_W/2 + (k-(cnt-1)/2)*s;
      rdia(B, x, yy, d, r, e);
    }
  }
}

/* ⑥ 시소 게이트 — 가운데 축에 걸린 지레. 먼저 온 구슬이 한쪽을 눌러 기울이면 그 뒤 구슬은
   반대쪽으로 강제로 흘러간다. 회전 바와 달리 각도가 ±0.42 rad(24°)로 묶여 있어 한 바퀴 돌지
   않고, 되돌리는 힘도 없다 — 다음 구슬이 반대쪽을 누를 때까지 기울어진 채로 있다.
   그래서 '누가 먼저 왔는가'가 그 뒤 몇 초를 바꾸는, 이 코스에서 유일하게 기억을 갖는 장애물이다. */
function robSeesaw(B, y, h, rnd, hl){
  const cy=y+h*0.55, L=(hl||RACE_W*0.36);
  B.push(rpeg(RACE_W/2, cy, 6));
  const b=rrotor(RACE_W/2, cy, L, 4, 6, (rnd()<0.5?-1:1)*0.42, 0);
  b.lim=0.42; B.push(b);
}

function rpathGate(B, y, rnd){
  const h=170;
  const gx = rnd()<0.5 ? -70 : RACE_W+70;
  B.push(rbar(gx, y+h*0.5, 340, 6, (rnd()<0.5?1:-1)*(0.9+rnd()*0.6), rnd()*6.283, 0));
  return h;
}

/* ── ③ 세기 차례 ──
   약한 것부터 센 것 순으로 늘어놓는다. 예전에는 매 1자길이 여섯 중 하나를 무작위로 뽑아서,
   판마다 초반이 격렬하고 후반이 조용하기도 하고 그 반대이기도 했다 — 설계된 곡선이 없었다.
   코스 진행률에 맞춰 이 순서에서 뽑으면 매 판 같은 기승전결이 나온다. 인접한 한 칸까지
   흔들어(±1) 판마다 같은 그림이 되지는 않게 한다. */
/* 버블 — 구슬이 닿는 순간 사라진다. 지금까지의 장애물은 전부 판이 끝날 때까지 그대로여서,
   앞선 구슬이 뒤 구슬의 조건을 바꾸는 상호작용이 하나도 없었다. 버블은 "1등이 뚫어 놓은 자리로
   2등이 더 빨리 온다"를 만든다 — 뒤가 따라붙는 장치이자, 코스가 판 중에 변하는 유일한 자리다.
   두 줄을 촘촘히(간격 4) 깔아 그냥은 못 지나가게 한다. 지름 18 이 지나려면 반드시 하나는
   터뜨려야 하고, 터진 자리는 그대로 길이 된다.
   막힐 걱정은 없다 — 닿기만 하면 사라지므로 눌려 있을수록 빨리 열린다. */
function robBubble(B, y, h, rnd){
  /* 한 줄만 깐다. 두 줄로 했더니 앞줄을 뚫고도 뒷줄에 다시 막혀서, 무리가 오래 갇힌 판이
     생겨 최장 소요가 31.5초까지 늘었다(테스트가 잡았다). 한 줄이면 뚫는 순간 바로 길이 된다. */
  const r=15, gap=4, dx=2*r+gap;
  const yy=y+h*0.46;
  for(let x=26; x<=RACE_W-26; x+=dx){
    const bb=rpeg(x, yy, r); bb.pop=1; bb.e=0.35; B.push(bb);
  }
}

const RACE_OBS = [robSlope, robPyramid, robSeesaw, robBubble, robSpinner, robDiagBumper, robPinball];

/* 출발 깔때기 — 구슬을 한 곳에 쏟아 문 하나로 내보낸다. 출발선의 좌우 위치가 결과에 남지 않게
   만드는 장치다. 이게 없으면 코스가 특정 레인을 유리하게 만들 때 출발 그리드가 곧 답이 된다 —
   돌림판에서 라벨 기울기가 답이었던 것과 같은 종류의 누출이다.

   soft 는 2인 판에서만 켠다. 두 구슬뿐이면 서로 미는 압력이 없어 구조적으로 늘어져서, 새 장애물
   그대로는 200판 중 2.5% 가 상한 23초를 넘었다(최대 25.5초). 완화는 세기 둘로만 한정한다 —
   탄성 못밭을 한 줄 줄이고 큰 날의 긴 팔을 78 로 낮춘다. 기하 규칙도 구성 비율도 코스 길이도
   건드리지 않으므로 '같은 게임'이 유지되고, 2인 판은 두 구슬이 같은 코스를 보므로 공정성과도
   무관하다. rnd 소비 횟수가 안 변하는 것도 중요하다 — 변하면 같은 시드가 다른 코스를 만든다. */
function raceMapBuild(rnd, soft){
  const B=[];
  let y=0;
  B.push(rcap(-8, y+50, RACE_W/2-17, y+250, 4));
  B.push(rcap(RACE_W+8, y+50, RACE_W/2+17, y+250, 4));
  y+=300;
  /* 구성 비율을 고정하고 순서만 섞는다. 매 구간을 독립으로 뽑았더니 어떤 판은 1자길만 나와
     4.5초, 어떤 판은 깔때기가 몰려 20초가 됐다 — 같은 게임이라고 보기 어려운 편차다.
     비율을 묶으면 길이가 모이고, 다양성은 '어떤 장애물이 어느 순서로 오느냐'가 맡는다. */
  const mix=RACE_SEG_MIX.slice();   // 아래 셔플은 순서만 바꾼다
  for(let i=mix.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=mix[i]; mix[i]=mix[j]; mix[j]=t; }
  // 1자길 한 칸 + 그 안에 들어갈 장애물 하나. 마지막 구간도 같은 것을 쓰므로 함수로 묶는다.
  // 다섯째 인자는 세기다 — 팔 길이를 가진 둘(robSpinner·robSeesaw)만 읽고 나머지 넷은 무시한다.
  /* prog 0~1 이 코스 진행률이다. 그 자리에 어울리는 세기의 장애물을 고르고, 그 위에 배경 못을
     깐다. from 을 넘기는 이유는 배경 못이 '이 구간에 방금 놓인 것'만 피하면 되기 때문이다. */
  let straightNo=0;
  const straightWithObstacle=(yy, prog)=>{
    const L=RACE_OBS.length;
    const base=Math.floor(prog*(L-1)+0.5);
    const pick=Math.max(0, Math.min(L-1, base + (rnd()<0.5?0:(rnd()<0.5?-1:1))));
    const ob=RACE_OBS[pick];
    const from=B.length;
    const h=rpathStraight(B, yy, rnd);
    ob(B, yy, h, rnd, soft ? (ob===robSpinner ? RACE_W*0.30 : ob===robSeesaw ? RACE_W*0.30 : undefined) : undefined);
    robBackPins(B, yy, h, rnd, from);
    straightNo++;
    return h;
  };
  /* 관문 두 개를 40%·70% 자리에 끼워 넣는다. 섞지 않고 자리를 고정하는 이유는 이것이 '무리를
     다시 모으는' 장치라서다 — 어디에 놓이든 상관없는 장식이 아니라, 퍼짐이 벌어지기 시작하는
     지점에 있어야 일을 한다. */
  const gateAt = new Set([Math.round(mix.length*0.4), Math.round(mix.length*0.7)]);
  const nStr = mix.filter(k=>k==="s").length + 1;   // 마지막 1자길까지
  let strDone=0;
  for(let s=0;s<mix.length;s++){
    if(gateAt.has(s)) y+=rpathGate(B, y, rnd);
    if(mix[s]==="s"){ y+=straightWithObstacle(y, strDone/(nStr-1)); strDone++; }
    else if(mix[s]==="z") y+=rpathZig(B, y, rnd);
    else                  y+=rpathFunnel(B, y, rnd);
  }
  /* 마지막 구간도 1자길 + 장애물이다. 예전에는 여기가 항상 깔때기였고 "결승 직전에 몰린다"는
     연출을 노렸는데, 계측해 보니 하는 일이 정반대였다 — 한 줄로 세워 통과시키니 들어간 순서가
     그대로 결승선까지 갔다. 코스 3/4 지점의 선두가 결국 지는 비율이 24명 판에서 43% 였던 것이
     이 자리를 장애물로 바꾸자 59% 가 됐다(200판). 마지막까지 모른다는 게 이 게임의 전부라,
     결승 직전이야말로 가장 흔들려야 하는 자리다.
     좁은 문으로 모으는 그림은 바로 아래 결승 구역 캡슐(틈 68)이 여전히 맡는다. */
  y+=straightWithObstacle(y, 1);       // 마지막 1자길 — 가장 센 장애물이 온다
  /* ── 결승 구역 ── 깔때기 + 좁고 긴 통로 + 그 입구를 쓸고 다니는 관문.

     통로를 길게 뽑는 것이 요점이다. 벽 안쪽 사이가 32 라 구슬 지름(18)의 1.8배 — 두 구슬이
     나란히 못 지나가고, 길이 170 동안 추월할 자리가 없다. 통로에 들어간 순서가 곧 결승 순서다.
     그래서 이 게임의 마지막 승부는 통로 안이 아니라 '통로에 누가 먼저 들어가느냐'로 옮겨간다.
     그 한 지점에 관문을 걸어 두면 판 전체의 긴장이 거기 한 곳으로 모인다.

     관문의 회전축을 코스 바깥(x=-70 또는 270)에 둔다. 축이 가운데 있으면 팔 끝이 급한 원을
     그려 입구를 스치듯 지나가는데, 축을 밖으로 빼면 코스를 지나는 구간이 훨씬 완만한 호가 되어
     같은 각속도로도 입구에 걸쳐 있는 시간이 길어진다. 팔 340 이면 반대쪽 벽을 340-70=270 로
     넘겨 덮으므로 한 바퀴의 22% 동안 입구가 통째로 막힌다 — 축을 46 에 두고 팔을 250 으로
     했을 때는 10% 였다(계측). 기울어 있는 동안에는 한쪽으로만 흘려보낸다.

     이 배치는 회전 팔과 정적 경사면(깔때기 벽)이 실제로 만나는 자리다 — 다른 곳에서는 정적
     쐐기가 생긴다고 일부러 피해 온 조합이라, 여기만은 계측으로 확인하고 쓴다(120판 정체 0).
     쐐기가 안 생기는 이유는 팔이 계속 돌아 그 조합이 유지되지 않기 때문이다.

     각속도 0.9~1.5(한 바퀴 4.2~7.0초)는 계측으로 골랐다. 더 느리게(한 바퀴 8.4초) 두면 무리가
     결승에 다가가는 몇 초 동안 관문이 한 자세로 서 있다시피 해서 열고 닫는 장면이 안 나오고,
     실제로 3/4 지점 역전이 24명 판에서 58% 로 떨어졌다(지금 62%). 더 빠르면 '느리게 도는
     관문'이라는 성격이 사라지고 역전도 다시 내려간다(57%). */
  /* 통로를 넓히고 짧게 하고, 양 벽에 짧은 날개를 사다리처럼 세운다.
     계측이 이유다 — 90~100% 구간의 선두 교체가 코스 전체에서 가장 적었다(104회, 최고점의 28%).
     통로 안쪽이 24 라 지름 18 인 구슬이 한 줄로만 서고, 길이 170 동안 추월할 자리가 없어서
     설계상 죽은 구간이었다. 클라이맥스여야 할 자리가 가장 조용했다.

     배치는 참고한 공개 구현(MIT)의 'Pot of greed' 끝 구간을 그대로 옮긴 것이다. 그쪽은 폭 20
     남짓한 통로의 양 벽에 길이 1~2 짜리 짧은 날개를 3 간격으로 사다리처럼 걸고, 좌우를 서로
     반대로 ±10 rad/s 로 돌린다. 우리 스케일로 환산하면:
       · 팔 길이 — 코스 폭 대비 그쪽 5~10% → 우리 폭 200 에 13
       · 세로 간격 — 그쪽 통로 폭의 0.19배 → 우리 통로 60 에 34
       · 각속도 — 끝속도가 코스 폭의 약 0.5배/초가 되게. 그쪽 10×1/20 ≈ 0.5 이므로
                  우리는 ω×13/200 = 0.5 → ω ≈ 7.7. 큰 날(2.2~3.4)보다 훨씬 빠르다.
     날개가 짧아서 막지는 않는다 — 양쪽에서 13 씩 들어와도 가운데 34 가 남아 지름 18 이 지난다.
     통로는 60 폭이라 구슬 세 개가 나란히 서고, 길이는 120 으로 줄여 죽은 구간을 짧게 했다. */
  const NECK=34, CHAN=120;                       // 통로 벽 중심의 반간격 · 통로 길이
  B.push(rcap(-8, y+20, RACE_W/2-NECK, y+120, 4));
  B.push(rcap(RACE_W+8, y+20, RACE_W/2+NECK, y+120, 4));
  B.push(rcap(RACE_W/2-NECK, y+120, RACE_W/2-NECK, y+120+CHAN, 4));
  B.push(rcap(RACE_W/2+NECK, y+120, RACE_W/2+NECK, y+120+CHAN, 4));
  /* 작은 날개 사다리를 걷어내고 '큰 날'이 훑게 한다 (실사용 제보 — 작은 것 여럿보다 큰 하나가
     쓸고 지나가는 그림을 원한다). 축을 코스에서 멀리 뺄수록 코스를 지나는 구간이 완만한 호가
     되어, 같은 각속도로도 천천히 쓸어 담는 느낌이 난다. 축 ±150 은 예전(±70)의 두 배 거리이고,
     팔 500 이면 코스 먼 쪽 끝(축에서 350)까지 덮는다.
     두 개를 쓴다 — 깔때기 입구 하나, 통로 한가운데 하나. 축을 서로 반대쪽 밖에 두어 두 날이
     같은 방향으로만 쓸지 않게 한다. */
  const GAX=150, GARM=500;
  const gs = rnd()<0.5 ? -1 : 1;                 // 축을 어느 쪽 밖에 둘지. 매 판 뒤집는다
  B.push(rbar(gs<0 ? -GAX : RACE_W+GAX, y+46, GARM, 6, (rnd()<0.5?1:-1)*(0.85+rnd()*0.45), rnd()*6.283, 0));
  /* 통로 쪽 날은 입구 쪽보다 빠르게 돈다(1.5~2.1). 같은 속도로 뒀더니 통로를 막고 있는 시간이
     길어, 2명 판에서 두 구슬이 그 앞에 오래 갇혀 최장 소요가 46초까지 갔다. 사람이 많으면
     서로 밀어 비집고 나가지만 둘뿐이면 밀 힘이 없다 — 그래서 날이 스스로 빨리 비켜 줘야 한다. */
  B.push(rbar(gs<0 ? RACE_W+GAX : -GAX, y+120+CHAN*0.5, GARM, 6, (rnd()<0.5?1:-1)*(1.5+rnd()*0.6), rnd()*6.283, 0));
  const neckY=y+20;                              // 결승 깔때기 벽이 시작되는 자리
  const finishY=y+120+CHAN+34;
  y=finishY+46;
  /* 회전체를 따로 모아 번호를 매긴다. 자유 회전체는 각도가 시간의 닫힌 식이 아니라 '충돌로
     쌓인 상태'라, 시뮬이 프레임마다 각도를 적어 두어야 재생이 같은 그림을 그릴 수 있다.
     등속으로 도는 것(결승 통로의 짧은 날개)도 같은 표에 올린다 — 그리는 쪽이 한 곳만 보면 된다. */
  const rotors=[];
  for(let i=0;i<B.length;i++){ if(B[i].sp || B[i].invI){ B[i].ri=rotors.length; rotors.push(i); } else B[i].ri=-1; }
  const cells=Math.ceil(y/RACE_CELL)+1;
  const grid=[]; for(let i=0;i<cells;i++) grid.push([]);
  for(let i=0;i<B.length;i++){
    const b=B[i];
    const a=Math.max(0, Math.floor(b.y0/RACE_CELL)), z=Math.min(cells-1, Math.floor(b.y1b/RACE_CELL));
    for(let c=a;c<=z;c++) grid[c].push(i);
  }
  return { bodies:B, grid, cells, rotors, total:y, finishY, neckY };
}

/* 한 판을 끝까지 돌리고 프레임마다 모든 구슬의 (x,y) 를 Float32Array 에 녹화한다.
   재생은 그 배열을 읽기만 한다 — 물리를 두 번 돌리지 않으므로 화면과 결과가 어긋날 여지가
   원천적으로 없다. 24명 × 1200프레임이면 115K 실수(≈460KB)라 폰에서도 부담이 아니다. */
function raceSimulate(map, n, rnd){
  const px=new Float64Array(n), py=new Float64Array(n), vx=new Float64Array(n), vy=new Float64Array(n);
  for(let i=0;i<n;i++){
    px[i]=0; py[i]=0; vx[i]=0; vy[i]=0;   // 아래에서 격자로 다시 놓는다
  }
  /* 출발선 정렬. 예전에는 x·y 를 각자 난수로 뿌려서 시작 화면이 흩어져 보였다 —
     [출발] 전에 "내 번호를 찾아두세요"라고 해 놓고 정작 어디를 봐야 할지 알 수 없었다.
     가지런한 격자로 세운다. 한 줄에 여덟 개씩, 위로 쌓는다(24명이면 세 줄).
     자리를 번호 순서대로 주지 않고 시드로 섞는 것이 중요하다 — 어떤 자리가 유리하면 그
     자리에 선 번호가 곧 답이 되기 때문이다. 출발 깔때기를 둔 것과 같은 이유의 누출이다.
     초기 속도는 0 이다. 가지런히 선 채로 멈춰 있어야 '출발 대기'로 읽힌다. */
  const SP=20, per=Math.max(1, Math.floor((RACE_W-2*(RACE_R+10))/SP));
  const slot=[]; for(let i=0;i<n;i++) slot.push(i);
  for(let i=n-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=slot[i]; slot[i]=slot[j]; slot[j]=t; }
  for(let i=0;i<n;i++){
    const sl=slot[i], row=Math.floor(sl/per), col=sl%per;
    const cnt=Math.min(per, n-row*per);          // 마지막 줄은 덜 찰 수 있다 — 그 줄만 따로 가운데 맞춘다
    px[i]=RACE_W/2 + (col-(cnt-1)/2)*SP;
    /* 아주 작은 흔들림을 얹는다. 없으면 2명 판에서 두 구슬이 완벽히 대칭으로 떨어져 출발
       깔때기 문에 동시에 맞물리고, 서로를 밀어내는 힘도 좌우 대칭이라 영원히 안 풀린다
       (테스트가 seed 23·n=2 에서 잡았다). 세로 ±0.9 · 가로 속도 ±6 이면 화면에서는 여전히
       한 줄로 보이는데 도착 시각과 접촉 각도가 갈려 맞물림이 풀린다. 값은 전부 시드에서
       나오므로 재현성은 그대로다. */
    py[i]=26-row*SP+(rnd()-0.5)*1.8;
    vx[i]=(rnd()-0.5)*12;
  }

  const path=new Float32Array(RACE_MAXF*n*2);
  /* 회전체 상태. 자유 회전체는 충돌로 각속도가 바뀌므로 각도가 시간의 함수가 아니다 —
     프레임마다 적어 두고 재생이 그걸 읽는다. 물체에 직접 쓰지 않고 지역 배열에 두는 이유는
     같은 맵으로 두 번 돌려도 결과가 같아야 하기 때문이다(재현성 테스트의 전제다). */
  const RC=map.rotors.length;
  const rang=new Float64Array(RC), rav=new Float64Array(RC);
  for(let k=0;k<RC;k++){ const b=map.bodies[map.rotors[k]]; rang[k]=b.ph; rav[k]=b.sp; }
  const rot=new Float32Array(RACE_MAXF*RC);
  const idx=new Int32Array(n); for(let i=0;i<n;i++) idx[i]=i;
  const B=map.bodies, grid=map.grid, cells=map.cells;
  let frames=0, winner=-1, leadPrev=-1, leadChanges=0;
  /* 역동성 지표 둘. leadChanges 는 선두가 프레임 단위로 깜빡이기만 해도 오르고(히스테리시스를
     걸어 재보면 25~30% 가 그 깜빡임이다), 더 큰 문제는 24명 판에서 leadChanges 가 16 인데 선두를
     잡아 본 구슬은 일곱뿐이라는 것이다 — 나머지 열일곱은 한 번도 맨 앞에 못 나왔다. 체감에
     직결되는 건 후자라 둘을 따로 센다. leadChanges 는 지표로 남기고 채택 문턱은 아래가 맡는다. */
  const ledSeen=new Uint8Array(n); let distinctLeaders=0;
  const rankPrev=new Int32Array(n).fill(-1); let rankChurn=0;

  for(let f=0; f<RACE_MAXF && winner<0; f++){
    for(let s=0; s<RACE_SUB; s++){
      const tt=(f*RACE_SUB+s)*RACE_DT;
      for(let i=0;i<n;i++){
        vy[i]+=RACE_G*RACE_DT;
        const q=vx[i]*vx[i]+vy[i]*vy[i];
        if(q>RACE_VMAX*RACE_VMAX){ const k=RACE_VMAX/Math.sqrt(q); vx[i]*=k; vy[i]*=k; }
        px[i]+=vx[i]*RACE_DT; py[i]+=vy[i]*RACE_DT;
      }
      /* 자유 회전체를 굴린다. 각속도 상한은 터널링과 같은 이유다 — 날개 끝이 한 스텝에 구슬
         반지름보다 많이 움직이면 구슬을 뛰어넘는다. 팔이 가장 긴 것이 74 이므로 상한 8 이면
         끝 속도 592, 한 스텝 2.5px 로 반지름 9 안에 들어온다.
         시소는 각도를 ±lim 으로 묶고 거기 닿으면 각속도를 죽인다 — 받침에 부딪힌 것과 같다. */
      for(let k=0;k<RC;k++){
        const b=B[map.rotors[k]];
        if(!b.invI){ rang[k]=b.ph+b.sp*tt; continue; }   // 등속으로 도는 것은 시간의 함수 그대로
        if(rav[k]>RACE_RAV_MAX) rav[k]=RACE_RAV_MAX; else if(rav[k]<-RACE_RAV_MAX) rav[k]=-RACE_RAV_MAX;
        rang[k]+=rav[k]*RACE_DT;
        if(b.lim){
          if(rang[k]> b.lim){ rang[k]= b.lim; if(rav[k]>0) rav[k]=0; }
          else if(rang[k]< -b.lim){ rang[k]= -b.lim; if(rav[k]<0) rav[k]=0; }
        }
      }
      for(let i=0;i<n;i++){                       // 지형·장애물
        const c=Math.floor(py[i]/RACE_CELL);
        if(c<0||c>=cells) continue;
        const list=grid[c];
        for(let k=0;k<list.length;k++){
          const b=B[list[k]];
          if(b.dead!=null) continue;                       // 이미 터진 버블 — 없는 셈 친다
          const touched=raceHit(b, i, px, py, vx, vy, rang, rav);
          // 버블은 닿는 순간 사라진다. 터진 프레임을 적어 두면 재생 쪽이 그때부터 안 그린다.
          if(touched && b.pop) b.dead=f;
        }
      }
      /* 구슬끼리 — y 로 정렬해 두면 창(지름) 밖은 볼 것도 없이 끊을 수 있다. 24개면 삽입정렬이
         매 스텝 거의 정렬된 배열을 다시 훑는 꼴이라 정렬 비용이 사실상 0 이다.
         RACE_ITER 번 반복하는 이유 — 결승 통로처럼 좁은 곳에 스물넷이 눌리면 한 쌍을 떼어 놓은
         결과가 옆 쌍을 다시 파고들게 만든다. 한 번만 돌리면 그 되밀림이 남아 프레임에 기록되고,
         화면에서는 구슬이 서로를 통과한 것처럼 보인다(통로를 넣자 최소 간격이 10.9 → 4.9 로
         떨어졌다. 지름이 18 이므로 73% 가 겹친 것이다). 반사(임펄스)는 첫 회에만 건다 —
         반복마다 걸면 같은 충돌로 에너지를 여러 번 얻어 구슬이 튀어 오른다. */
      for(let a=1;a<n;a++){ const v=idx[a]; let b=a-1; while(b>=0&&py[idx[b]]>py[v]){ idx[b+1]=idx[b]; b--; } idx[b+1]=v; }
      const D=2*RACE_R;
      for(let it=0; it<RACE_ITER; it++){
        for(let a=0;a<n;a++){
          const i=idx[a];
          for(let b=a+1;b<n;b++){
            const j=idx[b];
            if(py[j]-py[i]>D) break;
            let nx=px[j]-px[i], ny=py[j]-py[i];
            const d2=nx*nx+ny*ny;
            if(d2>=D*D||d2===0) continue;
            const d=Math.sqrt(d2); nx/=d; ny/=d;
            const push=(D-d)*0.5;
            px[i]-=nx*push; py[i]-=ny*push; px[j]+=nx*push; py[j]+=ny*push;
            if(it) continue;
            const rvn=(vx[j]-vx[i])*nx+(vy[j]-vy[i])*ny;
            if(rvn<0){
              const jm=-(1+RACE_E_BALL)*rvn*0.5;    // 질량이 같아 1/m+1/m = 2
              vx[i]-=nx*jm; vy[i]-=ny*jm; vx[j]+=nx*jm; vy[j]+=ny*jm;
            }
          }
        }
      }
      /* 좌우 바깥벽은 서브스텝의 '마지막'에 잡는다. 앞에 두면 지형이나 옆 구슬이 벽 너머로
         밀어낸 결과가 그대로 기록되어, 구슬이 한 프레임 벽을 삐져나온 그림이 나온다
         (테스트에서 x=8.4 로 잡혔다 — 반지름이 9 인데). 마지막에 두면 기록되는 좌표가 항상
         코스 안이다. 장애물 캡슐이 벽 너머(-8, W+8)까지 뻗어 있어서 순서를 바꿔도 지형 판정에
         빈틈이 생기지 않는다. */
      for(let i=0;i<n;i++){
        if(px[i]<RACE_R){ px[i]=RACE_R; if(vx[i]<0) vx[i]=-vx[i]*RACE_E_WALL; }
        else if(px[i]>RACE_W-RACE_R){ px[i]=RACE_W-RACE_R; if(vx[i]>0) vx[i]=-vx[i]*RACE_E_WALL; }
      }
    }
    const base=f*n*2;
    for(let i=0;i<n;i++){ path[base+i*2]=px[i]; path[base+i*2+1]=py[i]; }
    for(let k=0;k<RC;k++) rot[f*RC+k]=rang[k];
    frames=f+1;
    let lead=0;
    for(let i=1;i<n;i++) if(py[i]>py[lead]) lead=i;
    if(leadPrev>=0&&lead!==leadPrev) leadChanges++;
    leadPrev=lead;
    if(!ledSeen[lead]){ ledSeen[lead]=1; distinctLeaders++; }
    /* 순위 변동 총량. idx 는 바로 위 구슬끼리 패스가 py 오름차순으로 정렬해 놓았고 그 뒤 벽
       클램프는 x 만 건드리므로, 여기서 다시 정렬할 것이 없다 — 순위표가 이미 손에 있다.
       여섯 프레임(10Hz)마다 재는 이유는 매 프레임 재면 1px 차이로 붙어 가는 두 구슬이 서로
       자리를 바꾸는 떨림이 총량을 지배해서, leadChanges 와 똑같은 약점을 갖게 되기 때문이다. */
    if(f%6===0){
      for(let a=0;a<n;a++){
        const i=idx[n-1-a];                       // a=0 이 선두
        if(rankPrev[i]>=0) rankChurn+=Math.abs(a-rankPrev[i]);
        rankPrev[i]=a;
      }
    }
    if(py[lead]>=map.finishY) winner=lead;
  }
  return { ok:winner>=0, winner, frames, leadChanges, distinctLeaders, rankChurn,
           path:path.subarray(0, frames*n*2), rot:rot.subarray(0, frames*RC), rc:RC, n };
}

/* 구슬 i 와 캡슐 하나. 위치를 밀어내고 법선 반사 + 반발계수만 적용한다 — 접선은 손대지 않으므로
   마찰이 0 이다. 회전 막대는 접촉점의 표면 속도를 기준계로 삼아 그만큼 되돌려 준다(그래야 날개가
   구슬을 실제로 밀어낸다). */
function raceHit(b, i, px, py, vx, vy, rang, rav){
  let x1=b.x1,y1=b.y1,x2=b.x2,y2=b.y2, sxv=0, syv=0, w=0;
  if(b.ri>=0){
    w=rav[b.ri];
    const a=rang[b.ri], ca=Math.cos(a), sa=Math.sin(a);
    x1=b.cx-b.hl0*ca; y1=b.cy-b.hl0*sa; x2=b.cx+b.hl*ca; y2=b.cy+b.hl*sa;
  }
  const dx=x2-x1, dy=y2-y1, L2=dx*dx+dy*dy;
  let t = L2>0 ? ((px[i]-x1)*dx+(py[i]-y1)*dy)/L2 : 0;
  t = t<0?0 : t>1?1 : t;
  const qx=x1+t*dx, qy=y1+t*dy;
  let nx=px[i]-qx, ny=py[i]-qy;
  const rr=RACE_R+b.rad, d2=nx*nx+ny*ny;
  if(d2>=rr*rr) return false;   // 닿지 않음. 돌려주는 값은 버블을 터뜨릴지 판정하는 데 쓰인다
  let d=Math.sqrt(d2);
  if(d<1e-9){ nx=0; ny=-1; d=1e-9; } else { nx/=d; ny/=d; }
  /* 위치는 구슬만 민다. 회전체는 축이 고정이라 평행이동할 수 없다. */
  px[i]+=nx*(rr-d); py[i]+=ny*(rr-d);
  if(b.ri>=0){ sxv=-w*(qy-b.cy); syv=w*(qx-b.cx); }
  const rvx=vx[i]-sxv, rvy=vy[i]-syv;
  const vn=rvx*nx+rvy*ny;
  if(vn>=0) return true;        // 겹쳤지만 멀어지는 중 — 접촉은 접촉이다
  const e=b.e||RACE_E_WALL;
  if(!b.invI){                       // 무한 질량 — 벽·정적 지형·등속 회전체
    vx[i]=rvx-(1+e)*vn*nx+sxv;
    vy[i]=rvy-(1+e)*vn*ny+syv;
    return true;
  }
  /* 자유 회전체. 충격량을 구슬과 로터가 나눠 갖는다 — 이것이 '밀어붙이는 벽'과 '맞으면 돌아가는
     날개'를 가르는 전부다. rn 은 접촉점 지렛대(r × n)이고, 분모의 rn²·invI 가 로터 몫이다.
     구슬 질량을 1 로 두었으므로 1/m 은 1 이다. 날개 끝을 때릴수록 rn 이 커져 로터가 더 돈다. */
  const rn=(qx-b.cx)*ny-(qy-b.cy)*nx;
  const j=-(1+e)*vn/(1 + rn*rn*b.invI);
  vx[i]+=j*nx; vy[i]+=j*ny;
  rav[b.ri]=w + rn*j*b.invI;
  return true;
}

// 시드 PRNG — 코스와 출발 배치가 판마다 달라진다. 시드 하나로 완전히 재현된다.
function raceRnd(seed){
  let a=seed>>>0;
  return function(){
    a=(a+0x6d2b79f5)>>>0;
    let t=a;
    t=Math.imul(t^(t>>>15), t|1);
    t^=t+Math.imul(t^(t>>>7), t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}

// 기준일이 속한 주의 월요일까지 되돌릴 일수. getUTCDay() 는 일요일이 0 이므로 +6 %7 로
// 월(1)→0 · 화(2)→1 · … · 일(0)→6 이 된다.
function weekBackDays(ds){ return (new Date(ds+"T00:00:00Z").getUTCDay()+6)%7; }
// (이번 달 − 2)월. 1월 → 전년 11월, 2월 → 전년 12월. [연, 월(1-based)] 을 돌려준다.
function q3Start(y, m){ const mm=m-2; return mm<=0 ? [y-1, mm+12] : [y, mm]; }

/* ---------- 🏁 구슬 레이스 (물리) ----------
   순수 함수(raceMapBuild·raceSimulate·raceHit·raceRnd)는 위 마커 블록에 있고 난수를 인자로만
   받는다. 아래는 Math.random 을 부르고 캔버스를 만지므로 블록 밖이다 — 그 경계가 테스트의 전제다. */

/* 논리 치수. 캔버스 좌표는 전부 이 값들로 쓰고 devicePixelRatio 는 setTransform 한 줄로만 다룬다 —
   그림 코드에 dpr 이 섞이면 반지름·글자 크기가 기기마다 달라진다. */
const RACE_VIEW_H = 260;         // 캔버스 논리 높이 (폭은 RACE_W = 200)
/* 선두를 화면 위에서 이 비율 지점에 둔다. 0.40 이었는데 0.55 로 내렸다 — 선두 뒤쪽이 더 보인다.
   무리가 화면 밖에 있다는 게 이 게임의 오래된 문제였다(24명 판에서 구슬의 18% 만 화면 안).
   아래 줌과 함께 29% 로 올렸고, 선두 앞으로 보이는 코스도 156 → 165px 로 오히려 늘었다 —
   줌이 시야를 통째로 넓히기 때문에 앞뒤가 같이 늘어난다. */
const RACE_CAM = 0.55;
/* 무리가 퍼지면 시야를 넓힌다. 하한 0.70 은 가독성에서 나온 값이다 — 구슬 지름이 화면에서
   30.6px → 21.4px, 두 자리 번호가 15.3px → 10.7px 가 된다. 더 빼면(0.62) 번호가 9.5px 라
   예전에 문제였던 7.5px(R13-5)에 가까워진다.
   줌을 그대로 따라가면 프레임마다 값이 떨려서 화면이 울렁인다 — 지수 평활로 천천히 따라간다. */
const RACE_MINI_W = 22;          // 왼쪽 미니맵이 차지하는 폭(화면 논리 px). 코스는 그 오른쪽에만 그린다
const RACE_ZOOM_MIN = 0.70;
const RACE_ZOOM_EASE = 0.05;
/* 결승 깔때기부터는 반대로 조인다. 여기까지는 '누가 어디쯤인지'가 궁금해서 넓게 보다가,
   통로에 들어서는 순간부터는 '누가 먼저 들어가느냐' 한 가지만 남는다 — 그 몇 초를 가장 크게
   보여준다. 넓히기와 조이기가 한 값을 두고 다투지 않게, 기준선(map.neckY)을 넘으면 조이기가
   그냥 이기도록 갈라 놓는다.
   조일 때는 보간을 빠르게 한다(0.14). 깔때기 입구에서 결승까지가 300 남짓이라 0.05 로는
   다 조이기 전에 판이 끝난다 — 긴장을 만들려던 연출이 어정쩡한 배율로 지나가 버린다. */
const RACE_ZOOM_MAX = 2.0, RACE_ZOOM_IN_EASE = 0.14;
const RACE_CAM_PAD = 20;         // 카메라 여유 — 코스 양 끝에서 선두가 테두리에 걸치지 않게 한다
const RACE_HUD_MS = 200;         // HUD 갱신 간격
const RACE_DPR_MAX = 3;
// 캔버스는 CSS 를 상속받지 않으므로 폰트 스택을 여기 한 번 더 적는다 — body(51행) 스택과 같은 순서다.
const RACE_FONT = "-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', sans-serif";
/* 시드 재시도. 무엇을 보고 다시 뽑는지가 중요하다 — 승자는 보지 않는다. 소요 시간과 역동성만
   본다. 승자를 보고 다시 뽑으면 그게 거부 표집이고, 그러면 게임 앞에 설명할 수 없는 대기가 붙는다.
   한 판 계산이 24명에서 최대 27ms 라 몇 번 돌려도 사용자는 못 느낀다. */
const RACE_TRIES = 6;
/* 코스가 길어져(4810 → 5100) 중앙값이 20초대로 올라갔다. 창을 그대로 두면 절반 넘는 시드가
   문턱에 걸려 재시도로 버려지고, 결국 문턱을 못 넘은 판을 쓰게 된다 — 채택 기준이 사실상
   사라지는 셈이다. 실측 분포(16.6~33.1초)에 맞춰 넓힌다. */
const RACE_MIN_S = 15, RACE_MAX_S = 30;
/* 문턱은 leadChanges 가 아니라 '선두를 잡아 본 구슬 수'로 잡는다. 예전 문턱(역전 3회)은 계측해
   보니 아무것도 안 걸렀다 — 여섯 명 판에서도 하위 10% 가 4회라 첫 판이 거의 그대로 통과했다.
   즉 역동성을 고른 적이 없다. n 이 작을수록 구조적 상한이 낮아서 단을 나눈다(넷을 요구하면
   4인 판 통과율이 41% 로 떨어진다). 실측 통과율은 2인 91% · 8인 82% · 24인 96% 이고,
   가장 나쁜 4인 판도 여섯 번이면 98% 다. 못 넘어도 fallback 이 산다. */
const raceNeedLeaders = n => Math.min(n, n<=2 ? 2 : n<=5 ? 3 : 4);

/* 판 하나를 만든다. 승자를 미리 뽑지 않는다 — 물리가 정한다.
   문턱을 못 넘어도 완주한 판이 있으면 그걸 쓴다. 못 돌리는 것보다 조금 밋밋한 판이 낫다. */
function raceBuild(n){
  let fallback = null;
  for(let t=0; t<RACE_TRIES; t++){
    const rnd = raceRnd((Math.random()*0xffffffff)>>>0);
    const map = raceMapBuild(rnd, n<=2);
    const sim = raceSimulate(map, n, rnd);
    if(!sim.ok) continue;
    if(!fallback) fallback = { map, sim };
    const secs = sim.frames/60;
    if(secs >= RACE_MIN_S && secs <= RACE_MAX_S && sim.distinctLeaders >= raceNeedLeaders(n)) return { map, sim };
  }
  return fallback;
}

/* playRace(players[, onDone])
   그리고 움직이는 것까지만 한다. 게임 등록·건너뛰기 버튼·GS.teardown·결과 발표는 아래 startRace 가
   맡고, 그 둘을 잇는 이음매가 두 개다 — 돌려주는 ctl(raf·stop·finish·winner)과 onDone 콜백이다.
   ctl.finish() 는 스스로 rAF 를 취소하므로 [건너뛰기]는 finish() 만 부르면 되고,
   ctl.stop() 은 예약된 프레임만 없앤다(결과를 만들지 않는다). */
function playRace(players, onDone){
  const n = players.length;
  const built = raceBuild(n);
  const W = RACE_W, H = RACE_VIEW_H;

  openGameOv("🏁 구슬 레이스", `
    <div class="game-say" id="gvSay" aria-live="polite">준비됐어요 — 내 번호를 찾아두세요</div>
    <div class="game-hint" style="margin-bottom:8px">부딪히고 튕기며 내려가요 — 결과는 아무도 몰라요</div>
    <div class="race-wrap">
      <canvas id="raceCv" role="img" aria-label="구슬 레이스 진행 중"></canvas>
      <div class="race-hud" id="raceHud">
        <div class="bar"><i id="raceBar"></i></div>
        ${players.slice(0, 3).map((m,k)=>`<div class="rc-row"><b class="rc-rk">${k+1}</b><i class="rc-sw"></i><span class="rc-no"></span><span class="rc-nm"></span></div>`).join("")}
      </div>
    </div>
    ${gameLegendHtml(players, n)}
    <div id="gvWin" role="status"></div>`);
  setGameFoot(`<button class="btn btn-ghost btn-close" id="gvCancel">그만두기</button>`);
  bind("gvCancel",()=>closeGame());   // closeGame(opts) — 이벤트 객체를 opts 로 흘려보내지 않는다

  const cv = document.getElementById("raceCv");
  const ctx = cv.getContext("2d");
  const dpr = Math.max(1, Math.min(RACE_DPR_MAX, window.devicePixelRatio || 1));
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // 이 뒤의 좌표는 전부 논리 px 이다

  /* 시뮬레이션이 실패할 자리는 사실상 없지만(계측에서 정체 0), 없다고 단정하지 않는다 —
     여기서 막지 않으면 아래 전부가 null 을 읽는다. */
  if(!built){
    document.getElementById("gvSay").textContent = "코스를 못 만들었어요 — 다른 게임으로 돌려주세요";
    return { raf:0, done:true, started:true, stop(){}, finish(){}, start(){}, canvas:cv, winner:players[0] };
  }
  const map = built.map, sim = built.sim, END = sim.frames*1000/60;
  const winner = players[sim.winner];   // 구슬 번호에 의미가 없으므로 이 대응이 곧 균등 추첨이다

  /* ── HUD ── 200ms 마다 갱신한다. 별도 setInterval 대신 루프 안에서 레이스 시각을 검사하는
     이유는 중단 경로에서 끌 것을 rAF 하나로 유지하기 위해서다. */
  const barEl = document.getElementById("raceBar");
  const rowEls = [...document.querySelectorAll("#raceHud .rc-row")].map(r=>({
    sw:r.querySelector(".rc-sw"), no:r.querySelector(".rc-no"), nm:r.querySelector(".rc-nm"), cur:-1 }));
  let hudAt = -Infinity, barCur = "";
  function drawHud(t, order, force){
    if(!force && t - hudAt < RACE_HUD_MS) return;
    hudAt = t;
    const pct = Math.round(Math.min(1, ypos[order[0]]/map.finishY)*100) + "%";
    if(pct !== barCur){ barCur = pct; if(barEl) barEl.style.width = pct; }
    rowEls.forEach((row,k)=>{
      const i = order[k];
      if(i === undefined || row.cur === i) return;
      row.cur = i;
      row.sw.style.background = gcolor(i, n);
      row.no.textContent = (i+1) + ".";
      row.nm.textContent = players[i].name;
    });
  }

  /* ── 코스 그리기 ──
     예전에는 코스 전체를 오프스크린 한 장에 미리 그렸는데, 그러면 iOS 사파리의 캔버스 한 변
     4096px 제한에 코스 길이가 묶인다. 물리 코스는 화면에 보이는 띠(260 논리 px)만 매 프레임
     그리면 되고, 격자 덕에 그 띠에 걸친 물체만 훑으므로 40개 남짓이다 — 제한이 아예 사라졌다.
     stamp 는 한 물체가 여러 셀에 걸쳐 있을 때 두 번 그리지 않으려는 것이다(Set 을 매 프레임
     새로 만들지 않는다). */
  const stamp = new Int32Array(map.bodies.length).fill(-1);
  let stampNo = 0;
  function drawCourse(camY, f, vh){
    const tt = f*RACE_SUB*RACE_DT;
    stampNo++;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    const c0 = Math.max(0, Math.floor(camY/RACE_CELL));
    const c1 = Math.min(map.cells-1, Math.floor((camY+vh)/RACE_CELL));
    for(let c=c0;c<=c1;c++){
      const list = map.grid[c];
      for(let k=0;k<list.length;k++){
        const bi = list[k];
        if(stamp[bi] === stampNo) continue;
        stamp[bi] = stampNo;
        const b = map.bodies[bi];
        // 터진 버블은 그 프레임부터 그리지 않는다. dead 는 시뮬레이션이 적어 둔 프레임 번호다.
        if(b.dead!=null && f>=b.dead) continue;
        ctx.lineWidth = 2*b.rad;
        if(b.ri>=0){
          /* 회전체 각도는 시뮬이 프레임마다 적어 둔 표에서 읽는다. 자유 회전체는 충돌로 각속도가
             바뀌므로 ph+sp*t 같은 닫힌 식이 없다 — 그림이 물리와 어긋나지 않으려면 같은 값을 봐야 한다.
             두 팔을 축에서 따로, 다른 색으로 그려 회전 방향이 색 대비로 즉시 읽히게 한다. */
          const a=sim.rot[f*sim.rc + b.ri], ca=Math.cos(a), sa=Math.sin(a);
          ctx.strokeStyle="#8a7355";                     // 긴 팔
          ctx.beginPath(); ctx.moveTo(b.cx, b.cy-camY);
          ctx.lineTo(b.cx+b.hl*ca, b.cy+b.hl*sa-camY); ctx.stroke();
          ctx.strokeStyle="#bfa887";                     // 짧은 팔
          ctx.beginPath(); ctx.moveTo(b.cx, b.cy-camY);
          ctx.lineTo(b.cx-b.hl0*ca, b.cy-b.hl0*sa-camY); ctx.stroke();
          ctx.beginPath(); ctx.arc(b.cx, b.cy-camY, 4, 0, Math.PI*2);
          ctx.fillStyle="#7a6a52"; ctx.fill();
          continue;
        }
        // 색으로 성격을 갈라 둔다 — 세게 튕기는 것(탄성 못밭·범퍼)은 미리 알아볼 수 있어야 한다
        ctx.strokeStyle = b.e>=0.85 ? "#b8442a" : b.e ? "#c98a3a" : "#e0d5c4";
        ctx.beginPath();
        ctx.moveTo(b.x1, b.y1-camY); ctx.lineTo(b.x2, b.y2-camY);
        ctx.stroke();
      }
    }
    // 결승선 — 체커 두 줄. 1위가 도착하는 순간 화면에 무엇이 걸렸는지 보여야 한다
    const fy = map.finishY - camY;
    if(fy > -24 && fy < vh+24){
      const cell = 10;
      for(let row=0;row<2;row++) for(let x=0;x<W;x+=cell){
        ctx.fillStyle = ((x/cell + row) % 2) ? "#2b2118" : "#ffffff";
        ctx.fillRect(x, fy + row*cell, cell, cell);
      }
    }
  }

  // 구슬 = gcolor(i, n) 색 원 + 흰 번호. 선두만 어두운 테두리로 강조한다 —
  // 나머지의 흰 테두리는 구슬이 겹칠 때 경계를 남기는 용도다.
  function drawMarble(i, x, y, lead){
    ctx.beginPath(); ctx.arc(x, y, RACE_R, 0, Math.PI*2);
    ctx.fillStyle = gcolor(i, n); ctx.fill();
    ctx.lineWidth = lead ? 2.6 : 1.4;
    ctx.strokeStyle = lead ? "#2b2118" : "rgba(255,255,255,.92)";
    ctx.stroke();
    /* 논리 폭을 340 에서 200 으로 좁힌 덕에 배율이 0.752 → 1.28 로 올라갔다. 두 자리 번호 9px 도
       화면에서는 CSS 11.5px 이라, 예전 7.5px 문제(R13-5)가 여기서 해소된다. */
    ctx.font = "800 " + (i >= 9 ? 9 : 11) + "px " + RACE_FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff"; ctx.fillText(String(i+1), x, y+0.5);
  }

  /* 구슬 아래 이름표(레퍼런스와 같은 위치). 번호와 아래 범례를 오갈 것 없이 누가 누군지 바로
     읽힌다. 카메라 변환 '밖에서' 화면 좌표로 그리는 것이 요점이다 — 줌을 따라 같이 줄면 무리가
     퍼졌을 때(가장 필요할 때) 글자가 먼저 사라진다. 크기를 고정해 두면 카메라가 얼마나 물러나든
     이름은 늘 읽히고, 덕분에 축소 하한을 0.52 까지 열 수 있었다.
     인원 기준은 이 파일이 이미 쓰는 것을 그대로 쓴다 — GAME_LABEL_MAX(10)를 넘으면 사다리·
     돌림판도 이름을 번호로 바꾼다. 그 위로는 이름표끼리 겹쳐 오히려 방해라 번호와 범례에 맡긴다.
     흰 테두리를 두르는 이유는 코스 벽·장애물 위에 겹쳐도 읽히게 하기 위해서다. */
  function drawNames(base, z, ox, camY){
    if(n > GAME_LABEL_MAX) return;
    ctx.font = "800 9px " + RACE_FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.lineWidth = 3; ctx.lineJoin = "round";
    for(let k=n-1;k>=0;k--){
      const i = rank[k];
      const sy = (ypos[i] - camY)*z;
      if(sy < -20 || sy > H+8) continue;
      const nm = shortName(players[i].name, 4);
      /* 가장자리 구슬의 이름표가 캔버스 밖으로 나가 잘린다. 글자 폭을 재서 안으로 밀어 넣는다 —
         구슬과 살짝 어긋나 보이지만, 잘려서 못 읽는 것보다 낫다. */
      const half = ctx.measureText(nm).width/2 + 2;
      const sx = Math.max(RACE_MINI_W + half, Math.min(W - half,
                          ox + sim.path[base+i*2]*z));
      ctx.strokeStyle = "rgba(255,253,249,.95)"; ctx.strokeText(nm, sx, sy + RACE_R*z + 1.5);
      ctx.fillStyle = gcolor(i, n);              ctx.fillText(nm, sx, sy + RACE_R*z + 1.5);
    }
  }

  /* ── 한 프레임 ── 물리는 이미 끝나 있다. 여기서는 녹화된 좌표를 읽어 그리기만 한다. */
  const ypos = new Array(n).fill(0);
  const rank = players.map((m,i)=>i);
  let camZ = 1;                       // 지금 줌. 목표를 향해 천천히 따라간다
  /* 중계 대상. 1등만 뽑는 게임이지만 뒷 순위가 어떤 상황인지도 보여줘야 재미가 산다.
     선두가 혼자 멀리 달아나 있으면(2등과 LONE 이상) 카메라는 '가장 붙어 있는 다툼'으로 옮겨
     가고, 결승 깔때기에 들어서면 무조건 선두로 돌아온다 — 마지막은 1등 이야기라서다.
     자주 바꾸면 어지러우므로 한 번 고른 대상은 HOLD 프레임 동안 유지한다. */
  const CAM_LONE=240, CAM_TIGHT=70, CAM_HOLD=110;
  let camTgt=-1, camHold=0;
  function relayY(lead){
    if(lead >= map.neckY){ camTgt=-1; camHold=0; return lead; }
    if(camHold>0 && camTgt>=0){ camHold--; return (ypos[rank[camTgt]]+ypos[rank[camTgt+1]])*0.5; }
    camTgt=-1;
    if(n>=3 && ypos[rank[0]]-ypos[rank[1]] > CAM_LONE){
      let best=-1, bg=CAM_TIGHT;
      for(let k=1;k<Math.min(n-1,8);k++){
        const g=ypos[rank[k]]-ypos[rank[k+1]];
        if(g<bg){ bg=g; best=k; }
      }
      if(best>=0){ camTgt=best; camHold=CAM_HOLD;
        return (ypos[rank[best]]+ypos[rank[best+1]])*0.5; }
    }
    return lead;
  }
  function draw(t){
    const f = Math.max(0, Math.min(sim.frames-1, Math.floor(t*60/1000)));
    const base = f*n*2;
    for(let i=0;i<n;i++) ypos[i] = sim.path[base+i*2+1];
    rank.sort((a,b)=> ypos[b]-ypos[a]);   // 0 번이 선두. 뒤에서부터 그려 선두가 맨 위에 오게 한다
    /* 두 모드. 결승 깔때기 전에는 무리 전체(맨 앞~맨 뒤)를 담을 만큼 넓히고, 선두가 깔때기에
       들어선 뒤에는 남은 거리에 비례해 조인다. 경계에서 목표값이 뛰지만 보간이 그걸 흡수한다. */
    const lead = ypos[rank[0]];
    let zTarget, zEase;
    if(lead >= map.neckY){
      const p = Math.max(0, Math.min(1, (lead-map.neckY)/Math.max(1, map.finishY-map.neckY)));
      zTarget = 1 + (RACE_ZOOM_MAX-1)*p;
      zEase = RACE_ZOOM_IN_EASE;
    } else {
      const spread = lead - ypos[rank[n-1]] + 50;   // 50 은 위아래 여백
      zTarget = Math.max(RACE_ZOOM_MIN, Math.min(1, H/spread));
      zEase = RACE_ZOOM_EASE;
    }
    camZ += (zTarget - camZ) * zEase;
    const vh = H / camZ;                                     // 지금 화면이 담는 코스 높이
    const focus = relayY(lead);                              // 선두일 수도, 뒤쪽 다툼일 수도 있다
    const camY = Math.max(-RACE_CAM_PAD, Math.min(map.total - vh + RACE_CAM_PAD, focus - vh*RACE_CAM));
    /* 줌을 걸면 코스(폭 200)가 캔버스보다 좁아져 양옆에 여백이 생긴다. 그 여백을 캔버스와 같은
       색으로 두면 구슬이 보이지 않는 벽에 튕기는 것처럼 보이므로, 배경을 한 톤 어둡게 깔고
       코스 폭만 밝게 칠해 '길'이 어디까지인지 눈에 남긴다. */
    /* 왼쪽 RACE_MINI_W 는 미니맵 몫으로 비워 두고 코스는 그 오른쪽 공간의 가운데에 그린다.
       겹치게 두면 출발 직후처럼 구슬이 폭 전체에 흩어져 있을 때 왼쪽 구슬이 미니맵 뒤로 사라진다. */
    const camOX = RACE_MINI_W + (W-RACE_MINI_W)/2 - (W/2)*camZ;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#f1ebe1"; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(dpr*camZ, 0, 0, dpr*camZ, dpr*camOX, 0);
    ctx.fillStyle = "#fffdf9"; ctx.fillRect(0, 0, W, vh);
    drawCourse(camY, f, vh);
    for(let k=n-1;k>=0;k--){ const i=rank[k]; drawMarble(i, sim.path[base+i*2], ypos[i]-camY, k===0); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawNames(base, camZ, camOX, camY);
    drawMiniMap(base);
    return rank;
  }

  /* 미니맵 — 코스 전체를 왼쪽에 한 줄로 접어 놓고 구슬을 점으로 찍는다. 카메라가 무리를 물고
     따라다니는 대신 '지금 코스의 어디쯤인지'를 잃는데, 그걸 여기서 돌려준다. 레퍼런스도 같은
     자리에 같은 물건을 둔다. 줌과 무관한 화면 좌표로 그리므로 카메라 변환 밖에서 부른다. */
  /* 지형은 판마다 고정이라 한 번만 그려 두고 매 프레임 붙인다. 매번 96개를 다시 그리면 미니맵
     하나 때문에 프레임 예산을 쓰게 된다. 회전체는 축만 점으로 찍는다 — 미니맵 배율에서 날개는
     선 하나보다 얇아 그려 봐야 안 보이고, 축 위치가 '여기 도는 게 있다'를 말해 준다. */
  let miniBg=null;
  function buildMiniBg(mw, mh){
    const c=document.createElement("canvas");
    c.width=Math.round(mw*dpr); c.height=Math.round(mh*dpr);
    const g=c.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
    const sx=mw/W, sy=mh/map.total;
    g.lineCap="round";
    for(const b of map.bodies){
      if(b.ri>=0 || b.sp || b.invI){                 // 회전체 — 축만
        g.fillStyle="rgba(122,106,82,.55)";
        g.beginPath(); g.arc(b.cx*sx, b.cy*sy, 1.4, 0, Math.PI*2); g.fill();
        continue;
      }
      g.strokeStyle = b.pop ? "rgba(201,138,58,.55)" : "rgba(160,138,106,.42)";
      g.lineWidth = Math.max(0.6, b.rad*sx*0.8);
      g.beginPath(); g.moveTo(b.x1*sx, b.y1*sy); g.lineTo(b.x2*sx, b.y2*sy); g.stroke();
    }
    return c;
  }
  function drawMiniMap(base){
    const mw=RACE_MINI_W-8, mx=4, my=6, mh=H-12;
    ctx.fillStyle="rgba(255,253,249,.86)";
    ctx.strokeStyle="#e0d5c4"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.rect(mx, my, mw, mh); ctx.fill(); ctx.stroke();
    if(!miniBg) miniBg=buildMiniBg(mw, mh);
    ctx.drawImage(miniBg, mx, my, mw, mh);
    // 지금 화면이 코스의 어디를 보고 있는지
    const camTop=Math.max(0, Math.min(1, (ypos[rank[0]] - H/camZ*RACE_CAM)/map.total));
    const camBot=Math.max(0, Math.min(1, (ypos[rank[0]] + H/camZ*(1-RACE_CAM))/map.total));
    ctx.fillStyle="rgba(111,78,55,.13)";
    ctx.fillRect(mx, my+camTop*mh, mw, Math.max(2,(camBot-camTop)*mh));
    ctx.fillStyle="#2b2118";
    ctx.fillRect(mx, my+mh-1.5, mw, 1.5);                  // 결승선
    for(let k=n-1;k>=0;k--){
      const i=rank[k];
      const px=mx+2+ (sim.path[base+i*2]/W)*(mw-4);
      const py=my+ Math.max(0,Math.min(1, ypos[i]/map.total))*mh;
      ctx.beginPath(); ctx.arc(px, py, k===0?2.4:1.8, 0, Math.PI*2);
      ctx.fillStyle=gcolor(i, n); ctx.fill();
      if(k===0){ ctx.lineWidth=0.8; ctx.strokeStyle="#2b2118"; ctx.stroke(); }
    }
  }

  /* ── 루프 ──
     dt 를 64ms(≈4프레임)로 묶는다. 탭이 숨었다 돌아오면 now-last 가 몇 초가 되는데 그대로 더하면
     구슬이 화면 절반을 순간이동한다. 대가는 명확하다 — 숨어 있던 시간만큼 레이스가 뒤처진다.
     벽시계를 맞추는 것보다 '이어서 보이는' 쪽을 고른 것이다. */
  let t = 0, last = performance.now();
  const ctl = {
    raf: 0,
    done: false,
    started: false,
    winner: winner,
    stop(){ if(ctl.raf) cancelAnimationFrame(ctl.raf); ctl.raf = 0; ctl.done = true; },
    finish(){
      if(ctl.done) return;
      ctl.done = true;
      if(ctl.raf) cancelAnimationFrame(ctl.raf);
      ctl.raf = 0;
      drawHud(END, draw(END), true);
      if(typeof onDone === "function") onDone();
    },
    canvas: cv
  };
  /* 접전 슬로모션. 결승이 코앞이고 바로 뒤에 붙은 구슬이 있을 때만 재생 속도를 늦춘다.
     물리는 이미 다 끝나 녹화돼 있으므로 시간축만 늦추면 된다 — 시뮬레이션을 건드리지 않으니
     결과도 도착 순서도 바뀌지 않는다. 이게 녹화-재생 구조의 덤이다.
     경쟁자가 없으면 늦추지 않는다. 혼자 들어오는 장면을 늘리면 지루해질 뿐이다.
     하한 0.4 는 '느려졌다'가 읽히면서도 답답하지 않은 선이다(0.2 는 마지막 구간이 3초 넘게
     늘어져 전체 길이 예산을 밀어낸다). */
  const SLOW_D=300, SLOW_NEAR=95, SLOW_MIN=0.4;
  function timeScale(){
    if(!ypos.length || n<2) return 1;
    const lead=ypos[rank[0]], rest=map.finishY-lead;
    if(rest > SLOW_D || rest < 0) return 1;
    if(lead - ypos[rank[1]] > SLOW_NEAR) return 1;      // 뒤가 멀면 그냥 간다
    return Math.max(SLOW_MIN, rest/SLOW_D);
  }
  function frame(now){
    ctl.raf = 0;
    if(!cv.isConnected){ ctl.stop(); return; }   // 오버레이가 닫힌 뒤 이미 예약돼 있던 프레임 방어
    const dt = Math.min(64, now - last) * timeScale();
    last = now; t += dt;
    if(t >= END){ ctl.finish(); return; }
    drawHud(t, draw(t), false);
    ctl.raf = requestAnimationFrame(frame);
  }
  drawHud(0, draw(0), true);          // 첫 프레임은 즉시 — rAF 를 기다리면 빈 캔버스가 한 번 보인다
  /* 바로 굴리지 않는다. 출발선에 멈춰 있는 동안 "내가 몇 번인지" 찾을 시간이 생긴다 —
     그 확인 없이 시작하면 20명이 뒤엉킨 화면에서 자기 구슬을 끝까지 못 찾는다.
     시작 버튼은 startRace 가 푸터에 건다. 여기서는 시작하는 방법만 내어 준다.
     last 를 시작 순간에 다시 잡는 게 중요하다 — 멈춰 있던 시간이 레이스 시각에 섞이면
     첫 프레임에 구슬이 화면 절반을 순간이동한다(dt 상한 64ms 가 있어도 여러 프레임 튄다). */
  ctl.start = ()=>{
    if(ctl.done || ctl.started) return;
    ctl.started = true;
    const say=document.getElementById("gvSay"); if(say) say.textContent="출발!";
    if(lessMotion()){ gtimer(()=>ctl.finish(), 10); return; }   // 연출을 건너뛰고 결과로 간다
    last = performance.now();
    ctl.raf = requestAnimationFrame(frame);
  };
  return ctl;
}



/* ── 앱에서 떼어 오면서 필요한 최소 껍데기. 본체(위 물리·렌더 코드)는 index.html v9.97 그대로다. ── */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lessMotion = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function shortName(n,k){ n=String(n||""); return n.length>k ? n.slice(0,k) : n; }
let GS = { timers:[], teardown:null };
function gtimer(fn,ms){ const t=setTimeout(fn,ms); GS.timers.push(t); return t; }
function clearGameTimers(){ GS.timers.forEach(clearTimeout); GS.timers=[]; }
function bind(id,fn){ const el=$(id); if(el) el.onclick=fn; }
function openGameOv(title, body){ $("stage").innerHTML = body; }
function setGameFoot(html){ $("foot").innerHTML = html; }
function closeGame(){ if(GS.teardown){ try{ GS.teardown(); }catch(e){} GS.teardown=null; }
  clearGameTimers(); $("stage").innerHTML=""; $("foot").innerHTML=""; $("setup").style.display=""; }
function gameLegendHtml(players, n){
  if(n <= GAME_LABEL_MAX) return "";
  return '<div class="game-legend">' + players.map((m,i)=>
    '<span class="gl-it"><i class="gl-sw" style="background:'+gcolor(i,n)+'"></i>'
    +'<span class="gl-no">'+(i+1)+'</span><span class="gl-nm">'+esc(m.name)+'</span></span>').join("") + '</div>';
}
function showGameResult(w){
  const box=$("gvWin");
  if(box) box.innerHTML = '<div class="game-win"><div class="we">☕</div><div class="wn">'+esc(w.name)+'</div></div>';
  const say=$("gvSay"); if(say) say.textContent="결과가 나왔어요";
}
/* startRace 대신 쓰는 최소 진행부 — 출발 게이트와 건너뛰기만 남긴다. */
function runRace(players){
  $("setup").style.display="none";
  const ctl = playRace(players, ()=>showGameResult(ctl.winner));
  GS.teardown = ctl.stop;
  const runFoot = ()=>{
    setGameFoot('<div class="row-2"><button class="btn btn-soft" id="gvSkip">⏭ 건너뛰기</button>'
      +'<button class="btn btn-ghost" id="gvCancel">그만두기</button></div>');
    bind("gvSkip", ()=>ctl.finish()); bind("gvCancel", closeGame);
  };
  setGameFoot('<div class="row-2"><button class="btn btn-brand" id="gvGo">▶ 출발!</button>'
    +'<button class="btn btn-ghost" id="gvCancel">그만두기</button></div>');
  bind("gvGo", ()=>{ ctl.start(); runFoot(); });
  bind("gvCancel", closeGame);
}
const NAMES=["가온","나래","다솜","라온","마루","바다","사랑","아라","자람","차오","카린","타래",
             "파랑","하늘","初雪","보리","솔이","여울","윤슬","이든","주아","한별","해온","호수"];
$("go").onclick = ()=>{
  const n = Math.max(2, Math.min(GAME_MAX.race, +$("cnt").value || 8));
  runRace(NAMES.slice(0, n).map((name,i)=>({ id:"m"+i, name })));
};

</script>
